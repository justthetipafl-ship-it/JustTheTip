name: NFL plays pool

# The pool of real plays behind the two-minute drill. Weekly is enough: the pool only grows by
# roughly 160 fourth-quarter run/pass plays a week league-wide, and it carries four seasons.
#
# Play-by-play comes from nflverse. The charting under it is CC-BY-SA 4.0 and must be credited to
# FTN Data via nflverse wherever these plays are shown.
#
# The build prints pool depth per team and call, and warns if any pair gets thin. Read that output
# rather than assuming a narrower season range still works - the current season on its own leaves
# some team-call pairs with a single play in them.

on:
  schedule:
    - cron: "50 13 * * 2"      # Tuesday, after the week's games have settled
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons, comma separated (blank = last four)"
        type: string
        required: false
      quarters:
        description: "Quarters to keep (blank = 4; 'all' for every quarter)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: nfl-plays
  cancel-in-progress: false

jobs:
  plays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas pyarrow

      - name: Check the call classifier
        run: python3 nfl/build_plays.py --selftest

      - name: Build plays pool
        run: |
          ARGS="--out nfl/data"
          if [ -n "${{ inputs.seasons }}" ];  then ARGS="$ARGS --seasons ${{ inputs.seasons }}"; fi
          if [ -n "${{ inputs.quarters }}" ]; then ARGS="$ARGS --quarters ${{ inputs.quarters }}"; fi
          python3 nfl/build_plays.py $ARGS

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # one at a time: git add fails the whole command on a missing path
          for f in nfl/data/plays.json; do
            [ -f "$f" ] && git add "$f" && echo "staged $f"
          done
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "NFL plays pool"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
