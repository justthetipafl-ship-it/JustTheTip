name: NBL Odds (rapidodds)

# Same two-pull pattern as NFL and EPL: a morning sweep (--force) so the signals have prices
# to work with all day, then an hourly window that --window 1 gates to fire once, an hour
# before the first tip-off. NBL tips off late afternoon to evening AEST, so the hourly window
# covers 05:00-11:00 UTC (15:00-21:00 AEST). Weekend double-headers start earlier, which is
# why the window opens at 05:00 rather than the 07:00 a weeknight would need.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 20 * * *"    # 06:30 AEST - morning sweep (--force)
    - cron: "0 5-11 * * *"   # hourly UTC across tip-off windows - --window 1 gates the pull

permissions:
  contents: write
concurrency:
  group: nbl-odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RapidOddsAPI
        run: pip install rapidoddsapi
      - name: Pull NBL odds
        env:
          ROA_API_KEY: ${{ secrets.ROA_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 5-11 * * *" ]; then
            python3 scripts/fetch_odds.py NBL nbl/data/odds.json --window 1
          else
            python3 scripts/fetch_odds.py NBL nbl/data/odds.json --force
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nbl/data/odds.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "chore(nbl): odds $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
