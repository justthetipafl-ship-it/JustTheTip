name: EPL Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'     # daily 07:00 UTC — after FPL (06:00) and API-Football (05:30)

permissions:
  contents: write

concurrency:
  group: epl-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build EPL data
        run: python EPL/build_epl.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EPL/data/players.json EPL/data/gamelogs.json EPL/data/teams.json EPL/data/fixture.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "EPL build $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
