name: Set Tennis Password

# Lightweight: injects the access-password hash from the TENNIS_PASSWORD
# secret into tennis/index.html and commits. Does NOT run any data refresh.
# Trigger it manually from the Actions tab whenever you set or change the password.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-password:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject auth hash from secret
        env:
          TENNIS_PASSWORD: ${{ secrets.TENNIS_PASSWORD }}
        run: |
          if [ -z "$TENNIS_PASSWORD" ]; then
            echo "ERROR: TENNIS_PASSWORD secret is empty or not set"
            exit 1
          fi
          PW=$(printf '%s' "$TENNIS_PASSWORD" | tr -d '\r\n')
          HASH=$(printf '%s' "$PW" | sha256sum | cut -d' ' -f1)
          sed -i -E "s/(const AUTH_HASH = ')[^']*(';)/\1$HASH\2/" tennis/index.html
          echo "auth hash injected (len ${#HASH})"
          if grep -q "const AUTH_HASH = '$HASH';" tennis/index.html; then
            echo "verified: AUTH_HASH line updated"
          else
            echo "ERROR: AUTH_HASH line was not updated - check the file path/pattern"
            exit 1
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis/index.html
          if git diff --cached --quiet; then
            echo "No change - hash already current"
          else
            git commit -m "Set tennis access password hash"
            git push
          fi
