name: JTT NBA — data refresh (advanced)

# Basketball is daily. Two runs:
#   • 12:00 UTC → after sportsdataverse's own morning refresh (~10:00 UTC):
#                 full stats/DVP/gamelogs rebuild
#   • 21:00 UTC → pre-slate top-up (injuries, lineups) before the US evening tips
# Plus manual dispatch (optionally with the weekly password → hashed into meta.json).
# Off-season runs are cheap no-ops: identical output → nothing committed.
# Next season's files are probed automatically (max season + 1), so the
# 2026-27 NBA season flows in without touching this file.

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      password:
        description: "Weekly subscriber password (stored hashed, never in repo)"
        required: false

permissions:
  contents: write

concurrency:
  group: nba-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nba/requirements.txt

      - name: Install deps
        run: pip install -r nba/requirements.txt

      - name: Selftest (transform pipeline, no network)
        run: python nba/build_nba_data.py --selftest

      - name: Build split data (both leagues)
        run: |
          PW="${{ github.event.inputs.password || secrets.NBA_WEEKLY_PASSWORD }}"
          if [ -n "$PW" ]; then
            python nba/build_nba_data.py --out nba/data --league nba \
              --nba-seasons 2024,2025,2026 --nba-current 2026 \
              --password "$PW"
          else
            python nba/build_nba_data.py --out nba/data --league nba \
              --nba-seasons 2024,2025,2026 --nba-current 2026
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "jtt-bot"
          git config user.email "actions@github.com"
          git add nba/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(nba): data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo "pushed on attempt $i"; pushed=1; break
              fi
              echo "push contended by a concurrent commit, retrying ($i)…"; sleep $((RANDOM % 5 + 2))
            done
            if [ "$pushed" != "1" ]; then echo "::error::push failed after retries"; exit 1; fi
          fi
