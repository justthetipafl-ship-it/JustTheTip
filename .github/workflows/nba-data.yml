name: JTT NBA — data refresh (advanced)

# Basketball is daily. Two runs:
#   • 12:00 UTC → after sportsdataverse's own morning refresh (~10:00 UTC):
#                 full stats/DVP/gamelogs rebuild
#   • 21:00 UTC → pre-slate top-up (injuries, lineups) before the US evening tips
# Plus manual dispatch (optionally with the weekly password → hashed into meta.json).
# Off-season runs are cheap no-ops: identical output → nothing committed.
# Next season's files are probed automatically (max season + 1), so the
# 2026-27 NBA season flows in without touching this file.

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      password:
        description: "Weekly subscriber password (stored hashed, never in repo)"
        required: false

permissions:
  contents: write

concurrency:
  group: nba-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nba/requirements.txt

      - name: Install deps
        run: pip install -r nba/requirements.txt

      - name: Selftest (transform pipeline, no network)
        run: python nba/build_nba_data.py --selftest

      - name: Build split data (both leagues)
        run: |
          # The NBA season is labelled by the year it ENDS: 2026-27 is "2027". Only seasons that
          # are PUBLISHED may be listed here - a listed season that 404s kills the run, which is
          # what happened when 2027 was added two weeks before its first game. The build probes
          # max+1 by itself and tolerates its absence, so list the two behind and let it reach
          # forward. Derived from the date, so this never needs editing again.
          Y=$(date -u +%Y); M=$(date -u +%m)
          if [ "$M" -ge 09 ]; then NEXT=$((Y+1)); else NEXT=$Y; fi
          # Include the new season only once its box scores actually exist. Listing it early kills
          # the run (a required season that 404s is fatal); listing it late leaves currentSeason on
          # last year all through the new one. So ask.
          BOX="https://github.com/sportsdataverse/sportsdataverse-data/releases/download"
          BOX="$BOX/espn_nba_player_boxscores/player_box_$NEXT.parquet"
          if curl -sfL -o /dev/null -r 0-0 "$BOX"; then
            SEASONS="$((NEXT-2)),$((NEXT-1)),$NEXT"; CURRENT=$NEXT
            echo "season $NEXT is published - building it as current"
          else
            SEASONS="$((NEXT-2)),$((NEXT-1))"; CURRENT=$((NEXT-1))
            echo "season $NEXT not published yet - the build will still probe it for the schedule"
          fi
          echo "seasons=$SEASONS current=$CURRENT"
          PW="${{ github.event.inputs.password || secrets.NBA_WEEKLY_PASSWORD }}"
          if [ -n "$PW" ]; then
            python nba/build_nba_data.py --out nba/data --league nba \
              --flat --nba-seasons "$SEASONS" --nba-current "$CURRENT" \
              --password "$PW"
          else
            python nba/build_nba_data.py --out nba/data --league nba \
              --flat --nba-seasons "$SEASONS" --nba-current "$CURRENT"
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "jtt-bot"
          git config user.email "actions@github.com"
          # the build used to write nba/data/nba/ - clear it so the stray copy cannot be served
          rm -rf nba/data/nba
          git add -A nba/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(nba): data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo "pushed on attempt $i"; pushed=1; break
              fi
              echo "push contended by a concurrent commit, retrying ($i)…"; sleep $((RANDOM % 5 + 2))
            done
            if [ "$pushed" != "1" ]; then echo "::error::push failed after retries"; exit 1; fi
          fi
