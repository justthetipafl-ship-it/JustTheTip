name: Degenerates (free multi-sport page)

# Builds the free Degenerates page data by ranking each sport's committed odds + gamelogs
# into cross-sport products (Daily Train / Ladder Challenge / Yankee) -> degenerates/data/degenerates.json.
# Reads only committed data (never refreshes it), so run it AFTER the odds/data jobs.
on:
  workflow_dispatch:
    inputs:
      max_legs:
        description: "Max legs on the Daily Train (blank = 8)"
        required: false
      signup_url:
        description: "Sign-up URL (blank = default DubClub)"
        required: false
  schedule:
    - cron: '15 22 * * *'    # ~08:15 AEST
    - cron: '15 4 * * *'     # ~14:15 AEST
    - cron: '15 9 * * *'     # ~19:15 AEST

permissions:
  contents: write
concurrency:
  group: degenerates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build degenerates.json
        env:
          DEGEN_MAX_LEGS: ${{ github.event.inputs.max_legs }}
          DEGEN_SIGNUP_URL: ${{ github.event.inputs.signup_url }}
        run: python degenerates/build_degenerates.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add degenerates/data/degenerates.json
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "Degenerates $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
