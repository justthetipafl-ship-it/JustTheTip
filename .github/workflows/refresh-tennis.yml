# .github/workflows/refresh-tennis.yml   (MUST live at repo root under .github/workflows/ to run)
# Injects auth hash from the TENNIS_PASSWORD secret, refreshes data, commits back.
# Cloudflare Pages redeploys on the commit. Live at justthetipaus.com/tennis/
name: Refresh tennis data

on:
  schedule:
    - cron: '17 */6 * * *'      # every 6h UTC. '0 18 * * *' = once daily (~4am AEST).
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: tennis

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TENNIS_PASSWORD holds the PLAINTEXT password. Hash it and overwrite the whole
      # AUTH_HASH line (not a one-time placeholder), so re-running with a new password
      # actually takes effect.
      - name: Inject auth hash
        env:
          SECRET: ${{ secrets.TENNIS_PASSWORD }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "WARNING: TENNIS_PASSWORD secret not set — leaving AUTH_HASH unchanged"
          else
            CLEAN="$(printf '%s' "$SECRET" | tr -d '\r\n')"
            HASH=$(printf '%s' "$CLEAN" | sha256sum | cut -d' ' -f1)
            sed -i -E "s/(const AUTH_HASH = ')[^']*(';)/\1$HASH\2/" index.html
            echo "auth hash injected (len ${#HASH})"
          fi

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pandas

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: 'release', use-public-rspm: true }

      - name: Download Sackmann match files
        run: |
          mkdir -p data/sackmann
          A=https://raw.githubusercontent.com/JeffSackmann/tennis_atp/master
          W=https://raw.githubusercontent.com/JeffSackmann/tennis_wta/master
          for y in 2023 2024 2025 2026; do curl -sfL "$A/atp_matches_$y.csv" -o "data/sackmann/atp_matches_$y.csv" || true; done
          for y in 2025 2026;             do curl -sfL "$W/wta_matches_$y.csv" -o "data/sackmann/wta_matches_$y.csv" || true; done

      - name: 1. Fetch fixtures (ESPN)
        run: python fetch_espn_v4.py --days 3 --out data/tennis_fixtures.json

      - name: 2. Match players to Sackmann
        run: python match_players.py --download

      - name: 3. Build model bundles
        run: Rscript build.R

      - name: 4. Advanced stats (Match Charting Project)
        run: python fetch_advanced.py

      - name: Commit refreshed data + injected index
        working-directory: ${{ github.workspace }}
        run: |
          date +%s > tennis/data/version.txt
          git config user.name  "jtt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis/data tennis/index.html 2>/dev/null || echo "nothing to stage"
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Auto: refresh tennis data + auth $(date -u +%F)"
            git push
          fi
