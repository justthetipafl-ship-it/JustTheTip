name: WC One-Off Missing Teams Backfill

# Manual trigger only — this is a one-time job to backfill teams missed
# by the original historical scrape. After it runs successfully, you can
# either delete this workflow file or just leave it dormant.
on:
  workflow_dispatch:

jobs:
  backfill-missing-teams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Backfill missing teams (Iraq, Sweden, Cape Verde, Bosnia, Congo DR, Algeria)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python backfill_missing_teams.py

      - name: Commit backfilled data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wc/data/worldcup_intl_logs.json wc/data/worldcup_team_stats.json wc/data/version.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(wc): backfill missing teams historical data"
            git push
          fi
