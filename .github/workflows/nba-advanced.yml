name: NBA quarters, zones and shot actions

# Per-quarter production, shot zones and shot actions from the play-by-play. Runs after the NBA
# data build, since all three read the same season files and write alongside them.

on:
  schedule:
    - cron: "40 12 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons, comma separated (blank = last two)"
        type: string
        required: false
      zone_history:
        # PRE-FILLED on purpose. Left blank it falls back to the default window, which asks for the
        # season about to start - and that has no play-by-play until opening night, so the run
        # reads one season, cannot fit anything, and the persistence step has nothing to say.
        description: "Seasons to READ for the zone persistence test (only used with per_season)"
        type: string
        required: false
        default: "2022,2023,2024,2025,2026"
      per_season:
        description: "Also keep each season's zone defence apart, for the persistence test"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: nba-advanced
  cancel-in-progress: false

jobs:
  quarters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas pyarrow
      - name: Build quarters
        run: |
          ARGS="--out nba/data"
          if [ -n "${{ inputs.seasons }}" ]; then ARGS="$ARGS --seasons ${{ inputs.seasons }}"; fi
          python3 nba/build_nba_quarters.py $ARGS

      # The persistence fit needs years of history; the page needs recent basketball. Those are not
      # the same window, and feeding one input to both is how quarters.json came to average Luka
      # over 361 games: a history run must still PUBLISH a profile built from the last season or
      # two. zone_history says what to read, seasons says what to pool into what ships.
      - name: Build shot zones
        run: |
          ARGS="--out nba/data"
          if [ -n "${{ inputs.zone_history }}" ]; then
            ARGS="$ARGS --seasons ${{ inputs.zone_history }}"
            if [ -n "${{ inputs.seasons }}" ]; then ARGS="$ARGS --pool-seasons ${{ inputs.seasons }}"; fi
          elif [ -n "${{ inputs.seasons }}" ]; then
            ARGS="$ARGS --seasons ${{ inputs.seasons }}"
          fi
          if [ "${{ inputs.per_season }}" = "true" ]; then ARGS="$ARGS --per-season"; fi
          python3 nba/build_nba_zones.py $ARGS

      # Shot actions: WHERE he shoots is zones.json, HOW he gets there is this. Same feed, same
      # rolling season window - the script defaults to the season just gone plus the one under
      # way, exactly as the zone build does, so the two files on screen together never end up
      # describing different seasons.
      #
      # The selftest is offline and takes no time. It pins all 51 of ESPN's action labels to the
      # group each must land in, and the classifier is ORDER-DEPENDENT: a reordering that reads
      # as a tidy-up silently moves thousands of shots between groups and nothing downstream
      # looks wrong. Worth the two seconds on every run.
      - name: Shot action selftest
        run: python3 nba/build_nba_playtypes.py --selftest
      - name: Build shot actions
        run: |
          ARGS="--out nba/data"
          if [ -n "${{ inputs.seasons }}" ]; then ARGS="$ARGS --seasons ${{ inputs.seasons }}"; fi
          python3 nba/build_nba_playtypes.py $ARGS

      # Does a defence's zone record persist? The page shows the shot matchup as a read and
      # carries no price on it precisely because that has never been measured. This runs only
      # when the per-season file has just been written, needs no network, and prints the one
      # number the decision rests on: the fraction of a measured gap that carries into next
      # season, per zone.
      # A measurement, not a build step: it must never mark a good data build as failed.
      - name: Zone persistence
        if: ${{ inputs.per_season }}
        continue-on-error: true
        run: python3 nba/build_nba_zones.py --out nba/data --persist
      # WHO PLAYED WHEN: on/off intervals rebuilt from the same play-by-play, for the rotation
      # chart in the match report. It runs here rather than in a workflow of its own because it
      # reads that feed and, critically, because it takes its SEASON from nba/data/meta.json,
      # which the main NBA build writes at 12:00 - forty minutes before this.
      #
      # Daily is the right cadence: the file holds each club's LAST game, so it changes once a
      # night at most, and the upstream release lags about a day regardless.
      #
      # The selftest is offline and instant. It pins the clock arithmetic (time REMAINING in a
      # period becoming time ELAPSED in a game, overtime included) and the feed quirk that
      # matters: ESPN writes some substitutions twice, once with a blank side, and replaying both
      # desynchronises the floor WITHOUT moving anyone's minutes - so nothing downstream looks
      # wrong while the lineup is quietly incorrect.
      - name: Rotation selftest
        run: python3 nba/build_nba_stints.py --selftest
      - name: Build rotations
        run: |
          ARGS="--out nba/data"
          if [ -n "${{ inputs.seasons }}" ]; then ARGS="$ARGS --seasons ${{ inputs.seasons }}"; fi
          python3 nba/build_nba_stints.py $ARGS \
            || echo "::warning::rotation build failed - keeping the stints.json already in the repo"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in nba/data/quarters.json nba/data/zones.json \
                   nba/data/zones_by_season.json nba/data/zone_persistence.json \
                   nba/data/playtypes.json nba/data/stints.json; do
            [ -f "$f" ] && git add "$f" && echo "staged $f"
          done
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "NBA quarters, shot zones, shot actions and rotations"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
