name: WC Backfill Knockout Fixtures
on:
  workflow_dispatch:
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python backfill_wc_knockout.py
        env: { APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }} }
      - name: Commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add wc/data/
          git diff --staged --quiet || git commit -m "Backfill knockout fixtures"
          git push
