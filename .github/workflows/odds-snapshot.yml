name: Odds Snapshot

on:
  workflow_dispatch:
  schedule:
    # Twice daily. The later run is the one that matters: it lands closest to kickoff for the
    # AU evening slate, so the stored price is near the closing line rather than an opener.
    - cron: '0 2 * * *'
    - cron: '0 9 * * *'

permissions:
  contents: write

concurrency:
  group: odds-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Writes <SPORT>/odds-history/YYYY-MM-DD.json.gz — best price per player/market/line,
      # gzipped. Re-running the same day overwrites that day's file rather than adding another.
      - name: Snapshot odds
        run: node tools/snapshot-odds.js

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add */odds-history/*.json.gz
          if git diff --staged --quiet; then
            echo "No odds changes."
          else
            git commit -m "Odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
