name: JTT NFL — split data refresh (advanced)

# NFL plays Thu / Sun / Mon. Two weekly runs:
#   • Wed 09:00 UTC → after MNF settles: full stats/DVP/gamelogs/first-TD refresh
#   • Sat 16:00 UTC → final injuries + depth charts + weather before the Sunday slate
# Plus manual dispatch (optionally with the weekly password → hashed into meta.json).
# Off-season runs are cheap no-ops: identical output → nothing committed.
#
# NOTE: this is the ADVANCED pipeline writing nfl/data/*.json for the nfl/ tool.
# The legacy Phase-1 nfl-bundle.yml (NFL/bundle.json) can be deleted after cutover.

on:
  schedule:
    - cron: "0 9 * * 3"    # Wednesday 09:00 UTC
    - cron: "0 16 * * 6"   # Saturday 16:00 UTC
  workflow_dispatch:
    inputs:
      password:
        description: "Weekly subscriber password (stored hashed, never in repo)"
        required: false

permissions:
  contents: write

concurrency:
  group: nfl-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nfl/requirements.txt

      - name: Install deps
        run: pip install -r nfl/requirements.txt

      - name: Selftest (transform pipeline, no network)
        run: python nfl/build_nfl_data.py --selftest

      - name: Build split data
        run: |
          PW="${{ github.event.inputs.password || secrets.NFL_WEEKLY_PASSWORD }}"
          if [ -n "$PW" ]; then
            python nfl/build_nfl_data.py --out nfl/data \
              --seasons 2024,2025,2026 --current 2026 \
              --pbp-seasons 2024,2025 --password "$PW"
          else
            python nfl/build_nfl_data.py --out nfl/data \
              --seasons 2024,2025,2026 --current 2026 \
              --pbp-seasons 2024,2025
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "jtt-bot"
          git config user.email "actions@github.com"
          git add nfl/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(nfl): data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo "pushed on attempt $i"; pushed=1; break
              fi
              echo "push contended by a concurrent commit, retrying ($i)…"; sleep $((RANDOM % 5 + 2))
            done
            if [ "$pushed" != "1" ]; then echo "::error::push failed after retries"; exit 1; fi
          fi
