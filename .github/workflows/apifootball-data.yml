name: API-Football Data

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season start year (e.g. 2025 for 2025/26). Blank = use the default below.'
        required: false
        default: ''
  schedule:
    - cron: '30 5 * * *'     # daily 05:30 UTC — each run pulls ~90 fixtures within the free cap

permissions:
  contents: write

concurrency:
  group: apifootball-data
  cancel-in-progress: false

jobs:
  apifootball:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull API-Football data
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # Every season listed here must include the ones already stored: fetch_apifootball.py
          # wipes the store if a previously-stored season is no longer requested, so dropping a
          # year (or blanking this to fall back to the current season alone) forces a full
          # ~380-call re-backfill. Add the new season each July, keep the old ones.
          APIFOOTBALL_SEASON: ${{ github.event.inputs.season || '2024,2025,2026' }}
          APIFOOTBALL_MAX_PER_RUN: '800'
          APIFOOTBALL_PACE: '0.5'
        run: python EPL/fetch_apifootball.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EPL/data/apifootball_stats.json EPL/data/apifootball_meta.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "API-Football data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
