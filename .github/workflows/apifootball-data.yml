name: API-Football Data

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season start year (e.g. 2025 for 2025/26). Blank = use the default below.'
        required: false
        default: ''
  schedule:
    - cron: '30 5 * * *'     # daily 05:30 UTC — each run pulls ~90 fixtures within the free cap

permissions:
  contents: write

concurrency:
  group: apifootball-data
  cancel-in-progress: false

jobs:
  apifootball:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull API-Football data
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # Backfilling 2025/26 first. The daily cron finishes it over ~5 runs (100/day cap).
          # AFTER Round 1, change '2025' below to '' so the cron switches to the current season.
          APIFOOTBALL_SEASON: ${{ github.event.inputs.season || '2025' }}
        run: python EPL/fetch_apifootball.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EPL/data/apifootball_stats.json EPL/data/apifootball_meta.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "API-Football data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
