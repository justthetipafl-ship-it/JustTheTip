name: NRL Probe

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season e.g. 2026"
        required: true
        default: "2026"
      round:
        description: "Round number that has finished"
        required: true
        default: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NRL
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: System libraries for R packages
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R packages
        run: Rscript -e 'install.packages(c("nrlR","jsonlite","dplyr"), repos="https://cloud.r-project.org")'

      - name: Run probe
        run: |
          Rscript probe_nrl_v2.R "${{ github.event.inputs.season }}" "${{ github.event.inputs.round }}" > nrl_probe_output.txt 2>&1 || true
          echo "================= PROBE OUTPUT ================="
          cat nrl_probe_output.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nrl-probe-results
          path: |
            NRL/nrl_probe_output.txt
            NRL/nrl_player_logs_sample.json
          if-no-files-found: warn
          retention-days: 14
