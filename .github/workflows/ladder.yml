name: JTT Ladder
on:
  schedule:
    - cron: '0 20 * * *'   # daily ~06:00 AEST
  workflow_dispatch:
jobs:
  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ladder
        run: python scripts/build_ladder.py AFL/data
      - name: Commit
        run: |
          git config user.name "jtt-bot"
          git config user.email "bot@justthetip"
          git add AFL/data/ladder.json
          git diff --staged --quiet || git commit -m "ladder: daily update"
          git push
