name: JTT Ladders
on:
  schedule:
    - cron: '0 20 * * *'   # daily ~06:00 AEST
  workflow_dispatch:
concurrency:
  group: jtt-ladders
  cancel-in-progress: false
jobs:
  ladders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 2nd arg = fallback stat, used only when a sport has no odds.json (e.g. AFLW).
      # When odds exist, the pick is the best ~$2 same-game multi (any stat).
      - name: Build ladders (all sports)
        run: |
          python scripts/build_ladder.py AFL/data   disposals || true
          python scripts/build_ladder.py aflw/data  disposals || true
          python scripts/build_ladder.py nfl/data   recYds    || true
          python scripts/build_ladder.py ncaaf/data recYds    || true
          python scripts/build_ladder.py nba/data   points    || true
          python scripts/build_ladder.py wnba/data  points    || true
          python scripts/build_ladder.py nhl/data   shots     || true
          python scripts/build_ladder.py mlb/data   TB        || true
      - name: Commit ladders
        run: |
          git config user.name "jtt-bot"
          git config user.email "bot@justthetip"
          find . -path '*/data/ladder.json' -exec git add {} +
          git diff --staged --quiet || git commit -m "ladders: daily update"
          git push
