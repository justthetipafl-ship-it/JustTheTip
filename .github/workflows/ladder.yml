name: JTT Ladders
on:
  schedule:
    # 21:01 UTC = 07:01 AEST. The old 09:01 run sat in the middle of the US slate: by then only
    # 15 of 29 MLB games were still to start, so the pick was drawn from whatever was left rather
    # than the best of the day. An hour earlier leaves 21 of 29 ahead of it.
    # Actions crons run late under load, so treat this as "about 7am", not exactly.
    - cron: '1 21 * * *'
  workflow_dispatch:
concurrency:
  group: jtt-ladders
  cancel-in-progress: false
jobs:
  ladders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # A day is only added when a sport has real odds that yield a ~$2 multi
      # (cross-game when 2+ games are on, SGM when a single game is on).
      - name: Build ladders (all sports)
        run: |
          for s in AFL nfl nhl mlb nbl EPL; do
            python scripts/build_ladder.py "$s/data" || true
          done
          # one challenge whose day can come from ANY sport - the best build on the board
          python scripts/build_ladder.py --mixed data \
            AFL/data nfl/data EPL/data mlb/data nbl/data nhl/data || true
      - name: Commit ladders
        run: |
          git config user.name "jtt-bot"
          git config user.email "bot@justthetip"
          find . -path '*/data/ladder.json' -exec git add {} +
          git add data/ladder.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "ladders: daily update"
          git push
