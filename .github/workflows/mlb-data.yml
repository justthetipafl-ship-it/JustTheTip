name: JTT MLB daily data update

# Refreshes mlb/data/mlb_bundle.json from the MLB Stats API, then rebuilds the split
# data files the unified shell actually reads (players / gamelogs / fixture / teams /
# dvp / results / lineups / meta .json) and pulls team logos. Two runs/day:
# morning US (probable pitchers locked) + afternoon US (lineups posting).
on:
  schedule:
    - cron: '0 7 * * *'    # 07:00 UTC  (~03:00 ET) - after the full US slate ends, final gamelogs
    - cron: '0 13 * * *'   # 13:00 UTC  (~09:00 ET / ~23:00 AEST) - probable pitchers
    - cron: '0 22 * * *'   # 22:00 UTC  (~18:00 ET, lineups firming up)
  workflow_dispatch:

permissions:
  contents: write

# Don't let two data runs overlap; queue the second rather than cancel a fetch.
concurrency:
  group: mlb-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      - name: Fetch today's slate
        run: python3 mlb/fetch_mlb.py

      # Reshape the bundle into the split files the shell loads. MLB_PASSWORD is optional:
      # the suite uses one shared AFL password, but if the secret is set this writes a
      # fallback hash into mlb/data/meta.json too. If it's unset, nothing breaks.
      - name: Build split data files for the shell
        env:
          MLB_PASSWORD: ${{ secrets.MLB_PASSWORD }}
        run: python3 mlb/build_mlb_data.py mlb/data/mlb_bundle.json mlb/data

      # Official team logos from the MLB Stats API. Non-fatal so a logo hiccup never
      # blocks the data refresh.
      - name: Fetch team logos
        continue-on-error: true
        run: python3 mlb/fetch_mlb_logos.py mlb/data/mlb_bundle.json mlb/assets/logos

      - name: Commit refreshed data
        run: |
          git config user.name  "jtt-bot"
          git config user.email "[email protected]"
          git add mlb/data
          git reset -q -- mlb/data/mlb_bundle.json 2>/dev/null || true   # intermediate; full-season logs make it large
          git add mlb/assets/logos 2>/dev/null || true
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "data: refresh MLB slate $(date -u +%Y-%m-%dT%H:%MZ)"
          # Rebase onto whatever else pushed (auth job, AFL cron, etc.) and retry.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --autostash origin main \
              && git push origin main && { echo "pushed"; exit 0; }
            echo "push race - retry $i"; sleep $((RANDOM % 6 + 3))
          done
          echo "push failed after retries"; exit 1
