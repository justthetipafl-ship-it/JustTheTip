name: JTT MLB inject auth hash

# On every push that touches the tool, set AUTH_HASH from the MLB_PASSWORD secret.
# The committed file ships a demo hash so it works locally; this overwrites it for
# production. Idempotent: if the hash already matches, nothing is committed.
on:
  push:
    paths:
      - 'mlb/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject AUTH_HASH from secret
        env:
          MLB_PASSWORD: ${{ secrets.MLB_PASSWORD }}
        run: |
          if [ -z "$MLB_PASSWORD" ]; then echo "MLB_PASSWORD secret not set — skipping."; exit 0; fi
          # printf %s (no trailing newline) so it matches the browser's TextEncoder hash
          HASH=$(printf '%s' "$MLB_PASSWORD" | sha256sum | cut -d' ' -f1)
          sed -i -E "s/const AUTH_HASH = '[^']*';/const AUTH_HASH = '$HASH';/" mlb/index.html
      - name: Commit if changed
        run: |
          git config user.name  "jtt-bot"
          git config user.email "[email protected]"
          git add mlb/index.html
          git diff --cached --quiet && echo "Hash already current." || git commit -m "auth: inject MLB hash from secret"
          git push
