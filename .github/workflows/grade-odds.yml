name: Grade Odds

on:
  workflow_dispatch:
    inputs:
      minEv:
        description: 'Minimum modelled edge, in percent'
        required: false
        default: '3'
  schedule:
    # Wednesday 12:00 UTC, after Tuesday's NFL data refresh and that morning's calibration.
    # On Mondays the NFL weekend's games were not in the gamelogs yet, so every NFL price stored
    # that week sat ungraded - the sport with the most snapshots per round contributed nothing.
    - cron: '0 12 * * 3'

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Settles every stored price against what actually happened, using a model configured
      # only on games from before the capture day. Reports strike rate and return on turnover
      # by price band and edge band. Read-only: it grades, it does not write data.
      - name: Grade stored odds
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          node --max-old-space-size=6000 tools/grade-odds.js --min-ev "${{ github.event.inputs.minEv || '3' }}" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
