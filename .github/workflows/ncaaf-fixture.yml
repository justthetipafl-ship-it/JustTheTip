name: NCAAF Fixture (cfbfastR)

# Pulls the upcoming NCAA week from cfbfastR (keyless) and maps team names to the ESPN
# ids the tool uses, writing ncaaf/data/fixture.json. Week-0 safe (earliest upcoming week
# by date). If load_cfb_schedules needs a CFBD key on your setup, add CFBD_API_KEY.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 15 * * 1,2,3"   # Mon/Tue/Wed — refresh the upcoming week

permissions:
  contents: write
concurrency:
  group: ncaaf-fixture
  cancel-in-progress: false

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::cfbfastR
            any::jsonlite
      - name: Fetch NCAAF fixture
        env:
          NCAAF_SEASON: ${{ vars.NCAAF_SEASON }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: Rscript ncaaf/scripts/fetch_ncaaf_fixture.R
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ncaaf/data/fixture.json ncaaf/data/teams_extra.json ncaaf/_schedule_columns.txt 2>/dev/null || true
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "chore(ncaaf): fixture $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
