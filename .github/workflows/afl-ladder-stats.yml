name: AFL Ladder Stats (fitzRoy per-game)

# Pulls per-game AFL player stats from the Match Centre (fitzRoy) into
# AFL/data/ladder_gamelogs.json so the Ladder can result a rung the morning after
# a game, instead of waiting for wheelo's weekly per-round file. Runs BEFORE the
# JTT Ladders job (23:01 UTC), and again through game nights to catch late finishes.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 22 * * *"    # 08:00 AEST daily — catches the prior evening's games, pre-ladder
    - cron: "0 11 * * 4,5"  # ~21:00 AEST Thu/Fri — after weeknight games finish
    - cron: "0 12 * * 6,0"  # ~22:00 AEST Sat/Sun — after weekend late games

permissions:
  contents: write
concurrency:
  group: afl-ladder-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::fitzRoy
            any::jsonlite
            any::dplyr
      - name: Fetch per-game player stats (fitzRoy)
        env:
          AFL_SEASON: ${{ vars.AFL_SEASON }}
        run: Rscript scripts/fetch_afl_ladder_stats.R
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AFL/data/ladder_gamelogs.json scripts/_afl_playerstats_columns.txt 2>/dev/null || true
          if git diff --staged --quiet; then echo "no change (fetch produced nothing new)"; else
            git commit -m "chore(afl): ladder per-game stats $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
