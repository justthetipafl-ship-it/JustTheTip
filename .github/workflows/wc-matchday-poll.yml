# Save this as: .github/workflows/wc-matchday-poll.yml
#
# Matchday lineup poller — runs every 15 minutes during WC matchday hours
# to catch lineup announcements (~60-90 mins before kickoff) and odds
# movement (snapshots written to history for line-drift display).
#
# CRON SCHEDULE:
#   Runs every 15 minutes between 11:00 UTC and 22:00 UTC daily. This covers
#   the WC 2026 matchday window across all confederations (early afternoon
#   kickoffs in NA/MX through late evening kickoffs Pacific time).
#
#   Outside the tournament dates you can disable this workflow from the
#   Actions tab, OR leave it running — fetch_wc_lineups.py exits cheaply
#   if no fixtures are in the 6-hour window. Calls cost ~zero on quiet days.
#
# WHY SEPARATE FROM DAILY:
#   Daily fetcher runs once at 9am UTC. Lineups need much faster cadence
#   because they post 60-90 mins before kickoff and can change up to KO.
#
# CALL BUDGET:
#   8 matches × 4 polls/hour × 4 hours = ~130 calls per matchday window.
#   Daily quota is 7500, no concern.
#
# COMMIT BEHAVIOR:
#   Only commits when something actually changed. Most polls in the window
#   will be no-ops (lineups not yet posted, or already captured).

name: WC Matchday Poll

on:
  schedule:
    # Every 15 mins from 11:00 to 22:45 UTC
    - cron: "*/15 11-22 * * *"
  workflow_dispatch:

# Cancel any in-progress runs when a new one fires — no point queueing polls
concurrency:
  group: wc-matchday-poll
  cancel-in-progress: false  # let the previous one finish to avoid commit races

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Poll matchday lineups
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        continue-on-error: true
        working-directory: wc/data
        run: |
          python ../../fetch_wc_lineups.py

      - name: Snapshot current odds (line movement tracking)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        # Runs every 15 mins → ~4 odds snapshots/hour captured into history.
        # The history array in worldcup_odds_2026.json keeps the most recent
        # 48 snapshots (~12 hours of matchday polling), enough for the line
        # movement indicator to compute drift vs 24h ago.
        continue-on-error: true
        working-directory: wc/data
        run: |
          python ../../fetch_wc_odds.py

      - name: Pull live match status (minute, score, status)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        # Writes live_status.json with current minute + score for any in-play
        # WC fixture. The HTML reads this to power the LIVE pill and the
        # in-running probability updates. Single API call, very cheap.
        continue-on-error: true
        working-directory: wc/data
        run: |
          python ../../fetch_wc_live.py

      - name: Fetch events for newly-finished matches (goal/card minutes)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        # Powers the "By the halves" team panel section — needs each goal's
        # minute to split scoring/conceding into 1H/2H buckets. Incremental:
        # walks team_stats + FT fixtures and fetches only matches not already
        # in worldcup_events.json. On a quiet poll this exits with 0 API calls.
        # On a poll right after a match finishes, costs 1 call per FT match
        # just completed.
        continue-on-error: true
        working-directory: wc/data
        run: |
          python ../../fetch_wc_events.py

      - name: Commit any updates
        run: |
          git config user.name "JTT WC Bot"
          git config user.email "bot@justthetipaus.com"
          git add wc/data/wc_lineups.json wc/data/worldcup_odds_2026.json wc/data/live_status.json wc/data/worldcup_events.json wc/data/version.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No matchday updates this poll."
          else
            git commit -m "Matchday poll: $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase --autostash
            git push
          fi
