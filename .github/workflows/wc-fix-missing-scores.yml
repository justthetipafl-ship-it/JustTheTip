name: WC Fix Missing Scores

# Manual trigger only — one-off repair for rows where teamScore/oppScore
# were not written by an earlier backfill. Idempotent: re-runs after success
# find nothing and exit cleanly. Delete this workflow once the data's clean.
on:
  workflow_dispatch:

jobs:
  fix-missing-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Repair rows missing scores
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python fix_missing_scores.py

      - name: Commit repaired data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wc/data/worldcup_intl_logs.json wc/data/version.txt
          if git diff --staged --quiet; then
            echo "No changes (all rows already had scores)."
          else
            git commit -m "fix(wc): backfill teamScore/oppScore on missing-team rows"
            git push
            echo "Repair committed."
          fi
