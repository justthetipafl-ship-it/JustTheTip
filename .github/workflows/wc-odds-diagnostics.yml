name: WC Odds Diagnostic

# Manual trigger only — runs once to find out why /odds is returning empty.
# Output appears in the Actions log. Delete this workflow after you have the answer.
on:
  workflow_dispatch:

jobs:
  debug-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run diagnostic
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python debug_wc_odds.py
