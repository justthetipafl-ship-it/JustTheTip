name: NHL Odds (rapidodds)

# Same two-pull pattern as NFL/NBL/EPL: a sweep (--force) so the signals have prices to work
# with, then an hourly window that --window 1 gates to fire once, an hour before the first
# puck drop. NHL weeknights start ~7pm ET (23:00 UTC, 09:00 AEST); weekend matinees can start
# at 12:30-1pm ET (16:30-17:00 UTC), so the hourly window opens at 15:00 UTC to catch those.
# The sweep runs at 12:00 UTC (22:00 AEST), before the earliest matinee.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 * * *"      # 22:00 AEST - sweep (--force)
    - cron: "0 15-23 * * *"   # hourly UTC across puck-drop windows - --window 1 gates the pull

permissions:
  contents: write
concurrency:
  group: nhl-odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RapidOddsAPI
        run: pip install rapidoddsapi
      - name: Pull NHL odds
        env:
          ROA_API_KEY: ${{ secrets.ROA_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 15-23 * * *" ]; then
            python3 scripts/fetch_odds.py NHL nhl/data/odds.json --window 1
          else
            python3 scripts/fetch_odds.py NHL nhl/data/odds.json --force
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhl/data/odds.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "chore(nhl): odds $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
