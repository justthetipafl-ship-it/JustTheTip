name: AFL data refresh (fetch + split + derive)

# End-to-end, hands-off pipeline:
#   1. fetch current-season game logs + fixtures via fitzRoy -> bundle.json
#   2. split + DERIVE players / teams / DVP / form from those logs -> data/*.json
# Stage 1 is non-destructive: a failed fetch leaves the live bundle untouched,
# so a bad API day never ships empty data.

on:
  schedule:
    # AFL season cadence: Wed 23:00 UTC (Thu AM AEST) + Sun 09:00 UTC (post-round)
    - cron: "0 23 * * 3"
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      run_fetch:
        description: "Run the fitzRoy fetch (false = re-split existing bundle only)"
        required: false
        default: "true"
      password:
        description: "Weekly subscriber password (stored hashed, never in repo)"
        required: false

env:
  # dispatch input wins; scheduled runs always fetch
  RUN_FETCH: ${{ github.event.inputs.run_fetch || 'true' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ---------- Stage 1: fitzRoy fetch -> bundle.json ----------
      - name: Set up R
        if: env.RUN_FETCH == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true        # precompiled binaries (~2 min vs 20+ from source)

      - name: Install R packages (cached)
        if: env.RUN_FETCH == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::fitzRoy
            cran::jsonlite
            cran::dplyr

      - name: Fetch latest game logs + fixtures (fitzRoy)
        if: env.RUN_FETCH == 'true'
        env:
          AFL_BUNDLE: AFL/bundle.json
        run: Rscript scripts/fetch_afl.R

      # ---------- Stage 2: split + derive (always) ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build split data files
        run: |
          PW="${{ github.event.inputs.password || secrets.AFL_WEEKLY_PASSWORD }}"
          if [ -n "$PW" ]; then
            python AFL/build_afl_data.py --src AFL/bundle.json --out AFL/data \
              --seasons 2025,2026 --current 2026 --password "$PW"
          else
            python AFL/build_afl_data.py --src AFL/bundle.json --out AFL/data \
              --seasons 2025,2026 --current 2026
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "jtt-bot"
          git config user.email "actions@github.com"
          git add AFL/data AFL/bundle.json scripts/_afl_columns.txt 2>/dev/null || git add AFL/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(afl): refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
