name: AFL fixtures + results + lineups (fitzRoy)

# Match-level data the wheelo CSV pipeline doesn't carry:
#   * fixtures — upcoming round
#   * results  — OFFICIAL final scores (exact margins, no rushed-behind drift)
#   * lineups  — selected sides for the upcoming round (Role Watch / Absorbers)
# Game logs / player / team stats come from ingest_csv.py — this workflow NEVER
# touches them; fetch_afl.R only refreshes fixture/results/lineups in bundle.json.

on:
  schedule:
    - cron: "0 12 * * 4"   # Thu 12:00 UTC (~Thu 10pm AEST) — teams named -> lineups
    - cron: "0 9  * * 0"   # Sun 09:00 UTC (~Sun 7pm AEST)  — post-round results
  workflow_dispatch:
    inputs:
      password:
        description: "Weekly subscriber password (stored hashed, never in repo)"
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::fitzRoy
            cran::jsonlite
            cran::dplyr

      - name: Fetch fixtures + results + lineups (fitzRoy)
        env:
          AFL_BUNDLE: AFL/bundle.json
          RESULTS_SEASONS: "2024,2025,2026"
        run: Rscript scripts/fetch_afl.R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild split data
        run: |
          PW="${{ github.event.inputs.password || secrets.AFL_WEEKLY_PASSWORD }}"
          if [ -n "$PW" ]; then
            python AFL/build_afl_data.py --src AFL/bundle.json --out AFL/data \
              --seasons 2024,2025,2026 --current 2026 --password "$PW"
          else
            python AFL/build_afl_data.py --src AFL/bundle.json --out AFL/data \
              --seasons 2024,2025,2026 --current 2026
          fi

      - name: Fetch player-prop odds (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AFL_ODDS_OUT: AFL/data/odds.json
        run: python AFL/fetch_odds.py

      - name: Commit refreshed data
        run: |
          git config user.name  "jtt-bot"
          git config user.email "actions@github.com"
          git add AFL/data AFL/bundle.json scripts/_afl_*_columns.txt 2>/dev/null || git add AFL/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(afl): fixtures/results/lineups + odds $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
