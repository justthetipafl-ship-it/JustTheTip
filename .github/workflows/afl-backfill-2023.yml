name: AFL 2023 game-log backfill (fitzRoy → CSV → build)

# One-shot backfill of 2023 player game logs so Deja Vu / Bunnies get a 3rd+
# head-to-head meeting for the pairs currently stuck at 2. Run it once from the
# Actions tab. It: (1) fetches 2023 player stats via fitzRoy and writes
# AFL/csv/gamelogs_2023.csv, (2) runs the normal ingest + build, (3) commits the
# CSV and the rebuilt data. The CSV is committed so it stays a permanent input —
# future CSV-ingest runs keep including 2023 with no re-fetch.
#
# Safe to re-run: ingest upserts by (Year, MatchId, Player), and backfill_2023.R
# exits without writing if the fitzRoy schema drifts.

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Weekly subscriber password (optional; falls back to the AFL_WEEKLY_PASSWORD secret)"
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- R + fitzRoy (same setup as the fixtures/results workflow) ----
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install fitzRoy + readr
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::fitzRoy
            cran::readr

      - name: Fetch 2023 player game logs → AFL/csv/gamelogs_2023.csv
        run: Rscript scripts/backfill_2023.R

      # ---- Python ingest + build (same as the CSV-ingest workflow) ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest game-log CSVs → bundle.json
        env:
          AFL_BUNDLE: AFL/bundle.json
          CSV_DIR: AFL/csv
          PLAYER_DIR: AFL/csv_players
          TEAMFORM_DIR: AFL/csv_team_for
          TEAMDEF_DIR: AFL/csv_team_against
        run: python AFL/ingest_csv.py

      - name: Build split data files
        run: |
          PW="${{ github.event.inputs.password || secrets.AFL_WEEKLY_PASSWORD }}"
          if [ -n "$PW" ]; then
            python AFL/build_afl_data.py --src AFL/bundle.json --out AFL/data \
              --seasons 2023,2024,2025,2026 --current 2026 --password "$PW"
          else
            python AFL/build_afl_data.py --src AFL/bundle.json --out AFL/data \
              --seasons 2023,2024,2025,2026 --current 2026
          fi

      - name: Commit 2023 CSV + rebuilt data
        run: |
          git config user.name  "jtt-bot"
          git config user.email "actions@github.com"
          git add AFL/csv/gamelogs_2023.csv AFL/bundle.json AFL/data 2>/dev/null || git add AFL/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(afl): backfill 2023 game logs $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo "pushed on attempt $i"; pushed=1; break
              fi
              echo "push contended by a concurrent commit, retrying ($i)…"; sleep $((RANDOM % 5 + 2))
            done
            if [ "$pushed" != "1" ]; then echo "::error::push failed after retries"; exit 1; fi
          fi
