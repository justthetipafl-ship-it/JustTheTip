name: NBA bundle

# Multi-daily rebuild - NBA data goes stale fast (games every night).
# Times are UTC. AEST = UTC+10. These fire roughly:
#   16:00 UTC = 02:00 AEST  (after the previous US night settles)
#   22:00 UTC = 08:00 AEST  (morning refresh)
#   02:00 UTC = 12:00 AEST  (midday - injuries/lineups firming)
#   08:00 UTC = 18:00 AEST  (evening, pre-US-tipoff)

on:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
    - cron: '0 2 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-bundle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install nba_api requests

      - name: Smoke test (NBA Stats API reachability)
        id: smoke
        continue-on-error: true
        env:
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
        run: python fetch_nba_bundle.py --smoke

      - name: Build bundle
        if: steps.smoke.outcome == 'success'
        env:
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
          JTT_NBA_PASSWORD: ${{ secrets.JTT_NBA_PASSWORD }}
        run: python fetch_nba_bundle.py --season 2025-26 --out NBA/bundle.json

      - name: Commit bundle
        if: steps.smoke.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NBA/bundle.json
          if git diff --staged --quiet; then
            echo "No change in bundle."
          else
            git commit -m "chore(nba): rebuild bundle $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Flag IP block
        if: steps.smoke.outcome != 'success'
        run: |
          echo "::warning::NBA Stats API smoke test failed - runner likely IP-blocked."
          echo "Set the NBA_PROXY secret or move this job to a self-hosted runner."
          exit 1
