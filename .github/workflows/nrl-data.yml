name: NRL Data Fetch

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season e.g. 2026"
        required: true
        default: "2026"
  schedule:
    # Daily 20:00 UTC ~= 6am AEST — catches overnight-completed games
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NRL
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: System libraries for R packages
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-nrlR
          restore-keys: r-pkgs-${{ runner.os }}-

      - name: Install R packages
        run: Rscript -e 'install.packages(c("nrlR","jsonlite","dplyr"))'

      - name: Fetch NRL data
        run: Rscript fetch_nrl_data.R "${{ github.event.inputs.season || '2026' }}" 2>&1 | tee nrl_fetch_output.txt

      - name: Commit refreshed data
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "jtt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage whatever the fetcher produced — a missing file (e.g. empty
          # fixtures) must NOT abort the step, so add the folder not names
          git add NRL/data 2>/dev/null || echo "nothing under NRL/data to stage"
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Auto: refresh NRL data $(date -u +%F)"
            git push
          fi

      - name: Upload data (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrl-data
          path: NRL/nrl_fetch_output.txt
          if-no-files-found: warn
          retention-days: 7
