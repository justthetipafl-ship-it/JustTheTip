name: NRL daily data update

on:
  schedule:
    # 18:30 UTC ~= 04:30 AEST — after late games settle, before morning traffic.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      next_round:
        description: "Round for lineups (0 = auto/latest)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: nrl-daily-update
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      NRL_COMP_ID: ${{ vars.NRL_COMP_ID }}
      NRL_NEXT_ROUND: ${{ github.event.inputs.next_round || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rpkgs-nrlR-v1
          restore-keys: ${{ runner.os }}-rpkgs-

      - name: Install R deps
        run: |
          Rscript -e 'options(repos=c(CRAN="https://cloud.r-project.org"))
                      pkgs <- c("nrlR","jsonlite")
                      need <- pkgs[!pkgs %in% rownames(installed.packages())]
                      if (length(need)) install.packages(need)'

      - name: Fetch NRL data
        run: Rscript fetch_nrl.R

      - name: Commit refreshed JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(nrl): daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
