    if (!isPlayingP(key, n, team)) return;                      // named lineup out and he isn't in it
    var sum = 0;
    rows.forEach(function(r){ sum += statOf(key, r, mkt); });
    if (rows.length > maxN) maxN = rows.length;
    var pr = state.sports[key].idx.byName[n] || {};
    pool.push({ name:n, pos:posShortP(pr), avg:sum/rows.length, n:rows.length, lastMs:logMs(rows[0]) });
  });
  // 3 games is the sample we want, but early in a season nobody has three - so the gate
  // drops to whatever the most-played man on the team actually has.
  var need = Math.min(3, maxN);
  pool = pool.filter(function(r){ return r.n >= need; });
  pool.sort(function(a,b){ return b.avg - a.avg; });
  // A side that hasn't played yet this season (every NBL club in week one) would show a blank
  // card. Fall back to the previous season rather than show nothing - and say so on the card.
  if (!pool.length && win !== 'l5' && !statLeaders._fallback){
    statLeaders._fallback = true;
    try {
      var prev = statLeadersSeason(key, team, mkt, season - 1, limit);
      if (prev.length){ prev._fellBack = season - 1; return prev; }
    } finally { statLeaders._fallback = false; }
  }
  return pool.slice(0, limit || 5);
}
function statLeadersSeason(key, team, mkt, yr, limit){
  var logs = asArray(state.sports[key].data.gamelogs) || [], want = normTeam(team), byP = {};
  logs.forEach(function(r){
    if (!r || normTeam(r.Team || r.team) !== want || (+(r.Year||r.year)||0) !== yr) return;
    var n = r.Player || r.player; if (n) (byP[n] = byP[n] || []).push(r);
  });
  var pool = [], maxN = 0;
  Object.keys(byP).forEach(function(n){
    var rows = sortLogsDesc(byP[n]).filter(function(r){ return statOf(key, r, mkt) != null; });
    if (!rows.length || !isPlayingP(key, n, team)) return;
    var sum = 0; rows.forEach(function(r){ sum += statOf(key, r, mkt); });
    if (rows.length > maxN) maxN = rows.length;
    var pr = state.sports[key].idx.byName[n] || {};
    pool.push({ name:n, pos:posShortP(pr), avg:sum/rows.length, n:rows.length, lastMs:logMs(rows[0]) });
  });
  pool = pool.filter(function(r){ return r.n >= Math.min(3, maxN); });
  pool.sort(function(a,b){ return b.avg - a.avg; });
  return pool.slice(0, limit || 5);
}
function slCard(key, team, mkt, win, max){
  var rows = statLeaders(key, team, mkt, win, 5);
  var head = '<div class="sl-head">'+teamLogo(key,team)+'<span class="sl-nm">'+esc(abbrOf(key,team))+'</span>'
    + '<span class="sl-mk">'+esc(mktLabel(key, mkt))+'</span>'
    + (rows._fellBack ? '<span class="sl-mk" style="margin-left:6px;color:#f59e0b">'+rows._fellBack
        + ' \u00b7 no games yet this season</span>' : '')+'</div>';
  if (!rows.length) return '<div class="sl-card">'+head
    + '<div class="sl-none">No '+esc(mktLabel(key, mkt))+' recorded in this window.</div></div>';
  var dec = max < 3 ? 2 : 1;
  var body = rows.map(function(r, i){
    var pct = max > 0 ? Math.max(3, Math.round(r.avg / max * 100)) : 0;
    return '<div class="sl-row" onclick="LAB.player(\''+key+'\',\''+esc(r.name).replace(/'/g,"\\'")+'\')">'
      + '<span class="sl-rk">'+(i+1)+'</span>'
      + '<span class="sl-who"><b>'+esc(r.name)+'</b><span>'+esc(r.pos||'')+(r.pos?' \u00b7 ':'')+r.n+' gm</span></span>'
      + '<span class="sl-bars"><span class="sl-bar-t"><i style="width:'+pct+'%"></i></span></span>'
      + '<span class="sl-val">'+r.avg.toFixed(dec)+'</span></div>';
  }).join('');
  // Stale-feed guard: if the newest game carrying this stat is older than the team's newest
  // game, the card is running on history and says so instead of looking current.
  var newest = 0, played = 0;
  rows.forEach(function(r){ if (r.lastMs && r.lastMs > newest) newest = r.lastMs; });
  (asArray(state.sports[key].data.gamelogs)||[]).forEach(function(r){
    if (!r || normTeam(r.Team||r.team) !== normTeam(team)) return;
    var ms = logMs(r); if (ms && ms > played) played = ms;
  });
  var note = (newest && played && played - newest > 6048e5)      // more than a week behind
    ? '<div class="sl-none">Stat last recorded '+esc(localDate(newest))+'.</div>' : '';
  return '<div class="sl-card">'+head+body+note+'</div>';
}
function leadersSection(key, g){
  var mkts = slMarkets(key);
  if (!mkts.length)
    return secNote('Stat Leaders', SPORTS[key].name+' config.js defines no markets (oddsMkts / multiMkts), so there is nothing to rank on.');
  if (!(asArray(state.sports[key].data.gamelogs)||[]).length)
    return secNote('Stat Leaders', 'gamelogs.json returned nothing for '+SPORTS[key].name+' \u2014 leaders are computed from game logs, so nothing can be ranked.');
  var mkt = state.view.slMkt[key] || mkts[0][0];
  if (!mkts.some(function(m){ return m[0] === mkt; })) mkt = mkts[0][0];
  var win = state.view.slWin || 'season';
  var a = statLeaders(key, g.away, mkt, win, 5), h = statLeaders(key, g.home, mkt, win, 5);
  var max = 0;
  a.concat(h).forEach(function(r){ if (r.avg > max) max = r.avg; });
  var chips = mkts.map(function(m){
    return '<button class="sl-chip'+(m[0]===mkt?' on':'')+'" onclick="LAB.slMkt(\''+key+'\',\''+m[0]+'\')">'
      + esc(m[1])+'</button>'; }).join('');
  var wins = [['season','Season'],['l5','Last 5']].map(function(w){
    return '<button class="sl-chip'+(w[0]===win?' on':'')+'" onclick="LAB.slWin(\''+w[0]+'\')">'+w[1]+'</button>';
  }).join('');
  return '<div class="dayband"><span>Stat Leaders</span></div>'
    + '<div class="sl-bar">'+chips+'<span class="sl-win">'+wins+'</span></div>'
    + '<div class="sl-grid">'+slCard(key,g.away,mkt,win,max)+slCard(key,g.home,mkt,win,max)+'</div>';
}

/* ---- team section: lineup -------------------------------------------------
   Four sports, four different things on file, so this is a dispatcher rather than
   one renderer pretending they're the same:
     AFL  named team sheet by field position, confirmed or unconfirmed
     NFL  depth chart (QB/RB/WR/TE only - that's all the feed carries)
     MLB  the probable lineup for THIS gamePk, sorted by each bat's season order slot
     EPL  no lineup feed at all - last XI by minutes, plus FPL availability flags       */
var AFL_LINES = [
  ['Backs',        ['FB','BPL','BPR','HBFL','CHB','HBFR']],
  ['Midfield',     ['C','WL','WR','RK','RR','R']],
  ['Forwards',     ['CHF','HFFL','HFFR','FF','FPL','FPR']],
  ['Interchange',  ['INT']],
  ['Emergency',    ['EMERG']]
];
function injuryFor(key, team, name){
  var inj = asArray(state.sports[key].data.injury) || [];
  for (var i=0;i<inj.length;i++){
    var r = inj[i]; if (!r) continue;
    if ((r.Player || r.player) !== name) continue;
    if (r.Team && normTeam(r.Team) !== normTeam(team)) continue;
    return { label:(r.Status || r.Returning || 'Injured'), out:/^out$|season/i.test(String(r.Status||r.Returning||'')) };
  }
  return null;
}
function buildLineup(key, team, g){
  var S = state.sports[key], out = { groups:[], status:'', statusCls:'', sub:'' };
  var flag = function(n){ return injuryFor(key, team, n); };

  if (key === 'afl'){
    var lu = (asArray(S.data.lineups) || []).filter(function(r){ return r && normTeam(r.team) === normTeam(team); });
    if (!lu.length) return null;
    var rd = lu.reduce(function(m,r){ return Math.max(m, +r.round||0); }, 0);
    lu = lu.filter(function(r){ return +r.round === rd; });
    var conf = lu.some(function(r){ return /CONCLUDED|CONFIRMED/i.test(r.status||''); })
               && !lu.some(function(r){ return /UNCONFIRMED/i.test(r.status||''); });
    out.status = conf ? 'Named' : 'Unconfirmed';
    out.statusCls = conf ? 'ok' : 'soft';
    out.sub = 'Round ' + rd + ' team sheet';
    var used = {};
    AFL_LINES.forEach(function(ln){
      var ps = [];
      ln[1].forEach(function(code){
        lu.forEach(function(r){
          if (r.position !== code || used[r.player]) return;
          used[r.player] = 1;
          ps.push({ name:r.player, tag:code, flag:flag(r.player) });
        });
      });
      if (ps.length) out.groups.push({ name:ln[0], players:ps });
    });
    var rest = lu.filter(function(r){ return !used[r.player]; });
    if (rest.length) out.groups.push({ name:'Other', players:rest.map(function(r){
      return { name:r.player, tag:r.position||'', flag:flag(r.player) }; }) });
    return out;
  }

  if (key === 'nfl'){
    var d = (asArray(S.data.lineups) || []).filter(function(r){ return r && r.team === team; });
    if (!d.length) return null;
    var wk = d.reduce(function(m,r){ return Math.max(m, +r.week||0); }, 0);
    d = d.filter(function(r){ return +r.week === wk; });
    out.status = 'Depth chart'; out.statusCls = ''; out.sub = 'Week ' + wk + ' \u00b7 skill positions only';
    ['QB','RB','WR','TE'].forEach(function(pos){
      var ps = d.filter(function(r){ return r.position === pos; })
        .sort(function(a,b){ return (+a.depth||9) - (+b.depth||9); })
        .filter(function(r, i, arr){ return arr.findIndex(function(x){ return x.player === r.player; }) === i; })
        .slice(0, pos === 'WR' ? 6 : 4)
        .map(function(r){
          return { name:r.player, tag:(/STARTER/i.test(r.status||'') ? 'ST' : 'D'+(r.depth||'')), flag:flag(r.player) };
        });
      if (ps.length) out.groups.push({ name:pos, players:ps });
    });
    return out.groups.length ? out : null;
  }

  if (key === 'mlb'){
    var lus = asArray(S.data.lineups) || [];
    var row = null;
    for (var i=0;i<lus.length;i++){ if (lus[i] && lus[i].gamePk === g.gamePk){ row = lus[i]; break; } }
    if (!row) return null;
    var side = (normTeam(team) === normTeam(g.home)) ? row.home : row.away;
    if (!side || !side.length) return null;
    var byId = S.idx.byId;
    if (!byId){ byId = S.idx.byId = {}; (S.idx.players||[]).forEach(function(p){ if (p && p.id != null) byId[p.id] = p; }); }
    var bats = [], arms = [];
    side.forEach(function(id){
      var p = byId[id]; if (!p) return;
      var e = { name:p.name, tag:(p.position||'') + (p.bats ? ' '+p.bats : ''), flag:flag(p.name), ord:+p.order||99 };
      (p.role === 'pitch' ? arms : bats).push(e);
    });
    bats.sort(function(a,b){ return a.ord - b.ord || a.name.localeCompare(b.name); });
    out.status = 'Probable'; out.statusCls = 'soft';
    out.sub = 'Order shown is each bat\u2019s season slot, not a posted card';
    if (bats.length) out.groups.push({ name:'Bats', players:bats });
    if (arms.length) out.groups.push({ name:'Arms', players:arms });
    var sp = (normTeam(team) === normTeam(g.home)) ? g.homePitcher : g.awayPitcher;
    if (sp) out.groups.unshift({ name:'Starting pitcher', players:[{ name:sp, tag:'SP', flag:flag(sp) }] });
    return out.groups.length ? out : null;
  }

  // NHL: no lineup feed. The last game's dressed roster is in the gamelogs with ice time, which
  // orders the lines well enough: the goalie who played, then forwards and defence by TOI.
  if (key === 'nhl'){
    var hl = (asArray(S.data.gamelogs) || []).filter(function(r){
      return r && normTeam(r.Team || r.team) === normTeam(team) && (+r.toiMin || 0) > 0; });
    if (!hl.length) return null;
    sortLogsDesc(hl);
    var hd = String(hl[0].Date || hl[0].date || '').slice(0, 10);
    var hg = hl.filter(function(r){ return String(r.Date || r.date || '').slice(0, 10) === hd; })
      .sort(function(a,b){ return (+b.toiMin||0) - (+a.toiMin||0); });
    var toi = function(r){ var m = +r.toiMin || 0; return Math.floor(m)+':'+String(Math.round((m % 1)*60)).padStart(2,'0'); };
    var row = function(r){ return { name:r.Player, tag:r.pos || '', flag:{ label:toi(r), out:false } }; };
    var gk = hg.filter(function(r){ return r.pos === 'G'; }).slice(0, 1);
    var fw = hg.filter(function(r){ return r.pos === 'C' || r.pos === 'L' || r.pos === 'R'; }).slice(0, 12);
    var df = hg.filter(function(r){ return r.pos === 'D'; }).slice(0, 6);
    out.status = 'Derived'; out.statusCls = 'soft';
    out.sub = 'Dressed roster from the last game \u00b7 ' + hd + ' \u00b7 by ice time \u00b7 no lineup feed';
    if (gk.length) out.groups.push({ name:'Goalie', players: gk.map(row) });
    if (fw.length) out.groups.push({ name:'Forwards', players: fw.map(row) });
    if (df.length) out.groups.push({ name:'Defence', players: df.map(row) });
    return out.groups.length ? out : null;
  }

  // NBL: no lineup feed either, but the box scores carry a starter flag - so the last game's
  // starting five is a real record, and the rotation behind them is everyone else who played.
  if (key === 'nbl'){
    var nlogs = (asArray(S.data.gamelogs) || []).filter(function(r){
      return r && normTeam(r.Team || r.team) === normTeam(team) && (+r.minutes || 0) > 0; });
    if (!nlogs.length) return null;
    sortLogsDesc(nlogs);
    var nd = String(nlogs[0].Date || nlogs[0].date || '').slice(0, 10);
    var game = nlogs.filter(function(r){ return String(r.Date || r.date || '').slice(0, 10) === nd; });
    var tagOf = function(r){ var pr = (S.idx.byName || {})[r.Player] || {}; return pr.position || r.pos || ''; };
    var five = game.filter(function(r){ return +r.starter === 1; })
      .sort(function(a,b){ return (+b.minutes||0) - (+a.minutes||0); });
    var bench = game.filter(function(r){ return +r.starter !== 1; })
      .sort(function(a,b){ return (+b.minutes||0) - (+a.minutes||0); });
    var mins = function(r){ return Math.round(+r.minutes || 0)+' min'; };
    out.status = 'Derived'; out.statusCls = 'soft';
    out.sub = 'Starting five from the last game \u00b7 ' + nd + ' \u00b7 no lineup feed';
    if (five.length) out.groups.push({ name:'Starting five', players: five.map(function(r){
      return { name:r.Player, tag:tagOf(r), flag:{ label:mins(r), out:false } }; }) });
    if (bench.length) out.groups.push({ name:'Rotation', players: bench.slice(0, 5).map(function(r){
      return { name:r.Player, tag:tagOf(r), flag:{ label:mins(r), out:false } }; }) });
    return out.groups.length ? out : null;
  }

  // EPL: no lineup feed exists, so this is explicitly derived, not a team sheet.
  var logs = asArray(S.data.gamelogs) || [];
  var mine = logs.filter(function(r){ return r && normTeam(r.Team||r.team) === normTeam(team) && +r.min > 0; });
  if (!mine.length) return null;
  sortLogsDesc(mine);
  var last = String(mine[0].date || mine[0].Date || '').slice(0,10);
  var xi = mine.filter(function(r){ return String(r.date||r.Date||'').slice(0,10) === last; })
    .sort(function(a,b){ return (+b.min||0) - (+a.min||0); }).slice(0, 11);
  out.status = 'Derived'; out.statusCls = 'soft';
  out.sub = 'Last XI by minutes' + (last ? ' \u00b7 ' + last : '') + ' \u00b7 no lineup feed';
  var byName = S.idx.byName || {};
  out.groups.push({ name:'Last XI', players: xi.map(function(r){
    var pr = byName[r.Player] || {};
    return { name:r.Player, tag:(pr.pos || pr.position || ''), flag:null };
  })});
  var STAT = { i:{l:'Injured',o:1}, s:{l:'Suspended',o:1}, u:{l:'Unavailable',o:1}, d:{l:'Doubtful',o:0} };
  var flagged = (S.idx.players || []).filter(function(p){ return p && p.team === team && STAT[p.status]; })
    .map(function(p){ return { name:p.name, tag:(p.pos||p.position||''),
      flag:{ label:STAT[p.status].l, out:!!STAT[p.status].o } }; });
  if (flagged.length) out.groups.push({ name:'Unavailable / doubtful', players:flagged });
  return out;
}
function luCard(key, team, g){
  var d = buildLineup(key, team, g);
  var head = '<div class="lu-head">'+teamLogo(key,team)+'<span class="lu-nm">'+esc(abbrOf(key,team))+'</span>'
    + (d && d.status ? '<span class="lu-st '+d.statusCls+'">'+esc(d.status)+'</span>' : '')+'</div>';
  if (!d) return '<div class="lu-card">'+head+'<div class="sl-none">No lineup on file for this team.</div></div>';
  var body = d.groups.map(function(gr){
    return '<div class="lu-grp">'+esc(gr.name)+'</div>' + gr.players.map(function(p){
      return '<div class="lu-row" onclick="LAB.player(\''+key+'\',\''+esc(p.name).replace(/'/g,"\\'")+'\')">'
        + '<span class="lu-tag">'+esc(p.tag||'')+'</span><span class="lu-p">'+esc(p.name)+'</span>'
        + (p.flag ? '<span class="lu-flag'+(p.flag.out?' out':'')+'">'+esc(p.flag.label)+'</span>' : '')
        + '</div>'; }).join('');
  }).join('');
  return '<div class="lu-card">'+head+(d.sub?'<div class="lu-sub">'+esc(d.sub)+'</div>':'')+body+'</div>';
}
function lineupSection(key, g){
  var a = luCard(key, g.away, g), h = luCard(key, g.home, g);
  return '<div class="dayband"><span>Lineup</span></div><div class="lu-grid">'+a+h+'</div>';
}

/* ---- team section: DVP by position ----------------------------------------
   dvp.json is "allowed per game to that position", so the read is about the team
   in the OTHER column: rank 1 = concedes the most = softest spot to attack.
   MLB's file only carries pos "ALL", so it renders one honest team-level row.     */
function dvpMarkets(key){
  var cfg = state.sports[key].config || {};
  return (cfg.dvpStats || cfg.oddsMkts || cfg.multiMkts || []).slice(0, 8);
}
function dvpBoard(key, mkt){
  var S = state.sports[key];
  var rows = asArray(S.data.dvp) || [];
  // dvp.json keeps clubs from earlier seasons - EPL carries Leicester, Southampton, Burnley and
  // co. Ranking a 20-team league out of 25 makes every "3rd softest" wrong, so the board is
  // restricted to clubs in this season's teams.json when that file is there to restrict it by.
  var current = S.idx.teamMapN && Object.keys(S.idx.teamMapN).length ? S.idx.teamMapN : null;
  var byPos = {};
  rows.forEach(function(r){
    if (!r || !r.pos || r.team == null) return;
    if (current && !current[normTeam(r.team)]) return;
    var v = r[mkt]; if (v == null || !isFinite(+v)) return;
    var list = (byPos[r.pos] = byPos[r.pos] || []);
    // EPL's dvp.json carries each club twice under two naming styles ("Spurs" and
    // "Tottenham"), which would rank a 20-team league out of 30. Collapse on the
    // normalised name and keep one entry per club.
    var k2 = normTeam(r.team), dup = null;
    for (var i=0;i<list.length;i++){ if (normTeam(list[i].team) === k2){ dup = list[i]; break; } }
    if (dup){ if (+v > dup.val) dup.val = +v; return; }
    list.push({ team:r.team, val:+v });
  });
  Object.keys(byPos).forEach(function(pos){
    var list = byPos[pos].sort(function(a,b){ return b.val - a.val; });   // most allowed first
    var mx = list.length ? list[0].val : 0;
    list.forEach(function(e, i){ e.rank = i+1; e.of = list.length; e.max = mx; });
    if (mx <= 0) delete byPos[pos];                                      // stat doesn't apply to this position
  });
  return byPos;
}
function dvpCard(key, team, mkt, board){
  var cfg = state.sports[key].config || {};
  var order = (cfg.posOrder || []).slice();
  Object.keys(board).forEach(function(p){ if (order.indexOf(p) < 0) order.push(p); });
  var head = '<div class="dv-head">'+teamLogo(key,team)+'<span class="dv-nm">'+esc(abbrOf(key,team))+'</span>'
    + '<span class="dv-mk">'+esc(mktLabel(key, mkt))+' allowed</span></div>';
  var body = '', any = false;
  order.forEach(function(pos){
    var list = board[pos]; if (!list) return;
    var e = null;
    for (var i=0;i<list.length;i++){ if (normTeam(list[i].team) === normTeam(team)){ e = list[i]; break; } }
    if (!e) return;
    any = true;
    var third = Math.max(1, Math.round(e.of/3));
    var cls = e.rank <= third ? 'soft' : (e.rank > e.of - third ? 'tough' : '');
    var pct = e.max > 0 ? Math.max(3, Math.round(e.val / e.max * 100)) : 0;
    var dec = e.max < 3 ? 2 : 1;
    body += '<div class="dv-row"><span class="dv-pos">'+esc(pos === 'ALL' ? 'All bats' : pos)+'</span>'
      + '<span class="dv-bars"><span class="dv-bar-t"><i class="'+cls+'" style="width:'+pct+'%"></i></span></span>'
      + '<span class="dv-val">'+e.val.toFixed(dec)+'</span>'
      + '<span class="dv-rk '+cls+'">'+e.rank+'/'+e.of+'</span></div>';
  });
  if (!any) return '<div class="dv-card">'+head+'<div class="sl-none">No '+esc(mktLabel(key,mkt))+' splits on file.</div></div>';
  return '<div class="dv-card">'+head
    + '<div class="dv-sub">Per game \u00b7 rank 1 = concedes most</div>'+body+'</div>';
}
function dvpSection(key, g){
  var mkts = dvpMarkets(key);
  if (!mkts.length)
    return secNote('DVP by Position', SPORTS[key].name+' config.js defines no dvpStats, so there are no markets to split by.');
  if (!(asArray(state.sports[key].data.dvp)||[]).length)
    return secNote('DVP by Position', 'dvp.json returned nothing for '+SPORTS[key].name+' \u2014 the file is missing, empty, or failed to load.');
  var mkt = state.view.dvpMkt[key] || mkts[0][0];
  if (!mkts.some(function(m){ return m[0] === mkt; })) mkt = mkts[0][0];
  var board = dvpBoard(key, mkt);
  if (!Object.keys(board).length)
    return secNote('DVP by Position', 'No team in '+SPORTS[key].name+' records '+mktLabel(key, mkt)+' allowed by position.');
  var chips = mkts.map(function(m){
    return '<button class="sl-chip'+(m[0]===mkt?' on':'')+'" onclick="LAB.dvpMkt(\''+key+'\',\''+m[0]+'\')">'
      + esc(m[1])+'</button>'; }).join('');
  return '<div class="dayband"><span>DVP by Position</span></div>'
    + '<div class="sl-bar">'+chips+'</div>'
    + '<div class="dv-grid">'+dvpCard(key,g.away,mkt,board)+dvpCard(key,g.home,mkt,board)+'</div>';
}

/* ---- team section: positional distribution --------------------------------
   Ported from the production tool's _posDistribution: two pies per team, the split
   of the ball this team's OWN positions take (For) against the split its defence
   gives up (Against). AFL reads Against from dvp.json; NFL has no positional DVP
   for targets, so it aggregates gamelogs by opponent on a rolling window.          */
var AFL_POS = [
  {k:'Key Defender',s:'KD',c:'#1d4ed8'},{k:'Gen. Defender',s:'GD',c:'#38bdf8'},{k:'Midfielder',s:'MID',c:'#22c55e'},
  {k:'Mid-Forward',s:'MF',c:'#eab308'},{k:'Gen. Forward',s:'GF',c:'#f97316'},{k:'Key Forward',s:'KF',c:'#ef4444'},
  {k:'Ruck',s:'RUC',c:'#a855f7'}
];
var NFL_POS = [ {k:'WR',s:'WR',c:'#dc2626'},{k:'RB',s:'RB',c:'#6b7280'},{k:'TE',s:'TE',c:'#38bdf8'} ];
var POS_DIST_CFG = {
  afl: { stat:'disposals', label:'Disposal', groups:AFL_POS, against:'dvp' },
  nfl: { stat:'targets',   label:'Target',   groups:NFL_POS, against:'gamelog' }
};
function glAgainst(key, stat, groups){
  var S = state.sports[key];
  S.idx.glAg = S.idx.glAg || {};
  if (S.idx.glAg[stat]) return S.idx.glAg[stat];
  var gk = {}; groups.forEach(function(p){ gk[p.k] = 1; });
  var posMap = {}; (S.idx.players||[]).forEach(function(p){ if (p && p.name) posMap[p.name] = p.position; });
  var logs = asArray(S.data.gamelogs) || [];
  // Rolling last-10-games-per-DEFENCE, not a hard season lock: two weeks into a season
  // nobody has current-year sample, which would leave Against empty for most teams.
  var byOppGame = {}, curYr = 0;
  logs.forEach(function(r){
    var pos = posMap[r.Player]; if (!pos || !gk[pos]) return;
    var opp = r.Opp; if (!opp) return;
    var y = +r.Year||0; if (y > curYr) curYr = y;
    (byOppGame[opp] = byOppGame[opp] || {})[y*100 + (+r.Week||0)] = 1;
  });
  var keep = {};
  Object.keys(byOppGame).forEach(function(opp){
    var all = Object.keys(byOppGame[opp]).map(Number).sort(function(a,b){ return b-a; });
    var cur = all.filter(function(yw){ return Math.floor(yw/100) === curYr; });
    keep[opp] = {};
    (cur.length >= 10 ? cur : all.slice(0,10)).forEach(function(yw){ keep[opp][yw] = 1; });
  });
  var ag = {};
  logs.forEach(function(r){
    var pos = posMap[r.Player]; if (!pos || !gk[pos]) return;
    var opp = r.Opp; if (!opp) return;
    var yw = (+r.Year||0)*100 + (+r.Week||0);
    if (!keep[opp] || !keep[opp][yw]) return;
    (ag[opp] = ag[opp] || {})[pos] = (ag[opp][pos]||0) + (+r[stat]||0);
  });
  return (S.idx.glAg[stat] = ag);
}
function posDist(key, team){
  var cfg = POS_DIST_CFG[key]; if (!cfg) return null;
  var S = state.sports[key], G = cfg.groups, stat = cfg.stat, fd = {}, ad = {};
  G.forEach(function(p){ fd[p.k] = 0; ad[p.k] = 0; });
  // For: games-weighted season volume, so a 30-disposal player who missed half the year
  // doesn't carry the same weight as one who played every week.
  (S.idx.players||[]).forEach(function(p){
    if (!p || normTeam(p.team) !== normTeam(team) || fd[p.position] == null) return;
    fd[p.position] += (+p[stat]||0) * (+p.matches||0);
  });
  if (cfg.against === 'dvp'){
    (asArray(S.data.dvp)||[]).forEach(function(r){
      if (!r || normTeam(r.team) !== normTeam(team) || ad[r.pos] == null) return;
      ad[r.pos] += (+r[stat]||0);
    });
  } else {
    var t = glAgainst(key, stat, G)[team] || {};
    G.forEach(function(p){ ad[p.k] = +t[p.k] || 0; });
  }
  var ft = 0, at = 0;
  G.forEach(function(p){ ft += fd[p.k]; at += ad[p.k]; });
  var fp = {}, ap = {};
  G.forEach(function(p){ fp[p.k] = ft ? fd[p.k]/ft*100 : 0; ap[p.k] = at ? ad[p.k]/at*100 : 0; });
  return { fp:fp, ap:ap, ft:ft, at:at, cfg:cfg };
}
function pieGrad(dist, G){
  var seg = [], acc = 0;
  G.forEach(function(p){
    var v = dist[p.k] || 0; if (v <= 0) return;
    seg.push(p.c+' '+acc.toFixed(2)+'% '+(acc+v).toFixed(2)+'%'); acc += v;
  });
  return seg.length ? 'conic-gradient('+seg.join(',')+')' : 'var(--surface-3,var(--border))';
}
function pdCard(key, team){
  var d = posDist(key, team);
  var head = '<div class="ds-head">'+teamLogo(key,team)+'<span class="ds-nm">'+esc(abbrOf(key,team))+'</span></div>';
  if (!d || (!d.ft && !d.at)) return '<div class="ds-card">'+head+'<div class="sl-none">No positional split on file.</div></div>';
  var G = d.cfg.groups;
  var pies = '<div class="pd-pies">'
    + '<div class="pd-pw"><div class="pd-pie" style="background:'+pieGrad(d.fp,G)+'"></div><div class="pd-cap">For</div></div>'
    + '<div class="pd-pw"><div class="pd-pie" style="background:'+pieGrad(d.ap,G)+'"></div><div class="pd-cap">Against</div></div>'
    + '</div>';
  var leg = '<div class="pd-leg">' + G.map(function(p){
    var f = Math.round(d.fp[p.k]||0), a = Math.round(d.ap[p.k]||0), gap = f - a;
    return '<div class="pd-leg-r"><span class="pd-dot" style="background:'+p.c+'"></span>'
      + '<span class="pd-leg-nm">'+esc(p.s)+'</span>'
      + '<span class="pd-leg-v">'+f+' / '+a+'</span>'
      + '<span class="pd-leg-g '+(gap>=3?'up':(gap<=-3?'down':''))+'">'+(gap>0?'+':'')+gap+'</span></div>';
  }).join('') + '</div>';
  return '<div class="ds-card">'+head+'<div class="pd-wrap">'+pies+leg+'</div>'
    + '<div class="ds-sub" style="margin:7px 0 0">For % / Against % \u00b7 gap in points</div></div>';
}
function distSection(key, g){
  var cfg = POS_DIST_CFG[key]; if (!cfg) return '';       // sport has no positional volume stat - not a failure
  var a = pdCard(key, g.away), h = pdCard(key, g.home);
  return '<div class="dayband"><span>'+esc(cfg.label)+' Distribution</span></div>'
    + '<div class="ds-grid">'+a+h+'</div>';
}

/* ---- team section: MLB starter matchup ------------------------------------
   Port of the production _mlbStarterPanel. Each card is one team's BATS against the
   pitcher they actually face, so the away card carries the home starter and vice
   versa. Exploiter score = how much the starter leaks to that batter's hand, plus
   how good the batter is against the hand the starter throws.                     */
var MLB_LG_OPPAVG = 0.245, MLB_LG_OPS = 0.72;
function mlbPitcher(key, name){
  if (!name) return null;
  var ix = state.sports[key].idx;
  var bn = (ix.byName||{})[name];
  if (bn && bn.role === 'pitch') return bn;
  var ps = ix.players || [];
  for (var i=0;i<ps.length;i++){ if (ps[i] && ps[i].name === name && ps[i].role === 'pitch') return ps[i]; }
  return null;
}
function msExploiters(key, battingTeam, st){
  var bats = (state.sports[key].idx.players || []).filter(function(p){
    return p && normTeam(p.team) === normTeam(battingTeam) && p.role !== 'pitch';
  });
  return bats.map(function(b){
    var sw = (((b.bats === 'L') ? st.splitVsL : st.splitVsR) || {}).oppAVG;   // what the starter allows that hand
    var bs = ((st.throws === 'L') ? b.splitVsL : b.splitVsR) || {};           // batter's own split vs this hand
    var swD = (sw != null ? sw : MLB_LG_OPPAVG) - MLB_LG_OPPAVG;
    var bq  = ((bs.OPS != null ? bs.OPS : MLB_LG_OPS) - MLB_LG_OPS);
    var bv  = (b.bvp && (b.bvp[String(st.id)] || b.bvp[st.id])) || null;
    return { b:b, score:Math.round(swD*500 + bq*40), hand:b.bats||'', ops:bs.OPS, bvp:bv };
  }).filter(function(x){ return isFinite(x.score); })
    .sort(function(a,b){ return b.score - a.score; }).slice(0, 4);
}
function msCard(key, battingTeam, pitcherName){
  var st = mlbPitcher(key, pitcherName);
  var head = '<div class="ms-head">'+teamLogo(key,battingTeam)+'<span class="ms-nm">'+esc(abbrOf(key,battingTeam))+'</span>'
    + (st && st.throws ? '<span class="ms-hand">'+esc(st.throws)+'HP</span>' : '')+'</div>';
  if (!st) return '<div class="ms-card">'+head
    + '<div class="sl-none">'+(pitcherName ? 'No card on file for '+esc(pitcherName) : 'Starter not named yet')+'.</div></div>';
  var av3 = function(v){ return v == null ? '\u2014' : (+v).toFixed(3).replace(/^0/,''); };
  var meta = [ st.K9 != null ? st.K9.toFixed(1)+' K/9' : '',
               st.ERA != null ? st.ERA.toFixed(2)+' ERA' : '',
               st.WHIP != null ? st.WHIP.toFixed(2)+' WHIP' : '',
               st.oppAVG != null ? av3(st.oppAVG)+' oppAVG' : '' ].filter(Boolean).join(' \u00b7 ');
  var sp = st.splitVsL || {}, sr = st.splitVsR || {};
  var stats = '<div class="ms-stats">'
    + '<div class="ms-stat"><b>'+av3(sp.oppAVG)+'</b><span>vs LHB</span></div>'
    + '<div class="ms-stat"><b>'+av3(sr.oppAVG)+'</b><span>vs RHB</span></div>'
    + '<div class="ms-stat"><b>'+(st.GS != null ? st.GS : '\u2014')+'</b><span>starts</span></div></div>';
  var ex = msExploiters(key, battingTeam, st);
  var rows = ex.map(function(x){
    var cls = x.score >= 12 ? 'soft' : (x.score <= -8 ? 'tough' : '');
    var lab = x.score >= 12 ? 'SOFT' : (x.score <= -8 ? 'TOUGH' : 'NEU');
    var sub = [ x.hand ? x.hand+'HB' : '',
                x.ops != null ? x.ops.toFixed(3).replace(/^0/,'')+' OPS vs '+(st.throws||'')+'HP' : '',
                (x.bvp && x.bvp.PA) ? x.bvp.PA+' PA h2h \u00b7 '+(x.bvp.AVG != null ? (+x.bvp.AVG).toFixed(3).replace(/^0/,'') : '')
                  + (x.bvp.HR ? ' \u00b7 '+x.bvp.HR+' HR' : '') : '' ].filter(Boolean).join(' \u00b7 ');
    return '<div class="ms-row" onclick="LAB.player(\''+key+'\',\''+esc(x.b.name).replace(/'/g,"\\'")+'\')">'
      + '<span class="ms-who"><b>'+esc(x.b.name)+'</b><span>'+esc(sub)+'</span></span>'
      + '<span class="ms-tag '+cls+'">'+lab+' '+(x.score>0?'+':'')+x.score+'</span></div>';
  }).join('');
  return '<div class="ms-card">'+head
    + '<div class="ms-sub">vs '+esc(st.name)+(meta ? ' \u00b7 '+esc(meta) : '')+'</div>'
    + stats + (rows ? '<div class="ms-grp">Top exploiters</div>'+rows : '')+'</div>';
}
function starterSection(key, g){
  if (key !== 'mlb' || !g.homePitcher && !g.awayPitcher) return '';
  var pk = g.park || {}, wx = g.weather || {};
  var cond = [ pk.name || g.venue || '' ];
  if (pk.hrFactor != null) cond.push('Park HR '+(pk.hrFactor>=1?'+':'')+Math.round((pk.hrFactor-1)*100)+'%');
  if (wx.hrMult != null && wx.hrMult !== 1) cond.push('Wind '+(wx.hrMult>=1?'+':'')+Math.round((wx.hrMult-1)*100)+'%');
  return '<div class="dayband"><span>Starter Matchup</span></div>'
    + '<div class="ms-sub" style="margin:-2px 0 6px">'+esc(cond.filter(Boolean).join(' \u00b7 '))+'</div>'
    + '<div class="ms-grid">'+msCard(key, g.away, g.homePitcher)+msCard(key, g.home, g.awayPitcher)+'</div>';
}

/* ---- team section: EPL By The Halves + Substitution Trends -----------------
   Ported from the production _eplByTheHalves / _eplSubTrends. Halves come from
   results.json (htHome/htAway vs full time); the 15-minute timing buckets and the
   hooked list come from events.json, which is a separate feed to API-Football.     */
function eventsFor(key, team){
  var ev = (state.sports[key].data.events || {}).byTeam;
  if (!ev) return null;
  if (ev[team]) return ev[team];
  var want = normTeam(team), ks = Object.keys(ev);
  for (var i=0;i<ks.length;i++){ if (normTeam(ks[i]) === want) return ev[ks[i]]; }
  return null;
}
function halvesFor(key, team){
  var rs = resultRows(key).filter(function(r){
    return r && r.htHome != null && (normTeam(r.home) === normTeam(team) || normTeam(r.away) === normTeam(team));
  });
  if (!rs.length) return null;
  var n = rs.length, h1f=0, h1a=0, h2f=0, h2a=0, s1=0, s2=0, c1=0, c2=0;
  rs.forEach(function(r){
    var isH = normTeam(r.home) === normTeam(team);
    var ftF = isH ? r.homeScore : r.awayScore, ftA = isH ? r.awayScore : r.homeScore;
    var htF = (isH ? r.htHome : r.htAway) || 0, htA = (isH ? r.htAway : r.htHome) || 0;
    var g1f = htF, g1a = htA, g2f = Math.max(0, ftF-htF), g2a = Math.max(0, ftA-htA);
    h1f+=g1f; h1a+=g1a; h2f+=g2f; h2a+=g2a;
    if (g1f>0) s1++; if (g2f>0) s2++; if (g1a>0) c1++; if (g2a>0) c2++;
  });
  return { n:n, h1f:h1f/n, h1a:h1a/n, h2f:h2f/n, h2a:h2a/n,
           s1:Math.round(s1/n*100), s2:Math.round(s2/n*100),
           c1:Math.round(c1/n*100), c2:Math.round(c2/n*100) };
}
function btCard(key, team){
  var d = halvesFor(key, team);
  var head = '<div class="bt-head">'+teamLogo(key,team)+'<span class="bt-nm">'+esc(abbrOf(key,team))+'</span>'
    + (d ? '<span class="bt-n">'+d.n+' matches</span>' : '')+'</div>';
  if (!d) return '<div class="bt-card">'+head+'<div class="sl-none">No half-time scores on file.</div></div>';
  var call = d.h2f > d.h1f*1.15 ? 'Strong 2H attack' : (d.h1f > d.h2f*1.15 ? 'Strong 1H attack' : 'Balanced halves');
  if (d.h2a > d.h1a*1.2) call += ' \u00b7 leaky 2H';
  else if (d.h1a > d.h2a*1.2) call += ' \u00b7 leaky 1H';
  var cell = function(l,v){ return '<div class="bt-cell"><b>'+v+'</b><span>'+l+'</span></div>'; };
  var body = '<div class="bt-call">'+esc(call)+'</div>'
    + '<div class="bt-cells">'+cell('1H GF',d.h1f.toFixed(2))+cell('2H GF',d.h2f.toFixed(2))
      + cell('1H GA',d.h1a.toFixed(2))+cell('2H GA',d.h2a.toFixed(2))+'</div>'
    + '<div class="bt-cells">'+cell('Scored 1H',d.s1+'%')+cell('Scored 2H',d.s2+'%')
      + cell('Conc 1H',d.c1+'%')+cell('Conc 2H',d.c2+'%')+'</div>';
  var ev = eventsFor(key, team);
  if (ev && ev.timing && ev.timing.scored){
    var sc = ev.timing.scored, cc = ev.timing.conceded || [];
    var mx = Math.max.apply(null, [1].concat(sc, cc));
    var L = ['0-15','16-30','31-45','46-60','61-75','76-90'];
    body += '<div class="bt-sub">Goal timing \u00b7 15-min buckets</div><div class="gt-row">'
      + L.map(function(l,i){
          return '<div class="gt-col"><div class="gt-bars">'
            + '<div class="gt-bar sc" style="height:'+Math.round((sc[i]||0)/mx*100)+'%"></div>'
            + '<div class="gt-bar cc" style="height:'+Math.round((cc[i]||0)/mx*100)+'%"></div></div>'
            + '<div class="gt-lbl">'+l+'</div><div class="gt-n">'+(sc[i]||0)+'-'+(cc[i]||0)+'</div></div>';
        }).join('')
      + '</div><div class="gt-leg"><span class="gt-key sc"></span>Scored<span class="gt-key cc"></span>Conceded</div>';
  }
  return '<div class="bt-card">'+head+body+'</div>';
}
function halvesSection(key, g){
  if (key !== 'epl') return '';                            // half-time scores are an EPL-only feed
  var a = btCard(key, g.away), h = btCard(key, g.home);
  return '<div class="dayband"><span>By The Halves</span></div><div class="bt-grid">'+a+h+'</div>';
}
function sbCard(key, team){
  var ev = eventsFor(key, team);
  var head = '<div class="bt-head">'+teamLogo(key,team)+'<span class="bt-nm">'+esc(abbrOf(key,team))+'</span>'
    + (ev && ev.hooked ? '<span class="bt-n">'+ev.hooked.length+' regulars</span>' : '')+'</div>';
  if (!ev || !ev.hooked || !ev.hooked.length)
    return '<div class="bt-card">'+head+'<div class="sl-none">No substitution history on file.</div></div>';
  var rows = ev.hooked.slice(0, 8).map(function(x){
    var pct = Math.max(3, Math.round(Math.min(90, x.offAvg||0) / 90 * 100));
    return '<div class="sb-row" onclick="LAB.player(\''+key+'\',\''+esc(x.player).replace(/'/g,"\\'")+'\')">'
      + '<span class="sb-nm">'+esc(x.player)+'</span>'
      + '<span class="sb-bar"><i style="width:'+pct+'%"></i></span>'
      + '<span class="sb-meta">'+(x.offAvg||0)+'\u2032 \u00b7 '+(x.n||0)+'\u00d7</span></div>';
  }).join('');
  return '<div class="bt-card">'+head
    + '<div class="bt-sub" style="margin:0 0 2px">Hooked early \u00b7 prop carry-over risk</div>'+rows+'</div>';
}
function subsSection(key, g){
  if (key !== 'epl') return '';                            // substitution events are an EPL-only feed
  var a = sbCard(key, g.away), h = sbCard(key, g.home);
  return '<div class="dayband"><span>Substitution Trends</span></div><div class="bt-grid">'+a+h+'</div>';
}

/* ---- team section: first & last -------------------------------------------
   EPL is a port of _eplFirstLast straight off events.json. NFL has no equivalent
   feed, so it's derived from firsttd.json: one row per team per game holding that
   team's first touchdown, with gameFirst marking who opened the scoring outright.
   AFL and MLB carry no goal/score timing at all, so they get nothing rather than
   a guess.                                                                        */
var FL_WINDOW = 17;                                   // NFL: a season's worth of games, rolling
function nflFirstTd(key, team){
  var rows = (asArray(state.sports[key].data.firsttd) || []).filter(function(r){ return r && r.matchId; });
  if (!rows.length) return null;
  var games = {};                                     // every game on file involving this team
  rows.forEach(function(r){
    var pr = String(r.matchId).split('_');
    if (pr[2] !== team && pr[3] !== team) return;
    games[r.matchId] = games[r.matchId] || { seq:(+r.season||0)*100 + (+r.week||0), mine:null };
    if (r.team === team) games[r.matchId].mine = r;
  });
  var ids = Object.keys(games).sort(function(a,b){ return games[b].seq - games[a].seq; }).slice(0, FL_WINDOW);
  if (!ids.length) return null;
  var n = ids.length, opens = 0, q1 = 0, firstHalf = 0, qSum = 0, qN = 0, scorers = {};
  ids.forEach(function(id){
    var r = games[id].mine;
    if (!r) return;                                   // team scored no TD in that game
    if (r.gameFirst) opens++;
    if (+r.qtr === 1) q1++;
    if (+r.qtr <= 2) firstHalf++;
    if (+r.qtr){ qSum += +r.qtr; qN++; }
    scorers[r.player] = (scorers[r.player] || 0) + 1;
  });
  var list = Object.keys(scorers).map(function(k2){ return [k2, scorers[k2]]; })
    .sort(function(a,b){ return b[1] - a[1]; }).slice(0, 5);
  return { n:n, opens:opens/n, q1:q1/n, no1h:1 - firstHalf/n, avgQ:qN ? qSum/qN : null, scorers:list };
}
function flCard(key, team){
  var head = '<div class="bt-head">'+teamLogo(key,team)+'<span class="bt-nm">'+esc(abbrOf(key,team))+'</span>';
  var pc = function(x){ return Math.round((x||0)*100)+'%'; };
  var stat = function(l,v){ return '<div class="fl-stat"><b>'+v+'</b><span>'+l+'</span></div>'; };
  var list = function(title, arr, sfx){
    if (!arr || !arr.length) return '';
    return '<div class="fl-sec">'+esc(title)+'</div>' + arr.map(function(p){
      return '<div class="fl-row" onclick="LAB.player(\''+key+'\',\''+esc(p[0]).replace(/'/g,"\\'")+'\')">'
        + '<span class="fl-nm">'+esc(p[0])+'</span><span class="fl-c">'+p[1]+' '+esc(sfx)+'</span></div>';
    }).join('');
  };

  if (key === 'nfl'){
    var d = nflFirstTd(key, team);
    head += (d ? '<span class="bt-n">last '+d.n+' games</span>' : '')+'</div>';
    if (!d) return '<div class="bt-card">'+head+'<div class="sl-none">No first-TD history on file.</div></div>';
    return '<div class="bt-card">'+head
      + '<div class="fl-stats">'+stat('Opens the game',pc(d.opens))+stat('1st TD in Q1',pc(d.q1))
        + stat('No 1H TD',pc(d.no1h))+stat('Avg qtr',d.avgQ != null ? 'Q'+d.avgQ.toFixed(1) : '\u2014')+'</div>'
      + list('Opens the scoring for '+abbrOf(key,team), d.scorers, 'times')
      + '<div class="ds-sub" style="margin:7px 0 0">Team\u2019s first TD each game \u00b7 no last-scorer feed for NFL</div></div>';
  }

  var ev = eventsFor(key, team);
  head += (ev && ev.matches ? '<span class="bt-n">'+ev.matches+' matches</span>' : '')+'</div>';
  if (!ev) return '<div class="bt-card">'+head+'<div class="sl-none">No goal-timing history on file.</div></div>';
  return '<div class="bt-card">'+head
    + '<div class="fl-stats">'+stat('Opens scoring',pc(ev.opensScoring))+stat('Concedes 1st',pc(ev.concedesFirst))
      + stat('No 1H goal',pc(ev.no1hGoal))+stat('Carded 1st',pc(ev.cardedFirst))+'</div>'
    + '<div class="fl-stats">'+stat('Avg 1st scored', ev.avgFirstScored ? ev.avgFirstScored+'\u2032' : '\u2014')
      + stat('Avg 1st conceded', ev.avgFirstConceded ? ev.avgFirstConceded+'\u2032' : '\u2014')+'</div>'
    + list('First goal scorers', ev.firstScorers, 'opens')
    + list('Last goal scorers', ev.lastScorers, 'last')
    + list('Late merchants (76\u2032+)', ev.lateScorers, 'late')
    + list('First to be carded', ev.firstCarded, 'bookings')
    + '</div>';
}
function firstLastSection(key, g){
  if (key !== 'epl' && key !== 'nfl') return '';           // no scoring-timing feed for AFL or MLB
  var a = flCard(key, g.away), h = flCard(key, g.home);
  return '<div class="dayband"><span>'+(key === 'nfl' ? 'First TD' : 'First &amp; Last')+'</span></div>'
    + '<div class="bt-grid">'+a+h+'</div>';
}

/* ---- Degen Signals ---------------------------------------------------------
   Built one signal at a time against a shared tile chrome. Universal signals only
   for now: same rule in every sport, driven off config's market list.
   STREAKERS: consecutive games clearing the POSTED line. Production derives a
   synthetic line (realisticLine2) because AFL odds were patchy; the lab has odds
   in tier 2, so a streak is only shown against a line you can actually bet.       */
var STREAK_MIN = 4, STREAK_PIPS = 8, SIG_MAX_ROWS = 8;
// A null is not always a gap. API-Football omits a counting stat rather than writing 0, so an
// EPL row that HAS coverage (passes is recorded for anyone who played) but no shots means the
// player took none - a real zero. A row with no coverage at all is genuinely unverifiable.
// Sports with no entry here keep the strict reading: null = can't verify.
// A null is not always a gap. EPL's feed omits a stat the player didn't record; NFL leaves
// longRec/longRush/expRec null when a player took the field and simply didn't produce one.
// Both are zeros, and counting them as missing inflates every hit rate built on them - NFL's
// longRec is non-null on just 217 of 1,073 rows, so Chunk Plays was grading 20% of the games.
// `min` guards the NFL case: snapPct is present on every row INCLUDING players who never
// dressed, so a zero snap share still means "no game", not "a zero".
var COVER_FIELD = { epl: { field:'passes' }, nfl: { field:'snapPct', min:0.1 } };
// A posted market does not always share its name with the gamelog field. NFL's "sacks" market
// is priced for pass RUSHERS (Derrick Brown, Von Miller), but the gamelog's `sacks` column is
// sacks TAKEN by the quarterback - grading one against the other made every QB a sack artist
// and every rusher invisible. `defSacks` is the right column.
var MKT_FIELD = { nfl: { sacks:'defSacks' } };
function mktField(key, mkt){ return ((MKT_FIELD[key] || {})[mkt]) || mkt; }
/* A row whose minutes say he didn't play is not a game, whatever else it carries. FPL writes a row
   for every squad player every gameweek - 0 minutes for the unused sub and the dropped - with every
   stat set to an explicit 0, and it also wrote a full placeholder round (all 257 rows of 20 Sep at
   0 minutes) before that round's stats landed. statOf returned any present value, so each of those
   counted as a zero-output game: lower averages, broken streaks, a tighter record cap. 1,795 EPL
   rows at 0 minutes, none with any production.
   NOT applied to NFL: snapPct is OFFENSIVE snaps, and 3,457 zero-snap rows are defenders with real
   tackles - NFL keeps its existing rule (0 snaps only means "didn't play" when the stat is blank). */
var PLAY_GATE = { epl:'min', afl:'tog', nbl:'minutes', nhl:'toiMin' };
function statOf(key, row, mkt){
  mkt = mktField(key, mkt);
  var pg = PLAY_GATE[key];
  if (pg && row && row[pg] != null && isFinite(+row[pg]) && +row[pg] <= 0) return null;
  var v = row ? row[mkt] : null;
  if (v != null && isFinite(+v)) return +v;
  var cf = COVER_FIELD[key];
  if (!cf || !row) return null;
  var cv = row[cf.field];
  if (cv == null || !isFinite(+cv)) return null;                      // no coverage: unverifiable
  if (cf.min != null && +cv < cf.min) return null;                    // on the sheet but never played
  return 0;                                                           // played, didn't record one
}
// Production runs one floor for every signal (SIG_ODDS_FLOOR = 1.60, enforced in
// collectOU). Streakers gets its own, lower one: the play here is a live run, not a
// price edge, so $1.20 still pays while $1.05 chalk stays out.
var SIG_ODDS_FLOOR = 1.60, STREAK_ODDS_FLOOR = 1.20, SIG_KEEP_CHALK = false;
// MLB ships batters and pitchers in one players.json, and both carry an 'H'. Without this
// gate a pitcher's hits-ALLOWED gets streak-tested against the batter hits market.
var BAT_ONLY = { H:1, TB:1, HR:1, RBI:1, R:1, SB:1 }, ARM_ONLY = { K:1 };
// Candidate lines for a streak: the posted two-way line plus every alt rung. The signal
// is the HARDEST line the player is still clearing - picking the lowest rung would hand
// back "45 straight over 0.5 fouls", which is a line choice, not a trend.
function streakCandidates(key, name, mkt){
  name = oddsPlayer(key, name);   // books spell accents differently to players.json
  var out = [], seen = {};
  var od = oddsForP(key, name, mkt);
  if (od && od.line != null && od.over != null){
    out.push({ line:+od.line, price:+od.over, book:od.book, alt:false }); seen[od.line] = 1;
  }
  var d = state.sports[key].data.odds || {};
  (d.alt || []).forEach(function(r){
    if (!r || r.player !== name || r.market !== mkt || r.over == null || r.line == null) return;
    if (seen[r.line]) return;
    seen[r.line] = 1;
    out.push({ line:+r.line, price:+r.over, book:r.book, alt:true });
  });
  return out.sort(function(a,b){ return b.line - a.line; });     // hardest first
}
// A signal that did not trigger is not worth a card's height. It is still worth KNOWING about -
// "nothing fired" and "this tile is broken" look identical once you hide them - so untriggered
// tiles collapse into one line at the foot of the section that expands to show why each stayed
// quiet. Genuine data failures still shout: those go through secNote, not here.
var SIG_QUIET = [];
// Degen Crew runs every fixture's signals in CAPTURE mode: sigTile records the tile instead of
// drawing it, so the page reuses every tile builder rather than duplicating eighteen of them.
var SIG_CAPTURE = null, SIG_PHASE = 'u';
function sigTile(icon, title, desc, rows, emptyWhy){
  if (SIG_CAPTURE){
    SIG_CAPTURE.push({ phase:SIG_PHASE, icon:icon, title:title, desc:desc, rows:(rows || []).slice(), why:emptyWhy || '' });
    return '';
  }
  if (!rows || !rows.length){
    SIG_QUIET.push({ title:title, why:emptyWhy || 'Nothing cleared the gate for this fixture.' });
    return '';
  }
  var head = '<summary class="sig-head"><span class="sig-ico"><i class="ti '+esc(icon)+'"></i></span>'
    + '<span><span class="sig-ttl">'+esc(title)+'</span><span class="sig-desc">'+esc(desc)+'</span></span>'
    + '<span class="sig-n">'+rows.length+'</span></summary>';
  return '<details class="sig-tile" open>'+head+rows.join('')+'</details>';
}
function sigQuietNote(){
  if (SIG_CAPTURE) return '';
  if (!SIG_QUIET.length) return '';
  var list = SIG_QUIET.slice();
  return '<details class="sig-quiet"><summary>'+list.length+' signal'+(list.length === 1 ? '' : 's')
    + ' quiet on this fixture</summary>'
    + list.map(function(q){
        return '<div class="sig-quiet-row"><b>'+esc(q.title)+'</b><span>'+esc(q.why)+'</span></div>';
      }).join('')+'</details>';
}
// A band header with nothing under it is the same waste as an empty tile.
function sigBand(title, body){
  if (SIG_CAPTURE) return '';
  return body && body.replace(/\s+/g, '') ? '<div class="dayband"><span>'+title+'</span></div>'+body : '';
}
function streakers(key, g){
  var S = state.sports[key], cfg = S.config || {};
  var mkts = cfg.oddsMkts || cfg.multiMkts || [];
  var out = [];
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!p || !p.name || !isPlayingP(key, p.name, team)) return;
      var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice());   // newest first
      var best = null;
      mkts.forEach(function(m){
        var k = m[0];
        if (key === 'mlb'){                                   // don't test an arm against a bat market
          if (p.role === 'pitch' && BAT_ONLY[k]) return;
          if (p.role !== 'pitch' && ARM_ONLY[k]) return;
        }
        // Walk actual games, newest first. A game the player sat out is skipped; a game
        // where the stat wasn't recorded ENDS the run, because a streak you can't verify
        // isn't a streak. Without this, EPL's null-heavy feed produced "20 straight" out
        // of 20 scattered games spread across two seasons.
        var vals = [], gap = false;
        for (var gi=0; gi<logs.length; gi++){
          var rr = logs[gi];
          if (rr.min != null && +rr.min === 0) continue;     // unused sub: not a game, doesn't break the run
          var vv = statOf(key, rr, k);
          if (vv == null){ gap = true; break; }
          vals.push(vv);
        }
        if (vals.length < 5) return;
        var row = null, chalk = null;
        streakCandidates(key, p.name, k).forEach(function(od){
          if (row) return;                                   // candidates are hardest-first: first hit wins
          var streak = 0;
          for (var i=0;i<vals.length;i++){ if (vals[i] > od.line) streak++; else break; }
          if (streak < STREAK_MIN) return;
          if (od.price < STREAK_ODDS_FLOOR && !chalk){          // remember it, but keep looking for one that pays
            chalk = { od:od, streak:streak };
            return;
          }
          if (od.price < STREAK_ODDS_FLOOR) return;
          var n = Math.min(10, vals.length), hits = 0;
          for (var j=0;j<n;j++){ if (vals[j] > od.line) hits++; }
          var w = vals.slice(0, 10).slice().sort(function(x,y){ return x-y; });
          var med = w.length % 2 ? w[(w.length-1)/2] : (w[w.length/2-1] + w[w.length/2])/2;
          row = { name:p.name, team:team, opp:opp, pos:posShortP(p), mkt:k, label:m[1],
                  line:od.line, price:od.price, book:od.book, alt:od.alt, streak:streak, hits:hits, n:n,
                  med:med, last:vals.slice(0, STREAK_PIPS).reverse() };
        });
        if (!row && chalk && SIG_KEEP_CHALK){                                  // nothing on the ladder clears the floor
          var wc = vals.slice(0, 10).slice().sort(function(x,y){ return x-y; });
          var medc = wc.length % 2 ? wc[(wc.length-1)/2] : (wc[wc.length/2-1] + wc[wc.length/2])/2;
          var nc = Math.min(10, vals.length), hc = 0;
          for (var q=0;q<nc;q++){ if (vals[q] > chalk.od.line) hc++; }
          row = { name:p.name, team:team, opp:opp, pos:posShortP(p), mkt:k, label:m[1],
                  line:chalk.od.line, price:chalk.od.price, book:chalk.od.book, alt:chalk.od.alt,
                  streak:chalk.streak, hits:hc, n:nc, med:medc, short:true,
                  last:vals.slice(0, STREAK_PIPS).reverse() };
        }
        if (!row) return;
        if (!best || row.streak > best.streak || (row.streak === best.streak && row.price > best.price)) best = row;
      });
      if (best) out.push(best);                                   // one line per player: their longest live streak
    });
  });
  // Sorting on raw streak length puts the cheapest rungs on top, because a longer run is
  // usually just a softer line. Bands instead: a 17-gamer and a 20-gamer are the same
  // claim, so inside a band the better-paying run leads, then the bigger clearance.
  var margin = function(r){ return (r.med == null) ? 0 : (r.med - r.line) / Math.max(r.line, 0.5); };
  var band = function(n){ return n >= 15 ? 0 : (n >= 10 ? 1 : (n >= 7 ? 2 : 3)); };
  out.forEach(function(r){ r.margin = margin(r); r.band = band(r.streak); });
  out.sort(function(a,b){
    return (a.band - b.band) || (b.price - a.price) || (b.margin - a.margin) || (b.streak - a.streak);
  });
  return out.slice(0, SIG_MAX_ROWS);
}
function streakRow(key, r){
  var mx = Math.max.apply(null, r.last.concat([r.line])) || 1;
  var pips = '<div class="stk-pips">'+r.last.map(function(v){
    var hit = v > r.line, h = Math.max(6, Math.round(v / mx * 100));
    return '<span class="stk-pip'+(hit?'':' miss')+'"><i style="height:'+h+'%"></i></span>';
  }).join('')+'</div>'
  + '<div class="stk-vals">'+r.last.map(function(v){
      return '<span>'+(v % 1 ? v.toFixed(1) : v)+'</span>'; }).join('')+'</div>';
  var ask = (Math.round(r.line) === r.line) ? (r.line + 1) : Math.ceil(r.line);
  return '<div class="stk-row" onclick="LAB.player(\''+key+'\',\''+esc(r.name).replace(/'/g,"\\'")+'\')">'
    + playerImgP(key, r.name, 28)
    + '<div class="stk-left">'
      + '<div class="stk-nm"><b>'+esc(r.name)+'</b><span class="stk-tag">'
        + esc((r.pos ? r.pos+' \u00b7 ' : '')+abbrOf(key, r.team))+'</span></div>'
      + '<div class="stk-bet">'+ask+'+ '+esc(r.label)+' \u00b7 v '+esc(abbrOf(key, r.opp))
        + (r.med != null ? ' \u00b7 med '+(r.med % 1 ? r.med.toFixed(1) : r.med) : '')
        + (r.alt ? ' \u00b7 alt' : '')+(r.short ? ' \u00b7 under $'+STREAK_ODDS_FLOOR.toFixed(2) : '')+'</div>'
      + pips
    + '</div>'
    + '<div class="stk-right"><div class="stk-hit">'+r.streak+'</div>'
      + '<div class="stk-hitl">STRAIGHT</div>'
      + '<div class="stk-odds'+(r.short ? ' short' : '')+'">$'+r.price.toFixed(2)+'</div>'
      + '<span class="stk-book">'+esc(r.book||'')+' \u00b7 '+r.hits+'/'+r.n+'</span></div></div>';
}

/* ELITE MATCHUPS: league top-10 in a stat drawing a bottom-5 defence for that stat
   and position. Same rule in both production implementations; the lab difference is
   that it only considers the two teams in front of you, and it quotes the first rung
   that pays the signal floor rather than whatever the main line happens to be.       */
var ELITE_TOP_N = 10, ELITE_DVP_GATE = 5, ELITE_MIN_GAMES = 4;
// players.json is per-game in AFL, NFL and EPL but SEASON TOTALS in MLB (45 HR, not 45/gm),
// so ranking or labelling straight off it mixes two different units. Everything here is
// computed from gamelogs instead - one source, one unit, every sport.
function leagueAvg(key, mkt){
  var S = state.sports[key];
  S.idx.lgAvg = S.idx.lgAvg || {};
  if (S.idx.lgAvg[mkt]) return S.idx.lgAvg[mkt];
  var season = curSeason(key), byName = S.idx.logsByName || {}, out = {}, maxThis = 0;
  if (!Object.keys(byName).length) return out;   // gamelogs not indexed yet: compute later, don't cache empty
  Object.keys(byName).forEach(function(n){
    var c = 0;
    byName[n].forEach(function(r){
      if ((+(r.Year||r.year)||0) !== season) return;
      if (statOf(key, r, mkt) != null) c++;
    });
    if (c > maxThis) maxThis = c;
  });
  var useAll = maxThis < ELITE_MIN_GAMES;      // two weeks into a season, nobody qualifies yet
  Object.keys(byName).forEach(function(n){
    var sum = 0, cnt = 0;
    byName[n].forEach(function(r){
      if (!useAll && (+(r.Year||r.year)||0) !== season) return;
      var v = statOf(key, r, mkt); if (v == null) return;
      sum += v; cnt++;
    });
    if (cnt) out[n] = { avg:sum/cnt, games:cnt };
  });
  out._window = useAll ? 'all games on file' : 'this season';
  return (S.idx.lgAvg[mkt] = out);
}
function eliteStats(key){
  var cfg = state.sports[key].config || {};
  return (cfg.eliteDefs || cfg.dvpStats || cfg.oddsMkts || [])
    .filter(function(m){ return m[0] !== 'dreamteam'; }).slice(0, 6);
}
function dvpRankFor(key, opp, pos, mkt){
  var board = dvpBoard(key, mkt);
  var list = board[pos] || board.ALL;                       // MLB's dvp only splits to "ALL"
  if (!list || !list.length) return null;
  var e = null;
  for (var i=0;i<list.length;i++){ if (normTeam(list[i].team) === normTeam(opp)){ e = list[i]; break; } }
  if (!e) return null;
  var sum = 0; list.forEach(function(x){ sum += x.val; });
  var avg = sum / list.length;
  return { rank:e.rank, total:e.of, allowed:e.val, pct: avg ? (e.val - avg) / avg * 100 : 0 };
}
function eliteEntry(key, name, mkt){                       // first rung paying the floor, cheapest up
  var c = streakCandidates(key, name, mkt).filter(function(o){ return o.price >= SIG_ODDS_FLOOR; });
  if (!c.length) return null;
  return c[c.length - 1];                                  // candidates are hardest-first
}
function eliteMatchups(key, g){
  var S = state.sports[key], pool = S.idx.players || [];
  if (!pool.length) return [];
  var out = [], seen = {};
  eliteStats(key).forEach(function(m){
    var k = m[0], lg = leagueAvg(key, k);
    pool.filter(function(p){
        var e = p && lg[p.name];
        return e && e.games >= ELITE_MIN_GAMES && e.avg > 0;
      })
      .sort(function(a,b){ return lg[b.name].avg - lg[a.name].avg; })
      .slice(0, ELITE_TOP_N).forEach(function(p, i){
        var home = normTeam(p.team) === normTeam(g.home), away = normTeam(p.team) === normTeam(g.away);
        if (!home && !away) return;                        // league-wide ranking, this fixture's players only
        var team = home ? g.home : g.away, opp = home ? g.away : g.home;

  if (prob == null) return null;
  var S = state.sports[key], season = curSeason(key);
  var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice());
  var cur = logs.filter(function(r){ return (+(r.Year||r.year)||0) === season; });
  var pool = cur.length >= 10 ? cur : logs.slice(0, 20);
  var vals = statVals(key, p.name, mkt, pool);
  if (vals.length < 8) return prob;                         // too little record to overrule the model
  var hits = vals.filter(function(v){ return side === 'under' ? v <= line : v > line; }).length;
  var lg = leagueRateAt(key, mkt, line, side);
  var emp = lg != null ? (hits + 10 * lg) / (vals.length + 10) : (hits + 1) / (vals.length + 2);
  var margin = (lg != null && lg < 0.30) ? 0 : 0.05;
  return Math.min(prob, emp + margin);
}
function ouSignals(key, g, kind){
  var S = state.sports[key], sc = S.scoring;
  if (!sc || !sc.scoreCMP) return null;                // caller reports the missing module
  var mkts = (S.config || {}).oddsMkts || (S.config || {}).multiMkts || [];
  var over = kind === 'over', out = [];
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    var vac = vacatedNote(key, team);
    // Usage left behind by an absent starter has to land somewhere. Against an under that is a
    // straight contradiction, so the tile stops claiming it; against an over it is support.
    var vacBlocksUnder = !!vac && (vac.tgt >= VACATE_MIN || vac.rush >= 4 || (vac.min || 0) >= 20);
    playersOnTeam(key, team).forEach(function(p){
      if (!p || !p.name || !isPlayingP(key, p.name, team)) return;
      if (!over && vacBlocksUnder) return;
      mkts.forEach(function(m){
        var k = m[0];
        if (key === 'mlb'){
          if (p.role === 'pitch' && BAT_ONLY[k]) return;
          if (p.role !== 'pitch' && ARM_ONLY[k]) return;
        }
        var lg = leagueAvg(key, k)[p.name];
        if (!lg || lg.games < GL_MIN_GAMES) return;    // production's 3-game floor
        var minAvg = (sc.MIN_AVG || {})[k];
        if (minAvg != null && lg.avg < (over ? minAvg : minAvg * 0.7)) return;
        // DVP direction: back an over into a soft defence, an under into a hard one
        var dvpPct = null;
        try {
          var pos = (sc.POS_TO_DVP || {})[p.position || p.pos] || p.position || p.pos;
          dvpPct = sc.getDVPPct ? sc.getDVPPct(opp, pos, k) : null;
        } catch(e){}
        if (dvpPct != null && (over ? dvpPct <= 0 : dvpPct >= 0)) return;
        var cands = (over ? streakCandidates(key, p.name, k) : underCandidates(key, p.name, k))
          .filter(function(c){ return c.price >= SIG_ODDS_FLOOR; });
        if (!cands.length) return;
        // score the rungs nearest their own level rather than the whole ladder
        cands.sort(function(a,b){ return Math.abs(a.line - lg.avg) - Math.abs(b.line - lg.avg); });
        var best = null;
        cands.slice(0, GL_RUNGS).forEach(function(c){
          var score = null;
          try { score = sc.scoreCMP(p, k, c.line, opp); } catch(e){ return; }
          if (score == null || !isFinite(score)) return;
          if (over ? score < GL_SCORE : score > DR_SCORE) return;
          var pOver = glProb(key, p, k, c.line, score);
          if (pOver == null) return;
          pOver = calibrate(key, pOver);                 // raw model -> backtested probability
          var prob = over ? pOver : 1 - pOver;
          prob = recordCap(key, p, k, c.line, over ? 'over' : 'under', prob);
          if (prob == null) return;
          var ev = prob * (c.price - 1) - (1 - prob);
          var fair = novigFair(key, p.name, k, c.line, over ? 'over' : 'under');
          var row = { name:p.name, team:team, opp:opp, pos:posShortP(p), mkt:k, label:m[1],
                      line:c.line, price:c.price, book:c.book, score:score, prob:prob, ev:ev,
                      edge:(fair != null ? prob - fair : null), avg:lg.avg, games:lg.games,
                      dvpPct:dvpPct, over:over, vac:vac };
          // Where the model can't separate winners from losers, EV is noise dressed as maths -
          // so it neither filters nor ranks; the score does, and EV shows as information.
          if (evTrusted(key) && row.ev <= 0) return;     // the model likes it but the price doesn't pay
          if (!best || row.ev > best.ev) best = row;
        });
        if (best) out.push(best);
      });
    });
  });
  out.sort(evTrusted(key)
    ? function(a,b){ return (b.ev - a.ev) || (over ? b.score - a.score : a.score - b.score); }
    : function(a,b){ return over ? b.score - a.score : a.score - b.score; });
  return out.slice(0, SIG_MAX_ROWS);
}
function ctxChips(key, p, mkt, line, opp){
  var sc = state.sports[key].scoring;
  if (!sc || !sc.getContextSignals) return '';
  var out = [];
  try {
    // AFL/NFL return weighted numbers that already moved the score; EPL/MLB return tags
    // that nothing consumed until now. Both are worth showing as the row's reasoning.
    var sig = sc.getContextSignals(p, mkt, line, opp) || [];
    if (!sig.length) sig = sc.getContextSignals(p, mkt, opp) || [];
    sig.slice().sort(function(a,b){
      return Math.abs((b.pct||0)*(b.weight||1)) - Math.abs((a.pct||0)*(a.weight||1));
    }).slice(0, 3).forEach(function(x){
      if (x.t){ out.push('<span class="gl-chip '+(x.good ? 'good' : 'bad')+'">'+esc(x.t)+'</span>'); return; }
      if (x.label == null || x.pct == null || Math.abs(x.pct) < 5) return;
      out.push('<span class="gl-chip '+(x.pct > 0 ? 'good' : 'bad')+'">'+esc(x.label)
        + ' '+(x.pct > 0 ? '+' : '')+x.pct.toFixed(0)+'%</span>');
    });
  } catch(e){ return ''; }
  return out.join('');
}
function ouRow(key, r){
  var ask = (Math.round(r.line) === r.line) ? r.line + 1 : Math.ceil(r.line);
  var chips = '<div class="gl-why">'
    + '<span class="gl-chip '+(r.prob >= 0.6 ? 'good' : '')+'">'+Math.round(r.prob*100)+'% model</span>'
    + (r.edge != null ? '<span class="gl-chip '+(r.edge > 0 ? 'good' : 'bad')+'">'
        + (r.edge > 0 ? '+' : '')+Math.round(r.edge*100)+' pts vs fair</span>' : '')
    + '<span class="gl-chip">score '+r.score.toFixed(1)+'</span>'
    + (evTrusted(key) ? '' : '<span class="gl-chip bad">unranked model</span>')
    + (r.vac ? '<span class="gl-chip '+(r.over ? 'good' : 'bad')+'">'+esc(r.vac.text)+'</span>' : '')
    + (r.dvpPct != null ? '<span class="gl-chip '+(r.over ? 'good' : 'bad')+'">'
        + (r.dvpPct > 0 ? '+' : '')+r.dvpPct.toFixed(0)+'% DVP</span>' : '')
    + ctxChips(key, (state.sports[key].idx.byName||{})[r.name], r.mkt, r.line, r.opp)
    + '<span class="gl-chip">'+r.avg.toFixed(r.avg < 3 ? 2 : 1)+' avg \u00b7 '+r.games+' gm</span></div>';
  return '<div class="gl-row" onclick="LAB.player(\''+key+'\',\''+esc(r.name).replace(/'/g,"\\'")+'\')">'
    + playerImgP(key, r.name, 28)
    + '<div class="gl-left">'
      + '<div class="gl-nm"><b>'+esc(r.name)+'</b><span class="gl-tag">'
        + esc((r.pos ? r.pos+' \u00b7 ' : '')+abbrOf(key, r.team)+' v '+abbrOf(key, r.opp))+'</span></div>'
      + '<div class="gl-bet"><b>'+(r.over ? ask+'+ ' : 'Under '+r.line+' ')+'</b>'+esc(r.label)+'</div>'
      + chips
    + '</div>'
    + '<div class="gl-right"><div class="gl-ev '+(r.ev >= 0 ? 'pos' : 'neg')+'">'
      + (r.ev > 0 ? '+' : '')+Math.round(r.ev*100)+'%</div>'
      + '<div class="gl-evl">'+(evTrusted(key) ? 'EDGE' : 'EDGE?')+'</div>'
      + '<div class="gl-odds">$'+r.price.toFixed(2)+'</div>'
      + '<span class="gl-book">'+esc(r.book||'')+'</span></div></div>';
}
function ouTile(key, g, kind){
  var over = kind === 'over';
  var rows = ouSignals(key, g, kind);
  var why;
  if (rows === null){
    rows = [];
    why = SPORTS[key].name+' scoring.js exposes no scoreCMP, so nothing can be scored.';
  } else {
    why = over
      ? 'No player scored '+GL_SCORE+'+ into a soft matchup at a price that pays. Rows need a positive '
        + 'edge, so a strong read at a short price is filtered out rather than listed.'
      : 'No player scored '+DR_SCORE+' or worse into a tough matchup at a positive-edge under. '
        + 'Teams missing a starter are skipped here: the usage they leave behind lands on whoever '
        + 'is left, which is the opposite of an under'
        + (underCandidates(key, (playersOnTeam(key, g.home)[0]||{}).name || '', 'x').length ? '.' : ' \u2014 this sport posts no under markets.');
  }
  return sigTile(over ? 'ti-traffic-lights' : 'ti-skull',
    over ? 'Green Lights' : 'Death Riders',
    over ? 'Model and price both say over' : 'Model and price both say under',
    rows.map(function(r){ return ouRow(key, r); }), why);
}

/* FORM ALERTS: last 3 against the player's own baseline. Informational by nature - it says a
   player is running hot or cold, not that there is a bet in it. Production's thresholds kept:
   25% swing, 3+ current-season games, and a per-market floor so a man going from 0.2 to 0.4
   tackles doesn't read as a 100% spike.                                                      */
var ALERT_THRESHOLD = 0.25, ALERT_MIN_L3 = 3, ALERT_MAX_DRY = 2;
var ALERT_FLOOR = {
  disposals:15, goals:1.2, marks:4, tackles:4, clearances:4, dreamteam:70,
  recYds:25, rushYds:25, passYds:150, receptions:2, targets:3,
  shots:1, shotsOn:0.6, keyPasses:1, H:0.7, TB:1.2, K:4
};
function formAlerts(key, g){
  var S = state.sports[key], out = [];
  var mkts = (S.config || {}).oddsMkts || (S.config || {}).multiMkts || [];
  var season = curSeason(key);
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!p || !p.name || !isPlayingP(key, p.name, team)) return;
      if (!hasAnyOddsFor(key, p.name)) return;             // no price anywhere: not in this game
      var all = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice());
      var cur = all.filter(function(r){ return (+(r.Year||r.year)||0) === season; });
      if (cur.length < ALERT_MIN_L3) return;
      var base = cur.length >= 10 ? cur : all.slice(0, 10);
      mkts.forEach(function(m){
        var k = m[0], floor = ALERT_FLOOR[k];
        var bv = [], l3v = [];
        base.forEach(function(r){ var v = statOf(key, r, k); if (v != null) bv.push(v); });
        cur.slice(0, 3).forEach(function(r){ var v = statOf(key, r, k); if (v != null) l3v.push(v); });
        if (bv.length < 4 || l3v.length < ALERT_MIN_L3) return;
        var seasonAvg = bv.reduce(function(a,b){ return a+b; }, 0) / bv.length;
        var l3 = l3v.reduce(function(a,b){ return a+b; }, 0) / l3v.length;
        if (!(seasonAvg > 0)) return;
        var swing = (l3 - seasonAvg) / seasonAvg;
        if (Math.abs(swing) < ALERT_THRESHOLD) return;
        var up = swing > 0;
        if (floor != null){                       // a spike has to reach a real number, a drop to fall from one
          if (up && l3 < floor) return;
          if (!up && seasonAvg < floor) return;
        }
        // A run of zeros is a different animal to a graded decline: -100% is the floor for
        // every drought, so they all tie and crowd out real movement. Count the drought
        // instead and rank it on the baseline it fell from.
        var dry = 0;
        if (l3 === 0){
          for (var di=0; di<cur.length; di++){
            var dv = statOf(key, cur[di], k);
            if (dv == null || dv > 0) break;
            dry++;
          }
        }
        out.push({ name:p.name, team:team, opp:opp, pos:posShortP(p), label:m[1], mkt:k,
                   seasonAvg:seasonAvg, l3:l3, swing:swing, up:up, n:l3v.length, dry:dry });
      });
    });
  });
  var moved = out.filter(function(r){ return !r.dry; })
    .sort(function(a,b){ return Math.abs(b.swing) - Math.abs(a.swing); });
  var droughts = out.filter(function(r){ return r.dry; })
    .sort(function(a,b){ return (b.seasonAvg - a.seasonAvg) || (b.dry - a.dry); })
    .slice(0, ALERT_MAX_DRY);                      // never let droughts take over the tile
  return moved.concat(droughts).slice(0, SIG_MAX_ROWS);
}
function formRow(key, r){
  var pc = Math.round(Math.abs(r.swing) * 100);
  var w = Math.min(50, Math.round(Math.abs(r.swing) * 100 / 2));
  var dec = function(v){ return v < 3 ? v.toFixed(2) : v.toFixed(1); };
  var tag = r.dry ? 'DRY' : (r.up ? 'HEATING' : 'COOLING');
  var right = r.dry
    ? '<div class="fa-pc down">'+r.dry+'</div><div class="fa-pcl">GAMES DRY</div>'
    : '<div class="fa-pc '+(r.up?'up':'down')+'">'+(r.up?'+':'\u2212')+pc+'%</div>'
      + '<div class="fa-pcl">VS SEASON</div>';
  var sub = r.dry
    ? 'No '+esc(r.label).toLowerCase()+' in '+r.dry+' game'+(r.dry===1?'':'s')+' \u00b7 '
      + dec(r.seasonAvg)+' season \u00b7 v '+esc(abbrOf(key, r.opp))
    : esc(r.label)+' L3 '+dec(r.l3)+' v '+dec(r.seasonAvg)+' season \u00b7 v '+esc(abbrOf(key, r.opp));
  return '<div class="fa-row" onclick="LAB.player(\''+key+'\',\''+esc(r.name).replace(/'/g,"\\'")+'\')">'
    + playerImgP(key, r.name, 28)
    + '<div class="fa-left">'
      + '<div class="fa-nm"><b>'+esc(r.name)+'</b><span class="fa-dir '+(r.dry ? 'down' : (r.up?'up':'down'))+'">'
        + tag+'</span></div>'
      + '<div class="fa-sub">'+sub+'</div>'
      + (r.dry ? '' : '<div class="fa-bar"><span class="fa-track"><span class="fa-mid"></span>'
        + '<i class="'+(r.up?'up':'down')+'" style="width:'+w+'%"></i></span></div>')
    + '</div>'
    + '<div class="fa-right">'+right+'</div></div>';
}

/* NFL-SPECIFIC SIGNALS ---------------------------------------------------------
   Ported from nfl/signals.js with production's own thresholds. These fire only on NFL,
   because the data behind them is NFL-only: red-zone usage, explosive-play streaks, team
   sacks/interceptions allowed, and the per-fixture weather file.                          */
var CHUNK_DEFS = [
  { k:'longRec',  l:'Longest Rec',  thr:20, pos:['WR','TE','RB'], exp:'expRec',  style:'aDot', styleL:'aDot' },
  { k:'longRush', l:'Longest Rush', thr:12, pos:['RB','QB'],      exp:'expRush', style:'ypc',  styleL:'yds/carry' },
  { k:'longComp', l:'Longest Comp', thr:35, pos:['QB'],           exp:'expRec',  style:null,   styleL:null }
];
var CHUNK_HIT = 0.70, CHUNK_MIN_G = 6, WX_WIND = 25;
var TUDDY_STATS = {
  WR:[['rzTgt','RZ targets'],['i10Tgt','Inside-10 targets'],['rzRecTd','RZ rec TDs']],
  TE:[['rzTgt','RZ targets'],['i10Tgt','Inside-10 targets'],['rzRecTd','RZ rec TDs']],
  RB:[['rzAtt','RZ carries'],['i5Att','Inside-5 carries'],['rzRushTd','RZ rush TDs']],
  QB:[['rzAtt','RZ carries'],['i5Att','Inside-5 carries']]
};
function nflTeamRow(key, team){
  var rows = asArray(state.sports[key].data.teams) || [];
  for (var i=0;i<rows.length;i++) if (normTeam(rows[i].team) === normTeam(team)) return rows[i];
  return null;
}
function nflLeagueAvgOf(key, field){
  var rows = asArray(state.sports[key].data.teams) || [];
  var vals = rows.map(function(r){ return +r[field] || 0; }).filter(function(v){ return v > 0; });
  return vals.length ? vals.reduce(function(a,b){ return a+b; }, 0) / vals.length : 0;
}
/* Tuddy Targets: red-zone royalty into a soft TD defence */
function nflTuddy(key, g){
  var S = state.sports[key], rz = asArray(S.data.redzone) || [];
  if (!rz.length) return { rows:[], why:'redzone.json returned nothing \u2014 the red-zone build has not run.' };
  var scope = {}; scope[normTeam(g.home)] = g.away; scope[normTeam(g.away)] = g.home;
  // Rank across the WHOLE LEAGUE first, then keep the players in this fixture. Ranking inside
  // the fixture made "#1 RB RZ carries" mean first of the two lead backs on the slate, which is
  // not a credential at all.
  var byPos = {};
  rz.forEach(function(r){
    var p = (S.idx.byName || {})[r.player];
    if (!p || !TUDDY_STATS[p.position]) return;
    (byPos[p.position] = byPos[p.position] || []).push({ r:r, p:p });
  });
  var qual = {};
  Object.keys(byPos).forEach(function(pos){
    TUDDY_STATS[pos].forEach(function(kl){
      byPos[pos].filter(function(x){ return (x.r[kl[0]] || 0) > 0; })
        .sort(function(a,b){ return (b.r[kl[0]]||0) - (a.r[kl[0]]||0); })
        .slice(0, 10).forEach(function(x, i){          // top 10 in the league for that usage
          if (scope[normTeam(x.p.team)] === undefined) return;
          var q = qual[x.p.name] = qual[x.p.name] || { p:x.p, r:x.r, chips:[] };
          q.chips.push('#'+(i+1)+' in NFL \u00b7 '+pos+' '+kl[1]);
        });
    });
  });
  var out = [];
  Object.keys(qual).forEach(function(nm){
    var e = qual[nm], opp = scope[normTeam(e.p.team)];
    if (!opp) return;
    if (!isPlayingP(key, nm, e.p.team)) return;
    var dr = dvpRankFor(key, opp, e.p.position, 'anytimeTd');
    if (!dr || dr.rank > 10) return;                       // production: bottom-10 TD defence only
    // the anytimeTd ladder carries 0.5 / 1.5 / 2.5 (1+, 2+, 3+ TDs). "Best price" across the
    // whole ladder returns the 3+ rung at $151 - anytime means the 0.5 line and nothing else.
    var od = bestPriceFor(key, nm, 'anytimeTd', 0.5);
    if (!od) return;                                       // a TD tile with no TD price is not a tip
    out.push({ name:nm, p:e.p, opp:opp, chips:e.chips.slice(0, 3), dvp:dr,
               price:od.price, book:od.book, rz:e.r,
               score: (11 - dr.rank) * 2 + e.chips.length * 3 });
  });
  out.sort(function(a,b){ return b.score - a.score; });
  return { rows:out.slice(0, SIG_MAX_ROWS),
           why:'No top-10 league red-zone player on this fixture has an anytime-TD price and a '
             + 'bottom-10 TD defence for their position.' };
}
/* Chunk Plays: explosive-play streaks against a defence that does not suppress them */
function nflChunk(key, g){
  var S = state.sports[key], out = [];
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!p || !isPlayingP(key, p.name, team)) return;
      if (!hasAnyOddsFor(key, p.name)) return;             // not priced anywhere: not playing
      CHUNK_DEFS.forEach(function(def){
        if (def.pos.indexOf(p.position) < 0) return;
        var vals = [];
        sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice()).forEach(function(r){
          var v = statOf(key, r, def.k); if (v != null) vals.push(v);
        });
        if (vals.length < CHUNK_MIN_G) return;
        var od = oddsForP(key, p.name, def.k);
        var line = (od && od.line != null) ? Math.ceil(od.line) : def.thr;
        var hits = vals.filter(function(v){ return v >= line; }).length;
        var rate = hits / vals.length;
        if (rate < CHUNK_HIT) return;
        var dr = dvpRankFor(key, opp, p.position, def.k);
        // production's clamp reads the EXPLOSIVE dvp, not the longest-play dvp: a defence that
        // gives up few explosives makes a long-play history close to meaningless
        var expDvp = dvpRankFor(key, opp, p.position, def.exp);
        if (expDvp && expDvp.pct <= -12) return;
        // the player's own explosive rate and style, both of which the data carries and the
        // first cut ignored entirely
        var expVals = [];
        sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice()).forEach(function(r){
          var v = statOf(key, r, def.exp); if (v != null) expVals.push(v);
        });
        var expRate = expVals.length
          ? expVals.slice(0, 10).reduce(function(a,b){ return a+b; }, 0) / Math.min(10, expVals.length) : null;
        var style = def.style && p[def.style] != null ? +p[def.style] : null;
        out.push({ name:p.name, p:p, opp:opp, def:def, line:line, hits:hits, n:vals.length, rate:rate,
                   last:vals.slice(0, 8), dvp:dr, expDvp:expDvp, expRate:expRate, style:style,
                   avg:vals.reduce(function(a,b){ return a+b; }, 0) / vals.length,
                   price:(od && od.over != null ? +od.over : null),
                   book:(od ? od.book : null), posted:!!(od && od.line != null),
                   score: rate*100 + (expDvp ? expDvp.pct*0.6 : 0) + (dr ? dr.pct*0.3 : 0)
                          + (expRate != null ? expRate*4 : 0) });
      });
    });
  });
  out.sort(function(a,b){ return b.score - a.score; });
  return { rows:out.slice(0, SIG_MAX_ROWS),
           why:'No player on this game clears an explosive-play line in '+Math.round(CHUNK_HIT*100)+'% of games.' };
}
/* Sack Artists / Pick Watch --------------------------------------------------
   The first cut compared a per-GAME rate to a per-GAME concession, which rewards whoever plays
   a slow, high-snap game. The data supports the honest version:

     - normalise by OPPORTUNITY. A sack needs a dropback; an interception needs a throw. So the
       opponent's leak is sacks (or picks) per pass attempt faced, not per game, and the league
       baseline is computed the same way.
     - use POSITIONAL dvp (dvp.json carries defSacks and passInt per position), so a line that
       leaks to edge rushers but handles interior pressure reads correctly.
     - weight by the rusher's SNAP SHARE. A part-timer with a good per-game rate is a worse bet
       than a three-down player with the same number.
     - project rather than rank: expected = own rate per opportunity x expected opportunities x
       the opponent multiplier, so the row can be compared with the posted line directly.        */
function nflOppRate(key, team, madeField, oppField, volField){
  var row = nflTeamRow(key, team);
  if (!row) return null;
  var vol = +row[volField] || 0, made = +row[oppField] || 0;
  if (!vol) return null;
  var rows = asArray(state.sports[key].data.teams) || [];
  var lgMade = 0, lgVol = 0;
