/* NERD MODE ------------------------------------------------------------------------
   The market against itself, rather than the model against the market. Three reads, all from the
   per-book rows we already store:

     Arbs        both sides priced so 1/over + 1/under < 1 - the books disagree enough that backing
                 both is profit whatever happens. Rare, small, and short-lived.
     Middles     over at a low line with one book, under at a higher line with another. Both land if
                 the result finishes in the gap; "cost" is what the pair loses when it doesn't.
     Line value  the best price against the market's own fair price at that line, de-vigged with the
                 power method (which corrects the favourite-longshot bias better than dividing by
                 the overround). This is line shopping, not a model opinion - it says one book is
                 out of step with the rest, which is the cleanest edge there is.

   Our model's own edge is shown alongside line value, capped at the player's record as everywhere
   else, so the two can be compared: market-derived on one side, model-derived on the other.       */
var NERD_MIN_ARB = 0.5, NERD_MIN_GAP = 1, NERD_MAX_COST = 12, NERD_MIN_VALUE = 2,
    NERD_MIN_SAMP = 8, NERD_MIN_MARKET = 3;
function powerDevig(over, under){
  // solve p_o^k + p_u^k = 1 for k, then the fair probability is p_o^k
  var po = 1/over, pu = 1/under;
  if (!(po > 0 && pu > 0) || po + pu <= 1) return null;        // arb or bad input: no vig to remove
  var lo = 0.5, hi = 3;
  for (var i = 0; i < 60; i++){
    var k = (lo + hi)/2, sum = Math.pow(po, k) + Math.pow(pu, k);
    if (sum > 1) lo = k; else hi = k;
  }
  var kk = (lo + hi)/2;
  return Math.max(0.01, Math.min(0.99, Math.pow(po, kk)));
}
// standard normal tail and its inverse - LineOut anchors a distribution to the market's main line
function normSf(z){ return 0.5 * (1 - (z >= 0 ? 1 : -1) * Math.sqrt(1 - Math.exp(-2*z*z/Math.PI))); }
function normSfInv(pr){
  var lo = -6, hi = 6;
  for (var i = 0; i < 80; i++){ var m = (lo + hi)/2; if (normSf(m) > pr) lo = m; else hi = m; }
  return (lo + hi)/2;
}
function nerdRows(key, g){
  var S = state.sports[key], out = { arbs:[], middles:[], value:[], drift:[], lineout:[], implied:[], market:[] };
  var seenPlayers = {};
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!p || !p.name || seenPlayers[p.name] || !isPlayingP(key, p.name, team)) return;
      seenPlayers[p.name] = 1;
      var byMkt = (S.idx.bookIdx || {})[oddsPlayer(key, p.name)] || {};
      posMarkets(key, p).forEach(function(m){
        var rows = (byMkt[m[0]] || []).filter(function(r){ return r && r.line != null; });
        if (rows.length < 2) return;
        var byLine = {};
        rows.forEach(function(r){ (byLine[+r.line] = byLine[+r.line] || []).push(r); });
        // arbs and line value work within one line; middles across two
        Object.keys(byLine).forEach(function(ln){
          var rs = byLine[ln], L = +ln, bo = null, bu = null, prices = [];
          rs.forEach(function(r){
            if (r.over != null){ prices.push(+r.over); if (!bo || +r.over > bo.over) bo = { over:+r.over, book:r.book }; }
            if (r.under != null && (!bu || +r.under > bu.under)) bu = { under:+r.under, book:r.book };
          });
          if (bo && bu){
            var inv = 1/bo.over + 1/bu.under;
            if (inv < 1){
              var profit = (1 - inv) * 100;
              if (profit >= NERD_MIN_ARB) out.arbs.push({ p:p, opp:opp, mkt:m[0], label:m[1], line:L, bo:bo, bu:bu, profit:profit });
            }
          }
          // line value: the consensus two-way at this line, de-vigged, against the best over
          var cons = null;
          rs.forEach(function(r){ if (r.over != null && r.under != null && !cons) cons = r; });
          if (cons && bo && prices.length >= 2){
            var fair = powerDevig(+cons.over, +cons.under);
            if (fair != null){
              var ev = fair * bo.over - 1;
              if (ev >= NERD_MIN_VALUE/100){
                var mp = recordCap(key, p, m[0], L, 'over', modelProbAt(key, p, m[0], L, opp));
                out.value.push({ p:p, opp:opp, mkt:m[0], label:m[1], line:L, bo:bo, fair:fair, ev:ev,
                                 model:mp, modelEv:(mp != null ? mp * bo.over - 1 : null),
                                 books:prices.length, consensus:1/fair });
              }
            }
          }
        });

          });

        // LADDER DRIFT: anchor a distribution to the book's MAIN line, then price its alt ladder off
        // that anchor. The headline line is a book's sharpest number; its milestone rungs are often
        // set loosely against it, and a rung that drifts from what the main line implies is the
        // book disagreeing with itself. (Not the old tool's LineOut - that one is below.)
        var main = null;
        rows.forEach(function(r){ if (r.over != null && r.under != null && (!main || (r.books||0) > (main.books||0))) main = r; });

            var mu0 = mean(vals);

        // price. Value is the line advantage, priced through the same anchored distribution so the

          if (spread.length >= 8){

            var sd1 = Math.sqrt(spread.reduce(function(a,v){ return a + (v-mu1)*(v-mu1); }, 0) / spread.length);

                var ev = fair * price - 1;

                                   side:side, price:price, book:r.book, fair:fair, ev:ev, books:twoWay.length });
              });
            }

        // MARKET: the best price against the average across books (pure line shopping)

  out.middles.sort(function(a,b){ return a.cost - b.cost || b.gap - a.gap; });
  out.value.sort(function(a,b){ return b.ev - a.ev; });
  out.drift.sort(function(a,b){ return b.ev - a.ev; });
  out.lineout.sort(function(a,b){ return b.ev - a.ev; });

/* Player modal, Form tab: the receipts behind a pick. Every number here is the same one the
   signals are built on - same statOf null handling, same calibrated probability, same price
   floor - so a row in a tile and a row in here can never disagree.                            */
function ppOpponent(key, name){
  var S = state.sports[key], team = (S.idx.playerTeam || {})[name];
  var f = state.view.focus;
  if (team && f && f.sport === key && f.g){
    if (normTeam(f.g.home) === normTeam(team)) return f.g.away;
    if (normTeam(f.g.away) === normTeam(team)) return f.g.home;
  }
  return team ? (S.idx.nextOpp || {})[team] : null;
}

/* Player modal: prop calculator, ported from the AFL tool. Dial any line on any market, see the
   hit rate over a chosen window, the posted price at that exact line where one exists, and the
   edge the calibrated model makes of it. Adds straight to the multi slip.                     */
function pcDefaultLine(key, name, mkt){
  var od = bestPriceFor(key, name, mkt);
  if (od && od.line != null) return Math.max(1, Math.ceil(od.line));
  var e = leagueAvg(key, mkt)[name];
  return e ? Math.max(1, Math.round(e.avg)) : 1;
}
function pcGames(key, name, scope, opp){
  var all = sortLogsDesc((((state.sports[key].idx.logsByName) || {})[name] || []).slice());
  if (scope === 'h2h' && opp) return all.filter(function(r){
    var o = oppOf(key, r); return o && normTeam(o) === normTeam(opp); });
  if (scope === 'l5') return all.slice(0, 5);
  if (scope === 'l10') return all.slice(0, 10);
  var cur = all.filter(function(r){ return (+(r.Year||r.year)||0) === curSeason(key); });
  return cur.length ? cur : all.slice(0, 15);
}
function ppCalc(key, name){
  var S = state.sports[key], p = (S.idx.byName || {})[name];
  if (!p) return '<div class="empty" style="padding:20px">No player record.</div>';
  var mkts = posMarkets(key, p).slice(0, 10);
  if (!mkts.length) return '<div class="empty" style="padding:20px">No markets configured.</div>';
  var st = state.view.pc || {};
  if (st.name !== name){
    st = { name:name, mkt:mkts[0][0], line:pcDefaultLine(key, name, mkts[0][0]), scope:'season', side:'over' };
    state.view.pc = st;
  }
  var opp = ppOpponent(key, name);
  var games = pcGames(key, name, st.scope, opp);
  var vals = [];
  games.forEach(function(r){ var v = statOf(key, r, st.mkt); if (v != null) vals.push(v); });
  var over = st.side !== 'under';
  var thr = st.line - 0.5;                                  // "20+" means over 19.5
  var hits = vals.filter(function(v){ return over ? v >= st.line : v < st.line; }).length;
  var rate = vals.length ? hits / vals.length : null;
  var od = bestPriceFor(key, name, st.mkt, thr);
  var twoWay = cmbPosted(key, name, st.mkt);
  var price = over ? (od ? od.price : null)
                   : (twoWay && Math.ceil(+twoWay.line) === st.line && twoWay.under != null ? +twoWay.under : null);
  var raw = null;
  try { raw = S.scoring && S.scoring.prob ? S.scoring.prob(p, st.mkt, thr, opp) : null; } catch(e){}
  if (raw == null && (key === 'epl' || key === 'mlb')){
    try { var sc = S.scoring.scoreCMP(p, st.mkt, thr, opp);
      if (sc != null && isFinite(sc)) raw = Math.max(0.01, Math.min(0.99, sc/20 + 0.5)); } catch(e){}
  }
  var prob = raw != null ? calibrate(key, raw) : rate;
  if (prob != null && !over) prob = 1 - prob;
  var ev = (price != null && prob != null) ? prob * (price - 1) - (1 - prob) : null;
  var mx = Math.max.apply(null, vals.concat([st.line])) || 1;
  return '<div class="pc-wrap">'
    + '<div class="sl-bar">'+mkts.map(function(m){
        return '<button class="sl-chip'+(m[0] === st.mkt ? ' on' : '')+'" onclick="LAB.pcMkt(\'' + m[0] + '\')">'
          + esc(m[1])+'</button>'; }).join('')+'</div>'
    + '<div class="pc-row"><span class="pc-step">'
      + '<button onclick="LAB.pcLine(-1)">\u2212</button>'
      + '<span class="pc-line">'+(over ? st.line+'+' : 'U'+st.line)+'</span>'
      + '<button onclick="LAB.pcLine(1)">+</button></span>'
      + '<span class="pc-hr"><b>'+(rate == null ? '\u2014' : Math.round(rate*100)+'%')+'</b>'
      + '<span>'+hits+'/'+vals.length+' '+esc(st.scope === 'h2h' ? 'v '+(opp ? abbrOf(key, opp) : 'opp')
          : (st.scope === 'season' ? 'this season' : st.scope.toUpperCase()))+'</span></span></div>'
    + '<div class="sl-bar">'
      + [['over','Over'],['under','Under']].map(function(x){
          return '<button class="sl-chip'+(st.side === x[0] ? ' on' : '')+'" onclick="LAB.pcSide(\''+x[0]+'\')">'
            + x[1]+'</button>'; }).join('')
      + '<span class="sl-win">'+[['season','Season'],['l10','L10'],['l5','L5'],['h2h','H2H']].map(function(x){
          return '<button class="sl-chip'+(st.scope === x[0] ? ' on' : '')+'" onclick="LAB.pcScope(\''+x[0]+'\')">'
            + x[1]+'</button>'; }).join('')+'</span></div>'
    + '<div class="pc-odds">'
      + '<span><b>'+(price != null ? '$'+price.toFixed(2) : '\u2014')+'</b>posted</span>'
      + '<span><b>'+(prob != null ? Math.round(prob*100)+'%' : '\u2014')+'</b>model</span>'
      + '<span><b class="'+(ev != null && ev > 0 ? 'pos' : (ev != null ? 'neg' : ''))+'">'
        + (ev != null ? (ev > 0 ? '+' : '')+Math.round(ev*100)+'%' : '\u2014')+'</b>edge</span></div>'
    + (function(){
        var seq = vals.slice(0, 14).reverse();
        return '<div class="pc-bars">'+seq.map(function(v){
            var hit = over ? v >= st.line : v < st.line;
            return '<span class="'+(hit ? '' : 'miss')+'" style="height:'+Math.max(6, Math.round(v/mx*100))+'%"></span>';
          }).join('')+'</div>'
          + '<div class="pf-vals">'+seq.map(function(v){
            return '<span>'+(v % 1 ? v.toFixed(1) : v)+'</span>'; }).join('')+'</div>';
      })()
    + (price != null && over
        ? '<button class="pc-add" onclick="LAB.pcAdd()">Add to multi</button>'
        : '<div class="cmb-corr" style="margin-top:9px">'
          + (over ? 'No posted price at that exact line.' : 'Unders need a two-way market at this line.')+'</div>')
    + '</div>';
}
/* Radar and coverage, reused from the fixture sections but scoped to one player */
function ppRadar(key, name){
  var S = state.sports[key], p = (S.idx.byName || {})[name];
  var opp = ppOpponent(key, name);
  if (!p || !opp) return '<div class="empty" style="padding:20px">No fixture for this player.</div>';
  var rows = radarBuild(key, p, opp);
  if (!rows) return '<div class="empty" style="padding:20px">Not enough positional data for a radar.</div>';
  return '<div class="rdr-wrap"><div class="rdr-hd">'+playerImgP(key, p, 26)
    + '<span class="rdr-nm">'+esc(name)+'</span><span class="rdr-vs">v '+esc(abbrOf(key, opp))+'</span></div>'
    + radarSVG(rows)
    + '<div class="rdr-key"><span><i style="background:#7dd3fc"></i>Player vs peers</span>'
    + '<span><i style="background:var(--text-3)"></i>Defence softness</span>'
    + '<span>#N = DVP rank (1 = softest)</span></div>'
    + radarMarkets(key, p, opp)+'</div>';
}
function ppCoverage(key, name){
  var S = state.sports[key], p = (S.idx.byName || {})[name];
  var opp = ppOpponent(key, name);
  if (!p || !opp) return '<div class="empty" style="padding:20px">No fixture for this player.</div>';
  if (!p.cov || !(p.cov.man || p.cov.zone))
    return '<div class="empty" style="padding:20px">No man/zone split on file for this player.</div>';
  var od = (teamRec(key, opp) || {}).cov;
  var m = p.cov.man || { tgt:0, yds:0, td:0 }, z = p.cov.zone || { tgt:0, yds:0, td:0 };
  var mypt = m.tgt ? m.yds/m.tgt : 0, zypt = z.tgt ? z.yds/z.tgt : 0;
  var lean = mypt - zypt;
  var shells = od ? Object.keys(od.cover || {}).map(function(c){
      return [String(c).replace('COVER_','Cover-').replace('2_MAN','2-Man').replace(/_/g,' '), +od.cover[c]];
    }).sort(function(a,b){ return b[1]-a[1]; }).slice(0, 4) : [];
  var verdict = !od ? 'No coverage profile for '+abbrOf(key, opp)
    : (lean > 1.5 && od.manRate >= 45 ? 'Man beater into a man-heavy defence'
      : (lean < -1.5 && od.zoneRate >= 60 ? 'Zone beater into a zone-heavy defence'
        : 'No strong scheme edge here'));
  return '<div class="rdr-wrap">'
    + (od ? '<span class="cov-bar"><i style="width:'+Math.round(od.manRate)+'%"></i></span>'
      + '<div class="cov-rates">'+esc(abbrOf(key, opp))+': '+Math.round(od.manRate)+'% man / '
      + Math.round(od.zoneRate)+'% zone \u00b7 '+od.plays+' plays</div>'
      + (shells.length ? '<div class="gl-why" style="margin:6px 0">'+shells.map(function(sh){
          return '<span class="gl-chip">'+esc(sh[0])+' '+sh[1].toFixed(0)+'%</span>'; }).join('')+'</div>' : '')
      : '')
    + '<div class="pf-cells" style="margin-top:8px">'
      + '<div class="pf-cell"><b>'+mypt.toFixed(1)+'</b><span>yd/tgt vs man</span></div>'
      + '<div class="pf-cell"><b>'+zypt.toFixed(1)+'</b><span>yd/tgt vs zone</span></div>'
      + '<div class="pf-cell"><b>'+m.tgt+'/'+z.tgt+'</b><span>man/zone tgts</span></div>'
      + '<div class="pf-cell"><b>'+(m.td||0)+'/'+(z.td||0)+'</b><span>man/zone TDs</span></div></div>'
    + '<div class="ca-note '+(/beater/.test(verdict) ? 'good' : 'info')+'" style="margin-top:9px">'
      + '<i class="ti ti-shield-half"></i><span>'+esc(verdict)+'</span></div></div>';
}
/* DVP & averages: how the opponent defends every market this player bets into */
function ppDvp(key, name){
  var S = state.sports[key], p = (S.idx.byName || {})[name];
  var opp = ppOpponent(key, name);
  if (!p) return '<div class="empty" style="padding:20px">No player record.</div>';
  var mkts = posMarkets(key, p).slice(0, 10);          // a QB has no receiving matchup
  var rows = mkts.map(function(m){
    var lg = leagueAvg(key, m[0])[name];
    if (!lg) return null;
    var l5 = [];
    sortLogsDesc(((S.idx.logsByName || {})[name] || []).slice()).forEach(function(r){
      if (l5.length < 5){ var v = statOf(key, r, m[0]); if (v != null) l5.push(v); } });
    var h2h = [];
    if (opp) sortLogsDesc(((S.idx.logsByName || {})[name] || []).slice()).forEach(function(r){
      var o = oppOf(key, r);
      if (o && normTeam(o) === normTeam(opp)){ var v = statOf(key, r, m[0]); if (v != null) h2h.push(v); } });
    var avg = function(a){ return a.length ? a.reduce(function(x,y){ return x+y; }, 0)/a.length : null; };
    return { label:m[1], season:lg.avg, l5:avg(l5), h2h:avg(h2h), h2hN:h2h.length,
             dvp:(opp ? dvpRankFor(key, opp, p.position || p.pos, m[0]) : null) };
  }).filter(Boolean);
  if (!rows.length) return '<div class="empty" style="padding:20px">No market history for this player.</div>';
  var dec = function(v){ return v == null ? '\u2014' : (v < 3 ? v.toFixed(2) : v.toFixed(1)); };
  return '<div class="st-wrap"><table class="st-t"><thead><tr><th>Market</th><th>Season</th><th>L5</th>'
    + '<th>v '+esc(opp ? abbrOf(key, opp) : 'opp')+'</th><th>DVP</th></tr></thead><tbody>'
    + rows.map(function(r){
        var cls = r.dvp ? (r.dvp.pct > 5 ? 'hi' : (r.dvp.pct < -5 ? 'lo' : '')) : '';
        return '<tr><td class="nm">'+esc(r.label)+'</td><td>'+dec(r.season)+'</td><td>'+dec(r.l5)+'</td>'
          + '<td>'+dec(r.h2h)+(r.h2hN ? ' <span class="sub">('+r.h2hN+')</span>' : '')+'</td>'
          + '<td class="'+cls+'">'+(r.dvp ? '#'+r.dvp.rank+'/'+r.dvp.total : '\u2014')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
}

/* Which markets actually belong to a position. Showing a quarterback's receiving yards or a
   goalkeeper's shots is noise at best and misleading at worst - a DVP rank against a market the
   player never records reads as a matchup signal when it is nothing.                          */
var POS_MKTS = {
  nfl: {
    QB: ['passYds','passAtt','passComp','passTds','passInt','longComp','rushYds','rushAtt','anytimeTd'],
    RB: ['rushYds','rushAtt','receptions','recYds','rushRecYds','longRush','longRec','anytimeTd'],
    WR: ['receptions','recYds','longRec','rushRecYds','anytimeTd','rushYds','rushAtt'],
    TE: ['receptions','recYds','longRec','anytimeTd'],
    K:  ['kickingPts','fgMade'],
    LB: ['tackles','sacks'], DL: ['tackles','sacks'], DB: ['tackles','sacks']
  },
  nhl: {
    G: ['saves'],
    C: ['goals','assists','points','shots','ppPoints','blocks','hits'],
    L: ['goals','assists','points','shots','ppPoints','blocks','hits'],
    R: ['goals','assists','points','shots','ppPoints','blocks','hits'],
    D: ['goals','assists','points','shots','ppPoints','blocks','hits']
  },
  epl: {
    GK: ['saves','cards'],
    DEF:['tackles','cards','foulsCommitted','shotsOn','goals','assists'],
    MID:['goals','assists','shots','shotsOn','keyPasses','tackles','cards','foulsCommitted'],
    FWD:['goals','assists','shots','shotsOn','keyPasses','cards']
  }
};
function posMarkets(key, p, all){
  all = all || ((state.sports[key].config || {}).oddsMkts || (state.sports[key].config || {}).multiMkts || []);
  if (!p) return all;
  if (key === 'mlb'){                                   // batters and arms never share a market
    return all.filter(function(m){
      return p.role === 'pitch' ? !BAT_ONLY[m[0]] : !ARM_ONLY[m[0]];
    });
  }
  var map = POS_MKTS[key];
  if (!map) return all;
  var pos = p.position || p.pos;
  var allowed = map[pos];
  if (!allowed){                                        // EPL ships long position names too
    Object.keys(map).forEach(function(k2){
      if (!allowed && String(pos || '').toUpperCase().indexOf(k2) === 0) allowed = map[k2];
    });
  }
  if (!allowed) return all;
  return all.filter(function(m){ return allowed.indexOf(m[0]) >= 0; });
}
function ppFormTab(key, name){
  var S = state.sports[key], p = (S.idx.byName || {})[name];
  if (!p) return '<div class="empty" style="padding:20px">No player record on file.</div>';
  var opp = ppOpponent(key, name);
  var mkts = posMarkets(key, p);                        // only the markets this position records
  var logs = sortLogsDesc(((S.idx.logsByName || {})[name] || []).slice());
  if (!logs.length) return '<div class="empty" style="padding:20px">No game logs for this player.</div>';
  var h2h = opp ? (h2hSplit(key, name)[normTeam(opp)] || []) : [];
  var out = [];
  mkts.forEach(function(m){
    var k = m[0];
    if (key === 'mlb'){
      if (p.role === 'pitch' && BAT_ONLY[k]) return;
      if (p.role !== 'pitch' && ARM_ONLY[k]) return;
    }
    var od = oddsForP(key, name, k);
    var cands = streakCandidates(key, name, k).filter(function(c){ return c.price >= SIG_ODDS_FLOOR; });
    var bet = (od && od.line != null && od.over != null && od.over >= SIG_ODDS_FLOOR)
      ? { line:+od.line, price:+od.over, book:od.book } : (cands.length ? cands[cands.length-1] : null);
    var vals = [];
    logs.forEach(function(r){ var v = statOf(key, r, k); if (v != null) vals.push(v); });
    if (vals.length < 3) return;
    var last = vals.slice(0, 10);
    var lg = leagueAvg(key, k)[name];
    var l5 = last.slice(0, 5);
    var avg = function(a){ return a.length ? a.reduce(function(x,y){ return x+y; }, 0) / a.length : null; };
    var h2hVals = [];
    h2h.forEach(function(r){ var v = statOf(key, r, k); if (v != null) h2hVals.push(v); });
    var line = bet ? bet.line : null;
    var hits = line != null ? last.filter(function(v){ return v > line; }).length : null;
    var prob = null, ev = null;
    if (bet){
      var raw = null;
      try { raw = S.scoring && S.scoring.prob ? S.scoring.prob(p, k, bet.line, opp) : null; } catch(e){}
      if (raw != null && isFinite(raw)){
        prob = calibrate(key, raw);
        ev = prob * (bet.price - 1) - (1 - prob);
      }
    }
    var dr = opp ? dvpRankFor(key, opp, p.position || p.pos, k) : null;
    out.push({ mkt:k, label:m[1], bet:bet, last:last, hits:hits, prob:prob, ev:ev,
               season:lg ? lg.avg : avg(vals), l5:avg(l5), h2h:avg(h2hVals), h2hN:h2hVals.length, dvp:dr });
  });
  if (!out.length) return '<div class="empty" style="padding:20px">No markets with enough history for this player.</div>';
  out.sort(function(a,b){ return (b.ev == null ? -9 : b.ev) - (a.ev == null ? -9 : a.ev); });
  var dec = function(v){ return v == null ? '\u2014' : (v < 3 ? v.toFixed(2) : v.toFixed(1)); };
  return out.map(function(r){
    var mx = Math.max.apply(null, r.last.concat([r.bet ? r.bet.line : 0])) || 1;
    var pips = r.last.slice().reverse();
    return '<div class="pf-row">'
      + '<div class="pf-hd"><span class="pf-mk">'+esc(r.label)+'</span>'
        + (r.bet ? '<span class="pf-line">'+(Math.ceil(r.bet.line))+'+ @ $'+r.bet.price.toFixed(2)
            +' '+esc(r.bet.book||'')+'</span>' : '<span class="pf-line">no priced line</span>')
        + (r.ev != null ? '<span class="pf-ev '+(r.ev > 0 ? 'pos' : 'neg')+'">'
            + Math.round(r.prob*100)+'% \u00b7 '+(r.ev > 0 ? '+' : '')+Math.round(r.ev*100)+'% edge</span>' : '')
      + '</div>'
      + '<div class="pf-pips">'+pips.map(function(v){
          var hit = r.bet && v > r.bet.line;
          return '<span class="pf-pip'+(r.bet && !hit ? ' miss' : '')+'"><i style="height:'
            + Math.max(6, Math.round(v / mx * 100))+'%"></i></span>'; }).join('')+'</div>'
      + '<div class="pf-vals">'+pips.map(function(v){
          return '<span>'+(v % 1 ? v.toFixed(1) : v)+'</span>'; }).join('')+'</div>'
      + '<div class="pf-cells">'
        + '<div class="pf-cell"><b>'+(r.hits == null ? '\u2014' : r.hits+'/'+r.last.length)+'</b><span>hit</span></div>'
        + '<div class="pf-cell"><b>'+dec(r.l5)+'</b><span>L5</span></div>'
        + '<div class="pf-cell"><b>'+dec(r.season)+'</b><span>season</span></div>'
        + '<div class="pf-cell"><b>'+dec(r.h2h)+'</b><span>v opp'+(r.h2hN ? ' ('+r.h2hN+')' : '')+'</span></div>'
        + (r.dvp ? '<div class="pf-cell"><b>'+r.dvp.rank+'/'+r.dvp.total+'</b><span>dvp</span></div>' : '')
      + '</div></div>';
  }).join('');
}

/* CHECK MY BET / CHECK MY MULTI ----------------------------------------------
   A floating button, as in production, opening a Single/Multi modal. Input is free text
   ("Cripps 28+ disposals"), parsed into player + line + market + side. The read behind it is
   the same code the tiles and the player modal use - same statOf, same calibrate(), same
   price floor - so the three can never disagree.

   The multi is the part that needs care: legs in the same match are NOT independent. Two
   midfielders in a low-scoring game both fall short together. Production measures the
   correlation of the legs CO-CLEARING their lines (binary agreement, not stat correlation,
   which overstates it badly) and runs a Gaussian copula. Same approach here.                */
var CMB_SIDE_WORDS = { under:'under', u:'under', over:'over', o:'over' };
function cmbMarkets(key){
  var base = ((state.sports[key].config || {}).oddsMkts || (state.sports[key].config || {}).multiMkts || []);
  // first scorer has no line, so it is not in oddsMkts - but punters still ask for it by name
  return FS_MKT[key] ? base.concat([FS_MKT[key]]) : base;
}
// Punters type what they say, not what the config calls it: "pass yards", "receiving yds",
// "strike outs", "home runs". Canonicalise both sides token by token, then match on tokens
// rather than on the literal label - "Pass Yds" and "passing yards" reduce to the same thing.
var CMB_SYN = {
  yards:'yd', yard:'yd', yds:'yd', ydss:'yd',
  passing:'pass', pass:'pass', passes:'pass',
  rushing:'rush', rush:'rush', rushes:'rush', carries:'rushatt', carry:'rushatt',
  receiving:'rec', reception:'rec', receptions:'rec', catches:'rec', catch:'rec', recs:'rec',
  touchdown:'td', touchdowns:'td', tds:'td', td:'td',
  interception:'int', interceptions:'int', ints:'int', picks:'int',
  attempt:'att', attempts:'att', atts:'att',
  strikeout:'k', strikeouts:'k', ks:'k', punchouts:'k',
  homerun:'hr', homeruns:'hr', hrs:'hr', dinger:'hr', dingers:'hr',
  hits:'h', hit:'h', knocks:'h',
  rbis:'rbi', runs:'r', run:'r', bases:'tb', totalbases:'tb',
  disposal:'disposals', disposals:'disposals', poss:'disposals', touches:'disposals',
  mark:'marks', marks:'marks', tackle:'tackles', tackles:'tackles',
  clearance:'clearances', clearances:'clearances', goal:'goals', goals:'goals',
  behind:'behinds', hitout:'hitouts', hitouts:'hitouts',
  fantasy:'dreamteam', dreamteam:'dreamteam', fpts:'dreamteam', supercoach:'supercoach', sc:'supercoach',
  shot:'shots', shots:'shots', sot:'shotson', target:'', targets:'targets',
  save:'saves', saves:'saves', foul:'fouls', fouls:'fouls', card:'cards', cards:'cards',
  assist:'assists', assists:'assists', keypass:'keypasses', keypasses:'keypasses',
  points:'pts', pts:'pts', plus:'', over:'', under:'',
  possession:'disposals', possessions:'disposals', poss:'disposals',
  sot:'shotson', ontarget:'shotson', shotsontarget:'shotson',
  rushrec:'rushrec', scrimmage:'rushrec',
  first:'first', scorer:'scorer', firstscorer:'firstscorer', fts:'firstscorer',
  firsttd:'firstscorer', firstgoal:'firstscorer', anytime:'anytime', opener:'firstscorer'
};
// words that are never part of a player's name or a market, just noise around the bet
var CMB_STOP = { pts:1, point:1, points:1, line:1, odds:1, bet:1, prop:1, at:1, vs:1, v:1, the:1 };
function cmbCanon(tok){

/* FIRST SCORER -----------------------------------------------------------------
   The one posted market with no line to clear: 3,174 NFL rows and 2,123 EPL, and until now
   the tool ignored all of it because every other path needs a threshold.

   Modelled as two questions rather than one:
       P(this player scores first) = P(their team scores first) x P(it is him, given the team does)
   Team rate comes from how often that side has opened the scoring; the player's share comes from
   his cut of his own team's first scores, shrunk toward an even split so one lucky game doesn't
   read as a third of the team's openings. NFL names arrive abbreviated ("Mi.Wilson"), so they are

var FS_MKT = { nfl:['firstScorer','First TD'], epl:['firstScorer','First Goal'] };

  var hit = null;
  pool.forEach(function(p){
    var parts = String(p.name).toLowerCase().split(/\s+/);
    if (parts.length < 2) return;
    if (parts[parts.length-1].replace(/[^a-z]/g, '') !== last) return;
    if (parts[0].indexOf(ini) !== 0) return;
    if (!hit) hit = p.name;

}
function fsIndex(key){

  if (key === 'nfl'){
    var rows = asArray(S.data.firsttd) || [];
    var seen = {};
    rows.forEach(function(r){
      if (!r || !r.matchId) return;
      var pr = String(r.matchId).split('_');
      [pr[2], pr[3]].forEach(function(t){
        if (!t) return;
        var gk = normTeam(t) + '|' + r.matchId;
        if (!seen[gk]){ seen[gk] = 1; teamGames[normTeam(t)] = (teamGames[normTeam(t)] || 0) + 1; }
      });
      if (r.gameFirst) teamFirst[normTeam(r.team)] = (teamFirst[normTeam(r.team)] || 0) + 1;
      teamScores[normTeam(r.team)] = (teamScores[normTeam(r.team)] || 0) + 1;
      var nm = fsResolve(key, r.player);
      if (!nm) return;
      var k = normTeam(r.team) + '|' + nm;
      byPlayer[k] = byPlayer[k] || { team:normTeam(r.team), name:nm, n:0 };
      byPlayer[k].n++;
    });
  } else {
    var ev = (S.data.events || {}).byTeam || {};
    Object.keys(ev).forEach(function(t){
      var e = ev[t] || {};
      var tk = normTeam(t);
      teamGames[tk] = e.matches || 0;
      teamFirst[tk] = Math.round((e.opensScoring || 0) * (e.matches || 0));
      (e.firstScorers || []).forEach(function(fsRow){
        var nm = fsResolve(key, fsRow[0]) || fsRow[0];
        var k = tk + '|' + nm;
        byPlayer[k] = byPlayer[k] || { team:tk, name:nm, n:0 };
        byPlayer[k].n += (+fsRow[1] || 0);
        teamScores[tk] = (teamScores[tk] || 0) + (+fsRow[1] || 0);

// EPL: first-scorer SHARE from his share of the team's goals, not from first-scorer counts.
// events.json holds ~10 first-scorer events per club per season spread over a handful of names,
// and shrinking those toward an even split handed every listed player ~20% - summed over a game
// that was far more than one first goal. Goals per game against the team's goals per game has
// ten times the data, and minutes on the pitch scale it for rotation players.
function eplGoalShare(key, p){

  rows.forEach(function(r){ goals += +(statOf(key, r, 'goals') || 0); mins += +r.min || 0; });

    + ' (#'+dr.rank+'/'+dr.total+', '+(dr.pct > 0 ? '+' : '')+dr.pct.toFixed(0)+'%)');
  if (h2hRows.length) push(cleared(h2hRows[0].v) ? 'good' : 'info', 'ti-history',
    'Last vs '+esc(abbrOf(key, opp))+': '+dec(h2hRows[0].v)+' '+esc(l.label)+' \u2014 '
    + (cleared(h2hRows[0].v) ? 'landed this bet' : 'missed it')+' \u00b7 '
    + h2hRows.filter(function(r){ return cleared(r.v); }).length+'/'+h2hRows.length+' historically');
  if (isFinite(high)) push(isUnder ? (high < line ? 'good' : 'info') : (high >= line ? 'info' : 'bad'),
    'ti-mountain',

      + (isUnder ? ', so the under can be beaten' : '')
      : 'Season high only '+dec(high)+' \u2014 has never hit this line this season'
      + (isUnder ? ', which favours the under' : ''));
  if (l.price != null && l.prob != null){
    var ev = l.prob * (l.price - 1) - (1 - l.prob);
    push(ev > 0.05 ? 'good' : (ev > -0.05 ? 'warn' : 'bad'), 'ti-coin',
      'At $'+l.price.toFixed(2)+' the model makes this '+(ev > 0 ? '+' : '')+Math.round(ev*100)
      + '% \u2014 '+(ev > 0.05 ? 'value' : ev > -0.05 ? 'close to fair' : 'priced against you'));
  }
  h += '<div class="ca-lab">Analysis</div>'+notes.join('');

  /* similar players vs this opponent */
  var sim = cmbSimilar(key, p, mkt, line, opp, l.side);
  if (sim && sim.rows.length){
    h += '<div class="ca-simhd"><b>Recent '+esc(sim.pos)+' vs '+esc(abbrOf(key, opp))+'</b>'
      + '<span>'+sim.hit+'/'+sim.tot+' hit ('+Math.round(sim.hit/sim.tot*100)+'%)</span></div>'
      + sim.rows.map(function(r){
          return '<div class="ca-sim"><span class="ca-sim-n">'+esc(r.name)+'</span>'
            + '<span class="ca-sim-v">'+r.vals.map(function(v){
                return cleared(v) ? '<u>'+(v % 1 ? v.toFixed(1) : v)+'</u>' : '<s>'+(v % 1 ? v.toFixed(1) : v)+'</s>';
              }).join(', ')+'</span>'
            + '<span class="ca-sim-g">'+r.vals.length+'g</span></div>'; }).join('')
      + '<div class="cmb-corr">The '+sim.rows.length+' players in this position who met '
      + esc(abbrOf(key, opp))+' most recently \u00b7 their actual returns, newest meeting first.</div>';
  }
  return h;
}
function cmbResolve(q){
  // Parse ONCE PER SPORT: market names differ, and parsing "235+ pass yds" with AFL's market
  // list leaves "pass yds" stuck in the player name, which is why nothing was ever found while
  // more than one sport was switched on. Score each sport's interpretation and take the best.
  var cands = [];
  Object.keys(SPORTS).forEach(function(key){
    if (!state.view.active[key]) return;
    var parsed = cmbParse(key, q);
    if (!parsed || !parsed.name) return;
    var nameQ = cmbNameKey(parsed.name);
    var best = null;
    cmbPool(key).forEach(function(p){
      if (!p || !p.name) return;
      var n = cmbNameKey(p.name), last = cmbNameKey(String(p.name).trim().split(/\s+/).pop());
      var rank = n === nameQ ? 0 : (last === nameQ ? 1 : (n.indexOf(nameQ) >= 0 ? 2 : -1));
      if (rank < 0) return;
      if (!best || rank < best.rank) best = { p:p, rank:rank };
    });
    if (!best) return;
    cands.push({ key:key, p:best.p, rank:best.rank, parsed:parsed,
                 score:(best.rank) + (parsed.mkt ? 0 : 10) + (parsed.line != null ? 0 : 5) });
  });
  if (!cands.length) return { err:'Player not found. Try a surname, or check the sport is switched on.' };
  cands.sort(function(a,b){ return a.score - b.score; });
  var c = cands[0];
  if (!c.parsed.mkt) return { err:'Which market? Try \u201c'+esc(c.p.name)+' '
    + (cmbMarkets(c.key)[0] ? '20+ '+cmbMarkets(c.key)[0][1].toLowerCase() : '20+ disposals')+'\u201d.' };
  if (c.parsed.line == null && c.parsed.mkt[0] !== 'firstScorer')
    return { err:'Add a line, e.g. \u201c'+esc(c.p.name)+' 20+ '+c.parsed.mkt[1].toLowerCase()+'\u201d.' };
  ensureSport(c.key);
  if (state.sports[c.key].t3 !== 'ready') return { loading:true, key:c.key };
  return { leg: cmbLeg(c.key, c.p, c.parsed.mkt, (c.parsed.line == null ? 0 : c.parsed.line), c.parsed.side) };
}
// A four-leg multi can land at 0.04%, which renders as "0%" and tells the punter nothing.
// Below 1% say it the way people say it.
function cmbOdds(pv){
  if (pv == null || !isFinite(pv) || pv <= 0) return '\u2014';
  if (pv >= 0.01) return (pv*100).toFixed(1)+'%';
  return '1 in '+Math.round(1/pv).toLocaleString();
}

/* MULTI HISTORY: how this exact combination has actually gone, rather than only what the model
   says. Two backtests:
     vs this opponent - restrict every leg to games against the team it faces now, align them by
       match, and count the matches where EVERY leg cleared;
     all games - align by round/date across all opponents and do the same.
   Alignment is by MatchId where the legs share a fixture, otherwise by date or season+round, so
   legs from different games in the same round still line up.                                   */
function cmbLegSeries2(l, oppOnly){
  var S = state.sports[l.key], out = {};
  ((S.idx.logsByName || {})[l.p.name] || []).forEach(function(r){
    var v = statOf(l.key, r, l.mkt);
    if (v == null) return;
    if (oppOnly){
      var o = oppOf(l.key, r);
      if (!o || !l.opp || normTeam(o) !== normTeam(l.opp)) return;
    }
    var d = String(r.date || r.Date || '').slice(0, 10);
    var key = d || ((r.Year || r.year) + '|' + String(r.RoundName != null ? r.RoundName : r.Week));
    out[key] = { v:v, ms:(logMs(r) || logSeq(r)) };
  });
  return out;
}
function cmbTogether(legs, oppOnly){
  if (!legs.length) return null;
  var series = legs.map(function(l){ return cmbLegSeries2(l, oppOnly); });
  var shared = Object.keys(series[0]).filter(function(k){
    return series.every(function(sx){ return sx[k] != null; });
  });
  if (!shared.length) return { n:0, hit:0, rows:[] };
  shared.sort(function(a,b){ return (series[0][b].ms||0) - (series[0][a].ms||0); });
  var hit = 0, rows = [];
  shared.forEach(function(k){
    var all = legs.every(function(l, i){
      var v = series[i][k].v;
      return l.side === 'under' ? v <= l.line : v > l.line;
    });
    if (all) hit++;
    if (rows.length < 6) rows.push({ k:k, all:all, vals:legs.map(function(l,i){ return series[i][k].v; }) });
  });
  return { n:shared.length, hit:hit, rows:rows };
}
function cmbLegQuality(l){
  var S = state.sports[l.key];
  var all = [], vs = [];
  ((S.idx.logsByName || {})[l.p.name] || []).forEach(function(r){
    var v = statOf(l.key, r, l.mkt);
    if (v == null) return;
    var cleared = l.side === 'under' ? v <= l.line : v > l.line;
    all.push(cleared);
    var o = oppOf(l.key, r);
    if (o && l.opp && normTeam(o) === normTeam(l.opp)) vs.push(cleared);
  });
  return { n:all.length, hit:all.filter(Boolean).length,
           vsN:vs.length, vsHit:vs.filter(Boolean).length };
}

/* MULTI BUILDER ----------------------------------------------------------------
   Benchmarked on the production builder: the same five ways of generating a leg pool
   (safest / value / longshot / history vs this opponent / matchup), leg cards you tap into
   the slip, priced off the real ladder.

   Four things it does that the old one couldn't:
     - probabilities are the CALIBRATED model, not a raw hit rate, so "90%" means 90%;
     - value is measured against the book's no-vig fair price where a two-way market exists,
       not just against the quoted over;
     - Auto-build picks the combination greedily on CORRELATED joint EV, so it will not hand
       you three legs from the same team that all die together;
     - whatever it builds drops into the same slip, so the history backtest and copula in the
       Multi tab apply to a built multi exactly as to a typed one.                            */
var MB_MODES = [['signals','Signals'],['safe','Safest'],['value','Value'],['lotto','Longshot'],['hist','History'],['match','Matchup']];
var MB_MIN_GAMES = 4, MB_MAX_CARDS = 14;
function mbFixtures(){
  var out = [];
  Object.keys(SPORTS).forEach(function(key){
    if (!state.view.active[key]) return;
    var hz = fixtureHorizon(key);
    (asArray(state.sports[key].data.fixture) || []).forEach(function(g, i){
      if (gameStart(g).ms && gameStart(g).ms < Date.now() - 3*36e5) return;   // done and dusted
      if (!inFixtureWindow(key, g, hz)) return;
      out.push({ key:key, i:i, g:g });
    });
  });
  return out.slice(0, 40);
}
function mbCandidates(key, g, mode){
  var S = state.sports[key], out = [];
  var mkts = (S.config || {}).oddsMkts || (S.config || {}).multiMkts || [];
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!p || !p.name || !isPlayingP(key, p.name, team)) return;
      var best = null;
      mkts.forEach(function(m){
        var k = m[0];
        if (key === 'mlb'){
          if (p.role === 'pitch' && BAT_ONLY[k]) return;
          if (p.role !== 'pitch' && ARM_ONLY[k]) return;
        }
        var lg = leagueAvg(key, k)[p.name];
        if (!lg || lg.games < MB_MIN_GAMES) return;
        var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice());
        var vals = [];
        logs.forEach(function(r){ var v = statOf(key, r, k); if (v != null) vals.push(v); });
        if (vals.length < 5) return;
        var h2h = [];
        logs.forEach(function(r){
          var o = oppOf(key, r);
          if (!o || normTeam(o) !== normTeam(opp)) return;
          var v = statOf(key, r, k); if (v != null) h2h.push(v);
        });
        var dr = dvpRankFor(key, opp, p.position || p.pos, k);
        streakCandidates(key, p.name, k).forEach(function(c){
          if (c.price == null || c.price < STREAK_ODDS_FLOOR) return;
          var raw = null;
          try { raw = S.scoring && S.scoring.prob ? S.scoring.prob(p, k, c.line, opp) : null; } catch(e){}
          var prob = (raw != null && isFinite(raw)) ? calibrate(key, raw)
                   : vals.slice(0,10).filter(function(v){ return v > c.line; }).length / Math.min(10, vals.length);
          if (!(prob > 0)) return;
          // Tail guard: at a $251 rung the book implies 0.4%. A model claiming 15% there is not
          // finding value, it is extrapolating past the end of its data. Anything claiming more
          // than four times the market's own number is thrown out rather than sold as a longshot.
          var implied = 1 / c.price;
          if (prob > Math.min(0.97, implied * 4)) return;
          var ev = prob * (c.price - 1) - (1 - prob);
          var fair = novigFair(key, p.name, k, c.line, 'over');
          var l10 = vals.slice(0, 10), hits = l10.filter(function(v){ return v > c.line; }).length;
          var hHit = h2h.filter(function(v){ return v > c.line; }).length;
          var why = [], ok2 = false;
          if (mode === 'safe'){
            ok2 = (hits === l10.length && l10.length >= 5);
            why = [hits+'/'+l10.length+' last '+l10.length];
          } else if (mode === 'value'){
            var edge = fair != null ? prob - fair : prob - 1/c.price;
            ok2 = edge >= 0.03;
            why = [(edge*100).toFixed(0)+'% over '+(fair != null ? 'fair' : 'the quote')];
          } else if (mode === 'lotto'){
            ok2 = c.price >= 3 && prob >= 0.15;
            why = [Math.round(prob*100)+'% at $'+c.price.toFixed(2)];
          } else if (mode === 'hist'){
            ok2 = h2h.length >= 2 && hHit / h2h.length >= 0.75 && h2h[0] > c.line;
            why = [hHit+'/'+h2h.length+' v '+abbrOf(key, opp), 'landed last meeting'];
          } else if (mode === 'match'){
            var l5 = vals.slice(0, 5);
            var l5avg = l5.reduce(function(a,b){ return a+b; }, 0) / Math.max(1, l5.length);
            ok2 = !!dr && dr.pct >= 8 && l5avg > c.line;
            why = dr ? ['+'+dr.pct.toFixed(0)+'% DVP', 'L5 '+l5avg.toFixed(1)] : [];
          }
          if (!ok2) return;
          var rank = mode === 'lotto' ? prob * c.price : (mode === 'safe' ? c.price : ev);
          if (!best || rank > best.rank)
            best = { key:key, p:p, mkt:k, label:m[1], line:c.line, price:c.price, book:c.book,
                     prob:prob, ev:ev, opp:opp, team:team, why:why, rank:rank,
                     id:key+'|'+p.name+'|'+k+'|'+c.line };
        });
      });
      if (best) out.push(best);
    });
  });
  out.sort(function(a,b){ return b.rank - a.rank; });
  return out.slice(0, MB_MAX_CARDS);
}
function mbToLeg(c){
  return cmbLeg(c.key, c.p, [c.mkt, c.label], c.line, 'over');
}
// Greedy on correlated joint EV: each addition is judged on what it does to the WHOLE multi,
// so a second leg from the same team has to earn its correlation.
function mbAuto(cands, want){
  var picked = [], pool = cands.slice(0, 10);
  for (var step=0; step<want && pool.length; step++){
    var bestIdx = -1, bestVal = -Infinity;
    for (var i=0;i<pool.length;i++){
      var trial = picked.concat([pool[i]]).map(mbToLeg).filter(function(l){ return l.prob != null; });
      if (trial.length !== picked.length + 1) continue;
      var joint = cmbJoint(trial);
      if (joint == null) continue;
      var price = trial.reduce(function(a,l){ return a * (l.price || 1); }, 1);
      var val = joint * price - 1;                       // EV per unit staked on the whole multi
      if (val > bestVal){ bestVal = val; bestIdx = i; }
    }
    if (bestIdx < 0) break;
    picked.push(pool[bestIdx]);
    pool.splice(bestIdx, 1);
  }
  return picked;
}

/* SIGNALS MULTI ------------------------------------------------------------------
   Every Degen Signal that fired on the fixture, each WATERED DOWN: the signal says a player is
   live, so take a safer rung of the same market rather than the line the signal flagged. That
   trades price for strike rate, which is what a multi needs - a four-leg multi at 90% per leg
   lands two times in three; at 65% per leg, fewer than one in five.

   The watered rung is the highest line his last ten still clear at 90%+, never below $1.15 and
   never HIGHER than the line the signal fired on. One leg per player; the source signal rides
   along so you can see why each leg is there.                                                 */
var SM_STRIKE = 0.9, SM_FLOOR = 1.15;
function smWater(key, name, mkt, sigLine){
  var S = state.sports[key];
  var logs = sortLogsDesc(((S.idx.logsByName || {})[name] || []).slice());
  var vals = [];
  logs.forEach(function(r){ var v = statOf(key, r, mkt); if (v != null) vals.push(v); });
  var l10 = vals.slice(0, 10);
  if (l10.length < 5) return null;
  var cands = streakCandidates(key, name, mkt)
    .filter(function(c){ return c.price >= SM_FLOOR && (sigLine == null || c.line <= sigLine + 1e-9); });
  for (var i=0;i<cands.length;i++){                      // hardest first
    var c = cands[i];
    var hits = l10.filter(function(v){ return v > c.line; }).length;
    if (hits / l10.length >= SM_STRIKE)
      return { line:c.line, price:c.price, book:c.book, hits:hits, n:l10.length };
  }
  return null;
}
function signalLegs(key, g){
  var S = state.sports[key], raw = [];
  var add = function(src, name, mkt, label, line){
    var p = (S.idx.byName || {})[name];
    if (p) raw.push({ src:src, name:name, p:p, mkt:mkt, label:label, sigLine:line });
  };
  try { (ouSignals(key, g, 'over') || []).forEach(function(r){ add('Green Light', r.name, r.mkt, r.label, r.line); }); } catch(e){}
  try { streakers(key, g).forEach(function(r){ add('Streaker', r.name, r.mkt, r.label, r.line); }); } catch(e){}
  try { eliteMatchups(key, g).forEach(function(r){
      if (r.entry) add('Elite Matchup', r.name, r.mkt, r.label, r.entry.line); }); } catch(e){}
  try { h2hSignals(key, g, 'bunny').forEach(function(r){ add('Bunny', r.name, r.mkt, r.label, r.line); }); } catch(e){}
  if (WRAP_CFG[key]){
    try { tackleMachines(key, g).rows.forEach(function(r){ add('Tackle Machine', r.name, 'tackles', 'Tackles', r.line); }); } catch(e){}
  }
  if (key === 'nfl'){
    try { nflChunk(key, g).rows.forEach(function(r){ add('Chunk Play', r.name, r.def.k, r.def.l, r.line - 0.5); }); } catch(e){}
  }
  var out = [], seen = {};
  raw.forEach(function(x){
    if (seen[x.name]) return;                             // one leg per player
    var w = smWater(key, x.name, x.mkt, x.sigLine);
    if (!w) return;
    seen[x.name] = 1;
    out.push({ src:x.src, name:x.name, p:x.p, mkt:x.mkt, label:x.label, sigLine:x.sigLine,
               line:w.line, price:w.price, book:w.book, hits:w.hits, n:w.n,
               team:x.p.team });
  });
  out.sort(function(a,b){ return (b.hits/b.n) - (a.hits/a.n) || b.price - a.price; });
  return out;
}
function signalsMultiPanel(key, g){
  var legs = signalLegs(key, g);

    return '<div class="empty" style="padding:18px">No Degen Signal on this fixture waters down to a '

  var drop = state.view.smDrop || {};
  var kept = legs.filter(function(l){ return !drop[l.name]; });

    .filter(function(l){ return l && l.prob != null; });
  var comb = kept.reduce(function(a,l){ return a * l.price; }, 1);
  var joint = (kept.length > 1 && built.length === kept.length) ? cmbJoint(built) : null;
  if (joint != null && (!isFinite(joint) || joint <= 0)) joint = null;
  return '<div class="cmb-corr" style="margin:0 0 8px">Every signal that fired on this game, stepped down to '
    + 'the highest rung its last ten clear '+Math.round(SM_STRIKE*100)+'%+ of the time. Tap \u00d7 to drop a leg.</div>'
    + legs.map(function(l){

          + '<span class="deja-px">$'+l.price.toFixed(2)+'</span>'
          + '<button class="cmb-leg-x" onclick="LAB.smDrop(\'' + esc(l.name).replace(/'/g,"\\'") + '\')">'
          + (off ? '+' : '&times;')+'</button></div>';
      }).join('')
    + '<div class="deja-sum">'
      + '<div class="cmb-sum-row"><span>'+kept.length+' legs at the book</span><b>$'+comb.toFixed(2)+'</b></div>'
      + (joint != null ? '<div class="cmb-sum-row"><span>Correlated model</span><b>'+cmbOdds(joint)+'</b></div>'
        + '<div class="cmb-sum-row tot"><span>Edge</span><b class="'+(comb*joint - 1 > 0 ? 'cmb-vscore good' : 'cmb-vscore bad')
        + '" style="font-size:14px">'+((comb*joint - 1) > 0 ? '+' : '')+Math.round((comb*joint - 1)*100)+'%</b></div>' : '')
      + (kept.length ? '<button class="pc-add" onclick="LAB.smAdd()">Send to Check My Multi</button>' : '')
    + '</div>';
}
function mbPanel(){

  var selIdx = Math.min(v.mbFix || 0, fixes.length - 1), f = fixes[selIdx];

            + '</span></div>'

            + '<button class="cmb-leg-x" onclick="LAB.cmbDrop('+i+')">&times;</button></div>';
        }).join('') : '<div class="empty" style="padding:18px">No legs yet. Add one above.</div>')
      + (legs.length ? (function(){
          var vsOpp = cmbTogether(legs, true), allG = cmbTogether(legs, false);
          var pctOf = function(t){ return t && t.n ? Math.round(t.hit/t.n*100)+'%' : '\u2014'; };
          var strip = function(t){
            if (!t || !t.rows.length) return '';
            return '<div class="cmb-hist-strip">'+t.rows.map(function(r){
              return '<span class="cmb-hist-pip '+(r.all ? 'on' : '')+'" title="'+esc(r.k)+'">'

              + '</b></div>'

            + '<div class="cmb-sum">';
        })()
          + '<div class="cmb-sum-row"><span>Independent (wrong, for reference)</span><b>'
            + cmbOdds(isFinite(indep) ? indep : null)+'</b></div>'
          + '<div class="cmb-sum-row"><span>Correlated model</span><b>'

          + '<div class="cmb-corr">Legs in the same match move together, so the independent product '

  return '<div class="cmb-overlay" onclick="if(event.target===this)LAB.cmbClose()">'

/* STATS: Scanner / Teams / DVP -------------------------------------------------
   The three boards the old tool had, minus Compare. Scanner is the sortable player table
   with a search box and position pills; Teams is the for/allowed grid; DVP is a position's
   full column set per team. All read through statOf / leagueAvg / dvpBoard, so the numbers
   agree with every tile and the player card.                                                 */
var STATS_SUBS = [['scanner','Scanner','ti-table'],['teams','Teams','ti-shield'],['dvp','DVP','ti-shield-half']];

/* Window filter for the Scanner. Defaults to the current season - that is the question
   people are actually asking - but a season two games old says almost nothing, so when the
   fullest sample in the league is under four games the board falls back to all games on file
   and says so rather than showing a near-empty table.                                        */
var ST_WINDOWS = [['season','Season'],['l10','L10'],['l5','L5'],['all','All']];
function windowAvg(key, mkt, win){
  var S = state.sports[key];
  S.idx.winAvg = S.idx.winAvg || {};
  var ck = mkt+'|'+win;
  if (S.idx.winAvg[ck]) return S.idx.winAvg[ck];
  var season = curSeason(key), byName = S.idx.logsByName || {}, out = {}, maxThis = 0;
  if (win === 'season'){
    Object.keys(byName).forEach(function(n){
      var c = 0;
      byName[n].forEach(function(r){
        if ((+(r.Year||r.year)||0) !== season) return;
        if (statOf(key, r, mkt) != null) c++;
      });
      if (c > maxThis) maxThis = c;
    });
  }
  var thin = (win === 'season') && maxThis < 4;
  Object.keys(byName).forEach(function(n){
    var rows = byName[n];
    if (win === 'season' && !thin) rows = rows.filter(function(r){ return (+(r.Year||r.year)||0) === season; });
    else if (win === 'l10' || win === 'l5'){
      rows = sortLogsDesc(rows.slice()).filter(function(r){ return statOf(key, r, mkt) != null; })
        .slice(0, win === 'l10' ? 10 : 5);
    }
    var sum = 0, cnt = 0;
    rows.forEach(function(r){ var v = statOf(key, r, mkt); if (v == null) return; sum += v; cnt++; });
    if (cnt) out[n] = { avg:sum/cnt, games:cnt };
  });
  out._thin = thin;
  return (S.idx.winAvg[ck] = out);
}

/* Headshots where a source actually exists. NFL has ESPN ids on 1,688 of 2,173 players, EPL a
   Premier League photo code on all 662, MLB an id that resolves against its own CDN (production
   never used that one). AFL ships no id, so it gets initials rather than a broken image.
   Any image that 404s swaps itself for initials, so a dead id never leaves a hole in a row.   */
var IMG_SPORTS = { nfl:1, epl:1, mlb:1 };
function playerImgUrl(key, p){
  if (!p) return '';
  if (key === 'nfl' && p.espnId) return 'https://a.espncdn.com/i/headshots/nfl/players/full/'+p.espnId+'.png';
  if (key === 'epl' && p.code)   return 'https://resources.premierleague.com/premierleague/photos/players/110x140/p'+p.code+'.png';
  if (key === 'mlb' && p.id)     return 'https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/'+p.id+'/headshot/67/current';
  return '';
}
function playerInitials(nm){
  var parts = String(nm || '').replace(/[^A-Za-z .'-]/g, '').split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return ((parts[0][0] || '') + (parts.length > 1 ? (parts[parts.length-1][0] || '') : '')).toUpperCase();
}
function playerImgP(key, nameOrP, size){
  var p = (typeof nameOrP === 'string')
    ? ((state.sports[key].idx.byName || {})[nameOrP] ||
       cmbPool(key).filter(function(x){ return x.name === nameOrP; })[0])
    : nameOrP;
  var nm = (typeof nameOrP === 'string') ? nameOrP : (p && p.name);
  if (!IMG_SPORTS[key] || !nm) return '';
  var sz = size || 30;
  var ini = '<span class="pimg-ini" style="width:'+sz+'px;height:'+sz+'px;font-size:'
    + Math.round(sz*0.38)+'px">'+esc(playerInitials(nm))+'</span>';
  var url = playerImgUrl(key, p);
  if (!url) return ini;
  // the fallback markup goes inside a double-quoted attribute, so its own quotes have to be
  // entities - otherwise the attribute terminates early and a dead headshot stays broken
  var iniAttr = ini.replace(/"/g, '&quot;').replace(/'/g, "\\'");
  return '<span class="pimg" style="width:'+sz+'px;height:'+sz+'px"><img src="'+esc(url)+'" alt="" '
    + 'loading="lazy" onerror="this.parentNode.outerHTML=\''+iniAttr+'\'"></span>';
}
function stCols(key){
  var cfg = state.sports[key].config || {};
  return (cfg.pcStats || cfg.oddsMkts || cfg.dvpStats || []).slice(0, 8);
}
function stSortRows(rows, sortKey, dir){
  return rows.sort(function(a,b){
    var x = a.vals[sortKey], y = b.vals[sortKey];
    if (x == null) return 1;
    if (y == null) return -1;
    return (x - y) * dir;
  });
}
function scannerView(key){
  var S = state.sports[key], v = state.view;
  var cols = stCols(key);
  if (!cols.length) return secNote('Scanner', SPORTS[key].name+' config.js lists no stat columns.');
  var positions = [''].concat(((S.config || {}).posOrder || []));
  var posF = v.stPosF || '';
  var q = String(v.stQ || '').trim().toLowerCase();
  var win = v.stWin || 'season';
  var thin = false;
  var rows = (S.idx.players || []).map(function(p){
    var vals = {}, any = false, games = 0;
    cols.forEach(function(c){
      var board = windowAvg(key, c[0], win);
      if (board._thin) thin = true;
      var e = board[p.name];
      vals[c[0]] = e && e.games >= 1 ? e.avg : null;
      if (vals[c[0]] != null){ any = true; if (e.games > games) games = e.games; }
    });
    return any ? { p:p, vals:vals, games:games } : null;
  }).filter(Boolean);
  if (posF) rows = rows.filter(function(r){ return (r.p.position || r.p.pos) === posF; });
  if (q) rows = rows.filter(function(r){
    return r.p.name.toLowerCase().indexOf(q) >= 0 || String(r.p.team||'').toLowerCase().indexOf(q) >= 0; });
  var sortKey = v.stSort || cols[0][0], dir = v.stDir === 1 ? 1 : -1;
  rows = stSortRows(rows, sortKey, dir).slice(0, 200);
  var th = function(k, l){
    return '<th class="'+(sortKey===k?'on':'')+'" onclick="LAB.stSort(\''+k+'\')">'+esc(l)
      + (sortKey===k ? (dir < 0 ? ' \u25be' : ' \u25b4') : '')+'</th>'; };
  var h = '<div class="sc-filter"><input id="stSearch" placeholder="Search player or team\u2026" '
    + 'value="'+esc(v.stQ||'')+'" oninput="LAB.stQ(this.value)" autocomplete="off"></div>'
    + '<div class="sl-bar">'+positions.map(function(p2){
        return '<button class="sl-chip'+(posF===p2?' on':'')+'" onclick="LAB.stPosF(\''+esc(p2)+'\')">'
          + esc(p2 || 'All')+'</button>'; }).join('')
      + '<span class="sl-win">'+ST_WINDOWS.map(function(w){
          return '<button class="sl-chip'+(win===w[0]?' on':'')+'" onclick="LAB.stWin(\''+w[0]+'\')">'
            + w[1]+'</button>'; }).join('')+'</span></div>';
  if (!rows.length) return h + '<div class="empty"><i class="ti ti-search-off"></i>No players match.</div>';
  h += '<div class="st-wrap" id="stTbl"><table class="st-t"><thead><tr><th>Player</th>'
    + '<th class="'+(sortKey==='games'?'on':'')+'" onclick="LAB.stSort(\'games\')">GP</th>'
    + cols.map(function(c){ return th(c[0], c[1]); }).join('')+'</tr></thead><tbody>'
    + rows.map(function(r){
        var face = playerImgP(key, r.p, 24);
        return '<tr onclick="LAB.player(\''+key+'\',\''+esc(r.p.name).replace(/'/g,"\\'")+'\')">'
          + '<td class="nm"><span class="st-team">'+(face || '')
          + '<span><b>'+esc(r.p.name)+'</b><span class="sub">'
          + esc([posShortP(r.p), abbrOf(key, r.p.team)].filter(Boolean).join(' \u00b7 '))
          + '</span></span></span></td>'
          + '<td>'+r.games+'</td>'
          + cols.map(function(c){
              var val = r.vals[c[0]];
              return '<td>'+(val == null ? '\u2014' : (val < 3 ? val.toFixed(2) : val.toFixed(1)))+'</td>';
            }).join('')+'</tr>';
      }).join('')+'</tbody></table></div>'
    + '<div class="cmb-corr">'+rows.length+' shown \u00b7 per-game from gamelogs \u00b7 '
    + (win === 'season' ? (thin ? 'season is too young to rank on, so this is all games on file'
                                : 'this season')
       : (win === 'all' ? 'all games on file' : 'last '+(win === 'l10' ? 10 : 5)+' games'))
    + '. Tap a row for the full read.</div>';
  return h;
}
function teamsView(key){
  var S = state.sports[key], v = state.view;
  var teams = asArray(S.data.teams_form) || asArray(S.data.teams) || [];
  if (!teams.length) return secNote('Teams', 'teams.json returned nothing for '+SPORTS[key].name+'.');
  var cols = ((S.config || {}).teamCols || stCols(key)).slice(0, 10);

  // does this file even carry the allowed side?
  var hasAllowed = teams.some(function(t){ return cols.some(function(c){ return t[c[0]+'_a'] != null; }); });
  var sortKey = (v.stTeamSort && cols.some(function(c){ return c[0] === v.stTeamSort; })) ? v.stTeamSort : cols[0][0];
  var rows = teams.slice().sort(function(a,b){ return (+b[sortKey+suf]||0) - (+a[sortKey+suf]||0); });
  var avg = {};
  cols.forEach(function(c){
    avg[c[0]] = rows.reduce(function(a,t){ return a + (+t[c[0]+suf]||0); }, 0) / rows.length;
  });
  var h = '<div class="st-bar"><span class="st-seg">'
    + '<button class="'+(!allowed?'on':'')+'" onclick="LAB.stAllowed(false)">For</button>'
    + '<button class="'+(allowed?'on':'')+'" onclick="LAB.stAllowed(true)">Allowed</button></span></div>';
  if (allowed && !hasAllowed)
    return h + secNote('Teams', SPORTS[key].name+'\u2019s team file carries no \u201callowed\u201d columns, '
      + 'so only the team\u2019s own output can be shown.');
  h += '<div class="cmb-corr" style="margin:0 0 7px">'
    + (allowed ? 'Average conceded to opponents \u2014 higher is a softer defence.'
               : 'The team\u2019s own per-game output.')+'</div>'
    + '<div class="st-wrap"><table class="st-t"><thead><tr><th>Team</th><th>GP</th>'
    + cols.map(function(c){
        return '<th class="'+(sortKey===c[0]?'on':'')+'" onclick="LAB.stTeamSort(\''+c[0]+'\')">'
          + esc(c[1])+(sortKey===c[0]?' \u25be':'')+'</th>'; }).join('')+'</tr></thead><tbody>'
    + rows.map(function(t){
        return '<tr><td class="nm"><span class="st-team">'+teamLogo(key, t.team)
          + '<span>'+esc(teamFullName(key, t.team))+'</span></span></td>'
          + '<td>'+(t.matches || 0)+'</td>'
          + cols.map(function(c){
              var val = +t[c[0]+suf] || 0, a = avg[c[0]];
              var d = a ? (val - a) / a * 100 : 0;
              var cls = Math.abs(d) < 4 ? '' : (d > 0 ? 'hi' : 'lo');
              return '<td class="'+cls+'">'+(val < 3 ? val.toFixed(2) : val.toFixed(1))+'</td>';
            }).join('')+'</tr>';
      }).join('')+'</tbody></table></div>';
  return h;
}
function dvpView(key){
  var S = state.sports[key], v = state.view;
  var stats = ((S.config || {}).dvpStats || (S.config || {}).oddsMkts || []).slice(0, 8);
  // drop columns the position never records: a GK has no shots, a DB has no receiving yards
  var posProbe = { position: (v.stPos && v.stPos[key]) || null };
  if (posProbe.position){
    var lim = posMarkets(key, posProbe, stats);
    if (lim.length) stats = lim;
  }
  var raw = asArray(S.data.dvp) || [];
  if (!stats.length || !raw.length)
    return secNote('DVP', 'dvp.json returned nothing for '+SPORTS[key].name+'.');
  var positions = [];
  ((S.config || {}).posOrder || []).forEach(function(p2){
    if (raw.some(function(r){ return r.pos === p2; })) positions.push(p2); });
  raw.forEach(function(r){ if (r.pos && positions.indexOf(r.pos) < 0) positions.push(r.pos); });
  // default to the position with the most teams carrying data, not posOrder[0]
  var count = {};
  positions.forEach(function(p2){
    count[p2] = raw.filter(function(r){ return r.pos === p2 && stats.some(function(c){ return r[c[0]] != null; }); }).length; });
  var fullest = positions.slice().sort(function(a,b){ return count[b] - count[a]; })[0];
  var pos = (v.stPos && v.stPos[key] && positions.indexOf(v.stPos[key]) >= 0) ? v.stPos[key] : fullest;
  var sortKey = (v.stDvpSort && stats.some(function(c){ return c[0] === v.stDvpSort; })) ? v.stDvpSort : stats[0][0];
  // one row per club, collapsed on the normalised name, and only clubs playing this season -
  // the same restriction dvpBoard applies, so the grid and the ranks agree
  var current = S.idx.teamMapN && Object.keys(S.idx.teamMapN).length ? S.idx.teamMapN : null;
  var seen = {}, rows = [];
  raw.filter(function(r){ return r.pos === pos && (!current || current[normTeam(r.team)]); }).forEach(function(r){
    var k2 = normTeam(r.team);
    if (seen[k2]){

// A rolling week. AFL/NFL/EPL/MLB builds only ever write the coming round, so the page never
// needed a window - NBL and NHL write the whole season (161 and 1,344 games) and flooded it.
// The window is per sport: the next 7 days, or - if that sport's next game is further out, as
// NHL's opener is in preseason - just its next game day, so a sport never disappears entirely.
var FIX_DAYS = 7;
function fixtureHorizon(k){
  var now = Date.now(), first = null;
  (asArray(state.sports[k].data.fixture) || []).forEach(function(g){
    if (!g || !g.home || !g.away) return;
    var ms = gameStart(g).ms;
    if (ms == null || gameDone(k, g, ms)) return;
    if (first == null || ms < first) first = ms;
  });
  var week = now + FIX_DAYS * 864e5;
  return first != null && first > week ? first + 864e5 : week;
}
function inFixtureWindow(k, g, horizon){
  var ms = gameStart(g).ms;
  return ms == null || ms <= horizon;                 // undated rows stay: better shown than lost
}
function allGames(){
  var out = [];
  Object.keys(SPORTS).forEach(function(k){
    if (!state.view.active[k]) return;
    var fx = asArray(state.sports[k].data.fixture) || [];
    var horizon = fixtureHorizon(k);
    fx.forEach(function(g, idx){
      if (!g || !g.home || !g.away) return;
      var st = gameStart(g);
      var done = gameDone(k, g, st.ms);
      if (done && !state.view.showDone) return;        // yesterday's games drop off by default
      if (!done && !inFixtureWindow(k, g, horizon)) return;
      out.push({ sport:k, g:g, ms:st.ms, hasTime:st.hasTime, done:done, i:idx });
    });
  });
  return out.sort(function(a,b){
    if (a.ms == null) return 1;
    if (b.ms == null) return -1;
    return a.ms - b.ms;
  });
}

/* DEGEN CREW -----------------------------------------------------------------------
   Every signal across the slate on one page: the universal tiles first (the shared engine every
   sport runs), then each sport's own tiles. Built by running each upcoming fixture's signals in
   capture mode and merging rows by tile. Each sport covers its next 36 hours of games (or its
   next game day if that's further out), and results are cached until that sport's odds, data or
   fixture list change.                                                                          */
var CREW_HOURS = 36, CREW_SHOW = 8;
var CREW_UNIVERSAL = ['Green Lights','Death Riders','Streakers','Elite Matchups','Let\u2019s Climb',
                      'Tackle Machines','Bunnies','Bogey','Form Alerts'];
function crewGames(k){
  var S = state.sports[k], now = Date.now(), first = null, out = [];
  (asArray(S.data.fixture) || []).forEach(function(g, i){
    if (!g || !g.home || !g.away) return;
    var ms = gameStart(g).ms;
    if (ms == null || gameDone(k, g, ms)) return;
    if (first == null || ms < first) first = ms;
    out.push({ g:g, ms:ms, i:i });
  });
  var hz = first == null ? now : Math.max(now + CREW_HOURS * 36e5, first + 864e5);
  // a signal is about a player's NEXT game: MLB clubs play daily, so a 36-hour window holds two
  // games for most of them and every row appeared twice. Keep each club's first fixture only.
  var seen = {};
  return out.filter(function(x){ return x.ms <= hz; }).sort(function(a,b){ return a.ms - b.ms; })
    .filter(function(x){
      var h = normTeam(x.g.home), a = normTeam(x.g.away);
      if (seen[h] || seen[a]) return false;
      seen[h] = seen[a] = 1; return true;
    });
}
function crewSig(k){
  var S = state.sports[k], od = S.data.odds || {};
  return [S.t3, S.t2, od.updated || '', (asArray(S.data.fixture) || []).length,
          (asArray(S.data.lineups) || []).length, (asArray(S.data.injury) || []).length].join('|');
}
function crewCapture(k){
  var S = state.sports[k];
  state.crewCache = state.crewCache || {};
  var sig = crewSig(k), c = state.crewCache[k];
  if (c && c.sig === sig) return c;
  var tiles = {}, order = [], games = crewGames(k);
  games.forEach(function(x){
    SIG_CAPTURE = []; SIG_PHASE = 'u';
    try { signalsSection(k, x.g); } catch(e){ /* one bad fixture must not blank the page */ }
    var got = SIG_CAPTURE; SIG_CAPTURE = null; SIG_PHASE = 'u';
    got.forEach(function(t){
      var id = t.phase + '|' + t.title;
      if (!tiles[id]){ tiles[id] = { phase:t.phase, icon:t.icon, title:t.title, desc:t.desc, rows:[], why:t.why }; order.push(id); }
      tiles[id].seen = tiles[id].seen || {};
      t.rows.forEach(function(h){
        if (tiles[id].seen[h]) return;
        tiles[id].seen[h] = 1;
        var m = String(h).match(/class="gl-ev[^"]*">\s*([+-]?\d+(?:\.\d+)?)%/);
        tiles[id].rows.push({ k:k, html:h, edge:m ? +m[1] : null, ms:x.ms });
      });
    });
  });
  return (state.crewCache[k] = { sig:sig, games:games.length, tiles:order.map(function(id){ return tiles[id]; }) });
}
function crewRowsSorted(rows){
  return rows.slice().sort(function(a,b){
    if (a.edge != null && b.edge != null) return b.edge - a.edge;     // best edge first
    if (a.edge != null) return -1; if (b.edge != null) return 1;
    return a.ms - b.ms;                                               // otherwise soonest first
  });
}
function crewTile(t, sportLabels){
  var id = (t.sport || 'u') + '|' + t.title, open = (state.view.crewOpen || {})[id];
  var rows = crewRowsSorted(t.rows), shown = open ? rows : rows.slice(0, CREW_SHOW);

    return '<div class="crew-row">'+(sportLabels ? '<span class="crew-sp">'+esc(SPORTS[r.k].name)+'</span>' : '')+r.html+'</div>';
  });
  if (rows.length > CREW_SHOW)
    html.push('<button class="crew-more" onclick="LAB.crewMore(\'' + esc(id).replace(/'/g,"\\'") + '\')">'
      + (open ? 'Show top '+CREW_SHOW : 'Show all '+rows.length)+'</button>');
  // the badge counts rows passed in, which includes the Show-all button - put the real total back
  return sigTile(t.icon, t.title, t.desc, html, t.why)
    .replace(/<span class="sig-n">\d+<\/span>/, '<span class="sig-n">'+rows.length+'</span>');
}

// per-sport / Degenerates, exactly like the old tool's crew. Degenerates used to be its own tab;

function crewPage(){

  var f = state.view.crewSport || 'all';
  if (f !== 'all' && active.indexOf(f) < 0) f = 'all';
  var show = f === 'all' ? active : [f];
  if (!active.length) return crewHead(f, active) + '<div class="empty">Switch on a sport to see its signals.</div>';

  var open = state.view.crewTile || null;
  // Degenerates run on their own scope (Mixed or one sport) and their own loader
  if (open && open.indexOf('deg:') === 0){
    var which = open.slice(4);
    // the crew's own filter drives the build's scope: All = mixed, a sport = that sport. Two
