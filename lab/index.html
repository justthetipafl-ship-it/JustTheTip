<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Just The Tip — Lab</title>
<link rel="icon" href="/AFL/assets/jtt-check.png">
<link rel="apple-touch-icon" href="/AFL/assets/jtt-check.png">
<meta name="theme-color" content="#0a0c0f">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  :root{
    --bg:#0a0c0f; --surface:#11151a; --surface-2:#161b22; --surface-3:#1d242e;
    --border:#242c37; --text:#e8eaed; --text-2:#aab3bf; --text-3:#6b7684;
    --accent:#22c55e;
    --font-display:'Archivo Black',system-ui,sans-serif;
    --font-mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--text);max-width:100%;overflow-x:hidden;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.45;}
  .wrap{max-width:900px;width:100%;margin:0 auto;padding:0 12px 60px;}
  .cmb-tab{min-width:0;}

  /* ---- header ---- */
  .hdr{position:sticky;top:0;z-index:20;background:rgba(10,12,15,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:10px 0;margin-bottom:12px;}
  .hdr-in{max-width:900px;margin:0 auto;padding:0 12px;display:flex;align-items:center;gap:10px;}
  .logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.3px;}
  .brand-img{width:28px;height:28px;border-radius:50%;display:block;flex-shrink:0;}
  .brand-fallback{display:none;align-items:center;}
  .brand-fallback i{color:var(--accent);font-size:22px;}
  .brand-text{white-space:nowrap;}
  .lab-tag{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--accent);border-radius:4px;padding:1px 5px;}
  .hdr-status{margin-left:auto;font-size:10px;color:var(--text-3);font-family:var(--font-mono);}

  /* ---- sport filter ---- */
  .sports{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .sport-b{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.04em;
    text-transform:uppercase;padding:7px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-3);cursor:pointer;transition:.12s;}
  .sport-b.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
  .sport-b .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);}
  .sport-b.on .dot{background:var(--accent);}
  .sport-b.loading .dot{background:#eab308;animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.3}}

  /* ---- day grouping ---- */
  .dayband{display:flex;align-items:center;gap:9px;margin:18px 0 9px;}
  .dayband>span{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);white-space:nowrap;}
  .dayband:after{content:'';flex:1;height:1px;background:var(--border);}

  /* ---- fixture card (NFL style) ---- */
  .fxr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:11px;
    padding:11px 12px;margin-bottom:7px;cursor:pointer;transition:border-color .12s;}
  .fxr:hover{border-color:var(--accent);}
  .fxr-team{text-align:center;min-width:0;}
  .fxr-logo{width:40px;height:40px;object-fit:contain;display:block;margin:0 auto 4px;}
  .fxr-logo-ph{width:40px;height:40px;border-radius:50%;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center;margin:0 auto 4px;
    font-family:var(--font-display);font-size:13px;color:var(--text-3);}
  .fxr-name{font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fxr-rec{font-size:10px;color:var(--text-3);font-family:var(--font-mono);margin-top:2px;}
  .fxr-center{text-align:center;min-width:92px;}
  .fxr-ko-date{display:block;font-size:9px;color:var(--text-3);font-family:var(--font-mono);
    text-transform:uppercase;letter-spacing:.3px;line-height:1.3;}
  .fxr-ko-time{display:block;font-size:13px;font-weight:800;color:var(--text);line-height:1.25;}
  .fxr-vs{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-3);margin:3px 0;}
  .fxr-venue{font-family:var(--font-mono);font-size:9px;color:var(--text-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;margin:0 auto;}
  .fxr-badge{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    padding:1px 5px;border-radius:4px;margin-bottom:4px;}
  .fxr-done{opacity:.5;}

  /* Five tabs of uppercase text plus icons come to ~540px, wider than any phone. With no wrap or
     scroll that forced the whole PAGE wider than the viewport: the fixture cards, the tab bar and
     even the fixed Check My Bet overlay were all cut off at the right edge. The bar now scrolls,
     the labels tighten on a narrow screen, and the page itself can no longer overflow sideways. */
  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border);
    overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.04em;
    text-transform:uppercase;padding:9px 14px;border:0;background:none;color:var(--text-3);cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;flex:0 0 auto;white-space:nowrap;}
  @media(max-width:460px){
    .tab{padding:9px 7px;font-size:11px;gap:4px;letter-spacing:.01em;}
    .tab i{display:none;}                       /* the words matter more than the icons here */
  }
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);}
  .tab i{font-size:15px;}
  .mkt-chips{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 9px;}
  .mkt-chip{font-size:10px;font-weight:700;padding:5px 10px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-3);cursor:pointer;white-space:nowrap;}
  .mkt-chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
  .od-hd,.od-row{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:11px;}
  .od-hd{font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:800;
    border-bottom:1px solid var(--border);}
  .od-row{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:3px;}
  .od-nm{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .od-ln{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2);}
  .od-o,.od-u{min-width:46px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;}
  .od-o{color:var(--accent);}
  .od-u{color:var(--text-3);}
  .od-bk{min-width:68px;text-align:right;font-size:9px;color:var(--text-3);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .od-list{margin-bottom:6px;}
  .mt-chips{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px;}
  .mt-chip{font-size:9px;font-weight:700;letter-spacing:.03em;padding:5px 9px;border-radius:6px;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text-3);cursor:pointer;white-space:nowrap;}
  .mt-chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
  .od-tm{font-style:normal;font-size:9px;color:var(--text-3);margin-left:6px;text-transform:uppercase;}
  .od-det{margin-bottom:3px;}
  .od-det>summary{list-style:none;cursor:pointer;}
  .od-det>summary::-webkit-details-marker{display:none;}
  .od-det>summary .od-row{margin-bottom:0;}
  .od-det[open]>summary .od-row{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .alt-wrap{display:flex;flex-wrap:wrap;gap:4px;padding:7px 10px;background:var(--surface-2);
    border:1px solid var(--accent);border-top:0;border-radius:0 0 8px 8px;margin-bottom:3px;}
  .alt-rung{display:inline-flex;align-items:baseline;gap:4px;font-size:10px;font-variant-numeric:tabular-nums;
    background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:3px 7px;}
  .alt-rung b{font-weight:800;color:var(--text);}
  .alt-rung i{font-style:normal;font-size:8px;color:var(--text-3);text-transform:uppercase;}
  .alt-rung u{text-decoration:none;font-size:9px;color:var(--text-3);}
  .od-nm{cursor:pointer;}
  .od-nm:hover{color:var(--accent);}
  .pp-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;}
  .pp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(560px,94vw);
    max-height:82vh;display:flex;flex-direction:column;background:var(--surface);
    border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .pp-hd{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border);}
  .pp-nm{font-family:var(--font-display);font-weight:800;font-size:17px;}
  .pp-sub{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .pp-x{margin-left:auto;background:none;border:0;color:var(--text-3);font-size:24px;line-height:1;cursor:pointer;padding:0 2px;}
  .pp-body{overflow-y:auto;padding:12px 15px 16px;}
  .pp-mkt{margin-bottom:12px;}
  .pp-mk{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px;}
  .alt-rung{cursor:pointer;}
  .alt-rung.multi{border-color:var(--text-3);}
  .alt-rung:hover{border-color:var(--accent);}
  .od-bk{cursor:pointer;}
  .od-bk.multi:hover{color:var(--accent);}
  .od-bk u{text-decoration:none;color:var(--accent);font-size:8px;}
  .bk{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,92vw);
    max-height:76vh;display:flex;flex-direction:column;background:var(--surface);
    border:1px solid var(--border);border-radius:13px;overflow:hidden;}
  .bk-list{overflow-y:auto;padding:8px 10px 12px;}
  .bk-row{display:flex;align-items:center;gap:9px;padding:7px 9px;font-size:12px;
    border:1px solid var(--border);border-radius:8px;margin-bottom:3px;background:var(--surface-2);}
  .bk-row.top{border-color:var(--accent);}
  .bk-nm{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bk-o{min-width:46px;text-align:right;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
  .bk-u{min-width:46px;text-align:right;color:var(--text-3);font-variant-numeric:tabular-nums;}
  .bk-best{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);}
  .fx-back{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.05em;
    text-transform:uppercase;padding:6px 11px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-3);cursor:pointer;margin-bottom:12px;}
  .fx-back:hover{border-color:var(--accent);color:var(--accent);}
  .fx-hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 14px;margin-bottom:6px;}
  .fx-hero .fxr-logo,.fx-hero .fxr-logo-ph{width:54px;height:54px;}
  .fx-hero .fxr-name{font-size:16px;}
  .mo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:8px;margin-bottom:4px;}
  .mo-block{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;}
  .mo-lab{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:6px;}
  .mo-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;}
  .mo-t{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;min-width:0;}
  .mo-t .fxr-logo,.mo-t .fxr-logo-ph{width:18px;height:18px;margin:0;font-size:8px;}
  .mo-sp{font-weight:800;color:var(--text-2);font-variant-numeric:tabular-nums;}
  .mo-draw{color:var(--text-3);}
  .mo-o{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;min-width:44px;text-align:right;color:var(--text);}
  .mo-o.fav{color:var(--accent);}
  .mo-book{font-size:9px;color:var(--text-3);text-align:right;margin-bottom:8px;}
  .h2h-wrap{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;}
  .h2h-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-display);
    font-weight:800;font-size:12px;letter-spacing:.04em;padding-bottom:7px;margin-bottom:4px;border-bottom:1px solid var(--border);}
  .h2h-gp{font-family:var(--font-mono);font-size:8px;color:var(--text-3);font-weight:400;text-transform:uppercase;letter-spacing:.08em;}
  .h2h-row{display:flex;align-items:center;gap:9px;padding:5px 0;}
  .h2h-v{min-width:56px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-3);}
  .h2h-v.l{text-align:left;} .h2h-v.r{text-align:right;}
  .h2h-v.win{color:var(--accent);}
  .h2h-mid{flex:1;min-width:0;}
  .h2h-k{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);
    text-align:center;margin-bottom:3px;}
  .h2h-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--surface-3,var(--border));}
  .h2h-bar i{display:block;height:100%;}
  .h2h-bar .home{background:var(--accent);}
  .h2h-bar .away{background:#60a5fa;}
  .h2h-inv{font-style:normal;font-size:8px;color:var(--text-3);margin-left:3px;}
  .h2h-tabs{display:flex;align-items:center;gap:4px;margin-bottom:8px;}
  .h2h-tb{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;
    border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-3);cursor:pointer;}
  .h2h-tb.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
  .h2h-note{margin-left:auto;font-size:8px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
  .h2h-v{display:flex;flex-direction:column;gap:1px;}
  .h2h-v.r{align-items:flex-end;}
  .h2h-pc{font-size:8px;font-weight:700;letter-spacing:.02em;}
  .h2h-pc.up{color:#22c55e;} .h2h-pc.down{color:#f97316;} .h2h-pc.flat{color:var(--text-3);}
  .l5-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-bottom:6px;}
  .l5-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .l5-head{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
  .l5-head .fxr-logo,.l5-head .fxr-logo-ph{width:20px;height:20px;margin:0;font-size:8px;}
  .l5-nm{font-family:var(--font-display);font-size:12px;font-weight:800;letter-spacing:.02em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .l5-rec{margin-left:auto;font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-3);
    letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
  .l5-strip{display:flex;gap:3px;margin-bottom:8px;}
  .l5-chip{flex:1;text-align:center;font-size:9px;font-weight:800;padding:3px 0;border-radius:4px;
    background:var(--surface);border:1px solid var(--border);color:var(--text-3);}
  .l5-chip.W{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));
    background:color-mix(in srgb,var(--accent) 12%,transparent);}
  .l5-chip.L{color:#f97316;border-color:color-mix(in srgb,#f97316 40%,var(--border));
    background:color-mix(in srgb,#f97316 10%,transparent);}
  .l5-chip.D{color:#60a5fa;border-color:color-mix(in srgb,#60a5fa 40%,var(--border));
    background:color-mix(in srgb,#60a5fa 10%,transparent);}
  .l5-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;border-top:1px solid var(--border);}
  .l5-res{width:15px;height:15px;line-height:15px;text-align:center;border-radius:4px;font-size:8px;font-weight:800;flex:none;}
  .l5-res.W{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);}
  .l5-res.L{color:#f97316;background:color-mix(in srgb,#f97316 14%,transparent);}
  .l5-res.D{color:#60a5fa;background:color-mix(in srgb,#60a5fa 14%,transparent);}
  .l5-opp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);}
  .l5-ha{font-size:8px;font-weight:800;color:var(--text-3);letter-spacing:.06em;margin-right:4px;}
  .l5-ht{font-family:var(--font-mono);font-size:8px;color:var(--text-3);margin-left:5px;}
  .l5-sc{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;}
  .l5-mg{font-variant-numeric:tabular-nums;font-size:10px;font-weight:700;min-width:32px;text-align:right;color:var(--text-3);}
  .l5-mg.up{color:var(--accent);} .l5-mg.down{color:#f97316;}
  .l5-foot{display:flex;gap:10px;margin-top:8px;padding-top:7px;border-top:1px solid var(--border);
    font-family:var(--font-mono);font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);}
  .l5-foot b{font-family:var(--font-display);font-size:11px;color:var(--text-2);margin-left:3px;}
  .l5-none{font-size:10px;color:var(--text-3);padding:6px 0;}
  .sl-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:7px;}
  .sl-chip{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;
    border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-3);cursor:pointer;}
  .sl-chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
  .sl-win{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;min-width:0;}
  .sl-chip{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  .sl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-bottom:6px;}
  .sl-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .sl-head{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
  .sl-head .fxr-logo,.sl-head .fxr-logo-ph{width:20px;height:20px;margin:0;font-size:8px;}
  .sl-nm{font-family:var(--font-display);font-size:12px;font-weight:800;}
  .sl-mk{margin-left:auto;font-family:var(--font-mono);font-size:8px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--text-3);}
  .sl-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--border);cursor:pointer;}
  .sl-rk{width:12px;font-family:var(--font-mono);font-size:9px;color:var(--text-3);flex:none;}
  .sl-who{flex:1;min-width:0;}
  .sl-who b{display:block;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sl-who span{font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);}
  .sl-bars{width:56px;flex:none;}
  .sl-bar-t{height:4px;border-radius:2px;background:var(--surface-3,var(--border));overflow:hidden;}
  .sl-bar-t i{display:block;height:100%;background:var(--accent);}
  .sl-val{min-width:42px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;flex:none;}
  .sl-none{font-size:10px;color:var(--text-3);padding:6px 0;}

<body>
<div class="hdr"><div class="hdr-in">
  <span class="logo">
    <img class="brand-img" src="/AFL/assets/jtt-check.png" alt="JTT"
         onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'">
    <span class="brand-fallback"><i class="ti ti-circle-check-filled"></i></span>
    <span class="brand-text">Just The Tip</span><span class="lab-tag">Lab</span>
  </span>
  <span class="hdr-status" id="status">starting…</span>
</div></div>
<div class="wrap"><div id="app"><div class="boot">Loading fixtures…</div></div></div>

<script>
(function(){
'use strict';

/* ============================================================================
 * JTT LAB — multi-sport shell
 * ----------------------------------------------------------------------------
 * Differs from the production shell in exactly one way that matters: state is
 * NAMESPACED BY SPORT, so several sports can be in memory at once.
 *
 *     production:  state.data.players          (one sport, overwritten on switch)
 *     lab:         state.sports.nfl.data.players
 *
 * Data still lives in each sport's own folder and is fetched with the same
 * absolute paths (/nfl/data/...), so nothing on disk changes and the live tool
 * at /AFL/ is untouched.
 *
 * Loading is LAZY and tiered, because gamelogs are 75 of the ~99 MB total:
 *     tier 1 (always)   fixture, teams        ~0 MB  - enough for this page
 *     tier 2 (on need)  odds, players         ~12 MB
 *     tier 3 (on need)  gamelogs              ~75 MB - only when a signal needs it
 * ========================================================================== */

var SPORTS = {
  afl: { key:'afl', dir:'AFL', name:'AFL' },
  nfl: { key:'nfl', dir:'nfl', name:'NFL' },
  epl: { key:'epl', dir:'EPL', name:'EPL' },
  mlb: { key:'mlb', dir:'mlb', name:'MLB' },
  nbl: { key:'nbl', dir:'nbl', name:'NBL' },
  nhl: { key:'nhl', dir:'nhl', name:'NHL' }
};

var TIER1 = { fixture:'data/fixture.json', teams:'data/teams.json', meta:'data/meta.json' };

var state = {
  sports: {},                               // sports[key] = {data:{}, idx:{}, status:''}
  view:   { active: {}, tab: 'fixture', mkt: {}, match: {}, player: null, books: null, showDone: false, focus: null, h2hMode: 'for',
             slMkt: {}, slWin: 'season', dvpMkt: {}, ppTab: 'form',
             cmbQ: '', cmbSel: null, cmbRecent: [],
             cmbOpen: false, cmbMode: 'single', cmbLegs: [], cmbResult: null, cmbSugOff: false,
             cmbLadOpen: false, mbFix: 0, mbMode: 'signals', pc: null, ttWin: 10, smDrop: {},
             rdrPick: null, ulMk: 'snapPct', ulWin: 'l5',
             dvMeets: 3, dvLegs: 3, jMkt: null, jLine: 'auto', jSel: {},
             jHide: {}, jMin: null, jMax: null, jFocus: null, jVenue: 'venue',
             dvMkts: null, dvHail: false, dvDrop: {}, dvMin: null, dvMax: null, dvBook: null,
             stSport: null, stMode: 'scanner', stMkt: {}, stPos: {},
             stQ: '', stPosF: '', stWin: 'season', stSort: null, stDir: -1, stAllowed: false,
             stTeamSort: null, stDvpSort: null }   // filter + current page + market per sport
};
Object.keys(SPORTS).forEach(function(k){
  state.sports[k] = { data:{}, idx:{teamMap:{}}, status:'idle' };
  state.view.active[k] = true;              // all on by default
});

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function sportPath(key, p){ return '/'+SPORTS[key].dir+'/'+String(p).replace(/^[.\/]+/,''); }

/* ---- loading ------------------------------------------------------------ */
// Each sport's config.js assigns window.SPORT_CONFIG. That's a single global, so load them
// one at a time and snapshot the result into state.sports[key].config. This is also what
// makes logos work: every sport resolves them differently (CDN + id map, or a URL baked
// into teams.json) and the config already knows which.
var _cfgQueue = Promise.resolve();
function loadConfig(key){
  var S = state.sports[key];
  if (S.config) return Promise.resolve(S.config);
  _cfgQueue = _cfgQueue.then(function(){
    return new Promise(function(done){
      var prev = window.SPORT_CONFIG;
      var prevScoring = window.JTTScoring;
      window.SPORT_CONFIG = undefined;              // so a file that never sets it can be caught
      var el = document.createElement('script');
      el.src = sportPath(key, 'config.js') + '?v=' + (S.version || Date.now());
      var finish = function(failed){
        var got = window.SPORT_CONFIG;
        // A config.js that doesn't set SPORT_CONFIG used to fall through to {} silently, and
        // every section then reported "no markets" as if the sport simply had none. Say what
        // actually happened - including the case where a scoring file was uploaded over it.
        if (failed) S.configError = 'config.js failed to load';
        else if (!got || typeof got !== 'object'){
          S.configError = (window.JTTScoring && window.JTTScoring !== prevScoring)
            ? 'config.js contains a scoring engine, not a config - the file was replaced by mistake'
            : 'config.js loaded but never set SPORT_CONFIG';
        }
        S.config = (got && typeof got === 'object') ? got : {};
        window.SPORT_CONFIG = prev;                 // restore so nothing leaks between sports
        if (window.JTTScoring !== prevScoring) window.JTTScoring = prevScoring;
        done(S.config);
      };
      el.onload = function(){ finish(false); };
      el.onerror = function(){ finish(true); };
      document.head.appendChild(el);
    });
  });
  return _cfgQueue;
}
function configBanner(){
  var bad = Object.keys(SPORTS).filter(function(k){
    return state.view.active[k] && state.sports[k] && state.sports[k].configError; });
  if (!bad.length) return '';
  return bad.map(function(k){
    return '<div class="sec-note" style="border-color:#ef4444;margin:8px 0">'
      + '<i class="ti ti-alert-triangle" style="color:#ef4444"></i><span><b>'+esc(SPORTS[k].name)
      + ' is running without its config.</b> '+esc(state.sports[k].configError)
      + '. Every market list, DVP split and position filter for '+esc(SPORTS[k].name)
      + ' is empty until '+esc(SPORTS[k].dir)+'/config.js is restored.</span></div>';
  }).join('');
}
function loadTier1(key){
  var S = state.sports[key];
  if (S.status === 'ready' || S.status === 'loading') return Promise.resolve();
  S.status = 'loading'; render();
  // version.txt drives cache-busting, same as production
  return fetch(sportPath(key,'data/version.txt'), {cache:'reload'})
    .then(function(r){ return r.ok ? r.text() : ''; })
    .catch(function(){ return ''; })
    .then(function(v){
      var q = (v||'').trim() ? ('?v='+encodeURIComponent(v.trim())) : '';
      S.version = (v||'').trim();
      return Promise.all(Object.keys(TIER1).map(function(k){
        return fetch(sportPath(key, TIER1[k])+q, {cache:'reload'})
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(j){ if (j) S.data[k] = j; })
          .catch(function(){});
      }));
    })
    .then(function(){ buildTeamMap(key); return loadConfig(key); })
    .then(function(){
      buildTeamMap(key);
      S.status = 'ready';
      render();
      // Tier 1 finishing is itself a trigger: configs load through a sequential queue, so a
      // sport can become ready AFTER the user has already opened a page that needs tier 2.
      // Without this, whichever sport finished last (MLB) silently never loaded its odds.
      if (state.view.tab === 'odds') ensureTier2();
    });
}
function asArray(v){ return Array.isArray(v) ? v : (v && v.fixture) || (v && v.teams) || (v && v.players) || null; }
function buildTeamMap(key){
  var S = state.sports[key], m = {}, mN = {};
  (asArray(S.data.teams)||[]).forEach(function(t){
    if (!t || t.team == null) return;
    m[t.team] = t;
    mN[normTeam(t.team)] = t;                 // EPL's dvp.json says "Tottenham" where teams.json
  });                                          // says "Spurs" - an exact-match lookup loses the crest
  S.idx.teamMap = m; S.idx.teamMapN = mN;
}
// One resolver for every team lookup: exact first, then the normalised/aliased name.
function teamRec(key, t){
  var ix = state.sports[key].idx || {};
  return (ix.teamMap || {})[t] || (ix.teamMapN || {})[normTeam(t)] || {};
}

// Tier 2: odds (~12 MB across four sports) - loaded only when a page needs it, and only
// for sports the user actually has switched on. This is the whole point of the namespaced
// model: NFL's 4.6 MB doesn't get fetched because you glanced at the AFL odds.
var TIER2 = { odds:'data/odds.json', players:'data/players.json' };
function loadTier2(key){
  var S = state.sports[key];
  if (S.t2 === 'ready' || S.t2 === 'loading') return Promise.resolve();
  S.t2 = 'loading'; render();
  var q = S.version ? ('?v='+encodeURIComponent(S.version)) : '';
  return Promise.all(Object.keys(TIER2).map(function(k){
    return fetch(sportPath(key, TIER2[k])+q, {cache:'reload'})
      .then(function(r){ if (k === 'odds') S.oddsStatus = r.status; return r.ok ? r.json() : null; })
      .then(function(j){ if (j) S.data[k] = j; })
      .catch(function(){ if (k === 'odds') S.oddsStatus = 0; });
  })).then(function(){
    if (!S.data.odds){
      // A missing odds.json (404) is not "still loading": NHL has none until its odds workflow
      // exists, and the whole fixture page used to sit on "Loading odds..." forever while the
      // loader re-fetched on every render. Treat a 404, or a second failure, as "no prices" and
      // let everything that doesn't need a price render.
      S.t2Tries = (S.t2Tries || 0) + 1;
      if (S.oddsStatus === 404 || S.t2Tries >= 2){
        S.data.odds = { books:[], lines:[], alt:[], matchOdds:[] };
        S.noOdds = S.oddsStatus === 404 ? 'no odds.json has been published for this sport yet'
                                        : 'odds.json failed to load twice';
      } else { S.t2 = null; render(); return; }   // one transient failure: allow a retry
    }
    // Published but empty is the normal state before books post props (NHL in preseason): the
    // file exists, so it isn't "missing", but there is still nothing to price. Say so the same way.
    if (!S.noOdds){
      var od0 = S.data.odds || {};
      var nRows = ((od0.books && od0.books.length ? od0.books : (od0.lines || [])).length) + ((od0.alt || []).length);
      if (!nRows) S.noOdds = 'books haven\u2019t posted player prices yet'
        + (od0.updated ? ' (last checked '+String(od0.updated).replace('T',' ').replace('Z',' UTC')+')' : '');
    }
    // player -> team, so odds rows can be filtered by match
    S.idx.playerTeam = {};
    var pl = S.data.players;
    (Array.isArray(pl) ? pl : (pl && pl.players) || []).forEach(function(p){
      if (p && p.name) S.idx.playerTeam[p.name] = p.team;
    });
    S.t2 = 'ready'; render();
  });
}
// Check-bet needs one sport's full history and prices, not every active sport's.
function ensureSport(key){
  var S = state.sports[key];
  if (S.status !== 'ready') return;
  if (!S.t2) loadTier2(key);
  loadTier3(key);                        // self-guards on 'loading' / 'ready'
}
function ensureTier2(){
  Object.keys(SPORTS).forEach(function(k){
    if (state.view.active[k] && state.sports[k].status === 'ready' && !state.sports[k].t2) loadTier2(k);
  });
}

/* ---- tier 3: the heavy layer the real sections need ---------------------- */
// gamelogs + the supporting tables. This is where the weight is (AFL 26 MB, NFL 31 MB), so
// it loads per sport, on demand, and only once. Everything the ported sections rely on -
// the player/log/odds indexes and the sport's scoring + signals modules - is built here.
var TIER3 = { gamelogs:'data/gamelogs.json', dvp:'data/dvp.json', teams_form:'data/teams_form.json',
              injury:'data/injury.json', lineups:'data/lineups.json', results:'data/results.json',
              ladder:'data/ladder.json',
              weather:'data/weather.json', calib:'data/calib.json' };
function loadTier3(key){
  var S = state.sports[key];
  if (S.t3 === 'ready' || S.t3 === 'loading') return Promise.resolve();
  S.t3 = 'loading'; render();
  var q = S.version ? ('?v='+encodeURIComponent(S.version)) : '';
  var extra = (S.config && S.config.dataFiles) || {};      // sport-specific extras (NFL: redzone, firsttd, dbs)
  var want = {};
  Object.keys(TIER3).forEach(function(k){ want[k] = TIER3[k]; });
  Object.keys(extra).forEach(function(k){ want[k] = extra[k]; });
  return Promise.all(Object.keys(want).map(function(k){
    return fetch(sportPath(key, want[k])+q, {cache:'reload'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (j) S.data[k] = j; })
      .catch(function(){});
  }))
  .then(function(){
    // NBL ships one gamelog file per season (meta.gamelogFiles) rather than one gamelogs.json.
    // Merge them in listed order; anything that fails to load is reported, not silently skipped.
    var files = (S.data.meta && S.data.meta.gamelogFiles) || [];
    if (S.data.gamelogs || !files.length) return;
    return Promise.all(files.map(function(f){
      return fetch(sportPath(key, 'data/'+f)+q, {cache:'reload'})
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; });
    })).then(function(parts){
      var ok = parts.filter(Array.isArray);
      if (ok.length) S.data.gamelogs = [].concat.apply([], ok);
      if (ok.length < files.length) S.gamelogGap = (files.length - ok.length)+' of '+files.length+' season files failed to load';
    });
  })
  .then(function(){ return loadModules(key); })
  .then(function(){
    buildIndexes(key);
    // each sport's scoring module is a separate instance and must be configured with
    // that sport's data before prob()/hitRate() will return anything
    try{
      // NOTE: configure() wants logsByName (the INDEX), not a flat gamelogs array - passing
      // the array leaves getHitRate() returning null for every player, silently.
      // fixture/meta/env are NOT optional extras: MLB resolves the opposing starter and park
      // through fixture (no fixture -> starterFacing() returns null and the batter probability
      // loses the matchup entirely), EPL resolves home/away the same way, and NFL reads weather
      // out of env. Leaving them out silently degrades the score rather than erroring.
      var envByTeam = {};
      (asArray(S.data.weather) || []).forEach(function(w){
        if (!w) return;
        if (w.team) envByTeam[w.team] = w;
        if (w.home) envByTeam[w.home] = w;
      });
      if (S.scoring && S.scoring.configure) S.scoring.configure({
        players: S.idx.players,
        teams: asArray(S.data.teams) || [],
        teamsForm: asArray(S.data.teams_form) || asArray(S.data.teams) || [],
        dvp: asArray(S.data.dvp) || [],
        logsByName: S.idx.logsByName || {},
        fixture: asArray(S.data.fixture) || [],
        meta: S.data.meta || {},
        env: envByTeam,
        currentSeason: (S.data.meta && S.data.meta.currentSeason) || String(new Date().getFullYear())
      });
    }catch(e){}
    S.t3 = 'ready'; render();
  });
}

// scoring.js and signals.js assign single globals (JTTScoring / JTTSignals), same as
// config.js does - so they load through the same serial queue and get snapshotted.
function loadModules(key){
  var S = state.sports[key];
  if (S.scoring && S.signals) return Promise.resolve();
  _cfgQueue = _cfgQueue.then(function(){
    return new Promise(function(done){
      var pS = window.JTTScoring, pG = window.JTTSignals;
      var left = 2, q = S.version ? ('?v='+encodeURIComponent(S.version)) : '';
      var fin = function(){
        if (--left) return;
        S.scoring = window.JTTScoring; S.signals = window.JTTSignals;
        window.JTTScoring = pS; window.JTTSignals = pG;
        done();
      };
      ['scoring.js','signals.js'].forEach(function(fn){
        var el = document.createElement('script');
        el.src = sportPath(key, fn) + q;
        el.onload = el.onerror = fin;
        document.head.appendChild(el);
      });
    });
  });
  return _cfgQueue;
}

// The index layer the production sections read through. Built per sport so several can be
// live at once - this is the piece that makes ported sections work unchanged.
function buildIndexes(key){
  var S = state.sports[key], d = S.data, ix = S.idx;
  var players = asArray(d.players) || [];
  // One record per player. A build that keys by player+club writes a traded player once per club
  // (NHL: 277 names, 2-4 records each - Mitch Marner under TOR and VGK), and whichever came last in
  // the file won, so players turned up on their OLD club's roster. Keep the record whose club
  // matches his most recent game; records with DIFFERENT ids are different people and both stay.
  (function(){
    var lastTeam = {};
    (asArray(d.gamelogs) || []).forEach(function(r){
      var n = r && (r.Player || r.player); if (!n) return;
      var t = String(r.Date || r.date || '') || ((+(r.Year||r.year)||0)*1000 + (+(String(r.RoundName!=null?r.RoundName:r.Week).match(/\d+/)||[0])[0]));
      if (!lastTeam[n] || t >= lastTeam[n].t) lastTeam[n] = { t:t, team:r.Team || r.team };
    });
    var groups = {}, order = [];
    players.forEach(function(p){
      if (!p || !p.name) return;
      var id = p.playerId != null ? p.playerId : (p.id != null ? p.id : null);
      var gk = p.name + '|' + (id != null ? id : '');
      if (!groups[gk]){ groups[gk] = []; order.push(gk); }
      groups[gk].push(p);
    });
    var dropped = 0;
    players = order.map(function(gk){
      var g = groups[gk];
      if (g.length === 1) return g[0];
      dropped += g.length - 1;
      var lt = lastTeam[g[0].name];
      var hit = lt && g.filter(function(p){ return normTeam(p.team) === normTeam(lt.team); })[0];
      return hit || g.slice().sort(function(a,b){ return (+b.games || +b.matches || 0) - (+a.games || +a.matches || 0); })[0];
    });
    S.dupPlayers = dropped;
    // everything downstream - including each sport's scoring.configure() - reads this list
    if (dropped && Array.isArray(d.players)) d.players = players;
  })();
  ix.players = players;
  ix.byName = {};
  players.forEach(function(p){ if (p && p.name) ix.byName[p.name] = p; });

  ix.lgAvg = {}; ix.winAvg = {}; ix.matchOpp = null; ix.fs = null;
  ix.pricedSet = null; ix.oddsName = null; ix.oddsIni = null; ix.vac = null; ix.bookList = null; ix.resIdx = null; ix.mlbLg = null; ix.lgRate = null; ix.scState = null; ix.nhlPim = null; ix.injIdx = null; ix.luRows = null;
  var logs = asArray(d.gamelogs) || [];
  ix.logsByName = {};
  logs.forEach(function(r){
    var n = r && (r.Player || r.player); if (!n) return;
    (ix.logsByName[n] = ix.logsByName[n] || []).push(r);
  });

  var od = d.odds || {};
  ix.oddsIdx = {}; ix.bookIdx = {};
  (od.lines || []).forEach(function(r){
    if (!r || !r.player) return;
    (ix.oddsIdx[r.player] = ix.oddsIdx[r.player] || {})[r.market] = r;
  });
  ((od.books && od.books.length ? od.books : od.lines) || []).forEach(function(r){
    if (!r || !r.player) return;
    var m = ix.bookIdx[r.player] = ix.bookIdx[r.player] || {};
    (m[r.market] = m[r.market] || []).push(r);
  });
  ix.matchOddsIdx = {};
  (od.matchOdds || []).forEach(function(m){
    if (m && m.home && m.away) ix.matchOddsIdx[m.home+'|'+m.away] = m;
  });
  ix.nextOpp = {};
  (asArray(d.fixture) || []).forEach(function(g){
    if (!g || !g.home || !g.away) return;
    ix.nextOpp[g.home] = g.away; ix.nextOpp[g.away] = g.home;
  });
}

/* ---- fixture helpers ---------------------------------------------------- */
// Returns {ms, hasTime}. Sports differ: AFL ships bare-ISO UTC, EPL a Z stamp, NFL a real
// UTC stamp, MLB a DATE ONLY. A date-only value parses as UTC midnight, which would render
// as a confident but fictional kickoff time, so it's flagged and shown as TBC instead.
function gameStart(g){
  if (!g) return {ms:null, hasTime:false};
  // Every sport names this differently, so check them all in order of reliability:
  //   NFL/AFL  utc          '2026-09-18T00:15:00Z' | '2026-09-18T09:40:00' (bare = UTC)
  //   MLB      gameTimeUTC  '2026-09-18T22:40:00Z'
  //   EPL      date         '2026-09-18T19:00:00Z' (full stamp lives in `date`)
  var raw = String(g.utc || g.gameTimeUTC || g.startTime || g.kickoff || g.date || '');
  if (!raw) return {ms:null, hasTime:false};
  var hasTime = raw.indexOf('T') > 0 || /\d\d:\d\d/.test(raw);
  var s = raw;
  if (raw.indexOf('T') > 0 && !/[Zz]|[+\-]\d\d:?\d\d$/.test(s)) s += 'Z';   // bare ISO = UTC
  var ms = Date.parse(s);
  if (isNaN(ms)) return {ms:null, hasTime:false};
  return {ms:ms, hasTime:hasTime};
}
// Only MLB carries a status field, so completion is inferred from elapsed time, with a
// per-sport window generous enough to cover overtime/extra innings. Matches production.
var DONE_WINDOW = { mlb:240, nfl:225, afl:150, epl:150 };   // minutes after kickoff
function gameDone(key, g, ms){
  if (key === 'mlb' && g && typeof g.status === 'string'){
    var st = g.status.toLowerCase();
    if (st.indexOf('final') >= 0 || st.indexOf('completed') >= 0) return true;
    if (st.indexOf('progress') >= 0 || st.indexOf('live') >= 0) return false;
  }
  if (ms == null) return false;
  return Date.now() > ms + (DONE_WINDOW[key] || 150) * 60000;
}
function localDate(ms){ return new Date(ms).toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'}); }
function localTime(ms){ return new Date(ms).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function dayKey(ms){ var d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function teamName(key, t){
  var rec = teamRec(key, t);
  return (rec.name || rec.school || rec.displayName) || String(t);
}
// Club label for tables: prefer a real name where the data has one. AFL and EPL key teams by
// name already; MLB carries a `name` field beside the code; NFL has neither, so its three-letter
// code is genuinely all there is and the abbreviation stands on its own.
function teamFullName(key, t){
  var rec = teamRec(key, t);
  return rec.name || rec.fullName || rec.team || t;
}
// The NHL's own SVGs carry padding around the crest, so they drew visibly smaller than every
// other sport's in the same box. ESPN hosts NHL logos in the same full-frame format as the NFL
// ones; the league SVG stays as the fallback if ESPN ever misses one.
var NHL_ESPN = { ANA:'ana', BOS:'bos', BUF:'buf', CGY:'cgy', CAR:'car', CHI:'chi', COL:'col',
  CBJ:'cbj', DAL:'dal', DET:'det', EDM:'edm', FLA:'fla', LAK:'la', MIN:'min', MTL:'mtl', NSH:'nsh',
  NJD:'nj', NYI:'nyi', NYR:'nyr', OTT:'ott', PHI:'phi', PIT:'pit', SJS:'sj', SEA:'sea', STL:'stl',
  TBL:'tb', TOR:'tor', UTA:'utah', VAN:'van', VGK:'vgk', WSH:'wsh', WPG:'wpg' };
function teamLogo(key, t){
  var S = state.sports[key], cfg = S.config || {};
  var rec = teamRec(key, t);
  if (key === 'nhl'){
    var code = rec.team || t, espn = NHL_ESPN[String(code).toUpperCase()];
    if (espn){
      var fb = rec.logo || '';
      var ph0 = '<div class=&quot;fxr-logo-ph&quot;>'+esc(String(t).slice(0,3).toUpperCase())+'</div>';
      // first failure swaps to the league SVG, a second to the text placeholder
      return '<img class="fxr-logo" src="https://a.espncdn.com/i/teamlogos/nhl/500/'+espn+'.png" alt="" loading="lazy" '
        + 'onerror="if(this.dataset.fb!==\'1\'&&\''+esc(fb)+'\'){this.dataset.fb=\'1\';this.src=\''+esc(fb)+'\';}'
        + 'else{this.outerHTML=\''+ph0+'\';}">';
    }
  }
  var url = rec.logo || '';                                   // EPL: baked into teams.json
  if (!url && cfg.logoCdn){                                   // AFL / NFL / MLB: CDN + id
    var canon = rec.team || t;                                // resolve aliases before hitting the CDN
    var id = (cfg.teamIds && cfg.teamIds[canon] != null) ? cfg.teamIds[canon]
           : (cfg.teamIds && cfg.teamIds[t] != null) ? cfg.teamIds[t] : String(canon||'').toLowerCase();
    // extension default matters: AFL/NFL set logoCdnExt='.png', MLB sets none and the
    // MLB Stats API serves SVG - production defaults to '.svg', so match that exactly.
    url = cfg.logoCdn + id + (cfg.logoCdnExt || cfg.logoExt || '.svg');
  }
  var ph = '<div class=&quot;fxr-logo-ph&quot;>'+esc(String(t).slice(0,3).toUpperCase())+'</div>';
  if (url) return '<img class="fxr-logo" src="'+esc(url)+'" alt="" loading="lazy" '
    +'onerror="this.outerHTML=\''+ph+'\'">';

}

/* ---- odds --------------------------------------------------------------- */
// Sources differ PER MARKET, not per sport. AFL posts a two-way line for disposals only,
// while its other seven markets exist purely as milestone ladders in `alt`; EPL is alt-only
// throughout; NFL/MLB have both. So discover markets across every array, and for a given
// market prefer real two-way rows, falling back to the ladder when that's all there is.
function twoWayRows(d){
  if (!d) return [];
  return (d.books && d.books.length) ? d.books : (d.lines || []);
}
function oddsRows(d){
  if (!d) return [];
  return twoWayRows(d).concat(d.alt || []);
}
function rowsForMarket(d, mk){
  var tw = twoWayRows(d).filter(function(r){ return r && r.market === mk && r.over != null; });
  if (tw.length) return tw;
  return (d.alt || []).filter(function(r){ return r && r.market === mk && r.over != null; });
}
function abbrOf(key, t){
  var rec = teamRec(key, t);
  return rec.abbr || rec.short || String(t);
}
function mktLabel(key, mk){
  var cfg = state.sports[key].config || {};
  if (cfg.mktNames && cfg.mktNames[mk]) return cfg.mktNames[mk];
  var list = cfg.oddsMkts || cfg.multiMkts || [];
  for (var i=0;i<list.length;i++) if (list[i] && list[i][0] === mk) return list[i][1];
  return mk;
}
// Best two-way price per player/market. `lines` holds the consensus main line; `books` holds
// the per-book rows, so the best available over is taken from there when present.
function bestPrices(key, mk){
  var d = state.sports[key].data.odds || {};
  var best = {};
  rowsForMarket(d, mk).forEach(function(r){
    var k = r.player + '|' + r.line;
    if (!best[k] || r.over > best[k].over) best[k] = r;
  });
  // one row per player: the shortest posted line, with the ladder available on expand
  var byPlayer = {};
  Object.keys(best).forEach(function(k){
    var r = best[k], p = r.player;
    if (!byPlayer[p] || r.line < byPlayer[p].line) byPlayer[p] = r;
  });
  return Object.keys(byPlayer).map(function(p){ return byPlayer[p]; })
    .sort(function(a,b){ return (b.line - a.line) || (a.over - b.over); });
}
function marketsFor(key){
  var d = state.sports[key].data.odds || {};
  var rows = oddsRows(d);
  var seen = {};
  rows.forEach(function(r){ if (r && r.market && r.over != null) seen[r.market] = (seen[r.market]||0)+1; });
  return Object.keys(seen).sort(function(a,b){ return seen[b]-seen[a]; });
}
// Alt/milestone ladder for one player+market: every posted rung, best price per line.
function altLadder(key, player, mk){
  var d = state.sports[key].data.odds || {};
  var best = {};
  (d.alt || []).forEach(function(r){
    if (!r || r.player !== player || r.market !== mk || r.over == null) return;
    var k = String(r.line);
    if (!best[k] || r.over > best[k].over) best[k] = r;
  });
  var rungs = Object.keys(best).map(function(k){ return best[k]; })
    .sort(function(a,b){ return a.line - b.line; });
  if (rungs.length < 2) return '';
  return '<div class="alt-wrap">'+rungs.map(function(r){
    var n = bookRows(key, player, mk, r.line).length;
    return '<span class="alt-rung'+(n>1?' multi':'')+'" title="'+esc(bookTitle(key, player, mk, r.line))+'"'
      + ' onclick="event.stopPropagation();LAB.books(\''+key+'\',\''+esc(player).replace(/'/g,"\\'")+'\',\''+esc(mk)+'\','+r.line+')">'
      + '<b>'+esc(r.line)+'+</b>'+(+r.over).toFixed(2)
      + '<i>'+esc(r.book||'')+(n>1?' +'+(n-1):'')+'</i></span>';
  }).join('')+'</div>';
}
// Games for a sport, used as the match filter. Only games with at least one priced player
// are worth offering, so the chips never point at an empty board.
function matchesFor(key){
  var fx = asArray(state.sports[key].data.fixture) || [];
  return fx.filter(function(g){
    if (!g || !g.home || !g.away) return false;
    return state.view.showDone || !gameDone(key, g, gameStart(g).ms);
  }).map(function(g){
    return { id: g.home+'|'+g.away, home:g.home, away:g.away };
  });
}
// Every market a player has a price in, each with its full ladder. Opened by tapping a name
// on the odds board - the "what else can I bet on this guy" view.
// Every book's price for one exact player/market/line. Click-driven so it works on touch;
// desktop also gets it on hover via the title attribute. (When the settings page lands,
// "my books" will filter this list rather than a separate view.)
function bookRows(key, player, mk, line){
  var d = state.sports[key].data.odds || {};
  var all = twoWayRows(d).concat(d.alt || []);
  var seen = {}, out = [];
  all.forEach(function(r){
    if (!r || r.player !== player || r.market !== mk || r.over == null) return;
    if (Number(r.line) !== Number(line)) return;
    var b = r.book || '—';
    if (seen[b] && seen[b].over >= r.over) return;
    if (seen[b]) { out.splice(out.indexOf(seen[b]), 1); }
    seen[b] = r; out.push(r);
  });
  return out.sort(function(a,b){ return b.over - a.over; });
}
function bookTitle(key, player, mk, line){
  return bookRows(key, player, mk, line).map(function(r){
    return (r.book||'') + ' ' + (+r.over).toFixed(2) + (r.under!=null?' / '+(+r.under).toFixed(2):'');
  }).join('\n');
}
function booksPanel(){
  var b = state.view.books;
  if (!b) return '';
  var rows = bookRows(b.sport, b.player, b.market, b.line);
  if (!rows.length) return '';
  var best = rows[0].over;
  return '<div class="pp-back" style="z-index:50" onclick="LAB.books(null)"></div>'
    + '<div class="bk" style="z-index:51"><div class="pp-hd">'
    + '<div><div class="pp-nm" style="font-size:14px">'+esc(b.player)+'</div>'
    + '<div class="pp-sub">'+esc(mktLabel(b.sport, b.market))+' \u00b7 '+esc(b.line)+'+ \u00b7 '
    + rows.length+' book'+(rows.length===1?'':'s')+'</div></div>'
    + '<button class="pp-x" onclick="LAB.books(null)">&times;</button></div>'
    + '<div class="bk-list">'+rows.map(function(r){
        var top = r.over === best;
        return '<div class="bk-row'+(top?' top':'')+'">'
          + '<span class="bk-nm">'+esc(r.book||'—')+'</span>'
          + '<span class="bk-o">'+(+r.over).toFixed(2)+'</span>'
          + '<span class="bk-u">'+(r.under!=null?(+r.under).toFixed(2):'—')+'</span>'
          + (top?'<span class="bk-best">best</span>':'')+'</div>';
      }).join('')+'</div></div>';
}
/* ---- helpers the ported sections rely on --------------------------------- */
// Same signatures as production, but sport-scoped: the production shell has one global
// `state.idx`, the lab has one per sport, so each helper takes a sport key first.
function betStats(key){
  var cfg = state.sports[key].config || {};
  return (cfg.oddsMkts || cfg.multiMkts || []).map(function(m){ return m[0]; });
}
function mktLbl(key, mk){ return mktLabel(key, mk); }
function playersOnTeam(key, team){
  return (state.sports[key].idx.players || []).filter(function(p){ return p && p.team === team; });
}
function oddsForP(key, name, market){
  var ix = state.sports[key].idx;
  var main = (ix.oddsIdx || {})[name] && ix.oddsIdx[name][market];
  if (main) return main;
  var rows = ((ix.bookIdx || {})[name] || {})[market] || [];
  var best = null;
  rows.forEach(function(r){ if (r.over != null && (!best || r.over > best.over)) best = r; });
  return best;
}
/* Injury status, one vocabulary for every feed:
     NFL     Status      Out / Doubtful -> out; Questionable -> doubt
     AFL     Returning   "Season", "3 weeks", "TBC" -> out; "Test" (fitness test) -> doubt
     ESPN    Status      Out / Injured Reserve / Suspension -> out; Day-To-Day -> doubt   (NHL, MLB)
     NBL     Status      derived by build_nbl.py from missed games -> out
   Until now injury.json was only read to credit TEAMMATES with a player's vacated usage; nothing
   stopped the injured player himself reaching Green Lights, Streakers or Let's Climb until his
   team's lineup was published. The price gate usually covered it (books pull props), but a
   morning odds pull can carry him after the news.                                              */
function injStatus(key, name, team){
  var S = state.sports[key];
  if (!S.idx.injIdx){
    var ix = {};
    (asArray(S.data.injury) || []).forEach(function(r){
      if (!r) return;
      var nm = r.Player || r.player; if (!nm) return;
      var raw = String(r.Status || r.status || r.Returning || r.returning || '').trim();
      var st = null;
      if (/^(out|doubtful)$|injured reserve|\bir\b|suspen|season|week|tbc|indefinite|missed/i.test(raw)) st = 'out';
      else if (/questionable|day-to-day|day to day|test|probable|gtd/i.test(raw)) st = 'doubt';
      if (st) ix[foldName(nm)] = { st:st, raw:raw, team:r.Team || r.team, injury:r.Injury || r.injury || '' };
    });
    S.idx.injIdx = ix;
  }
  var e = S.idx.injIdx[foldName(name)];      // accents differ between feeds (ESPN v league)
  if (!e) return null;
  if (team && e.team && normTeam(e.team) !== normTeam(team)) return null;   // a different player's club
  return e;
}
// MLB publishes lineups as {gamePk, home:[playerId...], away:[playerId...]} - ids, not names - so
// the shared {team, player} check silently ignored them and anyone left out of a posted lineup
// still counted as available. Normalise that shape once, here.
function lineupRows(key){
  var S = state.sports[key];
  if (S.idx.luRows) return S.idx.luRows;
  var raw = asArray(S.data.lineups) || [], out = [];
  if (raw.length && raw[0] && (raw[0].home || raw[0].away) && !raw[0].player){
    var byId = {};
    (S.idx.players || []).forEach(function(p){ if (p && p.id != null) byId[p.id] = p; });
    var fx = asArray(S.data.fixture) || [];
    raw.forEach(function(r){
      var g = fx.filter(function(x){ return String(x.gamePk) === String(r.gamePk); })[0];
      if (!g) return;
      [['home', g.homeAbbr || g.home], ['away', g.awayAbbr || g.away]].forEach(function(sd){
        (r[sd[0]] || []).forEach(function(id){
          var p = byId[id];
          if (p) out.push({ team:p.team || sd[1], player:p.name });
        });
      });
    });
  } else out = raw;
  return (S.idx.luRows = out);
}
function isPlayingP(key, name, team){
  var lu = lineupRows(key);
  var any = lu.length && lu.some(function(r){ return r && r.team === team; });
  // a published lineup is the final word, either way
  if (any) return lu.some(function(r){ return r && r.team === team && r.player === name; });
  var inj = injStatus(key, name, team);
  return !(inj && inj.st === 'out');
}
function posShortP(p){ return (p && p.position) ? String(p.position) : ''; }

/* ---- ported: Top Value Bets ---------------------------------------------- */
// Model probability (from the sport's own scoring.js) vs the de-vigged implied price.
// IMPORTANT: the four scoring.js modules do NOT share an interface. Only getHitRate() is
// common to all of them (EPL alone has prob(); AFL/NFL have scoreOverLine()). Production's
// Value Bets calls prob(), so it silently renders for EPL only. Here we prefer prob() when
// present and fall back to the historical hit rate, which every sport supports - so the
// section actually works cross-sport instead of quietly doing nothing on three of four.
function modelProb(key, p, stat, line){
  var S = state.sports[key];
  if (S.scoring && S.scoring.prob){
    try{ var v = S.scoring.prob(p, stat, line); if (v != null && isFinite(v)) return {p:v, src:'model'}; }catch(e){}
  }
  if (S.scoring && S.scoring.getHitRate){
    try{
      var h = S.scoring.getHitRate(p.name, stat, line, false);
      var r = (h && typeof h === 'object') ? (h.rate != null ? h.rate : (h.n ? h.hits/h.n : null)) : h;
      var n = (h && typeof h === 'object' && h.n != null) ? h.n : null;
      if (r != null && isFinite(r) && (n == null || n >= 5)) return {p:r, src:'hit rate', n:n};
    }catch(e){}
  }
  return null;
}
function valueBets(key, g){
  var S = state.sports[key];
  if (!S.scoring) return '';
  var mkts = betStats(key), bets = [];
  var pool = playersOnTeam(key, g.home).concat(playersOnTeam(key, g.away));
  pool.forEach(function(p){
    if (!isPlayingP(key, p.name, p.team)) return;
    mkts.forEach(function(stat){
      var od = oddsForP(key, p.name, stat);
      if (!od || od.over == null || od.line == null) return;
      if (od.over < 1.2 || od.over > 6) return;
      var m = modelProb(key, p, stat, od.line);
      if (!m) return;
      var mp = m.p;
      var imp = (od.under != null && od.under > 0)
        ? (1/od.over) / ((1/od.over) + (1/od.under))    // de-vig when a two-way price exists
        : (1/od.over);
      var edge = mp - imp;
      if (edge >= 0.06) bets.push({p:p, stat:stat, line:od.line, over:od.over, book:od.book, mp:mp, imp:imp, edge:edge, src:m.src, n:m.n});
    });
  });
  if (!bets.length) return '';
  bets.sort(function(a,b){ return b.edge - a.edge; });
  var cards = bets.slice(0,8).map(function(b){
    return '<div class="vb-card" onclick="LAB.player(\''+key+'\',\''+esc(b.p.name).replace(/'/g,"\\'")+'\')">'
      + '<div class="vb-edge">+'+Math.round(b.edge*100)+'%</div>'
      + '<div class="vb-main"><div class="vb-nm">'+esc(b.p.name)+'</div>'
      + '<div class="vb-ln">'+esc(mktLbl(key,b.stat))+' O'+b.line+' \u00b7 $'+b.over.toFixed(2)+(b.book?' '+esc(b.book):'')+'</div>'
      + '<div class="vb-sub">'+esc(posShortP(b.p))+' \u00b7 '+esc(abbrOf(key,b.p.team))
      + ' \u00b7 '+esc(b.src)+' '+Math.round(b.mp*100)+'%'+(b.n?' ('+b.n+'g)':'')+' vs priced '+Math.round(b.imp*100)+'%</div></div>'
      + '<i class="ti ti-chevron-right vb-chev"></i></div>';
  }).join('');
  return '<div class="dayband"><span>Top Value Bets</span></div><div class="vb-list">'+cards+'</div>';
}

/* ---- focused fixture ----------------------------------------------------- */
// Match-level markets vary by sport (NFL has 1st-half lines and total TDs, EPL has corners
// and cards, MLB posts none at all), so render whatever keys are present rather than a
// fixed list. Totals all share the {points,over,under,book} shape.
var MO_TOTALS = [['total','Total'],['totalTds','Total TDs'],['totalCorners','Corners'],
                 ['totalCards','Cards'],['totalShots','Total Shots'],['totalSOT','Shots on Target'],
                 ['total1H','1st Half Total']];
// Team names in matchOdds come from the books and rarely match the fixture exactly:
// AFL 'Sydney Swans' vs 'Sydney', EPL 'Brighton & Hove Albion' vs 'Brighton'. Only NFL lines
// up, because its fetcher emits abbreviations. Normalise both sides before comparing.
var TEAM_ALIAS = {
  // AFL
  'sydneyswans':'sydney','brisbanelions':'brisbane','adelaidecrows':'adelaide',
  'gwsgiants':'greaterwesternsydney','gws':'greaterwesternsydney','westernbulldogs':'bulldogs',
  'goldcoastsuns':'goldcoast','westcoasteagles':'westcoast','northmelbournekangaroos':'northmelbourne',
  'portadelaidepower':'portadelaide','stkildasaints':'stkilda','geelongcats':'geelong',
  'melbournedemons':'melbourne','carltonblues':'carlton','collingwoodmagpies':'collingwood',
  'essendonbombers':'essendon','fremantledockers':'fremantle','hawthornhawks':'hawthorn',
  'richmondtigers':'richmond',
  // EPL
  'brightonandhovealbion':'brighton','tottenhamhotspur':'tottenham','spurs':'tottenham',
  'manchestercity':'mancity','manchesterunited':'manutd','manutd':'manutd',
  'newcastleunited':'newcastle','wolverhamptonwanderers':'wolves','nottinghamforest':'nottmforest',
  'westhamunited':'westham','leedsunited':'leeds','afcbournemouth':'bournemouth',
  'ipswichtown':'ipswich','hullcity':'hull','coventrycity':'coventry','leicestercity':'leicester',
  'crystalpalace':'crystalpalace','astonvilla':'astonvilla'
};
function normTeam(n){
  var t = String(n||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'');
  return TEAM_ALIAS[t] || t;
}
function moKey(a,b){ return [normTeam(a), normTeam(b)].sort().join('|'); }
function matchOddsFor(key, g){
  var mo = (state.sports[key].data.odds || {}).matchOdds || [];
  var want = moKey(g.home, g.away);
  for (var i=0;i<mo.length;i++){
    var m = mo[i];
    if (m && m.home && m.away && moKey(m.home, m.away) === want) return m;
  }
  return null;
}
function moBlock(key, g){
  var m = matchOddsFor(key, g);
  if (!m) return '<div class="empty" style="padding:16px"><i class="ti ti-coin-off"></i>No match markets posted.</div>';
  var odd = function(v){ return v == null ? '\u2014' : (+v).toFixed(2); };
  var sp  = function(v){ return v == null ? '' : ((v > 0 ? '+' : '') + (+v)); };
  var books = {}, blocks = '';

  // Head to Head - shortest price flagged as the favourite
  if (m.h2h){
    if (m.h2h.book) books[m.h2h.book] = 1;
    var hh = m.h2h.home == null ? 99 : +m.h2h.home;
    var ha = m.h2h.away == null ? 99 : +m.h2h.away;
    var hd = m.h2h.draw == null ? 99 : +m.h2h.draw;
    var lo = Math.min(hh, ha, hd);
    blocks += '<div class="mo-block"><div class="mo-lab">Head to Head</div>'
      + '<div class="mo-row"><span class="mo-t">'+teamLogo(key,g.home)+esc(abbrOf(key,g.home))+'</span>'
        + '<span class="mo-o'+(hh===lo?' fav':'')+'">'+odd(m.h2h.home)+'</span></div>'
      + (m.h2h.draw != null ? '<div class="mo-row"><span class="mo-t"><span class="mo-draw">Draw</span></span>'
        + '<span class="mo-o'+(hd===lo?' fav':'')+'">'+odd(m.h2h.draw)+'</span></div>' : '')
      + '<div class="mo-row"><span class="mo-t">'+teamLogo(key,g.away)+esc(abbrOf(key,g.away))+'</span>'
        + '<span class="mo-o'+(ha===lo?' fav':'')+'">'+odd(m.h2h.away)+'</span></div></div>';
  }

  // Line / handicap
  if (m.line){
    if (m.line.book) books[m.line.book] = 1;
    blocks += '<div class="mo-block"><div class="mo-lab">Line</div>'
      + '<div class="mo-row"><span class="mo-t">'+teamLogo(key,g.home)+esc(abbrOf(key,g.home))
        + '<b class="mo-sp">'+sp(m.line.home)+'</b></span><span class="mo-o">'+odd(m.line.homeOdds)+'</span></div>'
      + '<div class="mo-row"><span class="mo-t">'+teamLogo(key,g.away)+esc(abbrOf(key,g.away))
        + '<b class="mo-sp">'+sp(m.line.away)+'</b></span><span class="mo-o">'+odd(m.line.awayOdds)+'</span></div></div>';
  }

  // Totals - every variant the sport posts, same {points,over,under,book} shape
  MO_TOTALS.forEach(function(t){
    var v = m[t[0]];
    if (!v || v.over == null) return;
    if (v.book) books[v.book] = 1;
    blocks += '<div class="mo-block"><div class="mo-lab">'+t[1]+'</div>'
      + '<div class="mo-row"><span class="mo-t">Over <b class="mo-sp">'+v.points+'</b></span>'
        + '<span class="mo-o">'+odd(v.over)+'</span></div>'
      + '<div class="mo-row"><span class="mo-t">Under <b class="mo-sp">'+v.points+'</b></span>'
        + '<span class="mo-o">'+odd(v.under)+'</span></div></div>';
  });

  if (!blocks) return '<div class="empty" style="padding:16px"><i class="ti ti-coin-off"></i>No match markets posted.</div>';
  var bk = Object.keys(books);
  return '<div class="mo-grid">'+blocks+'</div>'
    + (bk.length ? '<div class="mo-book">best price from '+esc(bk.join(' \u00b7 '))+'</div>' : '');
}
/* ---- ported: Head to Head, season averages ------------------------------- */
// Each sport declares its own h2hKeys in config.js, and every sport's teams.json carries
// those fields - including EPL, which has the data but never had the section wired up.
var LOW_COUNT_KEYS = {goals:1,passTds:1,rushTds:1,passInt:1,sacks:1,assists:1,recTds:1,HR:1,
                      shotsOn:1,corners:1,cards:1,foulsCommitted:1};
// Stats where MORE is worse - the leader highlight has to invert or it reads backwards
// (a team leading on cards or sacks taken is not winning that row).
var INVERSE_KEYS = {cards:1,foulsCommitted:1,passInt:1,sacks:1,SO:1,ga:1};
// League average per stat, so each team's figure can be shown as a % above/below par.
function leagueAvg(key, k){
  var teams = asArray(state.sports[key].data.teams) || [];
  var v = [];
  teams.forEach(function(t){ var x = t && t[k]; if (x != null && isFinite(+x)) v.push(+x); });
  if (!v.length) return null;
  return v.reduce(function(a,b){ return a+b; },0) / v.length;
}
function h2hSection(key, g){
  var ix = state.sports[key].idx, cfg = state.sports[key].config || {};
  var th = (ix.teamMap||{})[g.home], ta = (ix.teamMap||{})[g.away];
  if (!th || !ta) return '';
  var keys = cfg.h2hKeys || [];
  if (!keys.length) return '';

  var mode = state.view.h2hMode || 'for';          // 'for' = own output, 'allowed' = conceded
  var suf  = mode === 'allowed' ? '_a' : '';
  var rows = '', any = false;

  keys.forEach(function(kv){
    var k = kv[0], lab = kv[1];
    var hv = th[k+suf], av = ta[k+suf];
    if (hv == null && av == null) return;
    any = true;
    var hn = +hv || 0, an = +av || 0, tot = (hn + an) || 1;
    var hp = Math.round(hn / tot * 100), ap = 100 - hp;
    var dec = LOW_COUNT_KEYS[k] ? 1 : 0;
    // On "allowed", conceding MORE is worse, so the better side flips relative to "for".
    // Genuinely inverse stats (cards, INTs thrown) flip again - i.e. back to normal.
    var inv = !!INVERSE_KEYS[k];
    var lowerWins = (mode === 'allowed') ? !inv : inv;
    var homeBetter = lowerWins ? (hn <= an) : (hn >= an);
    var awayBetter = lowerWins ? (an < hn)  : (an > hn);

    var lg = leagueAvg(key, k+suf);
    var pct = function(v){
      if (!lg) return '';
      var d = Math.round((v - lg) / lg * 100);
      if (!isFinite(d) || Math.abs(d) < 3) return '<span class="h2h-pc flat">par</span>';
      var good = lowerWins ? (d < 0) : (d > 0);
      return '<span class="h2h-pc '+(good?'up':'down')+'">'+(d>0?'+':'')+d+'%</span>';
    };

    rows += '<div class="h2h-row">'
      + '<div class="h2h-v l'+(homeBetter ? ' win' : '')+'">'+(+hn).toFixed(dec)+pct(hn)+'</div>'
      + '<div class="h2h-mid"><div class="h2h-k">'+esc(lab)
        + (lowerWins?'<i class="h2h-inv" title="lower is better">\u25be</i>':'')+'</div>'
        + '<div class="h2h-bar"><i class="home" style="width:'+hp+'%"></i><i class="away" style="width:'+ap+'%"></i></div></div>'
      + '<div class="h2h-v r'+(awayBetter ? ' win' : '')+'">'+(+an).toFixed(dec)+pct(an)+'</div></div>';
  });

  if (!any) return mode === 'allowed'
    ? '<div class="dayband"><span>Head to Head</span></div><div class="empty" style="padding:16px">No conceded stats for this sport.</div>'
    : '';

  var tab = function(m, lab){
    return '<button class="h2h-tb'+(mode===m?' on':'')+'" onclick="LAB.h2hMode(\''+m+'\')">'+lab+'</button>';
  };
  return '<div class="dayband"><span>Head to Head \u00b7 season averages</span></div>'
    + '<div class="h2h-wrap">'
    + '<div class="h2h-tabs">'+tab('for','For')+tab('allowed','Allowed')
      + '<span class="h2h-note">'+(mode==='allowed'?'conceded per game':'own output per game')+' \u00b7 % vs league</span></div>'
    + '<div class="h2h-head"><span>'+esc(abbrOf(key,g.home))+'</span>'
    + '<span class="h2h-gp">per game</span><span>'+esc(abbrOf(key,g.away))+'</span></div>'+rows+'</div>';
}

/* ---- ported: Last Time They Met ------------------------------------------ */
// Score fields differ per sport (NFL/MLB use hs/as, AFL/EPL use homeScore/awayScore) and
// EPL additionally carries corners, cards and half-time scores - so normalise on read and
// surface the extras only where they exist.
function resScore(r, side){
  if (!r) return null;
  var v = side === 'home' ? (r.homeScore != null ? r.homeScore : r.hs)
                          : (r.awayScore != null ? r.awayScore : r.as);
  return (v == null || !isFinite(+v)) ? null : +v;
}
function meetings(key, g, limit){
  var rows = asArray(state.sports[key].data.results) || [];
  var want = moKey(g.home, g.away);
  var out = [];
  rows.forEach(function(r){
    if (!r || !r.home || !r.away) return;
    if (moKey(r.home, r.away) !== want) return;
    if (resScore(r,'home') == null) return;
    out.push(r);
  });
  out.sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
  return limit ? out.slice(0, limit) : out;
}
function h2hHistory(key, g){
  var all = meetings(key, g);
  if (!all.length) return '';
  var recent = all.slice(0, 6);
  // record from the perspective of the fixture's home team, regardless of who hosted
  var w = 0, l = 0, d = 0, totSum = 0, marSum = 0;
  var extra = { corners:[], cards:[] };
  all.forEach(function(r){
    var hs = resScore(r,'home'), as = resScore(r,'away');
    var homeIsG = normTeam(r.home) === normTeam(g.home);
    var us = homeIsG ? hs : as, them = homeIsG ? as : hs;
    if (us > them) w++; else if (us < them) l++; else d++;
    totSum += (hs + as); marSum += Math.abs(hs - as);
    if (r.cornersHome != null) extra.corners.push((+r.cornersHome||0) + (+r.cornersAway||0));
    if (r.cardsHome != null)   extra.cards.push((+r.cardsHome||0) + (+r.cardsAway||0));
  });
  var n = all.length;
  var avg = function(a){ return a.length ? (a.reduce(function(x,y){return x+y;},0)/a.length) : null; };
  var stat = function(lab, val){ return val==null?'':'<div class="lm-stat"><span>'+esc(lab)+'</span><b>'+val+'</b></div>'; };
  var summary = '<div class="lm-stats">'
    + stat(abbrOf(key,g.home)+' record', w+'-'+l+(d?'-'+d:''))
    + stat('Avg total', (totSum/n).toFixed(1))
    + stat('Avg margin', (marSum/n).toFixed(1))
    + stat('Avg corners', extra.corners.length ? avg(extra.corners).toFixed(1) : null)
    + stat('Avg cards', extra.cards.length ? avg(extra.cards).toFixed(1) : null)
    + '</div>';
  var list = recent.map(function(r){
    var hs = resScore(r,'home'), as = resScore(r,'away');
    var win = hs === as ? null : (hs > as ? r.home : r.away);
    var when = String(r.date||'').slice(0,10);
    var meta = [];
    if (r.year || r.season) meta.push(r.year || r.season);
    if (r.round) meta.push('R'+r.round);
    else if (r.week && String(r.week).length <= 2) meta.push('W'+r.week);
    if (r.venue) meta.push(r.venue);
    var head = '<div class="lm-row">'
      + '<span class="lm-date">'+esc(when)+'</span>'
      + '<span class="lm-t'+(win && normTeam(win)===normTeam(r.home) ? ' win' : '')+'">'+esc(abbrOf(key,r.home))+'</span>'
      + '<span class="lm-sc">'+hs+' &ndash; '+as+'</span>'
      + '<span class="lm-t'+(win && normTeam(win)===normTeam(r.away) ? ' win' : '')+'">'+esc(abbrOf(key,r.away))+'</span>'
      + (meta.length ? '<span class="lm-meta">'+esc(meta.join(' \u00b7 '))+'</span>' : '')
      + '</div>';
    var lead = meetingLeaders(key, r, r.home) + meetingLeaders(key, r, r.away);
    return lead
      ? '<details class="lm-det"><summary>'+head+'</summary><div class="ml-wrap">'+lead+'</div></details>'
      : head;
  }).join('');
  return '<div class="dayband"><span>Last time they met \u00b7 '+n+' meeting'+(n===1?'':'s')+'</span></div>'
    + '<div class="lm-wrap">'+summary+'<div class="lm-list">'+list+'</div></div>';
}

// Join a past result to its gamelog rows. Sports key this differently:
//   EPL/MLB  gamelogs carry a date   -> match on date + team
//   NFL      Year + Week + team
//   AFL      Year + round number parsed out of RoundName ('Round 7' / 'Opening Round')
function roundNum(v){
  var m = String(v==null?'':v).match(/(\d+)/);
  return m ? +m[1] : (/opening/i.test(String(v)) ? 0 : null);
}
function logsForMeeting(key, r, team){
  var logs = asArray(state.sports[key].data.gamelogs) || [];
  var rDate = String(r.date||'').slice(0,10);
  var rYear = +(r.year || r.season || 0);
  var rRound = roundNum(r.round != null ? r.round : r.week);
  return logs.filter(function(x){
    if (!x || normTeam(x.Team || x.team) !== normTeam(team)) return false;
    var xd = String(x.date || x.Date || '').slice(0,10);
    if (xd && rDate) return xd === rDate;
    if (rYear && +(x.Year||x.year) !== rYear) return false;
    var xr = roundNum(x.RoundName != null ? x.RoundName : x.Week);
    return (rRound != null && xr != null) ? xr === rRound : false;
  });
}
// Top performer per stat for one team in one past game.
function meetingLeaders(key, r, team){
  var rows = logsForMeeting(key, r, team);
  if (!rows.length) return '';
  var cfg = state.sports[key].config || {};
  // leaderKeys lets a sport use richer gamelog-only stats here (NFL: rec yds, combined TDs)
  var src = cfg.leaderKeys || cfg.h2hKeys || [];
  var keys = src.map(function(x){ return x[0]; })
    .filter(function(k){ return rows.some(function(x){ return x[k] != null; }); }).slice(0,5);
  if (!keys.length) return '';
  var cells = keys.map(function(k){
    var best = null;
    rows.forEach(function(x){
      var v = +x[k];
      if (!isFinite(v) || v <= 0) return;
      if (!best || v > best.v) best = { v:v, n:(x.Player||x.player) };
    });
    if (!best) return '';
    var lab = (src.find(function(y){ return y[0]===k; })||[k,k])[1];
    return '<div class="ml-cell"><span class="ml-k">'+esc(lab)+'</span>'
      + '<span class="ml-v">'+ (LOW_COUNT_KEYS[k] ? best.v.toFixed(1) : Math.round(best.v)) +'</span>'
      + '<span class="ml-n">'+esc(best.n)+'</span></div>';
  }).filter(Boolean).join('');
  return cells ? ('<div class="ml-team"><div class="ml-tm">'+esc(abbrOf(key,team))+'</div><div class="ml-grid">'+cells+'</div></div>') : '';
}

// Players in this game that have any posted price, grouped by team.
function gamePlayers(key, g){
  var d = state.sports[key].data.odds || {};
  var pt = state.sports[key].idx.playerTeam || {};
  var byP = {};
  oddsRows(d).forEach(function(r){
    if (!r || r.over == null || !r.player) return;
    var t = pt[r.player];
    if (t !== g.home && t !== g.away) return;
    var e = byP[r.player] || (byP[r.player] = { name:r.player, team:t, mkts:{} });
    e.mkts[r.market] = 1;
  });
  return Object.keys(byP).map(function(n){ return byP[n]; })
    .sort(function(a,b){
      var d2 = Object.keys(b.mkts).length - Object.keys(a.mkts).length;
      return d2 || a.name.localeCompare(b.name);
    });
}
/* ---- team section: L5 form ------------------------------------------------
   results.json field names differ by sport (AFL/EPL: homeScore/awayScore, NFL/MLB: hs/as)
   so everything reads through resScoreH/A. Team keys match fixture keys in every sport,
   but normTeam() is used anyway so an alias change can't silently empty the card.       */
function resultRows(key){
  var d = state.sports[key].data.results;
  return Array.isArray(d) ? d : ((d && (d.results || d.rows)) || []);
}
function resScoreH(r){ return r.homeScore != null ? +r.homeScore : (r.hs != null ? +r.hs : null); }
function resScoreA(r){ return r.awayScore != null ? +r.awayScore : (r.as != null ? +r.as : null); }
function resMs(r){ var ms = Date.parse(r.date || r.Date || ''); return isFinite(ms) ? ms : null; }
function formRows(key, team, beforeMs, n){
  var res = resultRows(key), want = normTeam(team), out = [];
  for (var i=0;i<res.length;i++){
    var r = res[i]; if (!r || !r.home || !r.away) continue;
    var isH = normTeam(r.home) === want;
    if (!isH && normTeam(r.away) !== want) continue;
    var hs = resScoreH(r), as = resScoreA(r);
    if (hs == null || as == null) continue;                 // unplayed / unscored row
    var ms = resMs(r);
    if (beforeMs != null && ms != null && ms >= beforeMs) continue;   // never show this game back at itself
    var gf = isH ? hs : as, ga = isH ? as : hs;
    out.push({ ms:ms, opp:(isH ? r.away : r.home), home:isH, gf:gf, ga:ga,
      res:(gf > ga ? 'W' : (gf < ga ? 'L' : 'D')),
      ht:(r.htHome != null && r.htAway != null)
           ? (isH ? r.htHome+'-'+r.htAway : r.htAway+'-'+r.htHome) : null });
  }
  out.sort(function(a,b){ return (b.ms||0) - (a.ms||0); });   // results files aren't consistently ordered
  return out.slice(0, n || 5);
}
function formCard(key, team, beforeMs){
  var rows = formRows(key, team, beforeMs, 5);
  var head = '<div class="l5-head">'+teamLogo(key,team)
    + '<span class="l5-nm">'+esc(abbrOf(key,team))+'</span>';
  if (!rows.length){
    return '<div class="l5-card">'+head+'</div>'
      + '<div class="l5-none">No completed games on file.</div></div>';
  }
  var w=0,l=0,dr=0,gf=0,ga=0;
  rows.forEach(function(r){ if(r.res==='W')w++; else if(r.res==='L')l++; else dr++; gf+=r.gf; ga+=r.ga; });
  var rec = w+'-'+l+(dr?'-'+dr:'');
  head += '<span class="l5-rec">'+rec+'</span></div>';
  var strip = '<div class="l5-strip">'+rows.map(function(r){
    return '<span class="l5-chip '+r.res+'">'+r.res+'</span>'; }).join('')+'</div>';
  var dec = function(v){ return (Math.round(v*10)/10).toFixed(1); };
  var body = rows.map(function(r){
    var m = r.gf - r.ga;
    return '<div class="l5-row">'
      + '<span class="l5-res '+r.res+'">'+r.res+'</span>'
      + '<span class="l5-opp"><span class="l5-ha">'+(r.home?'H':'A')+'</span>'+esc(abbrOf(key,r.opp))
        + (r.ht ? '<span class="l5-ht">HT '+esc(r.ht)+'</span>' : '')+'</span>'
      + '<span class="l5-sc">'+r.gf+'\u2013'+r.ga+'</span>'
      + '<span class="l5-mg '+(m>0?'up':(m<0?'down':''))+'">'+(m>0?'+':'')+m+'</span></div>';
  }).join('');
  var foot = '<div class="l5-foot"><span>For<b>'+dec(gf/rows.length)+'</b></span>'
    + '<span>Against<b>'+dec(ga/rows.length)+'</b></span>'
    + '<span>Last '+rows.length+' \u00b7 newest first</span></div>';
  return '<div class="l5-card">'+head+strip+body+foot+'</div>';
}
function formSection(key, g){
  if (!resultRows(key).length)
    return secNote('Last 5', 'results.json returned nothing for '+SPORTS[key].name+' \u2014 the file is missing, empty, or failed to load.');
  var ms = gameStart(g).ms;
  return '<div class="dayband"><span>Last 5</span></div>'
    + '<div class="l5-grid">'+formCard(key, g.away, ms)+formCard(key, g.home, ms)+'</div>';
}

/* ---- team section: stat leaders -------------------------------------------
   Leaders come from gamelogs, not players.json: it's the only source every sport
   shares (MLB's players.json carries splits, not per-game averages) and it's the
   only one that can answer both windows - season and last 5 - from one pass.     */
function slMarkets(key){
  var cfg = state.sports[key].config || {};
  return (cfg.oddsMkts || cfg.multiMkts || cfg.compareStats || []).slice(0, 8);
}
function logMs(r){
  var d = r && (r.date || r.Date);
  if (!d) return null;
  var ms = Date.parse(String(d).slice(0,10));
  return isFinite(ms) ? ms : null;
}
function logSeq(r){                       // AFL/NFL ship no date - order by season + round/week
  var y = +(r.Year || r.year) || 0;
  var rd = roundNum(r.RoundName != null ? r.RoundName : r.Week);
  return y * 1000 + (rd == null ? 0 : rd);
}
function sortLogsDesc(rows){
  rows.sort(function(a,b){
    var am = logMs(a), bm = logMs(b);
    if (am != null && bm != null && am !== bm) return bm - am;
    return logSeq(b) - logSeq(a);
  });
  return rows;
}
function curSeason(key){
  var S = state.sports[key];
  if (S.data.meta && S.data.meta.currentSeason) return +S.data.meta.currentSeason;
  var mx = 0;
  (asArray(S.data.gamelogs) || []).forEach(function(r){ var y = +(r.Year||r.year)||0; if (y > mx) mx = y; });
  return mx || new Date().getFullYear();
}
function statLeaders(key, team, mkt, win, limit){
  var logs = asArray(state.sports[key].data.gamelogs) || [];
  var want = normTeam(team), season = curSeason(key), byP = {};
  for (var i=0;i<logs.length;i++){
    var r = logs[i];
    if (!r || normTeam(r.Team || r.team) !== want) continue;
    var n = r.Player || r.player; if (!n) continue;
    (byP[n] = byP[n] || []).push(r);
  }
  var pool = [], maxN = 0;
  Object.keys(byP).forEach(function(n){
    // A null isn't a zero: sports null out stats their feed never collected for that season
    // (and EPL's API-Football rows stop mid-2026), so rank only on games that carry the stat.
    var rows = sortLogsDesc(byP[n]).filter(function(r){ return statOf(key, r, mkt) != null; });
    rows = (win === 'l5') ? rows.slice(0,5)
                          : rows.filter(function(r){ return (+(r.Year||r.year)||0) === season; });
    if (!rows.length) return;
