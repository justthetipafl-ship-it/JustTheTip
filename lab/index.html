    var sc = degScope();
    var back = '<button class="fx-back" onclick="LAB.crewOpen(null)"><i class="ti ti-arrow-left"></i>All tiles</button>';
    var waitD = sc.sports.filter(function(k){ var S = state.sports[k]; if (S.t3 !== 'ready' || S.t2 !== 'ready'){ ensureSport(k); ensureTier2(); return true; } return false; });
    if (waitD.length) return crewHead(f, active) + back + '<div class="empty"><i class="ti ti-loader"></i>Loading '
      + esc(waitD.map(function(k){ return SPORTS[k].name; }).join(', '))+'\u2026</div>';
    var books = degBooks(sc.sports), book = state.view.degBook && books.indexOf(state.view.degBook) >= 0 ? state.view.degBook : null;
    var bar = '<div class="deg-bar"><span>Book</span><select class="ob-sel" onchange="LAB.degBook(this.value)"><option value="">Best price (per leg)</option>'
      + books.map(function(b){ return '<option value="'+esc(b)+'"'+(b === book ? ' selected' : '')+'>'+esc(b)+'</option>'; }).join('')+'</select>'
      + '<span class="deg-note">'+(book ? 'Every leg priced at '+esc(book)+' - one ticket.'
          : (sc.sc === 'mixed' ? 'Books listed price every sport in view.' : 'Pick a book to make each build one ticket.'))+'</span></div>';
    var body = which === 'train' ? degTrain(sc, book) : which === 'pyr' ? degPyramid(sc, book)
             : which === 'yank' ? degYankee(sc, book) : degLadder(sc);
    return crewHead(f, active) + back + bar + body;
  }

  var waiting = [], caps = {};
  show.forEach(function(k){
    var S = state.sports[k];
    if (S.t3 !== 'ready' || S.t2 !== 'ready'){ ensureSport(k); ensureTier2(); waiting.push(SPORTS[k].name); return; }
    caps[k] = crewCapture(k);
  });
  var have = Object.keys(caps);
  var gamesTxt = have.map(function(k){ return SPORTS[k].name+' '+caps[k].games; }).join(' \u00b7 ');
  var sub = '<div class="crew-sub">'+(gamesTxt ? 'Games in view: '+esc(gamesTxt)+' \u00b7 next '+CREW_HOURS+' hours' : '')
    + (waiting.length ? (gamesTxt ? ' \u00b7 ' : '')+'loading '+esc(waiting.join(', '))+'\u2026' : '')+'</div>';

  // merge the shared tiles across every sport in view; keep each sport's own separately
  var uni = {}, own = {};
  have.forEach(function(k){
    caps[k].tiles.forEach(function(t){
      if (t.phase === 'u'){
        var u = uni[t.title] = uni[t.title] || { icon:t.icon, title:t.title, desc:t.desc, rows:[], why:t.why };
        u.rows = u.rows.concat(t.rows);
      } else {
        (own[k] = own[k] || []).push(t);
      }
    });
  });
  var uniList = CREW_UNIVERSAL.map(function(tt){ return uni[tt]; }).filter(Boolean)
    .concat(Object.keys(uni).filter(function(tt){ return CREW_UNIVERSAL.indexOf(tt) < 0; }).map(function(tt){ return uni[tt]; }));

  // a tile is open: show its rows in full
  if (open){
    var back2 = '<button class="fx-back" onclick="LAB.crewOpen(null)"><i class="ti ti-arrow-left"></i>All tiles</button>';
    var t = null, sport = null;
    if (open.indexOf('u:') === 0) t = uniList.filter(function(x){ return x.title === open.slice(2); })[0];
    else if (open.indexOf('sp:') === 0){
      var parts = open.slice(3).split('|'); sport = parts[0];
      t = (own[sport] || []).filter(function(x){ return x.title === parts[1]; })[0];
      if (t) t.sport = sport;
    }
    if (!t) return crewHead(f, active, sub) + back2 + '<div class="sig-empty">That tile has nothing on the current slate.</div>';
    state.view.crewOpen = state.view.crewOpen || {};
    state.view.crewOpen[(t.sport || 'u') + '|' + t.title] = true;          // show every row, not the top 8
    return crewHead(f, active, sub) + back2
      + (t.rows.length ? crewTile(t, !sport && have.length > 1)
         : '<div class="sig-empty">'+esc(t.why || 'Nothing fired on the current slate.')+'</div>');
  }

  // the grid
  var h = crewHead(f, active, sub);
  h += '<div class="dayband"><span>Universal</span></div><div class="ct-grid">'
    + uniList.map(function(t){ return crewTileCard('u:'+t.title, t.icon, t.title, t.desc, t.rows.length); }).join('')
    + '</div>';
  have.forEach(function(k){
    if (!(own[k] || []).length) return;
    h += '<div class="dayband"><span>'+esc(SPORTS[k].name)+'</span></div><div class="ct-grid">'
      + own[k].map(function(t){ return crewTileCard('sp:'+k+'|'+t.title, t.icon, t.title, t.desc, t.rows.length); }).join('')
      + '</div>';
  });
  h += '<div class="dayband"><span>Degenerates</span></div><div class="ct-grid">'
    + DEG_TILES.map(function(d){ return crewTileCard('deg:'+d[0], d[2], d[1], d[3], null); }).join('')
    + '</div>';
  return h;
}

/* DEGENERATES ------------------------------------------------------------------------
   The old tool's high-variance page, per sport or MIXED across every sport switched on, priced at
   one bookmaker so each build is a ticket you can actually place:
     The Train    one short banker ($1.30-1.60) per game, combined
     The Pyramid  one stat, 1 / 2 / 3 players on descending rungs (single sport: a stat is a sport's)
     The Yankee   four ~$3 same-game multis from four games, staked as 6 doubles + 4 trebles + 1 four-fold
     The Ladder   the running $10 -> $10k challenge from scripts/build_ladder.py (one per sport)
   Rebuilt to this lab's standards: every leg is the calibrated model CAPPED at the player's own
   record (recordCap), legs must be roughly fair (not just short), and same-game legs are priced
   with correlation (cmbJoint) instead of multiplying the prices as if they were independent.    */
var DEG_TRAIN = [1.30, 1.60], DEG_YANK = [1.40, 2.10], DEG_SGM = [2.5, 3.8], DEG_MIN_EV = -0.03, DEG_TRAIN_EV = -0.10;
// Pyramid default stat per sport (production's): a stat with enough range to stack three rungs -
// MLB hits run 0-2, so a hits pyramid can never form
var DEG_PYR_DEFAULT = { afl:'disposals', nfl:'recYds', epl:'shots', mlb:'K', nbl:'points', nhl:'shots' };
var DEG_PYR_RUNG = { disposals:5, kicks:3, handballs:3, marks:2, tackles:2, goals:1, clearances:2,
  passYds:25, rushYds:15, recYds:15, receptions:1, rushRecYds:15, passAtt:5, rushAtt:3,
  points:4, rebounds:2, assists:2, threes:1, pra:6, pr:5, pa:5, ra:3, shots:1, H:1, TB:1, K:1, shotsOn:1 };
function degScope(){
  var active = Object.keys(SPORTS).filter(function(k){ return state.view.active[k]; });
  var sc = state.view.degSport || 'mixed';
  if (sc !== 'mixed' && active.indexOf(sc) < 0) sc = 'mixed';
  return { sc:sc, sports: sc === 'mixed' ? active : [sc], active:active };
}
function degPriceAt(k, name, mkt, line, book){
  var od = book ? bookPriceFor(k, name, mkt, line, book) : bestPriceFor(k, name, mkt, line);
  return od && od.price > 1 ? od : null;
}
// every priced leg in scope inside [lo, hi], with the capped probability
function degPool(sports, book, lo, hi){
  state.degCache = state.degCache || {};
  var ck = sports.map(function(k){ return k + ':' + crewSig(k); }).join(',') + '|' + (book || '*') + '|' + lo + '-' + hi;
  if (state.degCache[ck]) return state.degCache[ck];
  var legs = [];
  sports.forEach(function(k){
    crewGames(k).forEach(function(x){
      var g = x.g, gk = k + '|' + [normTeam(g.home), normTeam(g.away)].sort().join('|');
      [g.away, g.home].forEach(function(team){
        var opp = team === g.home ? g.away : g.home;
        playersOnTeam(k, team).forEach(function(p){
          if (!p || !p.name || !isPlayingP(k, p.name, team) || !hasAnyOddsFor(k, p.name)) return;
          posMarkets(k, p).forEach(function(m){
            streakCandidates(k, p.name, m[0]).forEach(function(c){
              var od = book ? degPriceAt(k, p.name, m[0], c.line, book) : c;
              if (!od || od.price < lo || od.price > hi) return;
              var pr = recordCap(k, p, m[0], c.line, 'over', modelProbAt(k, p, m[0], c.line, opp));
              if (pr == null) return;
              legs.push({ key:k, p:p, opp:opp, team:team, g:g, gk:gk, ms:x.ms, mkt:m[0], label:m[1], line:c.line,
                          side:'over', price:od.price, book:od.book, prob:pr, ev:pr * od.price - 1 });
            });
          });
        });
      });
    });
  });
  return (state.degCache[ck] = legs);
}
function degBooks(sports){
  var cnt = {};
  sports.forEach(function(k){ booksFor(k).forEach(function(b){ cnt[b] = (cnt[b] || 0) + 1; }); });
  // mixed: a book has to price every sport in play, or the multi can't be one ticket
  return Object.keys(cnt).filter(function(b){ return cnt[b] === sports.length; }).sort();
}
function degLegRow(l, showSport){
  return '<div class="deg-leg">'+playerImgP(l.key, l.p, 24)
    + '<div class="deg-lm"><b>'+esc(l.p.name)+'</b><span>'+(showSport ? esc(SPORTS[l.key].name)+' \u00b7 ' : '')
    + esc(abbrOf(l.key, l.team))+' v '+esc(abbrOf(l.key, l.opp))+' \u00b7 '+Math.ceil(l.line)+'+ '+esc(l.label)+'</span></div>'
    + '<span class="deg-lp">$'+l.price.toFixed(2)+'<i>'+Math.round(l.prob*100)+'%</i></span></div>';
}
function degSummary(price, prob, note){
  var ev = prob * price - 1;
  return '<div class="deg-sum"><div class="cmb-sum-row"><span>Price</span><b>$'+price.toFixed(2)+'</b></div>'
    + '<div class="cmb-sum-row"><span>Model</span><b>'+(prob*100).toFixed(prob < 0.1 ? 1 : 0)+'% \u00b7 fair $'+(1/prob).toFixed(2)+'</b></div>'
    + '<div class="cmb-sum-row tot"><span>Edge</span><b class="'+(ev >= 0 ? 'cmb-vscore good' : 'cmb-vscore bad')+'">'
    + (ev >= 0 ? '+' : '')+Math.round(ev*100)+'%</b></div>'+(note ? '<div class="cmb-corr">'+note+'</div>' : '')+'</div>';
}
function degSec(title, icon, sub, body){
  return '<div class="deg-sec"><div class="deg-sec-h"><i class="ti '+icon+'"></i> '+title
    + (sub ? '<span class="deg-sec-sub">'+sub+'</span>' : '')+'</div>'+body+'</div>';
}
/* THE TRAIN - one banker per game: the most likely leg priced $1.30-1.60 that's at least roughly
   fair on the capped probability. Different games, so the legs multiply honestly. */
function degTrain(sc, book){
  // A banker train carries the book's margin on every leg by construction, so asking each leg to be
  // near-fair left it empty across 17 games. Production had no value gate at all. Here: the most
  // likely leg per game, anything clearly bad (worse than -10%) dropped, and the edge shown honestly.
  var pool = degPool(sc.sports, book, DEG_TRAIN[0], DEG_TRAIN[1]).filter(function(l){ return l.ev >= DEG_TRAIN_EV; });
  var best = {};
  pool.forEach(function(l){ var c = best[l.gk]; if (!c || l.prob > c.prob) best[l.gk] = l; });
  var legs = Object.keys(best).map(function(k){ return best[k]; }).sort(function(a,b){ return a.ms - b.ms; });
  if (legs.length < 2) return degSec('The Train', 'ti-train', '', '<div class="sig-empty">Fewer than two games have a $1.30-1.60 banker within 10% of fair on the capped model'+(book ? ' at '+esc(book) : '')+'.</div>');
  var price = legs.reduce(function(a,l){ return a * l.price; }, 1), prob = legs.reduce(function(a,l){ return a * l.prob; }, 1);
  return degSec('The Train', 'ti-train', legs.length+' games', legs.map(function(l){ return degLegRow(l, sc.sc === 'mixed'); }).join('')
    + degSummary(price, prob, 'One leg per game, so the legs are independent and the probabilities multiply. Each is the most likely $1.30-1.60 leg in its game; bankers carry the book\u2019s margin, so expect the edge to read negative - it\u2019s a fun bet, not a value one.')
    + '<button class="pc-add" onclick="LAB.degSend(\'train\')">Send to Check My Multi</button>');
}
/* THE YANKEE - four same-game multis near $3, from four different games. Each SGM is the pair or
   trio of $1.40-2.10 legs with the best CORRELATED probability whose prices multiply to $2.50-3.80;
   the four with the best edge are staked as the 11-bet Yankee. Books price their own SGMs, usually
   below the product of the legs - the price shown is that product, so treat it as a ceiling.   */
function degYankeeSgms(sc, book){
  var pool = degPool(sc.sports, book, DEG_YANK[0], DEG_YANK[1]).filter(function(l){ return l.ev >= DEG_MIN_EV; });
  var byG = {};
  pool.forEach(function(l){ (byG[l.gk] = byG[l.gk] || []).push(l); });
  var sgms = [];
  Object.keys(byG).forEach(function(gk){
    var ls = byG[gk].sort(function(a,b){ return b.prob - a.prob; }).slice(0, 10), best = null;
    var tryCombo = function(c){
      var names = {}; for (var i=0;i<c.length;i++){ if (names[c[i].p.name]) return; names[c[i].p.name] = 1; }
      var price = c.reduce(function(a,l){ return a * l.price; }, 1);
      if (price < DEG_SGM[0] || price > DEG_SGM[1]) return;
      var j = cmbJoint(c); if (j == null) return;
      var ev = j * price - 1;
      if (!best || ev > best.ev) best = { legs:c, price:price, prob:j, ev:ev, gk:gk };
    };
    for (var a=0;a<ls.length;a++) for (var b=a+1;b<ls.length;b++){
      tryCombo([ls[a], ls[b]]);
      for (var c=b+1;c<ls.length;c++) tryCombo([ls[a], ls[b], ls[c]]);
    }
    if (best) sgms.push(best);
  });
  sgms.sort(function(a,b){ return b.ev - a.ev; });
  return sgms;
}
function degYankeeSystem(sgms){
  // 6 doubles + 4 trebles + 1 four-fold = 11 unit stakes; SGMs are independent (different games)
  var n = sgms.length, bets = [];
  for (var i=0;i<n;i++) for (var j=i+1;j<n;j++){
    bets.push([i,j]);
    for (var k=j+1;k<n;k++){ bets.push([i,j,k]); for (var m=k+1;m<n;m++) bets.push([i,j,k,m]); }
  }
  var er = 0, pAny = 0;
  for (var mask=0; mask < (1<<n); mask++){
    var pr = 1; for (var t=0;t<n;t++) pr *= (mask & (1<<t)) ? sgms[t].prob : 1 - sgms[t].prob;
    var ret = 0;
    bets.forEach(function(bt){ if (bt.every(function(ix){ return mask & (1<<ix); })) ret += bt.reduce(function(a,ix){ return a * sgms[ix].price; }, 1); });
    er += pr * ret; if (ret > 0) pAny += pr;
  }
  var all = sgms.reduce(function(a,x){ return a * x.price; }, 1);
  var two = sgms.slice().sort(function(a,b){ return a.price - b.price; }).slice(0, 2).reduce(function(a,x){ return a * x.price; }, 1);
  return { stakes:bets.length, ev:er / bets.length - 1, pAny:pAny, allReturn:all, minReturn:two };
}
function degYankee(sc, book){
  var sgms = degYankeeSgms(sc, book).slice(0, 4);
  if (sgms.length < 4) return degSec('The Yankee', 'ti-versions', '', '<div class="sig-empty">Only '+sgms.length
    +' game'+(sgms.length === 1 ? '' : 's')+' can build a roughly fair ~$3 same-game multi'+(book ? ' at '+esc(book) : '')+' - a Yankee needs four.</div>');
  var sys = degYankeeSystem(sgms);
  var cards = sgms.map(function(x, i){
    var l0 = x.legs[0];
    return '<div class="deg-sgm"><div class="deg-sgm-h">'+(sc.sc === 'mixed' ? '<span class="crew-sp">'+esc(SPORTS[l0.key].name)+'</span> ' : '')
      + esc(abbrOf(l0.key, l0.g.away))+' @ '+esc(abbrOf(l0.key, l0.g.home))
      + '<span>$'+x.price.toFixed(2)+' \u00b7 '+Math.round(x.prob*100)+'% correlated</span></div>'
      + x.legs.map(function(l){ return degLegRow(l, false); }).join('')
      + '<button class="pc-add" onclick="LAB.degSend(\'yank:'+i+'\')">Send this SGM to Check My Multi</button></div>';
  }).join('');
  return degSec('The Yankee', 'ti-versions', '4 SGMs \u00b7 11 bets', cards
    + '<div class="deg-sum"><div class="cmb-sum-row"><span>Stake</span><b>11 units (6 doubles, 4 trebles, 1 four-fold)</b></div>'
    + '<div class="cmb-sum-row"><span>All four land</span><b>'+(sys.allReturn).toFixed(0)+'\u00d7 a unit on the four-fold alone</b></div>'
    + '<div class="cmb-sum-row"><span>Any return (2+ land)</span><b>'+Math.round(sys.pAny*100)+'%</b></div>'
    + '<div class="cmb-sum-row tot"><span>Expected return on the 11</span><b class="'+(sys.ev >= 0 ? 'cmb-vscore good' : 'cmb-vscore bad')+'">'
    + (sys.ev >= 0 ? '+' : '')+Math.round(sys.ev*100)+'%</b></div>'
    + '<div class="cmb-corr">Each SGM is priced here as the product of its legs; books price their own SGMs, usually lower, so treat these prices as a ceiling. Legs within a game are correlated and priced that way; the four games are independent.</div></div>');
}
/* THE PYRAMID - one stat: 1 player at the top rung, 2 a rung lower, 3 lower again, each leg $1.25+
   and priced at the book. Swap any card for the next best. Legs can share a game, so the whole
   pyramid is priced with correlation.                                                          */
// the pyramid's six legs, so the Send button builds exactly what is on screen
function degPyramidLegs(sc, book){
  var cache = state.view._pyrLegs;
  return (cache && cache.sc === sc.sc && cache.book === (book || '') && cache.stat === state.view.degStat) ? cache.legs : null;
}
function degPyramid(sc, book){
  if (sc.sc === 'mixed') return degSec('The Pyramid', 'ti-triangle', '', '<div class="sig-empty">A pyramid is one stat - pick a sport above to build one.</div>');
  var k = sc.sc, mk = (state.sports[k].config || {}).oddsMkts || [];
  var dflt = DEG_PYR_DEFAULT[k] && mk.some(function(m){ return m[0] === DEG_PYR_DEFAULT[k]; }) ? DEG_PYR_DEFAULT[k] : ((mk[0] || [])[0]);
  var stat = state.view.degStat && mk.some(function(m){ return m[0] === state.view.degStat; }) ? state.view.degStat : dflt;
  var label = (mk.filter(function(m){ return m[0] === stat; })[0] || [stat, stat])[1];
  var skip = ((state.view.degSkip || {})[k + '|' + stat]) || [];
  var sel = '<div class="deg-bar"><span>Stat</span><select class="ob-sel" onchange="LAB.degStat(this.value)">'
    + mk.map(function(m){ return '<option value="'+m[0]+'"'+(m[0] === stat ? ' selected' : '')+'>'+esc(m[1])+'</option>'; }).join('')+'</select>'
    + (skip.length ? '<button class="sl-chip" onclick="LAB.degSkipReset()">Reset '+skip.length+' swap'+(skip.length === 1 ? '' : 's')+'</button>' : '')+'</div>';
  var players = [];
  crewGames(k).forEach(function(x){
    [x.g.away, x.g.home].forEach(function(team){
      var opp = team === x.g.home ? x.g.away : x.g.home;
      playersOnTeam(k, team).forEach(function(p){
        if (!p || skip.indexOf(p.name) >= 0 || !isPlayingP(k, p.name, team) || !hasAnyOddsFor(k, p.name)) return;
        if (!posMarkets(k, p).some(function(m){ return m[0] === stat; })) return;
        var v = statVals(k, p.name, stat, sortLogsDesc(((state.sports[k].idx.logsByName || {})[p.name] || []).slice()).slice(0, 10));
        if (v.length < 5) return;
        players.push({ p:p, team:team, opp:opp, g:x.g, ms:x.ms, proj:mean(v) });
      });
    });
  });
  players.sort(function(a,b){ return b.proj - a.proj; });
  if (players.length < 6) return degSec('The Pyramid', 'ti-triangle', '', sel+'<div class="sig-empty">Not enough priced '+esc(label)+' players to build a pyramid.</div>');
  var rung = DEG_PYR_RUNG[stat] || Math.max(1, Math.round(players[0].proj / 6));
  var legAt = function(pl, target){
    var cands = streakCandidates(k, pl.p.name, stat).filter(function(c){ return Math.abs(c.line - (target - 0.5)) <= Math.max(0.6, rung * 0.6); })
      .sort(function(a,b){ return Math.abs(a.line - (target - 0.5)) - Math.abs(b.line - (target - 0.5)); });
    for (var i=0;i<cands.length;i++){
      var od = book ? degPriceAt(k, pl.p.name, stat, cands[i].line, book) : cands[i];
      if (!od || od.price < 1.25) continue;
      var pr = recordCap(k, pl.p, stat, cands[i].line, 'over', modelProbAt(k, pl.p, stat, cands[i].line, pl.opp));
      if (pr == null) continue;
      return { key:k, p:pl.p, team:pl.team, opp:pl.opp, g:pl.g, mkt:stat, label:label, line:cands[i].line, side:'over', price:od.price, book:od.book, prob:pr };
    }
    return null;
  };
  var tiers = null;
  for (var top = Math.max(rung, Math.floor(players[0].proj / rung) * rung), t = 0; t < 12 && top >= rung; t++, top -= rung){
    var used = {}, rows = [[top,1],[top - rung,2],[Math.max(rung*0.5, top - 2*rung),3]].map(function(tr){
      var picked = [];
      players.forEach(function(pl){
        if (picked.length >= tr[1] || used[pl.p.name] || pl.proj < tr[0] * 0.9) return;
        var l = legAt(pl, tr[0]); if (l){ picked.push(l); used[pl.p.name] = 1; }
      });
      return picked;
    });
    if (rows[0].length === 1 && rows[1].length === 2 && rows[2].length === 3){ tiers = rows; break; }
  }
  if (!tiers) return degSec('The Pyramid', 'ti-triangle', '', sel+'<div class="sig-empty">Couldn\u2019t fill all six '+esc(label)+' spots at $1.25+'+(book ? ' at '+esc(book) : '')+'.</div>');
  var all = tiers[0].concat(tiers[1], tiers[2]);
  state.view._pyrLegs = { sc:sc.sc, book:book || '', stat:state.view.degStat, legs:all };
  var price = all.reduce(function(a,l){ return a * l.price; }, 1), prob = cmbJoint(all);
  var card = function(l){
    return '<div class="pyr-card"><button class="pyr-swap" title="Swap for the next best" onclick="LAB.degSkip(\''+esc(l.p.name).replace(/'/g,"\\'")+'\')">'
      + '<i class="ti ti-refresh"></i></button>'+playerImgP(k, l.p, 26)+'<div class="pyr-nm">'+esc(String(l.p.name).split(' ').pop())+'</div>'
      + '<div class="pyr-ln">'+Math.ceil(l.line)+'+</div><div class="pyr-od">$'+l.price.toFixed(2)+'</div></div>';
  };
  return degSec('The Pyramid', 'ti-triangle', esc(label), sel+'<div class="pyr">'+tiers.map(function(r){ return '<div class="pyr-row">'+r.map(card).join('')+'</div>'; }).join('')+'</div>'
    + degSummary(price, prob || 0.0001, 'Six legs; where they share a game the probability is correlated, not multiplied.')
    + '<button class="pc-add" onclick="LAB.degSend(\'pyr\')">Send to Check My Multi</button>');
}
/* THE LADDER - read-only view of each sport's running challenge (scripts/build_ladder.py). */

/* RESULTS ---------------------------------------------------------------------------
   The tipped record, from data/results.json (written by the bet-entry page). Everything is in
   UNITS: a stake divided by the unit size on the file. Dollars never reach this page - the stake
   column would otherwise publish the bankroll.
   Pending bets are counted nowhere except their own line: a bet that has not settled is not a
   result, and rolling it into profit is how tipsters accidentally flatter themselves.           */
function loadResults(){
  if (state.results || state.resultsLoading) return;
  state.resultsLoading = true;
  fetch('/data/results.json?cb=' + Date.now(), { cache:'reload' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var bets = Array.isArray(j) ? j : ((j && j.bets) || []);
      state.results = { unitSize: (j && +j.unitSize) || 25, updated:(j && j.updated) || null,
                        bets: bets.filter(function(b){ return b && b.stake != null; }), missing: !j };
      state.resultsLoading = false; render();
    })
    .catch(function(){ state.results = { unitSize:25, bets:[], missing:true }; state.resultsLoading = false; render(); });
}
function resultsStats(bets, unit){
  var st = { n:0, w:0, l:0, v:0, pend:0, staked:0, ret:0, profit:0, curve:[], best:null, worst:null };
  var run = 0;
  bets.forEach(function(b){
    if (b.result === 'pending'){ st.pend++; return; }
    var u = (+b.stake || 0) / unit, r = (b.returned == null ? 0 : +b.returned) / unit;
    st.n++; st.staked += u; st.ret += r;
    var pl = r - u; st.profit += pl; run += pl;
    if (b.result === 'win') st.w++; else if (b.result === 'loss') st.l++; else st.v++;
    st.curve.push({ d:b.date, run:run, pl:pl, b:b });
    if (!st.best || pl > st.best.pl) st.best = { pl:pl, b:b };
    if (!st.worst || pl < st.worst.pl) st.worst = { pl:pl, b:b };
  });
  st.roi = st.staked > 0 ? st.profit / st.staked : 0;
  st.strike = (st.w + st.l) > 0 ? st.w / (st.w + st.l) : 0;
  return st;
}
function resultsCurve(curve){
  if (curve.length < 2) return '';
  var W = 320, H = 96, pad = 4;
  var lo = Math.min(0, Math.min.apply(null, curve.map(function(c){ return c.run; })));
  var hi = Math.max(0, Math.max.apply(null, curve.map(function(c){ return c.run; })));
  var span = (hi - lo) || 1;
  var x = function(i){ return pad + i * (W - pad*2) / (curve.length - 1); };
  var y = function(v){ return H - pad - (v - lo) / span * (H - pad*2); };
  var d = curve.map(function(c, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(c.run).toFixed(1); }).join(' ');
  var zero = y(0);
  var up = curve[curve.length-1].run >= 0;
  return '<svg class="res-curve" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    + '<line x1="0" y1="'+zero.toFixed(1)+'" x2="'+W+'" y2="'+zero.toFixed(1)+'" stroke="var(--border)" stroke-dasharray="3 3"/>'
    + '<path d="'+d+'" fill="none" stroke="'+(up ? 'var(--accent)' : '#f97316')+'" stroke-width="2"/></svg>';
}
function resultsSplit(title, groups, unit){
  var keys = Object.keys(groups).filter(function(k){ return groups[k].length; });
  if (!keys.length) return '';
  var rows = keys.map(function(k){
    var st = resultsStats(groups[k], unit);
    return { k:k, st:st };
  }).sort(function(a,b){ return b.st.profit - a.st.profit; });
  return '<div class="res-split"><div class="res-split-h">'+esc(title)+'</div>'
    + rows.map(function(r){
        return '<div class="res-srow"><span class="res-sk">'+esc(r.k)+'</span>'
          + '<span class="res-sn">'+r.st.w+'-'+r.st.l+(r.st.v ? '-'+r.st.v : '')+'</span>'
          + '<span class="res-su">'+r.st.staked.toFixed(1)+'u</span>'
          + '<span class="res-sp '+(r.st.profit >= 0 ? 'pos' : 'neg')+'">'+(r.st.profit >= 0 ? '+' : '')+r.st.profit.toFixed(2)+'u</span>'
          + '<span class="res-sr">'+(r.st.roi >= 0 ? '+' : '')+Math.round(r.st.roi*100)+'%</span></div>';
      }).join('')+'</div>';
}
function resultsPage(){
  loadResults();
  var R = state.results;
  var h = '<div class="crew-head"><div class="crew-ttl"><i class="ti ti-trophy"></i> Just The Tip Results</div></div>';
  if (!R) return h + '<div class="empty"><i class="ti ti-loader"></i>Loading results\u2026</div>';
  if (!R.bets.length) return h + '<div class="empty">'+(R.missing
    ? 'No results file yet \u2014 data/results.json appears once the first bets are logged.'
    : 'No bets logged yet.')+'</div>';
  var unit = R.unitSize || 25;
  var sports = [];
  R.bets.forEach(function(b){ if (b.sport && sports.indexOf(b.sport) < 0) sports.push(b.sport); });
  var f = state.view.resSport || 'all', per = state.view.resPeriod || 'all';
  var cut = per === 'all' ? null : new Date(Date.now() - (per === '30' ? 30 : 90) * 864e5).toISOString().slice(0, 10);
  var bets = R.bets.filter(function(b){

  });
  h += '<div class="sl-bar"><button class="sl-chip'+(f === 'all' ? ' on' : '')+'" onclick="LAB.resSport(\'all\')">All sports</button>'
    + sports.map(function(sp){ return '<button class="sl-chip'+(f === sp ? ' on' : '')+'" onclick="LAB.resSport(\''+esc(sp)+'\')">'+esc(sp)+'</button>'; }).join('')
    + '</div><div class="sl-bar">'
    + [['all','All time'],['90','90 days'],['30','30 days']].map(function(o){
        return '<button class="sl-chip'+(per === o[0] ? ' on' : '')+'" onclick="LAB.resPeriod(\''+o[0]+'\')">'+o[1]+'</button>'; }).join('')
    + '</div>';
  var st = resultsStats(bets, unit);
  if (!st.n && !st.pend) return h + '<div class="sig-empty">Nothing settled in this view yet.</div>';
  h += '<div class="res-hero"><div class="res-big '+(st.profit >= 0 ? 'pos' : 'neg')+'">'
    + (st.profit >= 0 ? '+' : '')+st.profit.toFixed(2)+'<span>u</span></div>'
    + '<div class="res-kpis">'
    + '<div><b>'+(st.roi >= 0 ? '+' : '')+(st.roi*100).toFixed(1)+'%</b><span>ROI</span></div>'
    + '<div><b>'+st.w+'-'+st.l+(st.v ? '-'+st.v : '')+'</b><span>record</span></div>'
    + '<div><b>'+Math.round(st.strike*100)+'%</b><span>strike</span></div>'
    + '<div><b>'+st.staked.toFixed(1)+'u</b><span>staked</span></div>'
    + '</div></div>'
    + resultsCurve(st.curve)
    + '<div class="res-note">'+st.n+' settled bet'+(st.n === 1 ? '' : 's')
    + (st.pend ? ' \u00b7 '+st.pend+' still pending (counted nowhere until they land)' : '')
    + ' \u00b7 1 unit = 1 unit; stakes are never shown in dollars'
    + (R.updated ? ' \u00b7 updated '+esc(String(R.updated).replace('T', ' ').replace('Z', ' UTC')) : '')+'</div>';
  var bySport = {}, byType = {};
  bets.forEach(function(b){
    (bySport[b.sport || 'Other'] = bySport[b.sport || 'Other'] || []).push(b);
    (byType[b.type || 'Other'] = byType[b.type || 'Other'] || []).push(b);
  });
  h += '<div class="res-splits">'+resultsSplit('By sport', bySport, unit)+resultsSplit('By bet type', byType, unit)+'</div>';
  var recent = bets.slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)) || String(b.id).localeCompare(String(a.id)); }).slice(0, 25);
  h += '<div class="dayband"><span>Recent bets</span></div>'
    + recent.map(function(b){
        var u = (+b.stake || 0)/unit, pl = b.result === 'pending' ? null : ((b.returned == null ? 0 : +b.returned)/unit - u);
        return '<div class="res-bet"><span class="res-dt">'+esc(String(b.date || '').slice(5))+'</span>'
          + '<span class="res-sport">'+esc(b.sport || '')+'</span>'
          + '<span class="res-txt"><b>'+esc(b.bet || '')+'</b><i>'+esc(b.type || '')+(b.odds ? ' \u00b7 $'+(+b.odds).toFixed(2) : '')+' \u00b7 '+u.toFixed(2)+'u</i></span>'
          + '<span class="res-out '+(b.result === 'win' ? 'pos' : b.result === 'loss' ? 'neg' : 'mid')+'">'
          + (pl == null ? 'pending' : (pl >= 0 ? '+' : '')+pl.toFixed(2)+'u')+'</span></div>';
      }).join('');
  return h;
}

/* MY CARD ---------------------------------------------------------------------------
   The bet slip: singles and multis you've picked, kept in this browser (localStorage), each with
   your own stake. Singles can be combined into a multi. Nothing here is sent anywhere - it is your
   card, not a tip sheet, and it survives a refresh so it can be built before a slate and tracked
   during it.                                                                                    */
var CARD_KEY = 'jtt_lab_card';
var CARD = (function(){ try { var a = JSON.parse(localStorage.getItem(CARD_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; } })();
function cardSave(){ try { localStorage.setItem(CARD_KEY, JSON.stringify(CARD)); } catch(e){} }
function cardId(){ return 'c' + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
function cardKey(e){
  return e.type === 'multi'
    ? 'm|' + (e.legs || []).map(function(l){ return l.name + '@' + l.label; }).sort().join(',')
    : 's|' + [e.key, e.name, e.mkt, e.line, e.side].join('|');
}
function cardHas(e){ var k = cardKey(e); return CARD.some(function(x){ return cardKey(x) === k; }); }
function cardAdd(e){
  if (!e || !e.name) return false;
  if (cardHas(e)) return false;
  CARD.push(e); cardSave(); return true;
}
// rows carry their market as a label ("Points"); resolve it back to the stat key the live feed uses
function mktFromLabel(key, label){
  var mk = ((state.sports[key].config || {}).oddsMkts) || [];
  var hit = mk.filter(function(m){ return m[1] === label || m[0] === label; })[0];
  return hit ? hit[0] : String(label || '').toLowerCase();
}
function cardBtn(key, r, betLbl){
  var b = r && r.b; if (!b || !b.od) return '';
  var e = { id:cardId(), type:'single', key:key, name:r.name, team:(r.p && r.p.team) || '', opp:r.opp || '',
            mkt:mktFromLabel(key, betLbl), label:betLbl, line:b.od.line, side:b.side || 'over',
            odds:b.od.price, book:b.od.book || '', gamePk:(r.g && r.g.gamePk) != null ? r.g.gamePk : null, stake:null };
  return '<button class="card-add'+(cardHas(e) ? ' on' : '')+'" title="Add to my card" '
    + 'onclick="event.stopPropagation();LAB.cardAdd(this)" data-c="'+esc(JSON.stringify(e))+'">'
    + '<i class="ti ti-'+(cardHas(e) ? 'check' : 'plus')+'"></i></button>';
}
function cardCount(){ return CARD.length; }
function cardStake(e){ return +e.stake > 0 ? +e.stake : 0; }
function cardReturns(e){ return e.odds > 1 ? cardStake(e) * e.odds : 0; }
function cardTotals(){
  var st = 0, ret = 0, priced = 0;
  CARD.forEach(function(e){ st += cardStake(e); ret += cardReturns(e); if (e.odds > 1) priced++; });
  return { stake:st, ret:ret, priced:priced };
}
function cardRowHtml(e){
  var legs = e.type === 'multi'
    ? '<div class="cd-legs">' + e.legs.map(function(l){ return '<span>'+esc(l.name)+' <i>'+esc(l.label)+'</i>'+(l.odds ? ' $'+(+l.odds).toFixed(2) : '')+'</span>'; }).join('') + '</div>'
    : '';
  var title = e.type === 'multi' ? e.title : e.name;
  var sub = e.type === 'multi' ? e.legs.length+' legs'+(e.src ? ' \u00b7 '+esc(e.src) : '')
    : ((e.side === 'under' ? 'Under '+e.line : Math.ceil(e.line)+'+') + ' ' + esc(e.label || e.mkt)
       + (e.team ? ' \u00b7 '+esc(abbrOf(e.key, e.team))+' v '+esc(abbrOf(e.key, e.opp)) : ''));
  return '<div class="cd-row"><div class="cd-main"><b>'+esc(title)+'</b><span>'+sub+'</span>'+legs+'</div>'
    + '<div class="cd-odds">'+(e.odds > 1 ? '$'+(+e.odds).toFixed(2) : '<i>no price</i>')
    + (e.book ? '<i>'+esc(e.book)+'</i>' : '')+'</div>'
    + '<div class="cd-stake"><input type="number" inputmode="decimal" step="0.5" placeholder="stake" value="'
    + (e.stake == null ? '' : e.stake)+'" onchange="LAB.cardStake(\''+e.id+'\',this.value)"></div>'
    + '<div class="cd-ret">'+(cardReturns(e) ? '$'+cardReturns(e).toFixed(2) : '\u2014')+'</div>'
    + '<button class="cd-x" onclick="LAB.cardRemove(\''+e.id+'\')">&times;</button></div>';
}
function cardPanel(){
  if (!state.view.cardOpen) return '';

    ? CARD.map(cardRowHtml).join('')
      + '<div class="cd-tot"><span>'+CARD.length+' bet'+(CARD.length === 1 ? '' : 's')+'</span>'
      + '<span>staked <b>$'+t.stake.toFixed(2)+'</b></span>'
      + '<span>returns <b>$'+t.ret.toFixed(2)+'</b></span>'

      + '<div class="cd-acts"><button class="sl-chip" onclick="LAB.cardCombine()">Combine singles into a multi</button>'
      + '<button class="sl-chip" onclick="LAB.cardClear()">Clear card</button>'

  return '<div class="cmb-overlay open" onclick="if(event.target===this)LAB.cardClose()">'

function cardFab(){
  var n = cardCount();
  return '<button class="card-fab'+(n ? ' has' : '')+'" onclick="LAB.cardOpen()" title="My card">'

/* LIVE TRACKER ----------------------------------------------------------------------
   Every single on the card, matched to what the player has actually done so far, with a bar toward
   his line. It reads the sport's live worker (config.liveWorker) - only MLB has one today, so the
   others say so plainly rather than sitting on a spinner forever.
   "Pop out" uses the Document Picture-in-Picture API: a small always-on-top window you can leave
   beside the game. Chrome and Edge on desktop only; everywhere else keeps the in-page panel.     */
var LIVE = { data:{}, at:{}, timer:null, err:null, loading:false };
var LIVE_BAT = { H:'h', TB:'tb', HR:'hr', RBI:'rbi', R:'r', BB:'bb', K:'k', SB:'sb' };
var LIVE_PIT = { K:'k', ER:'er', OUTS:'outs', HA:'h', BB:'bb' };
function liveWorkerFor(key){ return ((state.sports[key].config || {}).liveWorker || '').replace(/\/+$/, ''); }
function liveGames(){                       // sports on the card that have a live feed at all
  var out = {};
  CARD.forEach(function(e){
    var keys = e.type === 'multi' ? (e.legs || []).map(function(l){ return l.key; }) : [e.key];
    keys.forEach(function(k){ if (k && liveWorkerFor(k)) out[k] = 1; });
  });
  return Object.keys(out);
}
function liveFetch(){
  var keys = liveGames();
  if (!keys.length) return;
  LIVE.loading = true;
  Promise.all(keys.map(function(k){
    return fetch(liveWorkerFor(k) + '/live?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (j) { LIVE.data[k] = j; LIVE.at[k] = Date.now(); } })
      .catch(function(){ LIVE.err = 'Live feed unavailable'; });
  })).then(function(){ LIVE.loading = false; if (state.view.liveOpen){ render(); livePaintPip(); } });
}
function livePoll(){
  clearTimeout(LIVE.timer);
  if (!state.view.liveOpen && !LIVE.pip) return;
  LIVE.timer = setTimeout(function(){ liveFetch(); livePoll(); }, 30000);
}
function liveFind(j, name, kind){
  var want = cmbNameKey(name), games = (j && j.games) || [];
  for (var i = 0; i < games.length; i++){
    var arr = (games[i][kind] || games[i].players || []);
    for (var n = 0; n < arr.length; n++){
      if (cmbNameKey(arr[n].name || '') === want) return { p:arr[n], g:games[i] };
    }
  }
  return null;
}
function liveStatFor(key, name, mkt){
  var j = LIVE.data[key]; if (!j) return null;
  var isPit = LIVE_PIT[mkt] != null && LIVE_BAT[mkt] == null;
  var hit = liveFind(j, name, isPit ? 'pitchers' : 'batters') || liveFind(j, name, isPit ? 'batters' : 'pitchers');
  if (!hit) return null;
  var field = (LIVE_BAT[mkt] != null && !isPit) ? LIVE_BAT[mkt] : LIVE_PIT[mkt];
  if (field == null) return null;
  return { v:+hit.p[field] || 0, game:hit.g };
}
function liveLegRows(){
  var legs = [];
  CARD.forEach(function(e){
    if (e.type === 'multi') (e.legs || []).forEach(function(l){ if (l.key) legs.push({ e:e, l:l, multi:e.title }); });
    else legs.push({ e:e, l:e, multi:null });
  });
  return legs.map(function(x){
    var l = x.l, st = l.key ? liveStatFor(l.key, l.name, l.mkt) : null;
    var line = parseFloat(l.line), need = Math.ceil(line), side = l.side || 'over';
    var have = st ? st.v : null;
    var state2 = have == null ? 'waiting'
      : side === 'over' ? (have >= need ? 'cashed' : 'open')
      : (have >= need ? 'busted' : 'open');
    return { name:l.name, label:(side === 'under' ? 'Under ' + l.line : need + '+') + ' ' + (l.label || l.mkt),
             have:have, need:need, side:side, state:state2, multi:x.multi,
             pct: (have == null || !need) ? 0 : Math.max(0, Math.min(1, have / need)) };
  });
}
function liveBody(compact){
  var keys = liveGames();
  if (!CARD.length) return '<div class="sig-empty">Nothing on your card to track.</div>';
  if (!keys.length) return '<div class="sig-empty">No live feed for the sports on your card yet '
    + '\u2014 only MLB has one. The card still tracks by hand.</div>';
  var rows = liveLegRows();
  var done = rows.filter(function(r){ return r.state === 'cashed'; }).length;
  var gone = rows.filter(function(r){ return r.state === 'busted'; }).length;
  return '<div class="lt-sum"><b>'+done+'</b> landed \u00b7 <b>'+gone+'</b> gone \u00b7 '

function render(){
  var loading = Object.keys(SPORTS).filter(function(k){ return state.sports[k].status==='loading'; });
  $('status').textContent = loading.length ? ('loading '+loading.join(', ')+'…') : 'ready';

  var tabs = [['fixture','ti-calendar','Fixture'],['crew','ti-flame','Degen Crew'],['odds','ti-coin','Odds'],['stats','ti-chart-bar','Stats'],['results','ti-trophy','Results']];
  var h = '<div class="tabs">'+tabs.map(function(t){
    return '<button class="tab'+(state.view.tab===t[0]?' on':'')+'" onclick="LAB.tab(\''+t[0]+'\')">'
      +'<i class="ti '+t[1]+'"></i>'+t[2]+'</button>'; }).join('')+'</div>';
  h += sportBar();

  if (state.view.focus){
    h = '' + focusPage();                       // focused fixture replaces the page
    $('app').innerHTML = configBanner() + h + playerPanel() + booksPanel() + cmbFab() + cmbPanel() + cardFab() + cardPanel() + livePanel();
    return;
  }
  if (state.view.tab === 'results'){
    h += resultsPage();
  } else if (state.view.tab === 'crew'){
    h += crewPage();
  } else if (state.view.tab === 'stats'){
    h += statsPage();
  } else if (state.view.tab === 'odds'){
    h += oddsPage();
  } else {
    var games = allGames();
    var nd = doneCount();
    if (nd) h += '<div class="done-bar"><button class="done-b'+(state.view.showDone?' on':'')+'" onclick="LAB.showDone()">'
      + '<i class="ti ti-history"></i>'+(state.view.showDone?'Hide':'Show')+' '+nd+' completed</button></div>';
    if (!games.length){
      h += '<div class="empty"><i class="ti ti-calendar-off"></i>'
        + (loading.length ? 'Loading fixtures…' : 'No fixtures for the selected sports.') + '</div>';
    } else {
      var lastDay = null;
      games.forEach(function(item){
        var dk = item.ms != null ? dayKey(item.ms) : 'tbc';
        if (dk !== lastDay){
          lastDay = dk;
          h += '<div class="dayband"><span>'+esc(item.ms != null ? localDate(item.ms) : 'Date TBC')+'</span></div>';
        }
        h += fixtureCard(item);
      });
    }
  }
  $('app').innerHTML = configBanner() + h + playerPanel() + booksPanel() + cmbFab() + cmbPanel() + cardFab() + cardPanel() + livePanel();
}

  },
  stMkt: function(k, m){ state.view.stMkt = state.view.stMkt || {}; state.view.stMkt[k] = m; render(); },
  stPos: function(k, p){ state.view.stPos = state.view.stPos || {}; state.view.stPos[k] = p; render(); },
  mbFix: function(i){ state.view.mbFix = +i; state.view.smDrop = {}; render(); },
  smDrop: function(n){
    state.view.smDrop = state.view.smDrop || {};
    if (state.view.smDrop[n]) delete state.view.smDrop[n]; else state.view.smDrop[n] = 1;
    render();
  },
  smAdd: function(){
    var fixes = mbFixtures(), f = fixes[Math.min(state.view.mbFix || 0, fixes.length - 1)];
    if (!f) return;
    var drop = state.view.smDrop || {};
    var legs = signalLegs(f.key, f.g).filter(function(l){ return !drop[l.name]; })
      .map(function(l){ return cmbLeg(f.key, l.p, [l.mkt, l.label], l.line, 'over'); }).filter(Boolean);
    if (!legs.length) return;
    state.view.cmbLegs = legs; state.view.cmbMode = 'multi';
    render();
  },
  mbMode: function(m){ state.view.mbMode = m; render(); },
  mbAdd: function(id){
    var fixes = mbFixtures(), f = fixes[Math.min(state.view.mbFix || 0, fixes.length - 1)];
    if (!f) return;
    var c = mbCandidates(f.key, f.g, state.view.mbMode || 'value').filter(function(x){ return x.id === id; })[0];
    if (!c) return;
    var legs = (state.view.cmbLegs || []).slice();
    var at = -1;
    legs.forEach(function(l, i){ if (l.key+'|'+l.p.name+'|'+l.mkt+'|'+l.line === id) at = i; });
    if (at >= 0) legs.splice(at, 1); else legs.push(mbToLeg(c));     // tap again to remove
    state.view.cmbLegs = legs;
    render();
  },
  mbAuto: function(){
    var fixes = mbFixtures(), f = fixes[Math.min(state.view.mbFix || 0, fixes.length - 1)];
    if (!f) return;
    var cands = mbCandidates(f.key, f.g, state.view.mbMode || 'value');
    var picked = mbAuto(cands, 3);
    if (!picked.length) return;
    state.view.cmbLegs = picked.map(mbToLeg);
    state.view.cmbMode = 'multi';                       // straight to the analysis
    render();
  },
  cmbLine: function(line){
    var r = state.view.cmbResult;
    if (!r || !r.leg) return;
    var l = r.leg;
    state.view.cmbResult = { leg: cmbLeg(l.key, l.p, [l.mkt, l.label], +line, l.side) };
    render();
  },
  cmbDrop: function(i){
    var l = (state.view.cmbLegs || []).slice();
    l.splice(i, 1); state.view.cmbLegs = l; render();
  },
  cmbQ_legacy: function(q){
    state.view.cmbQ = q;
    // re-render without stealing the caret: only the results list changes
    var el = $('app').querySelector('.cmb-hits, .empty');
    state.view.cmbSel = null;
    render();
    var inp = $('cmbInput');
    if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  },
  cmbPick: function(key, name){
    if (!key){ state.view.cmbSel = null; render(); return; }
    state.view.cmbSel = { key:key, name:name };
    var r = state.view.cmbRecent || [];
    r = r.filter(function(x){ return !(x.key === key && x.name === name); });
    r.unshift({ key:key, name:name });
    state.view.cmbRecent = r.slice(0, 6);
    ensureSport(key);
    render();
  },
  showDone: function(){ state.view.showDone = !state.view.showDone; render(); },
  books: function(k, player, market, line){ state.view.books = k ? {sport:k, player:player, market:market, line:line} : null; render(); },
  state: state
};

// boot: tier 1 for every sport (fixtures+teams are ~0 MB, so this is cheap)
Object.keys(SPORTS).forEach(loadTier1);
render();

})();
</script>
</body>
</html>
