  var S = state.sports[key], out = [];
  var stat = kind === 'sacks' ? 'sacks' : 'passInt';      // market keys; statOf maps sacks -> defSacks
  // sacks: opponent concedes sacks per dropback. picks: opponent's defence intercepts per throw.
  var oppRate = kind === 'sacks'
    ? function(opp){ return nflOppRate(key, opp, 'sacks', 'sacks_a', 'passAtt'); }
    : function(opp){ return nflOppRate(key, opp, 'passInt', 'passInt_a', 'passAtt_a'); };
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    var o = oppRate(opp);
    if (!o || o.mult < 1.08) return;                      // only a genuine leak, measured per chance
    playersOnTeam(key, team).forEach(function(p){
      if (!p || !isPlayingP(key, p.name, team)) return;
      if (kind === 'picks' && p.position !== 'QB') return;
      if (kind === 'sacks' && ['QB','RB','WR','TE','K'].indexOf(p.position) >= 0) return;
      var lg = leagueAvg(key, stat)[p.name];
      if (!lg || lg.games < 3 || !(lg.avg > 0)) return;
      if (kind === 'sacks' && lg.avg < 0.25) return;
      var od = bestPriceFor(key, p.name, stat);
      if (!od) return;                                    // a bet without a price is not a bet
      var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice()).slice(0, 10);
      // snap share: a three-down rusher and a rotational one are not the same bet
      var snaps = logs.map(function(r){ return r.snapPct != null ? +r.snapPct : null; })
        .filter(function(v){ return v != null; });
      var snap = snaps.length ? snaps.reduce(function(a,b){ return a+b; }, 0) / snaps.length : null;
      if (kind === 'sacks' && snap != null && snap < 35) return;
      // own volume: attempts for a QB, so the projection scales with how much he throws
      var vol = null;
      if (kind === 'picks'){
        var att = leagueAvg(key, 'passAtt')[p.name];
        vol = att ? att.avg : null;
      }
      var posDvp = dvpRankFor(key, opp, p.position, kind === 'sacks' ? 'defSacks' : 'passInt');
      var posMult = posDvp ? Math.max(0.8, Math.min(1.3, 1 + posDvp.pct/200)) : 1;
      var proj = lg.avg * o.mult * posMult;
      out.push({ name:p.name, p:p, opp:opp, stat:stat, avg:lg.avg, games:lg.games,
                 oppRate:o.rate, oppMult:o.mult, posDvp:posDvp, snap:snap, vol:vol, proj:proj,
                 price:od.price, line:od.line, book:od.book,
                 clears:(od.line != null ? proj - od.line : null),
                 score: proj });
    });
  });
  out.sort(function(a,b){ return b.score - a.score; });
  return { rows:out.slice(0, SIG_MAX_ROWS),
           why: kind === 'sacks'

             : 'No quarterback with a posted price faces a defence intercepting per throw 8%+ above league average.' };

function nflWeather(key, g){

  var w = (asArray(S.data.weather) || []).filter(function(x){
    return x && normTeam(x.home) === normTeam(g.home) && normTeam(x.away) === normTeam(g.away); })[0];
  if (!w) return { rows:[], why:'No forecast on file for this fixture.' };
  if (w.roof && w.roof !== 'outdoors' && w.roof !== 'open')
    return { rows:[], why:'Indoors at '+esc(w.venue || 'this venue')+' \u2014 weather is not an angle.' };
  var windy = w.wind != null && +w.wind >= WX_WIND;
  var wet = w.code != null && +w.code >= 61;
  if (!windy && !wet) return { rows:[], why:'Forecast is benign: '+Math.round(w.wind||0)+' km/h wind, '
    + esc(w.desc || 'clear')+'. Production flags wind at '+WX_WIND+'+ km/h or actual rain.' };
  var head = (windy ? Math.round(w.wind)+' km/h wind' : '') + (windy && wet ? ' + ' : '') + (wet ? (w.desc || 'rain') : '');
  var rows = [];
  [g.away, g.home].forEach(function(team){
    var rb = playersOnTeam(key, team).filter(function(p){
      return p.position === 'RB' && (leagueAvg(key, 'rushAtt')[p.name] || {}).games >= 3;
    }).sort(function(a,b){
      return ((leagueAvg(key,'rushAtt')[b.name]||{}).avg||0) - ((leagueAvg(key,'rushAtt')[a.name]||{}).avg||0);
    })[0];
    if (rb) rows.push({ name:rb.name, p:rb, team:team, why:'Lead back \u2014 conditions push teams to the ground',
      stat:'rushAtt', avg:(leagueAvg(key,'rushAtt')[rb.name]||{}).avg, dir:'up' });
    var deep = playersOnTeam(key, team).filter(function(p){
      var e = leagueAvg(key, 'recYds')[p.name];
      return e && e.games >= 3 && e.avg >= 45 && (p.position === 'WR' || p.position === 'TE');
    }).sort(function(a,b){
      return ((leagueAvg(key,'recYds')[b.name]||{}).avg||0) - ((leagueAvg(key,'recYds')[a.name]||{}).avg||0);
    })[0];
    if (deep) rows.push({ name:deep.name, p:deep, team:team, why:'Volume receiver \u2014 deep ball suffers in this',
      stat:'recYds', avg:(leagueAvg(key,'recYds')[deep.name]||{}).avg, dir:'down' });
  });
  return { rows:rows, head:head, venue:w.venue, temp:w.temp,
           why:'No qualifying runner or receiver on this fixture.' };
}

function impliedTeamTotal(key, team, opp){

function tuddyProfile(key, r){

/* CONDITIONS ------------------------------------------------------------------
   Team-level, so it sits with the match rather than in the signal stack, and it runs for any
   sport with a forecast. What the weather DOES differs by sport, so the read does too:
     NFL  wind kills the deep ball and pushes teams to the ground
     AFL  wind and wet suppress marking and clean disposal, lift tackles and stoppages
     MLB  the forecast comes with the park's own HR factor, so it is about the ball carrying
   EPL ships no forecast at all, so nothing is claimed for it.                                */
var WX_SPORT = {
  nfl: { wind:25, up:[['rushAtt','more carries']], down:[['recYds','deep passing']] },
  afl: { wind:25, up:[['tackles','contested football']], down:[['marks','clean marking']] },
  mlb: { wind:20, up:[], down:[] }

function conditionsFor(key, g){
  var S = state.sports[key];
  var w = (asArray(S.data.weather) || []).filter(function(x){
    return x && normTeam(x.home) === normTeam(g.home) && normTeam(x.away) === normTeam(g.away); })[0];
  if (!w && key === 'mlb' && g.weather) w = { temp:g.weather.tempF, wind:g.weather.windMph,
    desc:g.weather.summary, code:null, venue:(g.park || {}).name, roof:(g.park || {}).roof,
    hrMult:g.weather.hrMult, effect:g.weather.effect, imperial:true };
  return w || null;
}
function conditionsSection(key, g){
  var w = conditionsFor(key, g);
  if (!w) return '';
  var cfg = WX_SPORT[key] || { wind:25, up:[], down:[] };
  var windKmh = w.imperial ? +w.wind * 1.609 : +w.wind;
  var indoors = w.roof && w.roof !== 'outdoors' && w.roof !== 'open';
  var windy = isFinite(windKmh) && windKmh >= cfg.wind;
  var wet = (w.code != null && +w.code >= 61) || (+w.rainProb >= 60);
  var bits = [];

  if (w.wind != null) bits.push(Math.round(w.wind)+(w.imperial ? ' mph' : ' km/h')+' wind');
  if (w.desc) bits.push(esc(w.desc));
  if (w.rainProb != null && !w.imperial) bits.push(Math.round(w.rainProb)+'% rain');
  var head = bits.join(' \u00b7 ');
  var verdict, cls;
  if (indoors){ verdict = 'Indoors \u2014 no weather angle'; cls = ''; }
  else if (windy && wet){ verdict = 'Wind and wet'; cls = 'bad'; }
  else if (windy){ verdict = 'Windy'; cls = 'bad'; }
  else if (wet){ verdict = 'Wet'; cls = 'bad'; }
  else { verdict = 'Benign'; cls = 'good'; }
  var lines = [];

    cfg.up.forEach(function(x){ lines.push(['up', 'More '+x[1]+' \u2014 '+mktLabel(key, x[0])+' trends up']); });
    cfg.down.forEach(function(x){ lines.push(['down', 'Less '+x[1]+' \u2014 '+mktLabel(key, x[0])+' trends down']); });
  }
  if (key === 'mlb' && w.hrMult != null && Math.abs(w.hrMult - 1) > 0.02)
    lines.push([w.hrMult > 1 ? 'up' : 'down',

      + (w.hrMult > 1 ? '+' : '')+Math.round((w.hrMult - 1)*100)+'%'

    + '<div class="ca-bv" style="color:'+(cls === 'bad' ? '#f97316' : (cls === 'good' ? 'var(--accent)' : 'var(--text)'))+'">'

        return '<span class="gl-chip '+(l[0] === 'up' ? 'good' : 'bad')+'">'+l[1]+'</span>'; }).join('')+'</div>' : '')
    + '</div>';
}

/* NFL MATCHUP SECTIONS ---------------------------------------------------------

var RADAR_AXES = {
  QB: [['passYds','Pass Yds','passYds'],['passComp','Comp','passComp'],['passTds','Pass TDs','passTds'],
       ['passAtt','Attempts','passAtt'],['passInt','INTs','passInt',1]],
  WR: [['recYds','Rec Yds','recYds'],['receptions','Rec','receptions'],['targets','Targets','targets'],
       ['recTds','Rec TDs','recTds'],['longRec','Long','longRec']],
  TE: [['recYds','Rec Yds','recYds'],['receptions','Rec','receptions'],['targets','Targets','targets'],
       ['recTds','Rec TDs','recTds']],
  RB: [['rushYds','Rush Yds','rushYds'],['rushAtt','Carries','rushAtt'],['receptions','Rec','receptions'],
       ['rushTds','Rush TDs','rushTds'],['longRush','Long','longRush']]

var RADAR_DEPTH = { QB:2, RB:3, WR:5, TE:3 };
function pctOf(v, arr){
  var a = arr.filter(function(x){ return x != null && isFinite(x); }).sort(function(x,y){ return x-y; });
  if (!a.length || v == null) return 0.5;
  var below = 0;
  a.forEach(function(x){ if (x < v) below++; });
  return below / a.length;
}
function radarBuild(key, p, opp){
  var S = state.sports[key], axes = RADAR_AXES[p.position];
  if (!axes) return null;
  var dRows = (asArray(S.data.dvp) || []).filter(function(r){ return r.pos === p.position; });
  if (dRows.length < 10) return null;
  var oppRow = null;
  dRows.forEach(function(r){ if (normTeam(r.team) === normTeam(opp)) oppRow = r; });
  if (!oppRow) return null;
  var peers = (S.idx.players || []).filter(function(x){ return x.position === p.position; });
  var out = [];
  axes.forEach(function(ax){
    var pk = ax[0], lab = ax[1], dk = ax[2], inv = !!ax[3];
    var mine = (leagueAvg(key, pk)[p.name] || {}).avg;
    var dv = oppRow[dk];
    if (mine == null || dv == null) return;
    var peerVals = peers.map(function(x){ return (leagueAvg(key, pk)[x.name] || {}).avg; });
    var pPct = pctOf(mine, peerVals);
    if (inv) pPct = 1 - pPct;
    var dAll = dRows.map(function(r){ return +r[dk]; }).filter(function(x){ return isFinite(x); });
    var ord = dAll.slice().sort(function(a,b){ return inv ? (a-b) : (b-a); });
    var rank = 1;
    ord.forEach(function(x){ if (inv ? (x < +dv) : (x > +dv)) rank++; });
    var dPct = dAll.length > 1 ? 1 - (rank-1)/(dAll.length-1) : 0.5;
    out.push({ lab:lab, pPct:pPct, dPct:dPct, rank:rank, of:dAll.length, val:mine });
  });
  return out.length >= 3 ? out : null;
}
function radarSVG(rows){

    + poly(function(r){ return r.pPct; }, '')

function radarSection(key, g){

/* Coverage Matchup: man/zone tendency and the receivers whose splits exploit it */
function coverageSection(key, g){

    }).map(function(p){

/* Kicker Matchup: a pick, not a read - projection against the posted line, with the range

function kickerRows(key, g){

  var wind = w ? +w.wind || 0 : 0;

  var windMult = indoor ? 1.05 : (wind > 25 ? 0.88 : (wind > 15 ? 0.95 : 1));
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).filter(function(p){ return p.position === 'K'; }).forEach(function(p){
      var inj = injuryFor(key, team, p.name);
      if (inj && /out|doubtful/i.test(inj.label)) return;
      if (!hasAnyOddsFor(key, p.name)) return;
      var kp = (leagueAvg(key, 'kickingPts')[p.name] || {}).avg;
      var fga = (leagueAvg(key, 'fgAtt')[p.name] || {}).avg;
      var lng = (leagueAvg(key, 'fgLong')[p.name] || {}).avg;
      if (kp == null && fga == null) return;
      // range profile: how much of his work is from distance, which is what wind punishes
      var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice()).slice(0, 10);
      var band = function(f){
        var t = 0; logs.forEach(function(r){ t += +r[f] || 0; });
        return logs.length ? t / logs.length : 0;
      };
      var short = band('fg0_39'), mid = band('fg40_49'), long = band('fg50p');
      // opponent context: how many points kickers have taken off them
      var dr = dvpRankFor(key, opp, 'K', 'kickingPts');
      var oppMult = dr ? Math.max(0.85, Math.min(1.2, 1 + dr.pct/200)) : 1;
      var proj = kp != null ? kp * windMult * oppMult : null;
      var picks = [];
      [['kickingPts', kp, 'Kicking pts'], ['fgMade', fga, 'FG made']].forEach(function(m){
        var od = bestPriceFor(key, p.name, m[0]);
        if (!od || m[1] == null) return;
        var projm = m[0] === 'kickingPts' ? proj : m[1] * windMult * oppMult;
        picks.push({ mkt:m[0], label:m[2], od:od, proj:projm, own:m[1],
                     good:(projm != null && od.line != null && projm > od.line + 0.3) });
      });
      out.push({ p:p, team:team, opp:opp, kp:kp, fga:fga, lng:lng, short:short, mid:mid, long:long,

                 score:(picks.filter(function(x){ return x.good; }).length ? 1 : 0) * 100 + (proj || 0) });
    });
  });

  return out;

              + ' \u00b7 proj '+(x.proj != null ? x.proj.toFixed(1) : '\u2014')
              + (x.good ? ' \u2713' : ''); }).join(' \u00b7 ')
        : 'no posted kicking market')+'</div>'
    + '<div class="gl-why">'
      + '<span class="gl-chip">'+(r.kp != null ? r.kp.toFixed(1) : '\u2014')+' pts/gm</span>'

      + '<span class="gl-chip">range '+pct(r.short)+'/'+pct(r.mid)+'/'+pct(r.long)+' by 40/50+</span>'
      + '<span class="gl-chip'+(r.windMult > 1 ? ' good' : (r.windMult < 1 ? ' bad' : ''))+'">'
        + (r.indoor ? 'indoors' : Math.round(r.wind)+' km/h')+'</span>'
      + (r.dr ? '<span class="gl-chip'+(r.dr.pct > 0 ? ' good' : '')+'">'+esc(abbrOf(key, r.opp))

      + (r.proj != null ? r.proj.toFixed(1) : '\u2014')+'</div><div class="gl-evl">PROJ PTS</div></div></div>';
}

/* TACKLE MACHINES ---------------------------------------------------------------
   Ported from nfl/signals.js with production's thresholds: 6+ games, 65% hit rate, 4.5+ per
   game, 60%+ snap share, and dropped when the opponent STARVES the position of tackle chances
   (DVP 15%+ below average). Scored on hit rate plus the tackle funnel, with a bump for a
   high-volume or run-heavy opponent and for three-down players.

   All three sports post a tackles market, so all three get a version - but the shape of the bet
   is different in each, so the gates are:
     NFL  defenders only (LB/DL/DB), 4.5+ per game, snap share matters
     AFL  a midfield/forward pressure stat, so no position gate and a lower bar
     EPL  defensive midfielders and full-backs; the market sits at 0.5-2.5, so the bar is lower
   Every version requires a posted price.                                                      */
var WRAP_CFG = {
  nfl: { pos:['LB','DL','DB'], minAvg:4.5, minSnap:60, hit:0.65, minG:6, starve:-15 },
  afl: { pos:null,             minAvg:3.5, minSnap:0,  hit:0.65, minG:6, starve:-15 },
  epl: { pos:null,             minAvg:1.8, minSnap:0,  hit:0.60, minG:6, starve:-15 }
};
function oppVolume(key, opp){
  var rows = asArray(state.sports[key].data.teams) || [];
  var arr = rows.filter(function(t){ return t.plays != null; });
  if (!arr.length) return null;
  var me = null;
  arr.forEach(function(t){ if (normTeam(t.team) === normTeam(opp)) me = t; });
  if (!me) return null;
  var byPlays = arr.slice().sort(function(a,b){ return (+b.plays||0) - (+a.plays||0); });
  var byRush = arr.slice().sort(function(a,b){ return (+b.rushAtt||0) - (+a.rushAtt||0); });
  var idx = function(list){ var n = 0; list.forEach(function(t, i){ if (t === me) n = i + 1; }); return n; };
  return { plays:+me.plays || 0, playsRank:idx(byPlays), rushAtt:+me.rushAtt || 0,
           rushRank:idx(byRush), n:arr.length };
}
function tackleMachines(key, g){
  var cfg = WRAP_CFG[key];
  if (!cfg) return { rows:[], why:'' };
  var S = state.sports[key], out = [];
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    var vol = oppVolume(key, opp);
    playersOnTeam(key, team).forEach(function(p){
      if (!p || !isPlayingP(key, p.name, team)) return;
      if (cfg.pos && cfg.pos.indexOf(p.position) < 0) return;
      if (!hasAnyOddsFor(key, p.name)) return;
      var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice());
      var vals = [];
      logs.forEach(function(r){ var v = statOf(key, r, 'tackles'); if (v != null) vals.push(v); });
      if (vals.length < cfg.minG) return;
      var avg = vals.reduce(function(a,b){ return a+b; }, 0) / vals.length;
      if (avg < cfg.minAvg) return;
      // snap share, where the sport records it: a rotational defender is a different bet
      var snaps = logs.slice(0, 10).map(function(r){ return r.snapPct != null ? +r.snapPct : null; })
        .filter(function(v){ return v != null; });
      var snap = snaps.length ? snaps.reduce(function(a,b){ return a+b; }, 0) / snaps.length : null;
      if (cfg.minSnap && snap != null && snap < cfg.minSnap) return;
      // The line has to be the one his record supports, not the best-priced rung on the ladder -
      // that is always the hardest number and nobody clears it. Walk the rungs hardest-first and
      // take the first he still clears at the required rate; NFL's two-way line is in this list too.
      var cands = streakCandidates(key, p.name, 'tackles')
        .filter(function(c){ return c.price >= STREAK_ODDS_FLOOR; });
      if (!cands.length) return;
      var od = null, line = null, hits = 0, rate = 0;
      for (var ci=0; ci<cands.length; ci++){
        var c = cands[ci];
        var h = vals.filter(function(v){ return v > c.line; }).length;
        var rt = h / vals.length;
        if (rt >= cfg.hit){ od = c; line = c.line; hits = h; rate = rt; break; }
      }
      if (!od) return;
      var funnel = dvpRankFor(key, opp, p.position || p.pos, 'tackles');
      if (funnel && funnel.pct <= cfg.starve) return;       // they starve this position of chances
      var score = rate*100 + (funnel ? funnel.pct*0.7 : 0)
        + (vol && vol.playsRank <= 8 ? 6 : 0)
        + (vol && vol.rushRank <= 8 && p.position !== 'DB' ? 6 : 0)
        + (snap != null && snap >= 90 ? 4 : 0);
      out.push({ name:p.name, p:p, team:team, opp:opp, line:line, price:od.price, book:od.book,
                 hits:hits, n:vals.length, rate:rate, avg:avg, funnel:funnel, vol:vol, snap:snap,
                 last:vals.slice(0, 8), score:score });
    });
  });
  out.sort(function(a,b){ return b.score - a.score; });
  return { rows:out.slice(0, SIG_MAX_ROWS),
           why:'No '+(cfg.pos ? 'defender' : 'player')+' with a posted tackles price clears their line in '
             + Math.round(cfg.hit*100)+'% of games against an opponent that concedes them.' };
}
function tackleRow(key, r){
  var seq = r.last.slice().reverse();
  var mx = Math.max.apply(null, seq.concat([r.line])) || 1;
  return '<div class="stk-row chunk-row" onclick="LAB.player(\'' + key + '\',\'' + esc(r.name).replace(/'/g,"\\'") + '\')">'
    + playerImgP(key, r.name, 28)
    + '<div class="stk-left"><div class="stk-nm"><b>'+esc(r.name)+'</b><span class="stk-tag">'
      + esc((posShortP(r.p) ? posShortP(r.p)+' \u00b7 ' : '')+abbrOf(key, r.team))+'</span></div>'
    + '<div class="stk-bet">'+Math.ceil(r.line)+'+ '
      // NFL's tackles column is solo + assisted on every row, and the market is priced that
      // way too - naming it plainly stops it reading as solo tackles
      + (key === 'nfl' ? 'Tackles + Ast' : 'Tackles')+' \u00b7 v '+esc(abbrOf(key, r.opp))
      + ' \u00b7 avg '+r.avg.toFixed(1)
      + (r.snap != null ? ' \u00b7 '+Math.round(r.snap)+'% snaps' : '')
      + (r.funnel ? ' \u00b7 funnel '+(r.funnel.pct > 0 ? '+' : '')+r.funnel.pct.toFixed(0)+'%' : '')
      + (r.vol && r.vol.playsRank <= 8 ? ' \u00b7 #'+r.vol.playsRank+' in plays' : '')
      + (r.vol && r.vol.rushRank <= 8 ? ' \u00b7 #'+r.vol.rushRank+' in carries' : '')
      + '</div>'
    + '<div class="stk-pips">'+seq.map(function(v){
        return '<span class="stk-pip'+(v > r.line ? '' : ' miss')+'"><i style="height:'
          + Math.max(6, Math.round(v/mx*100))+'%"></i></span>'; }).join('')+'</div>'
    + '<div class="stk-vals">'+seq.map(function(v){
        return '<span>'+(v % 1 ? v.toFixed(1) : v)+'</span>'; }).join('')+'</div></div>'
    + '<div class="stk-right"><div class="stk-hit">'+Math.round(r.rate*100)+'%</div>'
      + '<div class="stk-hitl">'+r.hits+'/'+r.n+' GAMES</div>'
      + '<div class="stk-odds">$'+r.price.toFixed(2)+'</div>'
      + '<span class="stk-book">'+esc(r.book||'')+'</span></div></div>';
}

/* DEJA VU SGM -------------------------------------------------------------------
   The premise: find players who have cleared a line in EVERY one of the last N meetings between
   these two clubs, set the line at their minimum across those meetings (so it held every time),
   price it, and stack them into a same-game multi.

   Production's controls kept: a hit-streak stepper (how many straight meetings), a leg count,
   and one-leg-per-player. Added here: the correlated joint probability, because these legs are
   all from the same match and multiplying them straight overstates the multi badly.            */
function dvMeetings(key, g){
  var S = state.sports[key], seen = {};
  [g.home, g.away].forEach(function(t){
    playersOnTeam(key, t).forEach(function(p){
      ((S.idx.logsByName || {})[p.name] || []).forEach(function(r){
        var o = oppOf(key, r);
        if (!o) return;
        var mine = r.Team || r.team;
        var pair = [normTeam(mine), normTeam(o)].sort().join('|');
        if (pair !== [normTeam(g.home), normTeam(g.away)].sort().join('|')) return;
        var d = String(r.date || r.Date || '').slice(0, 10)
          || ((r.Year||r.year)+'|'+(r.RoundName != null ? r.RoundName : r.Week));
        seen[d] = (logMs(r) || logSeq(r));
      });
    });
  });
  return Object.keys(seen).sort(function(a,b){ return seen[b] - seen[a]; });
}
function dvLegs(key, g, meets){
  var S = state.sports[key], dates = dvMeetings(key, g).slice(0, meets), out = [];
  if (dates.length < meets) return { legs:[], dates:dates };
  var dset = {}; dates.forEach(function(d){ dset[d] = 1; });
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!isPlayingP(key, p.name, team) || !hasAnyOddsFor(key, p.name)) return;
      // A player's history against this opponent only counts if he was wearing THIS shirt.
      // Jauan Jennings faced the Bears three times for San Francisco and once for Minnesota;
      // counting the 49ers games as Vikings meetings invents a streak that never existed.
      var rows = ((S.idx.logsByName || {})[p.name] || []).filter(function(r){
        var d = String(r.date || r.Date || '').slice(0, 10)
          || ((r.Year||r.year)+'|'+(r.RoundName != null ? r.RoundName : r.Week));
        if (!dset[d]) return false;
        var worn = r.Team || r.team;
        return !worn || normTeam(worn) === normTeam(team);
      });
      if (rows.length < meets) return;
      var only = state.view.dvMkts;
      posMarkets(key, p).forEach(function(m){
        if (only && only.length && only.indexOf(m[0]) < 0) return;
        var vals = [];
        rows.forEach(function(r){ var v = statOf(key, r, m[0]); if (v != null) vals.push(v); });
        if (vals.length < meets) return;
        var lo = Math.min.apply(null, vals);
        if (!(lo > 0)) return;
        // the line he cleared every time, priced where the book has it
        var od = bookPriceFor(key, p.name, m[0], lo - 0.5, state.view.dvBook);
        if (!od || od.price < STREAK_ODDS_FLOOR) return;
        var lo2 = state.view.dvMin, hi2 = state.view.dvMax;
        if (lo2 != null && od.price < lo2) return;
        if (hi2 != null && od.price > hi2) return;
        out.push({ name:p.name, p:p, team:team, opp:opp, mkt:m[0], label:m[1], line:lo,
                   vals:vals, price:od.price, book:od.book, strength:lo * od.price });
      });
    });
  });
  out.sort(function(a,b){ return b.strength - a.strength; });
  return { legs:out, dates:dates };
}
function dejaVuSection(key, g){
  var avail = dvMeetings(key, g).length;
  if (!avail) return '';
  var meets = Math.min(Math.max(1, state.view.dvMeets || 3), avail);
  var hail = !!state.view.dvHail;
  var res = dvLegs(key, g, meets);
  var distinct = {};
  res.legs.forEach(function(l){ distinct[l.name] = 1; });
  var distinctN = Object.keys(distinct).length;
  // Hail Mary: every qualifying player, one leg each, however long that gets
  var legN = hail ? Math.max(1, distinctN) : Math.max(2, Math.min(state.view.dvLegs || 3, 6));
  var allMkts = (state.sports[key].config || {}).oddsMkts || [];
  var only = state.view.dvMkts;
  var ctrl = '<div class="deja-ctrl">'
    + '<span class="deja-step">Hit streak<button onclick="LAB.dvMeets(-1)"'+(meets <= 1 ? ' disabled' : '')+'>\u2212</button>'
      + '<b>'+meets+'</b><button onclick="LAB.dvMeets(1)"'+(meets >= avail ? ' disabled' : '')+'>+</button>/'+avail+'</span>'
    + '<span class="deja-step">Legs<button onclick="LAB.dvLegs(-1)"'+(legN <= 2 || hail ? ' disabled' : '')+'>\u2212</button>'
      + '<b>'+legN+'</b><button onclick="LAB.dvLegs(1)"'+(hail ? ' disabled' : '')+'>+</button></span>'
    + '<button class="sl-chip'+(hail ? ' on' : '')+'" onclick="LAB.dvHail()">Hail Mary</button>'
    + '<span class="deja-step">Odds'
      + '<input type="number" step="0.05" min="1" value="'+(state.view.dvMin != null ? state.view.dvMin : '')
      + '" placeholder="min" style="width:52px" onchange="LAB.dvOdds(\'min\',this.value)">'
      + '<input type="number" step="0.05" min="1" value="'+(state.view.dvMax != null ? state.view.dvMax : '')
      + '" placeholder="max" style="width:52px" onchange="LAB.dvOdds(\'max\',this.value)"></span></div>'
    + '<div class="sl-bar">'
      + '<button class="sl-chip'+(!state.view.dvBook ? ' on' : '')+'" onclick="LAB.dvBook(\'\')">Best price</button>'
      + booksFor(key).slice(0, 10).map(function(b){
          return '<button class="sl-chip'+(state.view.dvBook === b ? ' on' : '')+'" onclick="LAB.dvBook(\''
            + esc(b).replace(/'/g,"\\'")+'\')">'+esc(b)+'</button>'; }).join('')+'</div>'
    + '<div class="sl-bar">'
      + '<button class="sl-chip'+(!only || !only.length ? ' on' : '')+'" onclick="LAB.dvMkt(null)">All markets</button>'
      + allMkts.slice(0, 8).map(function(m){
          return '<button class="sl-chip'+(only && only.indexOf(m[0]) >= 0 ? ' on' : '')
            + '" onclick="LAB.dvMkt(\''+m[0]+'\')">'+esc(m[1])+'</button>'; }).join('')+'</div>';
  if (!res.legs.length)
    return '<div class="dayband"><span>D\u00e9j\u00e0 Vu SGM</span></div>'+ctrl
      + '<div class="sig-empty">No player with a posted price cleared a line in all '+meets
      + ' straight meetings between these clubs. Lower the hit streak to widen the pool.</div>';
  // one leg per player, best first
  var seen = {}, picked = [];
  var dropped = state.view.dvDrop || {};
  res.legs.forEach(function(l){
    if (dropped[l.name]) return;                       // removed from the Hail Mary by hand
    if (picked.length < legN && !seen[l.name]){ seen[l.name] = 1; picked.push(l); }
  });
  var legs = picked.map(function(l){ return cmbLeg(key, l.p, [l.mkt, l.label], l.line - 0.5, 'over'); })
    .filter(function(l){ return l && l.prob != null; });
  var comb = picked.reduce(function(a,l){ return a * l.price; }, 1);
  var joint = (picked.length > 1 && legs.length === picked.length) ? cmbJoint(legs) : null;
  if (joint == null || !isFinite(joint) || joint <= 0) joint = null;
  var fair = joint ? 1/joint : null;
  return '<div class="dayband"><span>D\u00e9j\u00e0 Vu SGM</span></div>'+ctrl
    + picked.map(function(l){
        return '<div class="deja-card">'+playerImgP(key, l.p, 26)
          + '<div class="deja-m"><b>'+esc(l.name)+'</b><span>'+Math.ceil(l.line)+'+ '+esc(l.label)
          + ' \u00b7 '+esc(abbrOf(key, l.team))+' \u00b7 <span class="deja-vals">'+l.vals.join(' / ')+'</span></span></div>'
          + '<span class="deja-px">$'+l.price.toFixed(2)+'</span>'
          + (hail ? '<button class="cmb-leg-x" onclick="LAB.dvDrop(\''+esc(l.name).replace(/'/g,"\\'")
              + '\')">&times;</button>' : '')+'</div>';
      }).join('')
    + '<div class="deja-sum">'
      + '<div class="cmb-sum-row"><span>Combined at the book</span><b>$'+comb.toFixed(2)+'</b></div>'
      + (joint != null ? '<div class="cmb-sum-row"><span>Correlated model</span><b>'+cmbOdds(joint)+'</b></div>'
        + '<div class="cmb-sum-row tot"><span>Fair price</span><b>$'+fair.toFixed(2)+'</b></div>'
        + '<div class="cmb-sum-row"><span>Edge</span><b class="'+(comb*joint - 1 > 0 ? 'cmb-vscore good' : 'cmb-vscore bad')
        + '" style="font-size:14px">'+((comb*joint - 1) > 0 ? '+' : '')+Math.round((comb*joint-1)*100)+'%</b></div>' : '')
      + '<div class="cmb-corr">Every leg cleared its line in all '+meets+' straight meetings between these '
      + 'clubs, in this shirt \u2014 games played for a former club do not count. Lines are each '
      + 'player\u2019s minimum across those games, so the record held every time.'
      + (state.view.dvBook ? ' Priced at '+esc(state.view.dvBook)+', so the whole multi is placeable there.'
         : ' Best price per leg \u2014 pick a book to make it placeable as one ticket.')+'</div>'
      + '<button class="pc-add" onclick="LAB.dvAdd()">Send to Check My Multi</button></div>';
}
/* JUPITER ------------------------------------------------------------------------
   The orb: every priced player in the fixture placed by how hot they are for one market.
   Radius is the calibrated model probability at their line - outer rim is hotter - and colour
   is the edge against the posted price. Tap a dot to add it to the slip.                       */

/* Jupiter's fourth axis needs to know where a past game was played and whether the player was
   at home. Each sport stores that differently:
     MLB  venue and home on the row
     NFL / EPL  a home flag only - the ground is the home side's, so a venue is its home team
     AFL  neither on the row; joined to results.json by year + round + club (98% of rows)      */
function rowVenue(key, r){
  var S = state.sports[key];
  if (key === 'mlb') return { venue:r.venue || null, home:(r.home == null ? null : !!r.home) };
  if (key === 'afl'){
    if (!S.idx.resIdx){
      var ix = {};
      (asArray(S.data.results) || []).forEach(function(m){
        [m.home, m.away].forEach(function(t){ ix[m.year+'|'+m.round+'|'+normTeam(t)] = m; });
      });
      S.idx.resIdx = ix;
    }
    var rd = +(String(r.RoundName || '').match(/\d+/) || [0])[0];
    var m = S.idx.resIdx[(r.Year||r.year)+'|'+rd+'|'+normTeam(r.Team || r.team)];
    return m ? { venue:m.venue, home:normTeam(m.home) === normTeam(r.Team || r.team) } : { venue:null, home:null };
  }
  var h = r.home == null ? null : !!(+r.home || r.home === true);
  var mine = r.Team || r.team, opp = oppOf(key, r);
  return { venue:(h == null ? null : 'home:'+normTeam(h ? mine : opp)), home:h };
}
var J_AXES = [['h2h','H2H',-Math.PI/2],['season','Season',0],['l10','L10',Math.PI/2],['venue','Venue',Math.PI]];
function jRates(key, p, mkt, line, opp, g){
  var S = state.sports[key];
  var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice());
  var season = curSeason(key);
  var isHome = normTeam(p.team) === normTeam(g.home);
  var venueKey = key === 'afl' || key === 'mlb' ? (g.venue || (g.park || {}).name) : 'home:'+normTeam(g.home);
  var mode = state.view.jVenue || 'venue';
  var acc = { season:[0,0], h2h:[0,0], l10:[0,0], venue:[0,0] };
  logs.forEach(function(r, i){
    var v = statOf(key, r, mkt);
    if (v == null) return;
    var hit = v > line ? 1 : 0;
    if ((+(r.Year||r.year)||0) === season){ acc.season[0] += hit; acc.season[1]++; }
    if (i < 10){ acc.l10[0] += hit; acc.l10[1]++; }
    var o = oppOf(key, r);
    if (o && opp && normTeam(o) === normTeam(opp)){ acc.h2h[0] += hit; acc.h2h[1]++; }
    var vi = rowVenue(key, r);
    var matchV = mode === 'venue'
      ? (vi.venue != null && venueKey != null && String(vi.venue).toLowerCase() === String(venueKey).toLowerCase())
      : (vi.home != null && vi.home === isHome);
    if (matchV){ acc.venue[0] += hit; acc.venue[1]++; }
  });
  var out = {};
  Object.keys(acc).forEach(function(k){ out[k] = acc[k][1] ? acc[k][0] / acc[k][1] : null; out[k+'N'] = acc[k][1]; });
  return out;
}
// Production's geometry: radius is overall strength (mean hit rate across the axes that have a
// sample), angle is the hit-rate-weighted vector - so a dot drifts toward the windows where the
// player actually delivers. A dot sitting left means "venue player", top means "owns this opponent".
function jPos(rates){
  var avail = J_AXES.map(function(a){ return rates[a[0]]; }).filter(function(v){ return v != null; });
  if (!avail.length) return null;
  var strength = avail.reduce(function(a,b){ return a+b; }, 0) / avail.length;
  var vx = 0, vy = 0;
  J_AXES.forEach(function(a){ var r = rates[a[0]]; if (r != null){ vx += r*Math.cos(a[2]); vy += r*Math.sin(a[2]); } });
  var angle = (Math.abs(vx) < 1e-6 && Math.abs(vy) < 1e-6) ? -Math.PI/2 : Math.atan2(vy, vx);
  return { strength:strength, angle:angle };
}
function jupiterData(key, g){
  var S = state.sports[key], mkt = state.view.jMkt;
  var mkts = (S.config || {}).oddsMkts || [];
  if (!mkt || !mkts.some(function(m){ return m[0] === mkt; })) mkt = (mkts[0] || [])[0];
  var hide = state.view.jHide || {};
  var out = [];
  [g.away, g.home].forEach(function(team){
    if (hide[team]) return;
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){

/* AFL-SPECIFIC SIGNALS + LET'S CLIMB -----------------------------------------------------
   Ported from the production AFL tool, each with the reasoning kept and one improvement where
   the data supports it. All are priced: a signal that names no bet is not a tip.              */
function modelProbAt(key, p, mkt, line, opp){
  var S = state.sports[key], raw = null;
  try { if (S.scoring && S.scoring.prob) raw = S.scoring.prob(p, mkt, line, opp); } catch(e){}
  if (raw == null){
    try { var sc = S.scoring && S.scoring.scoreCMP ? S.scoring.scoreCMP(p, mkt, line, opp) : null;
      if (sc != null && isFinite(sc)) raw = Math.max(0.01, Math.min(0.99, sc/20 + 0.5)); } catch(e){}
  }

function statVals(key, name, mkt, rows){
  var out = [];

    .forEach(function(r){ var v = statOf(key, r, mkt); if (v != null) out.push(v); });

var mean = function(a){ return a.length ? a.reduce(function(x,y){ return x+y; }, 0) / a.length : null; };

   for their position. Priced on 1+ goals, or 2+ where the 1+ is too short to be worth a row.

   forward whose shots have dried up.                                                           */

  var pool = (S.idx.players || []).filter(function(p){ return lg[p.name] && lg[p.name].games >= 4; })
    .sort(function(a,b){ return lg[b.name].avg - lg[a.name].avg; }).slice(0, 10);
  var inGame = {}; inGame[normTeam(g.home)] = g.away; inGame[normTeam(g.away)] = g.home;
  var out = [];
  pool.forEach(function(p, i){
    var opp = inGame[normTeam(p.team)];
    if (!opp || !isPlayingP(key, p.name, p.team)) return;
    var dr = dvpRankFor(key, opp, p.position, 'goals');
    if (!dr || dr.rank > 5) return;
    var one = bestPriceFor(key, p.name, 'goals', 0.5);
    var two = bestPriceFor(key, p.name, 'goals', 1.5);
    var bet = (one && one.price >= 1.2) ? { n:1, od:one } : (two ? { n:2, od:two } : (one ? { n:1, od:one } : null));
    if (!bet) return;
    var vals = statVals(key, p.name, 'goals');

    out.push({ name:p.name, p:p, opp:opp, rank:i+1, avg:lg[p.name].avg, l5:mean(vals.slice(0, 5)),
               shots:shots, dr:dr, bet:bet });
  });
  out.sort(function(a,b){ return a.dr.rank - b.dr.rank || a.rank - b.rank; });

/* HUNTING GROUNDS - AFL is the one code where clubs share grounds (the MCG and Marvel host half

   compared the raw venue average with the season average; four games is a small sample, so here
   the venue average is SHRUNK toward the player's overall average first (4 pseudo-games) and the
   edge has to survive that. Priced on the line his season average implies.                     */

  var S = state.sports[key], out = [], venue = g.venue;
  if (!venue) return { rows:[], why:'This fixture has no venue on file.' };
  var vkey = String(venue).toLowerCase();
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!isPlayingP(key, p.name, team) || !hasAnyOddsFor(key, p.name)) return;
      var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice());
      if (logs.length < 6) return;
      var here = logs.filter(function(r){ var v = rowVenue(key, r).venue; return v && String(v).toLowerCase() === vkey; });
      if (here.length < 4) return;
      HG_STATS.forEach(function(st){

   kick-in IS a kick, so here the projection becomes projected KICKS and is priced against the

function aflKickIns(key, g){

/* LET'S CLIMB - one staked ladder, not a list of rungs.
   A ladder is a single bet with a staggered stake: the biggest slice on the MAIN line (or the
   alt rung nearest $1.80 where there is no main line), then smaller slices on the next two or
   three rungs up. The base should be at least fair; every step above it has to be genuine value.
   It is meant to be rare: one ladder per fixture at most, and only when all of this holds
   (on the season AND his last 10, so a player who has gone cold can't qualify on March):

     - the base is the posted main line, or the alt rung closest to $1.80 (between $1.65-$2.05)
     - the base is at least break-even, and each step up is worth +8% or better
     - 10+ games of his own record behind it, and he clears the base line 50%+ of the time
     - every step is a rung he reaches 30%+ of the time - value, not a long shot
     - replayed against those games, the staggered package returned +10% or better

   Every probability is the conservative one: the calibrated model, capped at his own smoothed
   hit rate plus 5 points, and on tail rungs (he clears it under 30% of the time) his record alone -

var LADDER_W = [4, 2, 1, 1];                          // stake weights: base, then each step up
var LADDER_STEP_EV = 0.08, LADDER_MIN_G = 10, LADDER_PKG_EV = 0.10, LADDER_HIST_ROI = 0.10;
function ladderPlan(key, p, k, label, opp, sample){
  var rungs = streakCandidates(key, p.name, k).slice().sort(function(a,b){ return a.line - b.line; });
  if (rungs.length < 3) return null;
  // base: the posted main line, or the alt rung nearest $1.80
  var main = twoWayOverFor(key, p.name, k).filter(function(r){ return r.price >= 1.55 && r.price <= 2.30; })
    .sort(function(a,b){ return Math.abs(a.price - 1.9) - Math.abs(b.price - 1.9); })[0];
  var bi = -1;
  if (main){
    for (var i=0;i<rungs.length;i++) if (Math.abs(rungs[i].line - main.line) < 1e-9){ bi = i; break; }
    if (bi >= 0 && main.price > rungs[bi].price) rungs[bi] = { line:main.line, price:main.price, book:main.book };
  }
  if (bi < 0){
    var bd = 9;
    rungs.forEach(function(r, i){
      if (r.price < 1.65 || r.price > 2.05) return;
      var d = Math.abs(r.price - 1.80);
      if (d < bd){ bd = d; bi = i; }
    });
  }
  if (bi < 0 || bi + 2 >= rungs.length) return null;
  var vals = statVals(key, p.name, k, sample), n = vals.length;
  if (n < LADDER_MIN_G) return null;
  // his last 10 games too: a season rate can hide a player who has gone cold (Impey: 8+ marks in
  // 10 of 22 this season, but 9/0/7/3/4 in his last five), and AFL's calibration is too flat to
  // notice - so a rung only counts for what holds on BOTH windows
  var recent = statVals(key, p.name, k, sortLogsDesc(((state.sports[key].idx.logsByName || {})[p.name] || []).slice()).slice(0, 10));
  var nR = recent.length;
  var hr = function(line){ return vals.filter(function(v){ return v > line; }).length / n; };
  var hrR = function(line){ return nR ? recent.filter(function(v){ return v > line; }).length / nR : 0; };
  var conservative = function(r){
    var h = hr(r.line), hR = hrR(r.line);
    var emp = (h*n + 1)/(n + 2), empR = (hR*nR + 1)/(nR + 2);
    var pr = modelProbAt(key, p, k, r.line, opp);
    if (pr == null) return null;
    return Math.min(pr, emp + 0.05, empR + 0.05);

    var r = rungs[j], q = conservative(r);

    if (hr(r.line) < 0.30 || hrR(r.line) < 0.30) break;

  }
  if (steps.length < 2) return null;                                 // a ladder needs 2+ value steps
  var legs = [{ line:base.line, price:base.price, book:base.book, hit:bh, hitR:hrR(base.line), prob:bp, ev:bp*base.price - 1, base:true }]
    .concat(steps);
  var wsum = 0; legs.forEach(function(l, i){ l.w = LADDER_W[i]; wsum += l.w; });
  legs.forEach(function(l){ l.stake = l.w / wsum; });
  // package EV: rungs are nested, but expectation is additive regardless
  var pkgEv = legs.reduce(function(a, l){ return a + l.stake * l.prob * l.price; }, 0) - 1;
  // replay the package against his own games: what would it actually have returned?
  var ret = 0, wins = 0;
  vals.forEach(function(v){
    var pay = legs.reduce(function(a, l){ return a + (v > l.line ? l.stake * l.price : 0); }, 0);
    ret += pay - 1; if (pay > 1) wins++;
  });
  return { name:p.name, p:p, opp:opp, mkt:k, label:label, legs:legs, pkgEv:pkgEv,
           histRoi:ret / n, histWins:wins, n:n, fromMain:!!main && Math.abs(main.line - base.line) < 1e-9 };
}
function letsClimb(key, g){
  var S = state.sports[key], season = curSeason(key), cands = [];
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!isPlayingP(key, p.name, team) || !hasAnyOddsFor(key, p.name)) return;
      var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice());
      var cur = logs.filter(function(r){ return (+(r.Year||r.year)||0) === season; });
      var sample = cur.length >= LADDER_MIN_G ? cur : logs.slice(0, 15);
      posMarkets(key, p).forEach(function(m){
        var plan = ladderPlan(key, p, m[0], m[1], opp, sample);
        // the model has to like it AND his own games have to back it: a ladder that barely beat
        // its history (+7%) is a coin flip with extra steps, not a pick
        if (plan && plan.pkgEv >= LADDER_PKG_EV && plan.histRoi >= LADDER_HIST_ROI) cands.push(plan);
      });
    });
  });
  // one ladder per fixture: the best package, judged on the model AND on what it actually did
  cands.sort(function(a,b){ return (b.pkgEv + b.histRoi) - (a.pkgEv + a.histRoi); });
  return { rows:cands.slice(0, 1), considered:cands.length,
           why:'No ladder on this fixture starts at a fair main line, climbs 2+ rungs he reaches 30%+ of the '
             + 'time that are each +8% value, and returned +10% replayed against his own games.' };
}

/* EPL-SPECIFIC SIGNALS -----------------------------------------------------------
   Production's core reasoning for each, kept, with the data it was waiting on now wired in
   (API-Football shots/fouls, referee strictness, team corner and card rates) and every row
   priced. Rates that bench cameos would dilute (cards, fouls) use only games of 45+ minutes. */
function eplTeam(key, t){
  var r = null;
  (asArray(state.sports[key].data.teams) || []).forEach(function(x){ if (normTeam(x.team) === normTeam(t)) r = x; });
  return r;
}
function eplLeagueMean(key, f){
  var v = (asArray(state.sports[key].data.teams) || []).map(function(t){ return +t[f]; }).filter(function(x){ return x > 0; });
  return v.length ? v.reduce(function(a,b){ return a+b; }, 0) / v.length : null;
}
function eplRef(key, g){
  var rs = (state.sports[key].data.referees || {}).refStats || {};
  var name = g.referee;
  if (!name || !rs[name]) return null;
  var all = Object.keys(rs).map(function(k){ return rs[k]; }).filter(function(x){ return x.matches >= 10; });
  var lgC = mean(all.map(function(x){ return x.cardsPG; })), lgF = mean(all.map(function(x){ return x.foulsPG; }));
  return { name:name, cardsPG:rs[name].cardsPG, foulsPG:rs[name].foulsPG, matches:rs[name].matches,
           cardMult: lgC ? rs[name].cardsPG / lgC : 1, foulMult: lgF ? rs[name].foulsPG / lgF : 1 };
}
function eplAvail(key, p, team){
  if (p.status && p.status !== 'a') return false;               // FPL: injured / doubtful / suspended
  return isPlayingP(key, p.name, team) && hasAnyOddsFor(key, p.name);
}
function eplLogs(key, name, minMin){
  var rows = sortLogsDesc(((state.sports[key].idx.logsByName || {})[name] || []).slice());
  return minMin ? rows.filter(function(r){ return (+r.min || 0) >= minMin; }) : rows;
}
function poisAtLeast(lam, k){ var c = 0, t = Math.exp(-lam); for (var i=0;i<k;i++){ c += t; t = t*lam/(i+1); } return Math.max(0, Math.min(1, 1-c)); }
function eachSkater(key, g, fn){
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){ if (p && eplAvail(key, p, team)) fn(p, team, opp); });
  });
}
function eplRow(key, r, bet, chips, big, bigL, good, cardLbl){
  return '<div class="gl-row sig-extra" onclick="LAB.player(\'' + key + '\',\'' + esc(r.name).replace(/'/g,"\\'") + '\')">'
    + (cardLbl ? cardBtn(key, r, cardLbl) : '')
    + playerImgP(key, r.name, 28)
    + '<div class="gl-left"><div class="gl-nm"><b>'+esc(r.name)+'</b><span class="gl-tag">'
    + esc((posShortP(r.p) ? posShortP(r.p)+' \u00b7 ' : '')+abbrOf(key, r.p.team)+' v '+abbrOf(key, r.opp))+'</span></div>'
    + '<div class="gl-bet">'+bet+'</div>'
    + '<div class="gl-why">'+chips.map(function(c){ return '<span class="gl-chip'+(c[1] ? ' good' : '')+'">'+c[0]+'</span>'; }).join('')+'</div></div>'
    + '<div class="gl-right"><div class="gl-ev '+(good === false ? 'neg' : 'pos')+'">'+big+'</div><div class="gl-evl">'+bigL+'</div></div></div>';
}
var fmtP = function(od){ return '$'+od.price.toFixed(2)+' '+esc(od.book || ''); };
var edgeOf = function(pr, price){ return pr * price - 1; };

/* 1. LOCKED IN - cleared a posted line in 4+ of his last 5. Distinct from Streakers (which
   needs an unbroken run): one miss allowed, but the line is the book's, the price is $1.50+ so
   it isn't chalk, and the model has to agree. One market per player.                          */
function eplLockedIn(key, g){
  var out = [];
  eachSkater(key, g, function(p, team, opp){
    var best = null, l5all = eplLogs(key, p.name).slice(0, 5);
    if (l5all.length < 5) return;
    posMarkets(key, p).forEach(function(m){
      var v5 = statVals(key, p.name, m[0], l5all);
      if (v5.length < 5) return;
      streakCandidates(key, p.name, m[0]).forEach(function(c){
        if (c.price < 1.50) return;
        var hits = v5.filter(function(v){ return v > c.line; }).length;
        if (hits < 4) return;
        var pr = modelProbAt(key, p, m[0], c.line, opp);
        if (pr == null || edgeOf(pr, c.price) < 0) return;
        var sc = hits * 10 + c.line;
        if (!best || sc > best.sc) best = { sc:sc, m:m, c:c, hits:hits, pr:pr, v5:v5 };
      });
    });
    if (best) out.push({ name:p.name, p:p, opp:opp, b:best });
  });
  out.sort(function(a,b){ return b.b.sc - a.b.sc; });
  return { rows:out.slice(0, SIG_MAX_ROWS).map(function(r){
      var b = r.b;
      return eplRow(key, r, '<b>'+Math.ceil(b.c.line)+'+ '+esc(b.m[1])+'</b> \u00b7 '+fmtP(b.c),
        [[b.hits+'/5 last five', true], ['last 5: '+b.v5.slice().reverse().join(' '), false],
         ['model '+Math.round(b.pr*100)+'%', b.pr > 1/b.c.price]],
        '+'+Math.round(edgeOf(b.pr, b.c.price)*100)+'%', 'EDGE');
    }),
    why:'No priced player has cleared a $1.50+ posted line in 4 of his last 5 with the model agreeing.' };
}
/* 2. FIRST GOAL - production ranked players by how often they score. The first-scorer market
   is a different question: will HE score the FIRST goal. So: P(his side opens) x P(it's him),
   from events.json, against the first-scorer price.                                          */
function eplFirstGoal(key, g){
  var out = [];
  eachSkater(key, g, function(p, team, opp){
    if ((p.pos || p.position) === 'GK') return;
    var rd = firstScorerRead(key, p), od = fsPrice(key, p.name);
    if (!rd || !od) return;
    var ev = edgeOf(rd.prob, od.over);
    // the one priced tile without a walk-forward (events.json only holds season aggregates),
    // and first-scorer books carry big margins - so it needs a clear 10% before it fires
    if (ev < 0.10 || rd.prob > Math.min(0.97, (1/od.over) * 4)) return;
    out.push({ name:p.name, p:p, opp:opp, rd:rd, od:od, ev:ev });
  });
  out.sort(function(a,b){ return b.ev - a.ev; });
  return { rows:out.slice(0, 6).map(function(r){
      return eplRow(key, r, '<b>First goal</b> \u00b7 $'+r.od.over.toFixed(2)+' '+esc(r.od.book||''),
        [[abbrOf(key, r.p.team)+' open '+Math.round(r.rd.teamRate*100)+'%', r.rd.teamRate > 0.5],
         ['scores '+Math.round(r.rd.share*100)+'% of their goals', r.rd.share > 0.2],
         (r.rd.onPitch != null ? ['plays '+Math.round(r.rd.onPitch*100)+'% of the match', r.rd.onPitch > 0.8] : null),
         ['model '+(r.rd.prob*100).toFixed(1)+'% v '+(100/r.od.over).toFixed(1)+'% implied', true],
         (r.p.pens_order === 1 ? ['on penalties', true] : null)].filter(Boolean),
        '+'+Math.round(r.ev*100)+'%', 'EDGE');
    }),
    why:'No first-scorer price on this fixture is at least 10% generous against the opener model.' };
}
/* 3. TAP-INS - accurate shooters. Production: 50%+ on target over the last 5. Five games of a
   ratio is noise, so: last 10, 1.5+ shots a game, 45%+ on target, priced on shots on target at
   the rung his own rate supports.                                                             */
function eplTapIns(key, g){
  var out = [];
  eachSkater(key, g, function(p, team, opp){
    if ((p.pos || p.position) === 'GK') return;
    var l10 = eplLogs(key, p.name, 30).slice(0, 10);
    if (l10.length < 6) return;
    var sh = mean(statVals(key, p.name, 'shots', l10)), sot = mean(statVals(key, p.name, 'shotsOn', l10));
    if (!(sh >= 1.5) || !(sot > 0)) return;
    var acc = sot / sh;
    if (acc < 0.45) return;
    var ask = Math.max(1, Math.floor(sot + 0.35));
    var od = bestPriceFor(key, p.name, 'shotsOn', ask - 0.5);
    if (!od) return;
    var pr = modelProbAt(key, p, 'shotsOn', od.line, opp);
    if (pr == null || edgeOf(pr, od.price) < 0) return;
    var oT = eplTeam(key, opp), lgSA = eplLeagueMean(key, 'shotsOn_a');
    out.push({ name:p.name, p:p, opp:opp, sh:sh, sot:sot, acc:acc, od:od, ask:ask, pr:pr,
               oppSA:(oT ? +oT.shotsOn_a : null), lgSA:lgSA });
  });
  out.sort(function(a,b){ return (b.acc*b.sot) - (a.acc*a.sot); });
  return { rows:out.slice(0, SIG_MAX_ROWS).map(function(r){
      return eplRow(key, r, '<b>'+r.ask+'+ Shots on target</b> \u00b7 '+fmtP(r.od),
        [[r.sh.toFixed(1)+' shots/gm L10', r.sh >= 2.5], [Math.round(r.acc*100)+'% on target', true],
         (r.oppSA != null ? [abbrOf(key, r.opp)+' concede '+r.oppSA.toFixed(1)+' SOT/gm', r.oppSA > r.lgSA] : null),
         ['model '+Math.round(r.pr*100)+'%', true]].filter(Boolean),
        Math.round(r.acc*100)+'%', 'ON TARGET');
    }),
    why:'No priced shooter on this fixture hits the target 45%+ of the time on 1.5+ shots a game over his last 10.' };
}
/* 4. PENALTY KINGS - the first-choice taker gets a free shot at a goal most sides earn every
   few games. Priced on anytime goal, and only where the model backs the price.                */
function eplPenKings(key, g){
  var out = [];
  eachSkater(key, g, function(p, team, opp){
    if (p.pens_order !== 1) return;
    var od = bestPriceFor(key, p.name, 'goals', 0.5);
    if (!od) return;
    var pr = modelProbAt(key, p, 'goals', 0.5, opp);
    if (pr == null || edgeOf(pr, od.price) < 0) return;
    var l10 = statVals(key, p.name, 'goals', eplLogs(key, p.name, 45).slice(0, 10));
    out.push({ name:p.name, p:p, opp:opp, od:od, pr:pr, g10:l10.reduce(function(a,b){ return a+b; }, 0), n10:l10.length });
  });
  out.sort(function(a,b){ return edgeOf(b.pr, b.od.price) - edgeOf(a.pr, a.od.price); });
  return { rows:out.map(function(r){
      return eplRow(key, r, '<b>Anytime goal</b> \u00b7 '+fmtP(r.od),
        [['first-choice penalty taker', true], [r.g10+' goals in last '+r.n10, r.g10 >= 3],
         ['model '+Math.round(r.pr*100)+'% v '+Math.round(100/r.od.price)+'% implied', true]],
        '+'+Math.round(edgeOf(r.pr, r.od.price)*100)+'%', 'EDGE');
    }),
    why:'No first-choice penalty taker on this fixture has an anytime-goal price the model backs.' };
}
/* 5. SPAM SQUARE - REMOVED. Walk-forward over 4,093 player-games: a player's recent booking
   rate barely predicts his next card. "Magnets" booked in 30%+ of recent games were predicted at
   37% and carded 19.5% of the time - barely above the 18% for the quietest quarter. Any priced
   version of this tile would have shown edges that do not exist.                               */
/* 6. BRICK WALL - saves come from shots on target, so project them: the opponent's shots on
   target blended with what this side concedes, times the keeper's own save rate, against the
   saves ladder.                                                                                */
function eplBrickWall(key, g){
  var out = [];
  eachSkater(key, g, function(p, team, opp){
    if ((p.pos || p.position) !== 'GK') return;
    var oT = eplTeam(key, opp), mT = eplTeam(key, team);
    if (!oT || !mT) return;
    var sotFaced = mean([+oT.shotsOn || 0, +mT.shotsOn_a || 0]);
    var l10 = eplLogs(key, p.name, 60).slice(0, 10);
    var sv = mean(statVals(key, p.name, 'saves', l10));
    var faced = mT.shotsOn_a ? +mT.shotsOn_a : null;
    var saveRate = (faced && sv != null) ? Math.max(0.5, Math.min(0.9, sv / faced)) : 0.7;
    var proj = sotFaced * saveRate;
    // The projection is shown, but the PRICE comes from the EPL scoring model: that has a
    // walk-forward behind it (35.8pt quartile spread); this projection doesn't - historical team
    // shots on target can't be rebuilt reliably from the API-Football coverage window.
    var rungs = streakCandidates(key, p.name, 'saves').slice().sort(function(a,b){ return b.line - a.line; });
    var pick = null;
    rungs.forEach(function(c){
      if (pick) return;
      var pr = modelProbAt(key, p, 'saves', c.line, opp);
      if (pr == null || pr > Math.min(0.97, (1/c.price) * 4)) return;
      if (edgeOf(pr, c.price) >= 0.05) pick = { c:c, pr:pr };
    });
    if (!pick) return;
    out.push({ name:p.name, p:p, opp:opp, proj:proj, sotFaced:sotFaced, saveRate:saveRate, pick:pick });
  });
  out.sort(function(a,b){ return edgeOf(b.pick.pr, b.pick.c.price) - edgeOf(a.pick.pr, a.pick.c.price); });
  return { rows:out.map(function(r){
      return eplRow(key, r, '<b>'+Math.ceil(r.pick.c.line)+'+ Saves</b> \u00b7 '+fmtP(r.pick.c),
        [[r.sotFaced.toFixed(1)+' shots on target expected', r.sotFaced > 4.5],
         [Math.round(r.saveRate*100)+'% save rate', r.saveRate > 0.7],
         ['model '+Math.round(r.pick.pr*100)+'% v '+Math.round(100/r.pick.c.price)+'% implied', true]],
        r.proj.toFixed(1), 'PROJ SAVES');
    }),
    why:'No keeper on this fixture has a saves rung the shots-on-target projection beats by 5%.' };
}
/* 7. FOULED AGAIN - production aimed at fouls DRAWN, but the market books post is fouls
   COMMITTED, so that's what gets priced: his rate, scaled by the referee's whistle and by how
   many fouls this opponent draws.                                                              */
function eplFouls(key, g){
  var out = [], ref = eplRef(key, g);
  eachSkater(key, g, function(p, team, opp){
    var l10 = eplLogs(key, p.name, 45).slice(0, 10);
    if (l10.length < 6) return;
    var fc = mean(statVals(key, p.name, 'foulsCommitted', l10));
    if (!(fc >= 1)) return;
    var oT = eplTeam(key, opp), lgD = eplLeagueMean(key, 'foulsCommitted_a');
    var oppMult = (oT && lgD) ? Math.max(0.8, Math.min(1.3, (+oT.foulsCommitted_a) / lgD)) : 1;
    var refMult = ref ? Math.max(0.85, Math.min(1.2, ref.foulMult)) : 1;
    // Walk-forward: his rolling fouls rate (Poisson) predicted 22.0% for 2+ where 22.2% landed,
    // top quartile 34% v bottom 10%. The referee and opponent factors are untested, so they are
    // shown as context but kept OUT of the probability.
    var proj = fc;
    var rungs = streakCandidates(key, p.name, 'foulsCommitted').slice().sort(function(a,b){ return b.line - a.line; });
    var pick = null;
    rungs.forEach(function(c){
      if (pick) return;
      var pr = Math.min(0.9, poisAtLeast(proj, Math.ceil(c.line)));
      if (edgeOf(pr, c.price) >= 0.05) pick = { c:c, pr:pr };
    });
    if (!pick) return;
    out.push({ name:p.name, p:p, opp:opp, fc:fc, proj:proj, ref:ref, refMult:refMult, oppMult:oppMult, pick:pick });
  });
  out.sort(function(a,b){ return edgeOf(b.pick.pr, b.pick.c.price) - edgeOf(a.pick.pr, a.pick.c.price); });
  return { rows:out.slice(0, SIG_MAX_ROWS).map(function(r){
      return eplRow(key, r, '<b>'+Math.ceil(r.pick.c.line)+'+ Fouls committed</b> \u00b7 '+fmtP(r.pick.c),
        [[r.fc.toFixed(1)+' fouls/gm L10', r.fc >= 1.5],
         (r.ref ? [r.ref.name+' '+r.ref.foulsPG.toFixed(1)+' fouls/gm', r.refMult > 1] : ['referee not yet named', false]),
         [abbrOf(key, r.opp)+' draw fouls x'+r.oppMult.toFixed(2), r.oppMult > 1],
         ['model '+Math.round(r.pick.pr*100)+'%', true]],
        r.proj.toFixed(1), 'PROJ FOULS');
    }),
    why:'No priced player on this fixture projects to beat a fouls-committed rung by 5%.' };
}
/* 8. MISMATCH ALERT - a shooter with real volume into a defence that leaks shots to his
   position (+12% or worse). Unlike Elite Matchups, not limited to the league's top 10.        */
function eplMismatch(key, g){
  var out = [];
  eachSkater(key, g, function(p, team, opp){
    if ((p.pos || p.position) === 'GK') return;
    var dr = dvpRankFor(key, opp, p.position || p.pos, 'shots');
    if (!dr || dr.pct < 12) return;
    var sh = mean(statVals(key, p.name, 'shots', eplLogs(key, p.name, 30).slice(0, 10)));
    if (!(sh >= 1.5)) return;
    var ask = Math.max(1, Math.round(sh));
    var od = bestPriceFor(key, p.name, 'shots', ask - 0.5);
    if (!od) return;
    var pr = modelProbAt(key, p, 'shots', od.line, opp);
    if (pr == null || edgeOf(pr, od.price) < 0) return;
    out.push({ name:p.name, p:p, opp:opp, dr:dr, sh:sh, od:od, ask:ask, pr:pr });
  });
  out.sort(function(a,b){ return b.dr.pct - a.dr.pct; });
  return { rows:out.slice(0, SIG_MAX_ROWS).map(function(r){
      return eplRow(key, r, '<b>'+r.ask+'+ Shots</b> \u00b7 '+fmtP(r.od),
        [[abbrOf(key, r.opp)+' concede +'+Math.round(r.dr.pct)+'% shots to '+esc(posShortP(r.p)), true],
         [r.sh.toFixed(1)+' shots/gm L10', r.sh >= 2.5], ['model '+Math.round(r.pr*100)+'%', true]],
        '+'+Math.round(r.dr.pct)+'%', 'SHOTS LEAK');
    }),
    why:'No priced shooter on this fixture faces a defence leaking 12%+ more shots to his position.' };
}
/* 9-10. GOALS GALORE / CORNER STORM - REMOVED. A team attack x opponent defence Poisson model,
   walk-forward over 945 matches (goals) and 729 (corners), with and without shrinkage and
   recency windows: every variant scored WORSE than always guessing the base rate (best: goals
   0.2487 v 0.2470, corners 0.2478 v 0.2456). Match totals are among the sharpest markets posted;
   a model that can't beat the base rate has no business claiming an edge against them.         */
function eplSignals(key, g){
  if (key !== 'epl') return '';
  var li = eplLockedIn(key, g), fg = eplFirstGoal(key, g), ti = eplTapIns(key, g), pk = eplPenKings(key, g),
      bw = eplBrickWall(key, g), fa = eplFouls(key, g), mm = eplMismatch(key, g);
  return sigBand('EPL Signals',
    sigTile('ti-lock-square-rounded', 'Locked In', 'Cleared the posted line in 4 of the last 5', li.rows, li.why)
    + sigTile('ti-target-arrow', 'First Goal', 'Opener value: his side scores first, and it\u2019s him', fg.rows, fg.why)
    + sigTile('ti-hand-finger', 'Tap-Ins', 'Accurate shooters, priced on shots on target', ti.rows, ti.why)
    + sigTile('ti-crown', 'Penalty Kings', 'First-choice takers the model backs to score', pk.rows, pk.why)
    + sigTile('ti-shield', 'Brick Wall', 'Keepers in line for saves', bw.rows, bw.why)
    + sigTile('ti-hand-stop', 'Fouled Again', 'Foul volume, whistle and opponent', fa.rows, fa.why)
    + sigTile('ti-bolt', 'Mismatch Alert', 'Shooters into a defence that leaks shots', mm.rows, mm.why));
}

/* MLB-SPECIFIC SIGNALS ------------------------------------------------------------
   Production's reasoning picks WHO to look at; the calibrated MLB model (walk-forward quartile
   spread 27.4pt, the best-behaved of the six) decides whether the PRICE is value. Every row needs
   +5% at a posted price.

   Tested and left out:
     Hot Bats     - hot streaks don't carry: batters on a 72%+ week landed 1.3pt BELOW their own
                    rolling rate (3,946 games). Backing the hot bat is backing regression.
     (Due / Running Hot are built below, guarded against the Statcast column misalignment that
                    fetch_mlb.py's header repair fixes.)
     Whiff Risk, Innings Eaters, Sneaky Buggers - no batter-K, outs or steals market is posted. */
// share of regular batter-games this season that clear (or stay under) a line - the prior
function mlbLeagueRate(key, mkt, line, side){
  var S = state.sports[key], ck = mkt + '|' + line + '|' + (side || 'over');
  S.idx.mlbLg = S.idx.mlbLg || {};
  if (S.idx.mlbLg[ck] != null) return S.idx.mlbLg[ck];
  var season = curSeason(key), n = 0, h = 0;
  (asArray(S.data.gamelogs) || []).forEach(function(r){
    if (!r || (+(r.Year||r.year)||0) !== season) return;
    var v = statOf(key, r, mkt);
    if (v == null) return;
    if (mkt !== 'K' && r.role !== 'bat') return;
    if (mkt === 'K' && r.role !== 'pitch') return;
    n++; if (side === 'under' ? v <= line : v > line) h++;
  });
  return (S.idx.mlbLg[ck] = n ? h / n : 0.5);
}
function mlbSp(key, p){ try { return state.sports[key].scoring.starterFacing(p); } catch(e){ return null; } }
function mlbBats(key, g, fn){
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!p || p.role !== 'bat' || (p.matches || 0) < 15) return;
      if (!isPlayingP(key, p.name, team) || !hasAnyOddsFor(key, p.name)) return;
      fn(p, team, opp, mlbSp(key, p));
    });
  });
}
// the bet: an over at the posted main line (or 1+ where that's the market), or an under where
// the book posts one - priced, and backed by the calibrated model by 5% or more
function mlbPriced(key, p, mkt, opp, side, fixedLine){
  var od = null;
  if (side === 'under'){
    var u = underCandidates(key, p.name, mkt).sort(function(a,b){ return Math.abs(a.price - 1.9) - Math.abs(b.price - 1.9); })[0];
    if (u) od = { line:u.line, price:u.price, book:u.book };
  } else {
    od = fixedLine != null ? bestPriceFor(key, p.name, mkt, fixedLine) : (cmbPosted(key, p.name, mkt) ?
      { line:+cmbPosted(key, p.name, mkt).line, price:+cmbPosted(key, p.name, mkt).over, book:cmbPosted(key, p.name, mkt).book } : null);
  }
  if (!od || !(od.price > 1)) return null;
  var pr = modelProbAt(key, p, mkt, od.line, opp);
  if (pr == null) return null;
  if (side === 'under') pr = 1 - pr;
  // Cap the model at what he has actually done. Calibration pulls every probability toward the
  // league middle, so on long-priced markets it overrates the weak: the model gave Christian Koss
  // (4 HR all season, ~4% a game) a 14% HR chance, and all six "Homers" were low-power bats at
  // $9-10. His own smoothed season rate plus a small margin (2pt on HR, 5pt elsewhere) is the ceiling.
  var S0 = state.sports[key], season0 = curSeason(key);
  var logs0 = sortLogsDesc(((S0.idx.logsByName || {})[p.name] || []).slice());
  // a starter is judged on his STARTS: Blade Tidwell's 16 appearances include 7 short relief
  // outings where few strikeouts are near-certain, which inflated his K under from 44% to 60%
  if (p.role === 'pitch') logs0 = logs0.filter(function(r){ return (+r.outs || 0) >= 9; });
  var cur0 = logs0.filter(function(r){ return (+(r.Year||r.year)||0) === season0; });
  var pool0 = cur0.length >= 30 ? cur0 : logs0.slice(0, 60);
  var v0 = statVals(key, p.name, mkt, pool0);
  // 40 games of record or no price (a rookie's 3 homers in 20 games is a coin toss); starters
  // make ~30 starts a season, so pitchers need 10 starts
  if (v0.length < (p.role === 'pitch' ? 10 : 40)) return null;
  if (mkt === 'H' && p.role === 'bat' && p.AB > 0){
    // Hits per GAME misleads for part-timers: Drew Cavanaugh went hitless in 63% of games at 2.9
    // PA a game, but batting 4th today he gets ~4 trips. Build it per at-bat instead - his AVG
    // (shrunk toward the league's over 50 AB) across the at-bats his lineup slot usually gets.
    var avgS = ((p.H || 0) + 50 * 0.245) / (p.AB + 50);
    var abExp = (p.order && p.order <= 5) ? 4.1 : 3.8;
    var pHit = 1 - Math.pow(1 - avgS, abExp);
    pr = Math.min(pr, (side === 'under' ? 1 - pHit : pHit) + 0.03);
  } else {
    var hits0 = v0.filter(function(v){ return side === 'under' ? v <= od.line : v > od.line; }).length;
    // Shrink toward the LEAGUE rate at this line, not toward 50%: +1/+2 smoothing lifted Kreidler
    // (8 HR in 101 games, 7.9%) to 8.7%, a 2pt margin took him past the 10% the book implies, and
    // the "edge" was made of smoothing. 10 pseudo-games at the league rate, and no margin on HR.
    var lgR = mlbLeagueRate(key, mkt, od.line, side);
    var emp0 = (hits0 + 10 * lgR) / (v0.length + 10);
    pr = Math.min(pr, emp0 + (mkt === 'HR' ? 0 : 0.03));
  }
  if (pr > Math.min(0.97, (1/od.price) * 4)) return null;          // tail guard
  var ev = pr * od.price - 1;
  return ev >= 0.05 ? { od:od, pr:pr, ev:ev, side:side || 'over' } : null;
}
function mlbRow(key, r, betLbl, chips){
  var b = r.b;
  return eplRow(key, r, '<b>'+(b.side === 'under' ? 'Under '+b.od.line : Math.ceil(b.od.line)+'+')+' '+betLbl+'</b> \u00b7 '+fmtP(b.od),
    chips.concat([['model '+Math.round(b.pr*100)+'% v '+Math.round(100/b.od.price)+'% implied', true]]),
    '+'+Math.round(b.ev*100)+'%', 'EDGE', true, betLbl);
}
var d3m = function(v){ return v == null ? '\u2014' : v.toFixed(3).replace(/^0/, ''); };
/* SLUGGERS - a platoon edge: SLG against today's starter's hand 15%+ above his season SLG, on
   25+ PA. Production priced it on HITS; SLG is extra-base power, so it's priced on TOTAL BASES. */
function mlbSluggers(key, g){
  var out = [];
  mlbBats(key, g, function(p, team, opp, sp){
    if (!sp || !sp.throws) return;
    var split = sp.throws === 'L' ? p.splitVsL : p.splitVsR;
    if (!split || !p.SLG || !split.SLG || (split.PA || 0) < 25) return;
    var ratio = split.SLG / p.SLG;
    if (ratio < 1.15) return;
    var b = mlbPriced(key, p, 'TB', opp);
    if (b) out.push({ name:p.name, p:p, opp:opp, sp:sp, split:split, ratio:ratio, b:b });
  });
  out.sort(function(a,b){ return b.b.ev - a.b.ev; });
  return { rows:out.slice(0, SIG_MAX_ROWS).map(function(r){
      return mlbRow(key, r, 'Total bases', [['SLG '+d3m(r.split.SLG)+' v '+r.sp.throws+'HP (season '+d3m(r.p.SLG)+')', true],
        ['+'+Math.round((r.ratio-1)*100)+'% platoon edge \u00b7 '+r.split.PA+' PA', true], ['v '+esc(r.sp.name), false]]); }),
    why:'No priced batter has a 15%+ platoon power edge against today\u2019s starter that the model backs.' };
}
/* RUNNERS - top-of-order bats (1-3) against a walk-prone starter (WHIP 1.25+ or BB/9 3.3+):
   more traffic ahead of the heart of the order. Priced on 1+ run. */
function mlbRunners(key, g){
  var out = [];
  mlbBats(key, g, function(p, team, opp, sp){
    if ((p.order || 9) > 3 || !sp) return;
    if (!((sp.WHIP || 0) >= 1.25 || (sp.BB9 || 0) >= 3.3)) return;
    var b = mlbPriced(key, p, 'R', opp, 'over', 0.5);
    if (b) out.push({ name:p.name, p:p, opp:opp, sp:sp, b:b });
  });
  out.sort(function(a,b){ return b.b.ev - a.b.ev; });
  return { rows:out.slice(0, SIG_MAX_ROWS).map(function(r){
      return mlbRow(key, r, 'Runs', [['bats '+r.p.order+' in the order', true],
        [esc(r.sp.name)+' WHIP '+(r.sp.WHIP||0).toFixed(2)+' \u00b7 BB/9 '+(r.sp.BB9||0).toFixed(1), true]]); }),
    why:'No top-of-order bat faces a walk-prone starter at a run price the model backs.' };
}
/* RBI MEN - the heart of the order (3-5) against a hittable starter (opp AVG .260+ or WHIP 1.30+).
   Priced on 1+ RBI. */
function mlbRbi(key, g){
  var out = [];
  mlbBats(key, g, function(p, team, opp, sp){
    var o = p.order || 9;
    if (o < 3 || o > 5 || !sp) return;
    if (!((sp.oppAVG || 0) >= 0.260 || (sp.WHIP || 0) >= 1.30)) return;
    var b = mlbPriced(key, p, 'RBI', opp, 'over', 0.5);
    if (b) out.push({ name:p.name, p:p, opp:opp, sp:sp, b:b });
  });
  out.sort(function(a,b){ return b.b.ev - a.b.ev; });
  return { rows:out.slice(0, SIG_MAX_ROWS).map(function(r){
      return mlbRow(key, r, 'RBIs', [['bats '+r.p.order+' in the order', true],
        [esc(r.sp.name)+' opp AVG '+d3m(r.sp.oppAVG)+' \u00b7 WHIP '+(r.sp.WHIP||0).toFixed(2), true]]); }),
    why:'No middle-order bat faces a hittable starter at an RBI price the model backs.' };
}
/* FREE PASSES - patient hitters (walk rate 10%+ of PA) against a wild starter (BB/9 3.3+).
   Priced on 1+ walk. */
function mlbWalks(key, g){
  var out = [];
  mlbBats(key, g, function(p, team, opp, sp){
    if (!sp || (sp.BB9 || 0) < 3.3 || !(p.PA > 0)) return;
    var bbRate = (p.BB || 0) / p.PA;
    if (bbRate < 0.10) return;
    var b = mlbPriced(key, p, 'BB', opp, 'over', 0.5);
    if (b) out.push({ name:p.name, p:p, opp:opp, sp:sp, bbRate:bbRate, b:b });
  });
  out.sort(function(a,b){ return b.b.ev - a.b.ev; });
  return { rows:out.slice(0, SIG_MAX_ROWS).map(function(r){
      return mlbRow(key, r, 'Walks', [['walks '+Math.round(r.bbRate*100)+'% of PA', true],
        [esc(r.sp.name)+' BB/9 '+(r.sp.BB9||0).toFixed(1), true]]); }),
    why:'No patient hitter faces a wild starter at a walk price the model backs.' };
}
/* HOMERS - home run spots: the model's HR probability with park and the starter's HR/9 shown.
   Tail guard applies: HR is a long-priced market where an extrapolating model looks generous. */
function mlbHomers(key, g){
  var out = [];
  mlbBats(key, g, function(p, team, opp, sp){
    var b = mlbPriced(key, p, 'HR', opp, 'over', 0.5);
    if (!b) return;
    var pk = {}; try { pk = state.sports[key].scoring.parkFor(p.team) || {}; } catch(e){}
    out.push({ name:p.name, p:p, opp:opp, sp:sp, pk:pk, b:b });
  });
  out.sort(function(a,b){ return b.b.ev - a.b.ev; });
  return { rows:out.slice(0, SIG_MAX_ROWS).map(function(r){
      return mlbRow(key, r, 'Home run', [[(r.p.HR||0)+' HR this season', (r.p.HR||0) >= 20],
        ['park HR '+(r.pk.hrFactor || 1).toFixed(2)+'x', (r.pk.hrFactor || 1) > 1.03],
        (r.sp ? [esc(r.sp.name)+' HR/9 '+(r.sp.HR9||0).toFixed(2), (r.sp.HR9||0) >= 1.3] : ['starter TBC', false])]); }),
    why:'No home-run price on this fixture is 5% generous against the model.' };
}
/* STRIKE TIME / GRINDERS - the starters. Strike Time backs strikeouts where the K projection
   beats the posted line; Grinders fades a starter in a tough spot - the UNDER on his Ks. Both are
   priced on the posted K line, not the projection's own line as production did. */
function mlbStarters(key, g, dir){
  var out = [], S = state.sports[key];
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    var nm = team === g.home ? g.homePitcher : g.awayPitcher;
    var p = nm && (S.idx.byName || {})[nm];
    if (!p || p.role !== 'pitch' || !hasAnyOddsFor(key, p.name)) return;
    var kp = null; try { kp = S.scoring.pitcherKProj(p); } catch(e){}
    var posted = cmbPosted(key, p.name, 'K');
    if (!kp || !posted) return;
    var line = +posted.line;
    if (dir === 'over' && kp.proj < line + 0.3) return;
    if (dir === 'under' && kp.proj > line - 0.5) return;
    var b = mlbPriced(key, p, 'K', opp, dir === 'under' ? 'under' : 'over');
    if (b) out.push({ name:p.name, p:p, opp:opp, kp:kp, line:line, b:b });
  });
  out.sort(function(a,b){ return b.b.ev - a.b.ev; });
  return { rows:out.map(function(r){
      return mlbRow(key, r, 'Strikeouts', [['proj '+r.kp.proj.toFixed(1)+' K v line '+r.line, true],
        ['K/9 '+(r.kp.k9||0).toFixed(1), (dir === 'over') === ((r.kp.k9||0) >= 9)],
        ['ERA '+(r.p.ERA||0).toFixed(2)+' \u00b7 WHIP '+(r.p.WHIP||0).toFixed(2), false]]); }),
    why: dir === 'over' ? 'No starter projects 0.3+ strikeouts over his posted line at a price the model backs.'
                        : 'No starter projects 0.5+ strikeouts under his posted line at an under the model backs.' };
}
/* COLD BATS - a 4+ game hitless skid. Tested: skids carry a small real drop (1-2pt below the
   batter's own rate, 1,373 games) - too small to fade on its own, so the skid is the filter and
   the calibrated model must also make the UNDER on hits value. */
function mlbCold(key, g){
  var out = [];
  mlbBats(key, g, function(p, team, opp){
    var logs = sortLogsDesc(((state.sports[key].idx.logsByName || {})[p.name] || []).slice());
    var n = 0; for (var i=0;i<logs.length;i++){ if ((+logs[i].H || 0) < 1) n++; else break; }
    if (n < 4) return;
    var b = mlbPriced(key, p, 'H', opp, 'under');
    if (b) out.push({ name:p.name, p:p, opp:opp, skid:n, b:b });
  });
  out.sort(function(a,b){ return b.b.ev - a.b.ev; });
  return { rows:out.map(function(r){
      return mlbRow(key, r, 'Hits', [[r.skid+'-game hitless skid', true],
        ['season AVG '+d3m(r.p.AVG), false]]); }),
    why:'No batter on a 4+ game hitless skid has a hits under the model backs.' };
}

/* DUE / UNLUCKY and RUNNING HOT - the gap between the quality of his contact (xwOBA) and his
   results (wOBA). Contact quality is the steadier number, so a big gap tends to close: back the
   unlucky, fade the lucky. Selection only - the calibrated model and his own record still decide
   whether the price is value.

   Guarded: until fetch_mlb.py's header repair ships, the stored "xwoba" is Savant's DIFFERENCE
   column (median .004), which would make every regular look like he's running hot. If the league
   median xwOBA isn't somewhere believable, both tiles stay quiet and say so.                    */
function mlbStatcastState(key){
  var S = state.sports[key];
  if (S.idx.scState) return S.idx.scState;
  var xs = (S.idx.players || []).filter(function(p){ return p.role === 'bat' && (p.AB || 0) >= 150 &&
    p.statcast && p.statcast.xwoba != null && p.statcast.woba != null; }).map(function(p){ return +p.statcast.xwoba; })
    .sort(function(a,b){ return a - b; });
  var med = xs.length ? xs[Math.floor(xs.length/2)] : null;
  return (S.idx.scState = { n:xs.length, median:med, ok:(med != null && med >= 0.25 && med <= 0.40) });
}
function mlbLuck(key, g, dir){
  var st = mlbStatcastState(key);
  if (!st.n) return { rows:[], why:'No Statcast expected stats in players.json yet.' };
  if (!st.ok) return { rows:[], why:'Statcast looks misaligned (league median xwOBA '+(st.median != null ? st.median.toFixed(3) : '\u2014')
    +', should be ~.315) - the fetch_mlb.py header repair needs to run before this tile can trust it.' };
  var out = [];
  mlbBats(key, g, function(p, team, opp){
    var sc = p.statcast;
    if (!sc || sc.xwoba == null || sc.woba == null || (p.AB || 0) < 150) return;
    var gap = sc.xwoba - sc.woba;
    if (dir === 'due' && (gap < 0.028 || sc.xwoba < 0.330)) return;
    if (dir === 'hot' && gap > -0.032) return;
    var b = dir === 'due' ? mlbPriced(key, p, 'TB', opp) : (mlbPriced(key, p, 'TB', opp, 'under') || mlbPriced(key, p, 'H', opp, 'under'));

/* NBL-SPECIFIC SIGNALS ------------------------------------------------------------
   From the NBL tool's crew: the four stat specialists and Double Trouble, priced. Every row needs
   the calibrated model AND the player's own record at that line (recordCap) to beat the price by 5%.

   Tested and left out:
     Usage Trend - minutes spikes REVERT. Over 2,071 player-games, players whose minutes rose 25%+
                   (last 5 v prior 20) scored 1.14 points BELOW their form projection and beat it 37%
                   of the time (control 45%). A points over on "rising usage" bets on the spike
                   lasting; history says it fades - it's usually injury cover or a blowout.           */
function nblPriced(key, p, mkt, opp, line){
  var od = line != null ? bestPriceFor(key, p.name, mkt, line) : null;
  if (!od && line == null){
    var c = cmbPosted(key, p.name, mkt);
    if (c) od = { line:+c.line, price:+c.over, book:c.book };
  }
  // no two-way main line: many NBL props are posted only as milestone ladders (Parker
  // Jackson-Cartwright's assists v a +26% soft defence had no main line and was skipped), so take
  // the ladder rung nearest his average
  if (!od && line == null){
    var avg = (leagueAvg(key, mkt)[p.name] || {}).avg;
    // NBL ladders step unevenly (assists 4.5 / 6.5 / 9.5 / 12.5), so an exact lookup at his
    // average usually falls between rungs - take the posted rung nearest it instead
    if (avg != null && avg > 0.5){
      var near = streakCandidates(key, p.name, mkt).slice()
        .sort(function(a,b){ return Math.abs(a.line - (avg - 0.5)) - Math.abs(b.line - (avg - 0.5)); })[0];
      if (near) od = { line:near.line, price:near.price, book:near.book };
    }
  }
  if (!od || !(od.price > 1)) return null;
  var pr = recordCap(key, p, mkt, od.line, 'over', modelProbAt(key, p, mkt, od.line, opp));

/* SLASHERS / SPLASHERS / DISHERS / BOARDERS - the league's best at a stat into a defence that

  var S = state.sports[key], lg = leagueAvg(key, stat);

    .sort(function(a,b){ return lg[b.name].avg - lg[a.name].avg; }).slice(0, 15);
  var inGame = {}; inGame[normTeam(g.home)] = g.away; inGame[normTeam(g.away)] = g.home;
  var out = [];

    var opp = inGame[normTeam(p.team)];

    var dr = dvpRankFor(key, opp, p.position || p.pos, stat);

/* DOUBLE TROUBLE - double-doubles in 40%+ of his last 10. No book posts a double-double market,
   and production priced it on PRA, which is a different bet. The bet that DECIDES a double-double is
   the harder of his two 10+ legs, so that is what's priced: 10+ on the stat he reaches least often. */
function nblDoubleTrouble(key, g){
  var S = state.sports[key], out = [];
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;

      if (!isPlayingP(key, p.name, team) || !hasAnyOddsFor(key, p.name)) return;
      var l10 = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice())
        .filter(function(r){ return (+r.minutes || 0) > 0; }).slice(0, 10);
      if (l10.length < 6) return;
      var stats = ['points','rebounds','assists'];
      var ddN = l10.filter(function(r){ return stats.filter(function(k){ return (+r[k] || 0) >= 10; }).length >= 2; }).length;
      var rate = ddN / l10.length;
      if (rate < 0.40) return;
      // the two stats his double-doubles are built on, and the one he reaches 10 in least
      var reach = stats.map(function(k){ return { k:k, r:l10.filter(function(r){ return (+r[k] || 0) >= 10; }).length / l10.length }; })
        .sort(function(a,b){ return b.r - a.r; }).slice(0, 2);
      var hard = reach[1];
      var b = nblPriced(key, p, hard.k, opp, 9.5);

    });

}

/* NEXT MAN UP (NBL) - teammates of an absent regular. The measured effect is priced in rather than
