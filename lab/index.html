/* MULTI BUILDER ----------------------------------------------------------------
   Benchmarked on the production builder: the same five ways of generating a leg pool
   (safest / value / longshot / history vs this opponent / matchup), leg cards you tap into
   the slip, priced off the real ladder.

   Four things it does that the old one couldn't:
     - probabilities are the CALIBRATED model, not a raw hit rate, so "90%" means 90%;
     - value is measured against the book's no-vig fair price where a two-way market exists,
       not just against the quoted over;
     - Auto-build picks the combination greedily on CORRELATED joint EV, so it will not hand
       you three legs from the same team that all die together;
     - whatever it builds drops into the same slip, so the history backtest and copula in the
       Multi tab apply to a built multi exactly as to a typed one.                            */
var MB_MODES = [['safe','Safest'],['value','Value'],['lotto','Longshot'],['hist','History'],['match','Matchup']];
var MB_MIN_GAMES = 4, MB_MAX_CARDS = 14;
function mbFixtures(){
  var out = [];
  Object.keys(SPORTS).forEach(function(key){
    if (!state.view.active[key]) return;
    (asArray(state.sports[key].data.fixture) || []).forEach(function(g, i){
      if (gameStart(g).ms && gameStart(g).ms < Date.now() - 3*36e5) return;   // done and dusted
      out.push({ key:key, i:i, g:g });
    });
  });
  return out.slice(0, 40);
}
function mbCandidates(key, g, mode){
  var S = state.sports[key], out = [];
  var mkts = (S.config || {}).oddsMkts || (S.config || {}).multiMkts || [];
  [g.away, g.home].forEach(function(team){
    var opp = (team === g.home) ? g.away : g.home;
    playersOnTeam(key, team).forEach(function(p){
      if (!p || !p.name || !isPlayingP(key, p.name, team)) return;
      var best = null;
      mkts.forEach(function(m){
        var k = m[0];
        if (key === 'mlb'){
          if (p.role === 'pitch' && BAT_ONLY[k]) return;
          if (p.role !== 'pitch' && ARM_ONLY[k]) return;
        }
        var lg = leagueAvg(key, k)[p.name];
        if (!lg || lg.games < MB_MIN_GAMES) return;
        var logs = sortLogsDesc(((S.idx.logsByName || {})[p.name] || []).slice());
        var vals = [];
        logs.forEach(function(r){ var v = statOf(key, r, k); if (v != null) vals.push(v); });
        if (vals.length < 5) return;
        var h2h = [];
        logs.forEach(function(r){
          var o = oppOf(key, r);
          if (!o || normTeam(o) !== normTeam(opp)) return;
          var v = statOf(key, r, k); if (v != null) h2h.push(v);
        });
        var dr = dvpRankFor(key, opp, p.position || p.pos, k);
        streakCandidates(key, p.name, k).forEach(function(c){
          if (c.price == null || c.price < STREAK_ODDS_FLOOR) return;
          var raw = null;
          try { raw = S.scoring && S.scoring.prob ? S.scoring.prob(p, k, c.line, opp) : null; } catch(e){}
          var prob = (raw != null && isFinite(raw)) ? calibrate(key, raw)
                   : vals.slice(0,10).filter(function(v){ return v > c.line; }).length / Math.min(10, vals.length);
          if (!(prob > 0)) return;
          // Tail guard: at a $251 rung the book implies 0.4%. A model claiming 15% there is not
          // finding value, it is extrapolating past the end of its data. Anything claiming more
          // than four times the market's own number is thrown out rather than sold as a longshot.
          var implied = 1 / c.price;
          if (prob > Math.min(0.97, implied * 4)) return;
          var ev = prob * (c.price - 1) - (1 - prob);
          var fair = novigFair(key, p.name, k, c.line, 'over');
          var l10 = vals.slice(0, 10), hits = l10.filter(function(v){ return v > c.line; }).length;
          var hHit = h2h.filter(function(v){ return v > c.line; }).length;
          var why = [], ok2 = false;
          if (mode === 'safe'){
            ok2 = (hits === l10.length && l10.length >= 5);
            why = [hits+'/'+l10.length+' last '+l10.length];
          } else if (mode === 'value'){
            var edge = fair != null ? prob - fair : prob - 1/c.price;
            ok2 = edge >= 0.03;
            why = [(edge*100).toFixed(0)+'% over '+(fair != null ? 'fair' : 'the quote')];
          } else if (mode === 'lotto'){
            ok2 = c.price >= 3 && prob >= 0.15;
            why = [Math.round(prob*100)+'% at $'+c.price.toFixed(2)];
          } else if (mode === 'hist'){
            ok2 = h2h.length >= 2 && hHit / h2h.length >= 0.75 && h2h[0] > c.line;
            why = [hHit+'/'+h2h.length+' v '+abbrOf(key, opp), 'landed last meeting'];
          } else if (mode === 'match'){
            var l5 = vals.slice(0, 5);
            var l5avg = l5.reduce(function(a,b){ return a+b; }, 0) / Math.max(1, l5.length);
            ok2 = !!dr && dr.pct >= 8 && l5avg > c.line;
            why = dr ? ['+'+dr.pct.toFixed(0)+'% DVP', 'L5 '+l5avg.toFixed(1)] : [];
          }
          if (!ok2) return;
          var rank = mode === 'lotto' ? prob * c.price : (mode === 'safe' ? c.price : ev);
          if (!best || rank > best.rank)
            best = { key:key, p:p, mkt:k, label:m[1], line:c.line, price:c.price, book:c.book,
                     prob:prob, ev:ev, opp:opp, team:team, why:why, rank:rank,
                     id:key+'|'+p.name+'|'+k+'|'+c.line };
        });
      });
      if (best) out.push(best);
    });
  });
  out.sort(function(a,b){ return b.rank - a.rank; });
  return out.slice(0, MB_MAX_CARDS);
}
function mbToLeg(c){
  return cmbLeg(c.key, c.p, [c.mkt, c.label], c.line, 'over');
}
// Greedy on correlated joint EV: each addition is judged on what it does to the WHOLE multi,
// so a second leg from the same team has to earn its correlation.
function mbAuto(cands, want){
  var picked = [], pool = cands.slice(0, 10);
  for (var step=0; step<want && pool.length; step++){
    var bestIdx = -1, bestVal = -Infinity;
    for (var i=0;i<pool.length;i++){
      var trial = picked.concat([pool[i]]).map(mbToLeg).filter(function(l){ return l.prob != null; });
      if (trial.length !== picked.length + 1) continue;
      var joint = cmbJoint(trial);
      if (joint == null) continue;
      var price = trial.reduce(function(a,l){ return a * (l.price || 1); }, 1);
      var val = joint * price - 1;                       // EV per unit staked on the whole multi
      if (val > bestVal){ bestVal = val; bestIdx = i; }
    }
    if (bestIdx < 0) break;
    picked.push(pool[bestIdx]);
    pool.splice(bestIdx, 1);
  }
  return picked;
}

/* STATS: Scanner / Teams / DVP -------------------------------------------------
   The three boards the old tool had, minus Compare. Scanner is the sortable player table
   with a search box and position pills; Teams is the for/allowed grid; DVP is a position's
   full column set per team. All read through statOf / leagueAvg / dvpBoard, so the numbers
   agree with every tile and the player card.                                                 */
var STATS_SUBS = [['scanner','Scanner','ti-table'],['teams','Teams','ti-shield'],['dvp','DVP','ti-shield-half']];

/* Window filter for the Scanner. Defaults to the current season - that is the question
   people are actually asking - but a season two games old says almost nothing, so when the
   fullest sample in the league is under four games the board falls back to all games on file
   and says so rather than showing a near-empty table.                                        */
var ST_WINDOWS = [['season','Season'],['l10','L10'],['l5','L5'],['all','All']];
function windowAvg(key, mkt, win){
  var S = state.sports[key];
  S.idx.winAvg = S.idx.winAvg || {};
  var ck = mkt+'|'+win;
  if (S.idx.winAvg[ck]) return S.idx.winAvg[ck];
  var season = curSeason(key), byName = S.idx.logsByName || {}, out = {}, maxThis = 0;
  if (win === 'season'){
    Object.keys(byName).forEach(function(n){
      var c = 0;
      byName[n].forEach(function(r){
        if ((+(r.Year||r.year)||0) !== season) return;
        if (statOf(key, r, mkt) != null) c++;
      });
      if (c > maxThis) maxThis = c;
    });
  }
  var thin = (win === 'season') && maxThis < 4;
  Object.keys(byName).forEach(function(n){
    var rows = byName[n];
    if (win === 'season' && !thin) rows = rows.filter(function(r){ return (+(r.Year||r.year)||0) === season; });
    else if (win === 'l10' || win === 'l5'){
      rows = sortLogsDesc(rows.slice()).filter(function(r){ return statOf(key, r, mkt) != null; })
        .slice(0, win === 'l10' ? 10 : 5);
    }
    var sum = 0, cnt = 0;
    rows.forEach(function(r){ var v = statOf(key, r, mkt); if (v == null) return; sum += v; cnt++; });
    if (cnt) out[n] = { avg:sum/cnt, games:cnt };
  });
  out._thin = thin;
  return (S.idx.winAvg[ck] = out);
}

/* Headshots where a source actually exists. NFL has ESPN ids on 1,688 of 2,173 players, EPL a
   Premier League photo code on all 662, MLB an id that resolves against its own CDN (production
   never used that one). AFL ships no id, so it gets initials rather than a broken image.
   Any image that 404s swaps itself for initials, so a dead id never leaves a hole in a row.   */
var IMG_SPORTS = { nfl:1, epl:1, mlb:1 };
function playerImgUrl(key, p){
  if (!p) return '';
  if (key === 'nfl' && p.espnId) return 'https://a.espncdn.com/i/headshots/nfl/players/full/'+p.espnId+'.png';
  if (key === 'epl' && p.code)   return 'https://resources.premierleague.com/premierleague/photos/players/110x140/p'+p.code+'.png';
  if (key === 'mlb' && p.id)     return 'https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/'+p.id+'/headshot/67/current';
  return '';
}
function playerInitials(nm){
  var parts = String(nm || '').replace(/[^A-Za-z .'-]/g, '').split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return ((parts[0][0] || '') + (parts.length > 1 ? (parts[parts.length-1][0] || '') : '')).toUpperCase();
}
function playerImgP(key, nameOrP, size){
  var p = (typeof nameOrP === 'string')
    ? ((state.sports[key].idx.byName || {})[nameOrP] ||
       cmbPool(key).filter(function(x){ return x.name === nameOrP; })[0])
    : nameOrP;
  var nm = (typeof nameOrP === 'string') ? nameOrP : (p && p.name);
  if (!IMG_SPORTS[key] || !nm) return '';
  var sz = size || 30;
  var ini = '<span class="pimg-ini" style="width:'+sz+'px;height:'+sz+'px;font-size:'
    + Math.round(sz*0.38)+'px">'+esc(playerInitials(nm))+'</span>';
  var url = playerImgUrl(key, p);
  if (!url) return ini;
  // the fallback markup goes inside a double-quoted attribute, so its own quotes have to be
  // entities - otherwise the attribute terminates early and a dead headshot stays broken
  var iniAttr = ini.replace(/"/g, '&quot;').replace(/'/g, "\\'");
  return '<span class="pimg" style="width:'+sz+'px;height:'+sz+'px"><img src="'+esc(url)+'" alt="" '
    + 'loading="lazy" onerror="this.parentNode.outerHTML=\''+iniAttr+'\'"></span>';
}
function stCols(key){
  var cfg = state.sports[key].config || {};
  return (cfg.pcStats || cfg.oddsMkts || cfg.dvpStats || []).slice(0, 8);
}
function stSortRows(rows, sortKey, dir){
  return rows.sort(function(a,b){
    var x = a.vals[sortKey], y = b.vals[sortKey];
    if (x == null) return 1;
    if (y == null) return -1;
    return (x - y) * dir;
  });
}
function scannerView(key){
  var S = state.sports[key], v = state.view;
  var cols = stCols(key);
  if (!cols.length) return secNote('Scanner', SPORTS[key].name+' config.js lists no stat columns.');
  var positions = [''].concat(((S.config || {}).posOrder || []));
  var posF = v.stPosF || '';
  var q = String(v.stQ || '').trim().toLowerCase();
  var win = v.stWin || 'season';
  var thin = false;
  var rows = (S.idx.players || []).map(function(p){
    var vals = {}, any = false, games = 0;
    cols.forEach(function(c){
      var board = windowAvg(key, c[0], win);
      if (board._thin) thin = true;
      var e = board[p.name];
      vals[c[0]] = e && e.games >= 1 ? e.avg : null;
      if (vals[c[0]] != null){ any = true; if (e.games > games) games = e.games; }
    });
    return any ? { p:p, vals:vals, games:games } : null;
  }).filter(Boolean);
  if (posF) rows = rows.filter(function(r){ return (r.p.position || r.p.pos) === posF; });
  if (q) rows = rows.filter(function(r){
    return r.p.name.toLowerCase().indexOf(q) >= 0 || String(r.p.team||'').toLowerCase().indexOf(q) >= 0; });
  var sortKey = v.stSort || cols[0][0], dir = v.stDir === 1 ? 1 : -1;
  rows = stSortRows(rows, sortKey, dir).slice(0, 200);
  var th = function(k, l){
    return '<th class="'+(sortKey===k?'on':'')+'" onclick="LAB.stSort(\''+k+'\')">'+esc(l)
      + (sortKey===k ? (dir < 0 ? ' \u25be' : ' \u25b4') : '')+'</th>'; };
  var h = '<div class="sc-filter"><input id="stSearch" placeholder="Search player or team\u2026" '
    + 'value="'+esc(v.stQ||'')+'" oninput="LAB.stQ(this.value)" autocomplete="off"></div>'
    + '<div class="sl-bar">'+positions.map(function(p2){
        return '<button class="sl-chip'+(posF===p2?' on':'')+'" onclick="LAB.stPosF(\''+esc(p2)+'\')">'
          + esc(p2 || 'All')+'</button>'; }).join('')
      + '<span class="sl-win">'+ST_WINDOWS.map(function(w){
          return '<button class="sl-chip'+(win===w[0]?' on':'')+'" onclick="LAB.stWin(\''+w[0]+'\')">'
            + w[1]+'</button>'; }).join('')+'</span></div>';
  if (!rows.length) return h + '<div class="empty"><i class="ti ti-search-off"></i>No players match.</div>';
  h += '<div class="st-wrap" id="stTbl"><table class="st-t"><thead><tr><th>Player</th>'
    + '<th class="'+(sortKey==='games'?'on':'')+'" onclick="LAB.stSort(\'games\')">GP</th>'
    + cols.map(function(c){ return th(c[0], c[1]); }).join('')+'</tr></thead><tbody>'
    + rows.map(function(r){
        var face = playerImgP(key, r.p, 24);
        return '<tr onclick="LAB.player(\''+key+'\',\''+esc(r.p.name).replace(/'/g,"\\'")+'\')">'
          + '<td class="nm"><span class="st-team">'+(face || '')
          + '<span><b>'+esc(r.p.name)+'</b><span class="sub">'
          + esc([posShortP(r.p), abbrOf(key, r.p.team)].filter(Boolean).join(' \u00b7 '))
          + '</span></span></span></td>'
          + '<td>'+r.games+'</td>'
          + cols.map(function(c){
              var val = r.vals[c[0]];
              return '<td>'+(val == null ? '\u2014' : (val < 3 ? val.toFixed(2) : val.toFixed(1)))+'</td>';
            }).join('')+'</tr>';
      }).join('')+'</tbody></table></div>'
    + '<div class="cmb-corr">'+rows.length+' shown \u00b7 per-game from gamelogs \u00b7 '
    + (win === 'season' ? (thin ? 'season is too young to rank on, so this is all games on file'
                                : 'this season')
       : (win === 'all' ? 'all games on file' : 'last '+(win === 'l10' ? 10 : 5)+' games'))
    + '. Tap a row for the full read.</div>';
  return h;
}
function teamsView(key){
  var S = state.sports[key], v = state.view;
  var teams = asArray(S.data.teams_form) || asArray(S.data.teams) || [];
  if (!teams.length) return secNote('Teams', 'teams.json returned nothing for '+SPORTS[key].name+'.');

  var sortKey = (v.stTeamSort && cols.some(function(c){ return c[0] === v.stTeamSort; })) ? v.stTeamSort : cols[0][0];
  var rows = teams.slice().sort(function(a,b){ return (+b[sortKey+suf]||0) - (+a[sortKey+suf]||0); });

              var val = +t[c[0]+suf] || 0, a = avg[c[0]];

function dvpView(key){
  var S = state.sports[key], v = state.view;
  var stats = ((S.config || {}).dvpStats || (S.config || {}).oddsMkts || []).slice(0, 8);
  var raw = asArray(S.data.dvp) || [];
  if (!stats.length || !raw.length)
    return secNote('DVP', 'dvp.json returned nothing for '+SPORTS[key].name+'.');
  var positions = [];
  ((S.config || {}).posOrder || []).forEach(function(p2){
    if (raw.some(function(r){ return r.pos === p2; })) positions.push(p2); });
  raw.forEach(function(r){ if (r.pos && positions.indexOf(r.pos) < 0) positions.push(r.pos); });
  // default to the position with the most teams carrying data, not posOrder[0]
  var count = {};
  positions.forEach(function(p2){
    count[p2] = raw.filter(function(r){ return r.pos === p2 && stats.some(function(c){ return r[c[0]] != null; }); }).length; });
  var fullest = positions.slice().sort(function(a,b){ return count[b] - count[a]; })[0];
  var pos = (v.stPos && v.stPos[key] && positions.indexOf(v.stPos[key]) >= 0) ? v.stPos[key] : fullest;
  var sortKey = (v.stDvpSort && stats.some(function(c){ return c[0] === v.stDvpSort; })) ? v.stDvpSort : stats[0][0];
  // one row per club, collapsed on the normalised name, and only clubs playing this season -
  // the same restriction dvpBoard applies, so the grid and the ranks agree
  var current = S.idx.teamMapN && Object.keys(S.idx.teamMapN).length ? S.idx.teamMapN : null;
  var seen = {}, rows = [];
  raw.filter(function(r){ return r.pos === pos && (!current || current[normTeam(r.team)]); }).forEach(function(r){
    var k2 = normTeam(r.team);
    if (seen[k2]){
      stats.forEach(function(c){ if (r[c[0]] != null && (seen[k2][c[0]] == null || +r[c[0]] > +seen[k2][c[0]])) seen[k2][c[0]] = r[c[0]]; });
      return;
    }
    seen[k2] = Object.assign({}, r);
    rows.push(seen[k2]);
  });
  rows.sort(function(a,b){ return (+b[sortKey]||0) - (+a[sortKey]||0); });
  var avg = {};
  stats.forEach(function(c){ avg[c[0]] = rows.reduce(function(a,t){ return a + (+t[c[0]]||0); }, 0) / Math.max(1, rows.length); });
  var h = '<div class="sl-bar">'+positions.map(function(p2){
      return '<button class="sl-chip'+(p2===pos?' on':'')+'" onclick="LAB.stPos(\''+key+'\',\''+esc(p2)+'\')">'
        + esc(p2 === 'ALL' ? 'All' : p2)+'</button>'; }).join('')+'</div>'
    + '<div class="cmb-corr" style="margin:0 0 7px">Per game, conceded to '
    + esc(pos === 'ALL' ? 'all players' : pos)+'. Green concedes more than the league \u2014 the softer draw.</div>'
    + '<div class="st-wrap"><table class="st-t"><thead><tr><th>Team</th>'
    + stats.map(function(c){
        return '<th class="'+(sortKey===c[0]?'on':'')+'" onclick="LAB.stDvpSort(\''+c[0]+'\')">'
          + esc(c[1])+(sortKey===c[0]?' \u25be':'')+'</th>'; }).join('')+'</tr></thead><tbody>'
    + rows.map(function(t){
        return '<tr><td class="nm"><span class="st-team">'+teamLogo(key, t.team)
          + '<span>'+esc(teamFullName(key, t.team))+'</span></span></td>'
          + stats.map(function(c){
              var val = t[c[0]];
              if (val == null) return '<td>\u2014</td>';
              var a = avg[c[0]], d = a ? (+val - a) / a * 100 : 0;
              var cls = Math.abs(d) < 4 ? '' : (d > 0 ? 'hi' : 'lo');
              return '<td class="'+cls+'">'+(+val < 3 ? (+val).toFixed(2) : (+val).toFixed(1))+'</td>';
            }).join('')+'</tr>';
      }).join('')+'</tbody></table></div>';
  return h;
}

function oddsPage(){

    }
    var mkts = marketsFor(k);
    if (!mkts.length){
      h += '<div class="dayband"><span>'+esc(SPORTS[k].name)+'</span></div>'
        +  '<div class="empty" style="padding:18px"><i class="ti ti-coin-off"></i>No posted odds for '+esc(SPORTS[k].name)+' yet.</div>';
      return;
    }
    var sel = state.view.mkt[k];
    if (!sel || mkts.indexOf(sel) < 0) sel = mkts[0];
    var chips = mkts.slice(0,14).map(function(m){
      return '<button class="mkt-chip'+(m===sel?' on':'')+'" onclick="LAB.mkt(\''+k+'\',\''+m+'\')">'
        + esc(mktLabel(k,m)) + '</button>';
    }).join('');
    var mSel = state.view.match[k] || '';
    var pt = S.idx.playerTeam || {};
    var rows = bestPrices(k, sel).filter(function(r){
      if (!mSel) return true;
      var t = pt[r.player]; if (!t) return false;
      var parts = mSel.split('|');
      return t === parts[0] || t === parts[1];
    }).slice(0, 60);
    var body = rows.length ? rows.map(function(r){
      var lad = altLadder(k, r.player, sel);
      var nb = bookRows(k, r.player, sel, r.line).length;
      var t = pt[r.player] || '';
      var head = '<div class="od-row">'
        + '<span class="od-nm" onclick="event.preventDefault();event.stopPropagation();LAB.player(\''+k+'\',\''+esc(r.player).replace(/'/g,"\\'")+'\')">'
          + esc(r.player)+(t?'<i class="od-tm">'+esc(abbrOf(k,t))+'</i>':'')+'</span>'
        + '<span class="od-ln">'+esc(r.line)+'</span>'
        + '<span class="od-o">'+(+r.over).toFixed(2)+'</span>'
        + '<span class="od-u">'+(r.under!=null?(+r.under).toFixed(2):'—')+'</span>'
        + '<span class="od-bk'+(nb>1?' multi':'')+'" title="'+esc(bookTitle(k, r.player, sel, r.line))+'"'
        + ' onclick="event.preventDefault();event.stopPropagation();LAB.books(\''+k+'\',\''+esc(r.player).replace(/'/g,"\\'")+'\',\''+esc(sel)+'\','+r.line+')">'
        + esc(r.book||'')+(nb>1?' <u>+'+(nb-1)+'</u>':'')+'</span></div>';
      return lad ? ('<details class="od-det"><summary>'+head+'</summary>'+lad+'</details>') : head;
    }).join('') : '<div class="empty" style="padding:16px">Nothing posted'+(mSel?' for this match':'')+'.</div>';

    var ms = matchesFor(k);
    var mchips = ms.length ? ('<div class="mt-chips"><button class="mt-chip'+(!mSel?' on':'')
      + '" onclick="LAB.match(\''+k+'\',\'\')">All matches</button>'
      + ms.map(function(m){
          return '<button class="mt-chip'+(mSel===m.id?' on':'')+'" onclick="LAB.match(\''+k+'\',\''+esc(m.id)+'\')">'
            + esc(abbrOf(k,m.away))+' @ '+esc(abbrOf(k,m.home))+'</button>'; }).join('')
      + '</div>') : '';
    h += '<div class="dayband"><span>'+esc(SPORTS[k].name)+'</span></div>'
      +  mchips
      +  '<div class="mkt-chips">'+chips+'</div>'
      +  '<div class="od-hd"><span class="od-nm">Player</span><span class="od-ln">Line</span>'
      +  '<span class="od-o">Over</span><span class="od-u">Under</span><span class="od-bk">Book</span></div>'
      +  '<div class="od-list">'+body+'</div>';
  });
  return h;
}

/* ---- render ------------------------------------------------------------- */
function sportBar(){
  return '<div class="sports">'+Object.keys(SPORTS).map(function(k){
    var S = state.sports[k], on = state.view.active[k];
    var cls = 'sport-b'+(on?' on':'')+(S.status==='loading'?' loading':'');
    var n = on && S.status==='ready' ? countGames(k) : null;
    return '<button class="'+cls+'" onclick="LAB.toggle(\''+k+'\')"><span class="dot"></span>'
      + esc(SPORTS[k].name) + (n!=null?' <span style="opacity:.7">'+n+'</span>':'') + '</button>';
  }).join('')+'</div>';
}
function countGames(key){
  var fx = asArray(state.sports[key].data.fixture) || [];
  return fx.filter(function(g){ return g && g.home && g.away; }).length;
}

function doneCount(){
  var n = 0;
  Object.keys(SPORTS).forEach(function(k){
    if (!state.view.active[k]) return;
    (asArray(state.sports[k].data.fixture) || []).forEach(function(g){
      if (!g || !g.home || !g.away) return;
      if (gameDone(k, g, gameStart(g).ms)) n++;
    });
  });
  return n;
}
function allGames(){
  var out = [];
  Object.keys(SPORTS).forEach(function(k){
    if (!state.view.active[k]) return;
    var fx = asArray(state.sports[k].data.fixture) || [];
    fx.forEach(function(g, idx){
      if (!g || !g.home || !g.away) return;
      var st = gameStart(g);
      var done = gameDone(k, g, st.ms);
      if (done && !state.view.showDone) return;        // yesterday's games drop off by default
      out.push({ sport:k, g:g, ms:st.ms, hasTime:st.hasTime, done:done, i:idx });
    });
  });
  return out.sort(function(a,b){
    if (a.ms == null) return 1;
    if (b.ms == null) return -1;
    return a.ms - b.ms;
  });
}

function fixtureCard(item){
  var k = item.sport, g = item.g, ms = item.ms;
  var col = {afl:'#22c55e', nfl:'#60a5fa', epl:'#a78bfa', mlb:'#f59e0b'}[k] || 'var(--text-3)';
  var when = ms == null
    ? '<span class="fxr-ko-date">TBC</span>'
    : (item.hasTime
        ? '<span class="fxr-ko-date">'+esc(localDate(ms))+'</span><span class="fxr-ko-time">'+esc(localTime(ms))+'</span>'
        : '<span class="fxr-ko-date">'+esc(localDate(ms))+'</span><span class="fxr-ko-time" style="color:var(--text-3);font-size:11px">time TBC</span>');
  return '<div class="fxr'+(item.done?' fxr-done':'')+'" onclick="LAB.focus(\''+k+'\','+item.i+')">'
    + '<div class="fxr-team">'+teamLogo(k, g.away)+'<div class="fxr-name">'+esc(teamName(k, g.away))+'</div></div>'
    + '<div class="fxr-center">'
      + '<span class="fxr-badge" style="color:'+col+';background:color-mix(in srgb,'+col+' 16%,transparent)">'+esc(SPORTS[k].name)+'</span>'
      + when
      + '<div class="fxr-vs">@</div>'
      + '<div class="fxr-venue">'+esc(g.venue||'TBC')+'</div>'
    + '</div>'
    + '<div class="fxr-team">'+teamLogo(k, g.home)+'<div class="fxr-name">'+esc(teamName(k, g.home))+'</div></div>'
    + '</div>';
}

function render(){
  var loading = Object.keys(SPORTS).filter(function(k){ return state.sports[k].status==='loading'; });
  $('status').textContent = loading.length ? ('loading '+loading.join(', ')+'…') : 'ready';

  var tabs = [['fixture','ti-calendar','Fixture'],['odds','ti-coin','Odds'],['stats','ti-chart-bar','Stats']];
  var h = '<div class="tabs">'+tabs.map(function(t){
    return '<button class="tab'+(state.view.tab===t[0]?' on':'')+'" onclick="LAB.tab(\''+t[0]+'\')">'
      +'<i class="ti '+t[1]+'"></i>'+t[2]+'</button>'; }).join('')+'</div>';
  h += sportBar();

  if (state.view.focus){
    h = '' + focusPage();                       // focused fixture replaces the page
    $('app').innerHTML = h + playerPanel() + booksPanel() + cmbFab() + cmbPanel();
    return;
  }
  if (state.view.tab === 'stats'){
    h += statsPage();
  } else if (state.view.tab === 'odds'){
    h += oddsPage();
  } else {
    var games = allGames();
    var nd = doneCount();
    if (nd) h += '<div class="done-bar"><button class="done-b'+(state.view.showDone?' on':'')+'" onclick="LAB.showDone()">'
      + '<i class="ti ti-history"></i>'+(state.view.showDone?'Hide':'Show')+' '+nd+' completed</button></div>';
    if (!games.length){
      h += '<div class="empty"><i class="ti ti-calendar-off"></i>'
        + (loading.length ? 'Loading fixtures…' : 'No fixtures for the selected sports.') + '</div>';
    } else {
      var lastDay = null;
      games.forEach(function(item){
        var dk = item.ms != null ? dayKey(item.ms) : 'tbc';
        if (dk !== lastDay){
          lastDay = dk;
          h += '<div class="dayband"><span>'+esc(item.ms != null ? localDate(item.ms) : 'Date TBC')+'</span></div>';
        }
        h += fixtureCard(item);
      });
    }
  }
  $('app').innerHTML = h + playerPanel() + booksPanel() + cmbFab() + cmbPanel();
}

/* ---- public ------------------------------------------------------------- */
window.LAB = {
  toggle: function(k){
    state.view.active[k] = !state.view.active[k];
    if (state.view.active[k] && state.sports[k].status === 'idle') loadTier1(k);
    else render();
    if (state.view.tab === 'odds') ensureTier2();
  },
  tab: function(t){
    state.view.tab = t;
    render();
    if (t === 'odds') ensureTier2();        // pull odds only when the page is actually opened
  },
  mkt: function(k, m){ state.view.mkt[k] = m; render(); },
  match: function(k, id){ state.view.match[k] = id; render(); },
  player: function(k, name){ state.view.player = k ? {sport:k, name:name} : null; render(); },
  focus: function(k, i){
    if (!k){ state.view.focus = null; render(); return; }
    var fx = asArray(state.sports[k].data.fixture) || [];
    var g = fx[i];
    if (!g) return;
    state.view.focus = { sport:k, g:g };
    if (!state.sports[k].t2) loadTier2(k);      // focused view needs odds
    if (!state.sports[k].t3) loadTier3(k);      // and the heavy layer for the real sections
    render(); window.scrollTo({top:0});
  },
  h2hMode: function(m){ state.view.h2hMode = m; render(); },
  slMkt: function(k, m){ state.view.slMkt[k] = m; render(); },
  slWin: function(w){ state.view.slWin = w; render(); },
  dvpMkt: function(k, m){ state.view.dvpMkt[k] = m; render(); },
  ppTab: function(t){ state.view.ppTab = t; render(); },
  cmbOpen: function(){
    state.view.cmbOpen = true;
    ensureTier2();                              // players.json is tier 2 - without it nothing is searchable
    render();
    var i = $('cmbInput'); if (i) i.focus();
  },
  cmbType: function(q){
    state.view.cmbQ = q;
    state.view.cmbSugOff = false;
    cmbSugRefresh();          // patch the list only: the input keeps focus, caret and keyboard
  },
  cmbUse: function(name, mode){
    // keep whatever line/market the user already typed, swap in the full name
    var q = String(state.view.cmbQ || '');
    var tail = q.replace(/[A-Za-z\u00C0-\u024F'\-\.]+/g, function(w){
      return name.toLowerCase().indexOf(w.toLowerCase()) >= 0 ? '' : w; }).trim();
    state.view.cmbQ = (name + ' ' + tail).trim();
    state.view.cmbSugOff = true;
    var parsed = null;
    Object.keys(SPORTS).forEach(function(k){
      if (!state.view.active[k] || parsed) return;
      var pp = cmbParse(k, state.view.cmbQ);
      if (pp && pp.mkt && pp.line != null) parsed = pp;     // first sport that understands it
    });
    if (parsed){
      if (mode === 'multi') LAB.cmbAddLeg(state.view.cmbQ); else LAB.cmbRun(state.view.cmbQ);
      return;
    }
    render();
    var i = $('cmbInput');
    if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  },
  cmbClose: function(){ state.view.cmbOpen = false; render(); },
  cmbMode: function(m){ state.view.cmbMode = m; render(); },
  cmbRun: function(q){
    state.view.cmbQ = q;
    state.view.cmbSugOff = true;
    state.view.cmbResult = cmbResolve(q);
    if (!state.view.cmbResult.err && !state.view.cmbResult.loading){
      var r = (state.view.cmbRecent || []).filter(function(x){ return x !== q; });
      r.unshift(q); state.view.cmbRecent = r.slice(0, 5);
    }
    render();
    if (state.view.cmbResult.loading) setTimeout(function(){ LAB.cmbRun(q); }, 600);
  },
  cmbAdd: function(){
    var r = state.view.cmbResult;
    if (!r || !r.leg) return;
    state.view.cmbLegs = (state.view.cmbLegs || []).concat([r.leg]);
    state.view.cmbMode = 'multi';
    render();
  },
  cmbAddLeg: function(q){
    var r = cmbResolve(q);
    if (r.loading){ setTimeout(function(){ LAB.cmbAddLeg(q); }, 600); return; }
    if (r.leg) state.view.cmbLegs = (state.view.cmbLegs || []).concat([r.leg]);
    else state.view.cmbResult = r;
    render();
  },
  cmbLad: function(open){ state.view.cmbLadOpen = !!open; },
  stSport: function(k){ state.view.stSport = k; ensureSport(k); render(); },
  stMode: function(m){ state.view.stMode = m; render(); },
  stSort: function(k){
    var v = state.view;
    if (v.stSort === k) v.stDir = (v.stDir === 1 ? -1 : 1); else { v.stSort = k; v.stDir = -1; }
    render();
  },
  stTeamSort: function(k){ state.view.stTeamSort = k; render(); },
  stDvpSort: function(k){ state.view.stDvpSort = k; render(); },
  stAllowed: function(a){ state.view.stAllowed = !!a; render(); },
  stPosF: function(p){ state.view.stPosF = p; render(); },
  stWin: function(w){ state.view.stWin = w; render(); },
  stQ: function(q){
    // same rule as the bet search: patch the table, never the focused input
    state.view.stQ = q;
    var host = $('stTbl');
    var keys = Object.keys(SPORTS).filter(function(k){ return state.view.active[k]; });
    var key = keys.indexOf(state.view.stSport) >= 0 ? state.view.stSport : keys[0];
    if (!host || !key){ render(); return; }
    var frag = document.createElement('div');
    frag.innerHTML = scannerView(key);
    var fresh = frag.querySelector('#stTbl');
    host.innerHTML = fresh ? fresh.innerHTML : '';
  },
  stMkt: function(k, m){ state.view.stMkt = state.view.stMkt || {}; state.view.stMkt[k] = m; render(); },
  stPos: function(k, p){ state.view.stPos = state.view.stPos || {}; state.view.stPos[k] = p; render(); },
  mbFix: function(i){ state.view.mbFix = +i; render(); },
  mbMode: function(m){ state.view.mbMode = m; render(); },
  mbAdd: function(id){
    var fixes = mbFixtures(), f = fixes[Math.min(state.view.mbFix || 0, fixes.length - 1)];
    if (!f) return;
    var c = mbCandidates(f.key, f.g, state.view.mbMode || 'value').filter(function(x){ return x.id === id; })[0];
    if (!c) return;
    var legs = (state.view.cmbLegs || []).slice();
    var at = -1;
    legs.forEach(function(l, i){ if (l.key+'|'+l.p.name+'|'+l.mkt+'|'+l.line === id) at = i; });
    if (at >= 0) legs.splice(at, 1); else legs.push(mbToLeg(c));     // tap again to remove
    state.view.cmbLegs = legs;
    render();
  },
  mbAuto: function(){
    var fixes = mbFixtures(), f = fixes[Math.min(state.view.mbFix || 0, fixes.length - 1)];
    if (!f) return;
    var cands = mbCandidates(f.key, f.g, state.view.mbMode || 'value');
    var picked = mbAuto(cands, 3);
    if (!picked.length) return;
    state.view.cmbLegs = picked.map(mbToLeg);
    state.view.cmbMode = 'multi';                       // straight to the analysis
    render();
  },
  cmbLine: function(line){
    var r = state.view.cmbResult;
    if (!r || !r.leg) return;
    var l = r.leg;
    state.view.cmbResult = { leg: cmbLeg(l.key, l.p, [l.mkt, l.label], +line, l.side) };
    render();
  },
  cmbDrop: function(i){
    var l = (state.view.cmbLegs || []).slice();
    l.splice(i, 1); state.view.cmbLegs = l; render();
  },
  cmbQ_legacy: function(q){
    state.view.cmbQ = q;
    // re-render without stealing the caret: only the results list changes
    var el = $('app').querySelector('.cmb-hits, .empty');
    state.view.cmbSel = null;
    render();
    var inp = $('cmbInput');
    if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  },
  cmbPick: function(key, name){
    if (!key){ state.view.cmbSel = null; render(); return; }
    state.view.cmbSel = { key:key, name:name };
    var r = state.view.cmbRecent || [];
    r = r.filter(function(x){ return !(x.key === key && x.name === name); });
    r.unshift({ key:key, name:name });
    state.view.cmbRecent = r.slice(0, 6);
    ensureSport(key);
    render();
  },
  showDone: function(){ state.view.showDone = !state.view.showDone; render(); },
  books: function(k, player, market, line){ state.view.books = k ? {sport:k, player:player, market:market, line:line} : null; render(); },
  state: state
};

// boot: tier 1 for every sport (fixtures+teams are ~0 MB, so this is cheap)
Object.keys(SPORTS).forEach(loadTier1);
render();

})();
</script>
</body>
</html>
